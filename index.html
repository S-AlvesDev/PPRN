to dos deveres da tornozeleira eletrônica pelo reeducando: autoriza-se a regressão de regime, a revogação das saídas temporárias ou o cancelamento da prisão domiciliar."},{"id":328,"numero":328,"bloco":1,"materia":"Lei de Execução Penal","texto_base":null,"enunciado":"A suspensão condicional da pena (sursis) constitui instituto de política criminal voltado a evitar o encarceramento de condenados a penas de curta duração. Nos termos do artigo 156 da LEP, o Juiz da Execução, ao receber a guia de recolhimento para a execução do sursis, designará audiência admonitória com o objetivo de:","alternativas":{"A":"interrogar o réu sobre a autoria e materialidade da infração penal praticada.","B":"ler as condições da suspensão ao condenado, ouvi-lo sobre sua aceitação e adverti-lo sobre as consequências do descumprimento.","C":"aplicar sanções disciplinares de advertência verbal em face de faltas leves passadas.","D":"homologar os cálculos de remissão por estudo e trabalho apresentados pela defesa.","E":"decretar a prisão preventiva do apenado por motivos de conveniência orçamentária."},"resposta_correta":"B","comentario":"Conforme preceitua o artigo 156 da Lei de Execução Penal, a audiência admonitória qualifica-se como ato processual formal presidido pelo juiz para a inauguração do sursis, onde são lidas as condições da suspensão e colhida a aceitação voluntária do apenado sob advertências legais."},{"id":329,"numero":329,"bloco":1,"materia":"Lei de Execução Penal","texto_base":null,"enunciado":"Considere a seguinte situação hipotética: Um Policial Penal potiguar de plantão na muralha externa de um complexo carcerário percebe que um detento que exerce atividades laborais de limpeza no pátio externo tenta arremessar um invólucro plástico contendo ferramentas perfurantes em direção à rua. O servidor intervém com rapidez e aborta a ação, apreendendo os materiais. De acordo com o artigo 45 da LEP, a conduta do reeducando configura desvio disciplinar, sendo terminantemente proibido na aplicação das sanções disciplinares:","alternativas":{"A":"a aplicação de castigos corporais, confinamento em cela escura, penas cruéis ou coletivas.","B":"o isolamento na própria cela por período inferior a cinco dias úteis consecutivos.","C":"a perda temporária do direito de participar de cultos religiosos internos comuns.","D":"a suspensão do direito de receber visitas de familiares aos finais de semana regulares.","E":"a anotação da infração nos assentamentos funcionais do prontuário do preso."},"resposta_correta":"A","comentario":"O artigo 45, § 2º, da LEP consagra uma barreira humanitária intransigente na execução penal, proibindo terminantemente a aplicação de castigos corporais, o confinamento em celas escuras, penas cruéis ou sanções coletivas na disciplina prisional."},{"id":330,"numero":330,"bloco":1,"materia":"Lei de Execução Penal","texto_base":null,"enunciado":"A individualização da pena projeta-se sobre a fase de execução por meio da classificação da massa carcerária a partir de exames técnicos específicos. Nos termos do artigo 5º e 6º da Lei de Execução Penal, a classificação dos condenados e a orientação da execução serão realizadas pela Comissão Técnica de Classificação (CTC), que será presidida pelo Diretor da unidade e composta, no mínimo, por:","alternativas":{"A":"três policiais penais operacionais táticos de plantão na guarita da muralha.","B":"dois chefes de seção, um assistente social, um psicólogo e um psiquiatra, quando se tratar de condenado à pena privativa de liberdade.","C":"três promotores de justiça titulares da fiscalização das varas criminais regionais.","D":"dois advogados inscritos na OAB e indicados pelo sindicato da respectiva categoria profissional.","E":"cinco cidadãos eleitores da comarca indicados por conselhos comunitários locais."},"resposta_correta":"B","comentario":"É a redação expressa do artigo 7º da Lei nº 7.210/1984. A Comissão Técnica de Classificação (CTC) destinada a avaliar e classificar os condenados à pena privativa de liberdade será composta, além do Diretor, por 2 chefes de seção, 1 assistente social, 1 psicólogo e 1 psiquiatra."},{"id":331,"numero":331,"bloco":1,"materia":"Lei de Execução Penal","texto_base":null,"enunciado":"O exame criminológico constitui instrumento pericial técnico voltado a avaliar a periculosidade e a maturidade psicológica do apenado para a progressão de regime. De acordo com o artigo 8º da LEP e a jurisprudência consolidada na Súmula Vinculante 26 do STF, a exigência de exame criminológico para a progressão de regime:","alternativas":{"A":"é proibida em toda e qualquer hipótese por violar o direito constitucional à dignidade.","B":"é obrigatória de forma automática para todos os crimes dolosos com pena superior a 4 anos.","C":"depende de decisão motivada do magistrado, que poderá exigi-lo com base nas peculiaridades do caso concreto.","D":"constitui ato privativo e discricionário da comissão técnica de classificação (CTC) sem controle judicial.","E":"exige a aprovação e homologação unânime por parte dos deputados estaduais da comarca."},"resposta_correta":"C","comentario":"O Supremo Tribunal Federal consolidou por meio da Súmula Vinculante 26 que o exame criminológico deixou de ser obrigatório de forma automática com as reformas legislativas da progressão. Contudo, o magistrado penal mantém a prerrogativa de exigi-lo no caso concreto por meio de decisão devidamente motivada."},{"id":332,"numero":332,"bloco":1,"materia":"Lei de Execução Penal","texto_base":null,"enunciado":"O trabalho externo é admissível para os presos em cumprimento de pena privativa de liberdade, submetendo-se contudo a requisitos e limites diferenciados a depender do regime. Nos termos do artigo 36 da Lei de Execução Penal, o trabalho externo para os presos em regime fechado será autorizado apenas em serviços ou obras públicas realizadas por órgãos da Administração Direta ou Indireta, estipulando a lei o limite máximo de presos correspondente a:","alternativas":{"A":"até 10% (dez por cento) do número total de operários empregados na obra pública.","B":"até 20% (vinte por cento) do número total de operários empregados na obra pública.","C":"até 30% (trinta por cento) do número total de operários empregados na obra pública.","D":"até 40% (quarenta por cento) do número total de operários empregados na obra pública.","E":"até 50% (cinquenta por cento) do número total de operários empregados na obra pública."},"resposta_correta":"B","comentario":"Nos termos do artigo 36, § 1º, da LEP, o trabalho externo do preso em regime fechado em serviços ou obras públicas submete-se ao limite fiscal e logístico de emprego correspondente a no máximo 20% do número total de operários da obra."},{"id":333,"numero":333,"bloco":1,"materia":"Lei de Execução Penal","texto_base":null,"enunciado":"A revogação do tempo remido constitui sanção aplicada pelo Juiz da Execução em face do cometimento de falta grave homologada no PAD. De acordo com o entendimento pacificado pelo Supremo Tribunal Federal na Súmula Vinculante 9, o artigo 127 da Lei de Execução Penal, que prevê a perda de parte dos dias remidos por falta grave:","alternativas":{"A":"foi revogado tacitamente pela Constituição Federal de 1988 por configurar ofensa ao direito adquirido.","B":"foi recebido pela Constituição Federal de 1988, não configurando ofensa ao direito adquirido ou dupla punição.","C":"submete-se à aprovação prévia e obrigatória do sindicato dos servidores públicos da segurança.","D":"foi considerado inconstitucional por violar o princípio da dignidade humana e individualização da pena.","E":"aplica-se unicamente aos dias remidos obtidos por meio de estudo e frequência escolar."},"resposta_correta":"B","comentario":"O Supremo Tribunal Federal editou a Súmula Vinculante 9 chancelando a constitucionalidade plena do artigo 127 da LEP, firmando que a perda de parte dos dias remidos motivada por falta grave foi recepcionada pela CF/88 e não configura ofensa ao direito adquirido."},{"id":334,"numero":334,"bloco":1,"materia":"Lei de Execução Penal","texto_base":null,"enunciado":"Considere a seguinte situação hipotética: Um apenado que cumpre pena em regime fechado trabalha regularmente nas oficinas industriais instaladas no interior de um complexo carcerário potiguar. Durante a realização do labor, o detento sofre um acidente mecânico que resulta na amputação de dois quirodáctilos (dedos da mão), necessitando de afastamento médico e cirúrgico. De acordo com o artigo 126, § 4º, da Lei de Execução Penal, o preso impossibilitado de prosseguir no trabalho ou nos estudos por acidente:","alternativas":{"A":"perderá o direito à remissão acumulada no passado por interrupção do requisito objetivo material.","B":"continuará a remir o tempo como se estivesse trabalhando ou estudando, enquanto durar a incapacidade médica.","C":"submete-se à revogação imediata de todos os benefícios outorgados e regressão provisória de regime.","D":"deve ser colocado em liberdade provisória automática por meio de alvará humanitário compulsório.","E":"transfere a sua contagem de tempo de remissão carcerária para o seu companheiro de cela mais próximo."},"resposta_correta":"B","comentario":"Trata-se da aplicação literal da garantia de proteção acidentária contida no artigo 126, § 4º, da LEP. O detento que sofrer acidente no labor ou nos estudos carcerários mantém o direito de continuar a remir o tempo normalmente enquanto perdurar a incapacidade médica atestada."},{"id":335,"numero":335,"bloco":1,"materia":"Lei de Execução Penal","texto_base":null,"enunciado":"A fiscalização das condições do regime aberto e da limitação de fim de semana constitui atribuição de órgãos específicos da execução penal. Nos termos do artigo 73 da LEP, o Patronato é órgão da execução pública destinado especificamente a prestar assistência aos:","alternativas":{"A":"presos provisórios recolhidos a cadeias públicas em fase de inquérito policial civil.","B":"albergados e aos egressos, bem como fiscalizar o cumprimento das penas de prestação de serviços.","C":"policiais penais afastados de suas funções operacionais por motivos de saúde ocupacional.","D":"diretores de estabelecimentos prisionais processados por crimes de abuso de autoridade.","E":"familiares de detentos de alta periculosidade inclusos em Regime Disciplinar Diferenciado."},"resposta_correta":"B","comentario":"O artigo 79 da LEP define as atribuições do Patronato na execução penal, qualificando-o como o órgão de assistência pós-penitenciária voltado especificamente a prestar apoio aos albergados (regime aberto) e egressos, além de fiscalizar penas alternativas."},{"id":336,"numero":336,"bloco":1,"materia":"Lei de Execução Penal","texto_base":null,"enunciado":"A Lei de Execução Penal estabelece o rol de direitos assegurados ao preso no artigo 41, visando neutralizar arbitrariedades e garantir a integridade moral carcerária. Assinale a alternativa que apresenta um direito expressamente catalogado no referido dispositivo legal.","alternativas":{"A":"O recebimento de visitas íntimas diárias sem triagem ou controle das forças de segurança públicas.","B":"O direito de greve tática armada e paralisação das atividades laborais industriais em oficinas de campo.","C":"Audiência especial com o Diretor do estabelecimento, visitas de familiares e do cônjuge, e assistência de advogado.","D":"A escolha discricionária do pavilhão, bloco residencial e companheiros de cela comuns do complexo.","E":"O acesso irrestrito a aparelhos telefônicos portáteis inteligentes sem monitoramento ou restrição geográfica."},"resposta_correta":"C","comentario":"O artigo 41 da LEP cataloga os direitos mínimos do preso, incluindo expressamente no inciso X a garantia de audiência especial com o Diretor da unidade, o recebimento de visitas do cônjuge e parentes em dias fixados e a assistência técnica de advogado."},{"id":337,"numero":337,"bloco":1,"materia":"Lei de Execução Penal","texto_base":null,"enunciado":"A progressão de regime para mulheres gestantes ou mães de crianças e pessoas com deficiência submete-se a critérios e frações diferenciados instituídos por reformas humanitárias na LEP. Nos termos do artigo 112, § 3º, da Lei de Execução Penal, introduzido pela Lei nº 13.769/2018, a progressão de regime para a mulher gestante ou mãe de filho menor de 12 anos dar-se-á após o cumprimento de 1/8 (um oitavo) da pena, desde que atenda cumulativamente aos seguintes requisitos:","alternativas":{"A":"ser ré reincidente confessa de alta periculosidade e pertencer a facções criminosas nacionais.","B":"não ter cometido o crime com violência ou grave ameaça a pessoa e não ter cometido o crime contra seu filho ou dependente.","C":"comprovar filiação partidária ativa e possuir recursos financeiros privados superiores a dez salários mínimos.","D":"obter a aprovação unânime e homologação por escrito de todos os deputados estaduais da comarca.","E":"aceitar a submissão permanente a trabalhos forçados agrícolas em fazendas modelo do estado."},"resposta_correta":"B","comentario":"É a aplicação das regras de proteção à maternidade introduzidas pela Lei nº 13.769/2018 no artigo 112, § 3º, da LEP. A progressão facilitada após 1/8 de cumprimento exige que o crime não tenha sido cometido com violência/grave ameaça e que a vítima não seja o próprio filho ou dependente da ré."},{"id":338,"numero":338,"bloco":1,"materia":"Lei de Execução Penal","texto_base":null,"enunciado":"A concessão de recompensas na execução penal visa prestigiar o bom comportamento carcerário e o empenho do apenado nas atividades de ressocialização. Nos termos do artigo 56 da LEP, constituem modalidades de recompensas expressamente previstas no texto legal:","alternativas":{"A":"o elogio registrado nos assentamentos do preso e a concessão de regalias.","B":"a remissão total e compulsória da pena aplicada e o fornecimento de gratificações financeiras livres.","C":"o direito de realizar saídas temporárias diárias sem monitoramento por tornozeleira eletrônica.","D":"a transferência automática para o regime aberto domiciliar sem exigência de prazos temporais.","E":"a isenção obrigatória do cumprimento das normas do regulamento disciplinar carcerário comum."},"resposta_correta":"A","comentario":"Nos termos do artigo 56 da Lei de Execução Penal, as únicas recompensas administrativas expressamente previstas no texto legal para prestigiar o bom comportamento carcerário são o elogio registrado nos assentamentos do detento e a concessão de regalias."},{"id":339,"numero":339,"bloco":1,"materia":"Lei de Execução Penal","texto_base":null,"enunciado":"Considere a seguinte situação hipotética: Durante a realização de uma vistoria técnica estrutural em um pavilhão carcerário do Rio Grande do Norte, os Policiais Penais localizam um túnel em fase avançada de escavação ocultado sob o piso sanitário de uma cela coletiva que abrigava cinco detentos. À luz das normas que regulam a responsabilidade disciplinar no artigo 48 da LEP, em caso de infrações cometidas de forma coletiva nas quais não seja possível individualizar a conduta inicial de cada agente, as sanções disciplinares:","alternativas":{"A":"serão aplicadas de forma coletiva a todos os presos do pavilhão carcerário sem direito a defesa.","B":"não poderão ser aplicadas de forma coletiva, dependendo a punição da individualização técnica da conduta de cada interno.","C":"autorizam o Diretor a aplicar a sanção de isolamento em RDD de ofício a toda a massa carcerária.","D":"são dispensadas de forma total pela aplicação do princípio do informalismo processual moderado.","E":"submetem-se à aprovação e homologação prévia por escrito dos deputados integrantes da comissão de segurança."},"resposta_correta":"B","comentario":"O artigo 45, § 3º, da LEP veda terminantemente a aplicação de sanções coletivas. Constatada uma infração ou túnel em cela coletiva, a punição disciplinar exige a comprovação da autoria individualizada, sendo proibido punir o grupo por presunção objetiva de culpa."},{"id":340,"numero":340,"bloco":1,"materia":"Lei de Execução Penal","texto_base":null,"enunciado":"O regime aberto fundamenta-se na autodisciplina e no senso de responsabilidade do condenado, que deverá trabalhar ou estudar fora do estabelecimento sem vigilância direta. Nos termos do artigo 114 da LEP, constitui requisito impositivo para o ingresso e permanência no regime aberto:","alternativas":{"A":"a comprovação de filiação partidária ativa por período superior a dois anos ininterruptos.","B":"que o apenado aceite a submissão permanente a exames psicotécnicos de natureza sigilosa semanais.","C":"o recolhimento de taxas de manutenção financeiras à Secretaria de Estado de Administração Penitenciária.","D":"que o condenado apresente indícios de que irá ajustar-se, com autodisciplina, ao novo regime, e comprove atividade laboral ou aceitação de emprego.","E":"obter a autorização verbal e homologação direta do comandante da polícia militar da área."},"resposta_correta":"D","comentario":"Conforme preceitua o artigo 114 da LEP, o ingresso no regime aberto exige o preenchimento de requisitos cumulativos: o apenado deve demonstrar senso de responsabilidade e autodisciplina e comprovar o exercício de atividade laboral ou aceitação de emprego imediato."},{"id":341,"numero":341,"bloco":1,"materia":"Lei de Execução Penal","texto_base":null,"enunciado":"A guia de recolhimento constitui o documento oficial que inaugura formalmente a fase de execução penal perante o Poder Judiciário. De acordo com o artigo 106 da LEP, nenhuma pena privativa de liberdade será executada sem a expedição prévia da respectiva guia de recolhimento, que deverá conter, entre outros elementos obrigatórios:","alternativas":{"A":"a orientação político-partidária e a opção religiosa do juiz presidente da vara criminal.","B":"a qualificação do condenado, o teor da sentença condenatória, a data do trânsito em julgado e o cômputo da prisão provisória.","C":"o histórico de transações bancárias particulares realizadas pelos familiares do reeducando nos últimos anos.","D":"a indicação de parceiros comerciais de preferência do réu para a prestação de serviços comunitários.","E":"a assinatura unânime dos membros do conselho penitenciário e do conselho da comunidade locais."},"resposta_correta":"B","comentario":"O artigo 106 da LEP detalha os requisitos formais impositivos da guia de recolhimento, documento que inaugura a execução penal e deve conter a qualificação completa do réu, o teor da sentença condenatória, as datas de trânsito em julgado e o desconto da prisão provisória."},{"id":342,"numero":342,"bloco":1,"materia":"Lei de Execução Penal","texto_base":null,"enunciado":"O isolamento preventivo constitui medida cautelar de natureza puramente administrativa que visa resguardar a ordem interna das unidades carcerárias diante de infrações graves em apuração. Nos termos do artigo 60 da LEP, modificado pelo Pacote Anticrime, a autoridade administrativa poderá decretar o isolamento preventivo do condicionado pelo prazo máximo de:","alternativas":{"A":"até 5 (cinco) dias úteis consecutivos de forma improrrogável em qualquer hipótese.","B":"até 10 (dez) dias corridos contados da lavratura da comunicação de ocorrência carcerária.","C":"até 15 (quinze) dias, sendo computado o período de isolamento na duração da sanção disciplinar que vier a ser aplicada.","D":"até 30 (trinta) dias consecutivos mediante autorização verbal do promotor de justiça da comarca.","E":"até 60 (sessenta) dias sob pena de nulidade absoluta do processo administrativo disciplinar (PAD)."},"resposta_correta":"C","comentario":"Nos termos do artigo 60 da LEP (redação do Pacote Anticrime), o isolamento preventivo constitui medida cautelar administrativa de urgência aplicável pelo Diretor no limite máximo de até 15 dias, devendo o tempo de tranca cautelar ser computado na sanção final aplicada."},{"id":343,"numero":343,"bloco":1,"materia":"Lei de Execução Penal","texto_base":null,"enunciado":"O Conselho Penitenciário é órgão consultivo e de fiscalização da execução da pena, composto por membros nomeados pelo Governador do Estado dentre profissionais do direito, psicologia e ciências correlatas. Nos termos do artigo 70 da LEP, compete ao Conselho Penitenciário, entre outras atribuições:","alternativas":{"A":"expedir mandados de prisão preventiva de ofício durante o trâmite de rebeliões carcerárias.","B":"emitir parecer sobre os pedidos de indulto e comutação de penas, e fiscalizar os patronatos locais.","C":"assinar termos de cooperação internacional para a privatização de presídios estaduais femininos.","D":"decretar a perda definitiva dos direitos políticos de detentos reincidentes em crimes hediondos.","E":"julgar em grau de recurso as decisões disciplinares exaradas pelas comissões de ética do estado."},"resposta_correta":"B","comentario":"O artigo 70 da LEP estabelece as competências institucionais do Conselho Penitenciário na execução penal, destacando-se o dever de emitir parecer obrigatório (embora não vinculante) nos pedidos de indulto e comutação de penas e fiscalizar patronatos."},{"id":344,"numero":344,"bloco":1,"materia":"Lei de Execução Penal","texto_base":null,"enunciado":"Considere a seguinte situação hipotética: Um detento que cumpre pena em regime semiaberto em uma penitenciária do Rio Grande do Norte comete um crime doloso de lesão corporal contra outro preso durante o banho de sol, gerando instabilidade na unidade. De acordo com o artigo 118, inciso I, da Lei de Execução Penal, o cometimento de crime doloso ou falta grave no curso da execução constitui causa legítima de:","alternativas":{"A":"regressão de regime, transferindo-se o apenado para qualquer dos regimes mais rigorosos.","B":"concessão automática de indulto humanitário individual por clemência do poder executivo.","C":"remissão compulsória de metade do restante da pena privativa de liberdade em andamento.","D":"anulação de todo o histórico de faltas disciplinares graves documentadas no prontuário carcerário.","E":"remoção imediata para colônias agrícolas de segurança média sem monitoramento eletrônico."},"resposta_correta":"A","comentario":"Conforme preceitua o artigo 118, inciso I, da Lei de Execução Penal, o cometimento de fato definido como crime doloso ou de falta disciplinar de natureza grave no curso do cumprimento da pena constitui causa legítima para a regressão de regime a patamar mais severo."},{"id":345,"numero":345,"bloco":1,"materia":"Lei de Execução Penal","texto_base":null,"enunciado":"A permissão de saída constitui modalidade de autorização de trânsito externo de presos provisórios ou condenados em regimes fechado ou semiaberto dotada de características emergenciais específicas. Nos termos do artigo 120 da LEP, a permissão de saída poderá ser concedida pelos Diretores dos estabelecimentos em hipóteses que envolvam:","alternativas":{"A":"a necessidade de participar de eventos festivos comunitários ou manifestações político-partidárias externas.","B":"falecimento ou doença grave do cônjuge, companheiro, ascendente, descendente ou irmão, bem como necessidade de tratamento médico.","C":"a realização de entrevistas de emprego comerciais privadas em empresas terceirizadas parceiras do órgão.","D":"o direito de realizar compras de insumos alimentares de preferência em feiras livres urbanas locais.","E":"a indicação discricionária realizada por comissões especiais de direitos humanos estaduais."},"resposta_correta":"B","comentario":"O artigo 120 da LEP define as hipóteses taxativas e emergenciais de concessão de permissão de saída (ato do Diretor): falecimento ou doença grave de familiares próximos (cônjuge, pais, filhos, irmãos) ou necessidade premente de tratamento médico hospitalar externo."},{"id":346,"numero":346,"bloco":1,"materia":"Lei de Execução Penal","texto_base":null,"enunciado":"A LEP estabelece regras estritas sobre a vigilância interna e o acompanhamento dos presos durante as saídas autorizadas pela administração. De acordo com o artigo 121 da Lei de Execução Penal, a permissão de saída (concedida pelo Diretor do estabelecimento nas hipóteses de falecimento ou tratamento médico) realizar-se- á:","alternativas":{"A":"sem qualquer modalidade de escolta armada para preservar a imagem e intimidade do reeducando.","B":"mediante escolta armada e ostensiva permanente durante todo o período de trânsito externo do detento.","C":"condicionado ao monitoramento geográfico por tornozeleira eletrônica de forma isolada, dispensando agentes públicos.","D":"se houver a presença e acompanhamento de familiares do apenado sob o compromisso de guarda civil.","E":"mediante escolta. (Nota de ajuste gramatical e padrão: de acordo com a redação fria do Artigo 121, a permissão de saída será concedida mediante escolta). Assinale a opção que guarda exata correspondência: A) sem escolta de segurança. B) mediante escolta. C) com acompanhamento familiar isolado. D) por monitoramento de satélite unicamente. E) com autorização verbal do sindicato."},"resposta_correta":"B","comentario":"É a redação do artigo 121 da LEP. Por envolver presos dos regimes fechado ou semiaberto em trânsito externo emergencial, a permissão de saída realiza-se obrigatoriamente sob a custódia e vigilância de escolta armada permanente."},{"id":347,"numero":347,"bloco":1,"materia":"Lei de Execução Penal","texto_base":null,"enunciado":"O Patronato qualifica-se como órgão de assistência ao egresso e fiscalização de penas restritivas de direitos na estrutura da execução penal. Nos termos do artigo 79 da LEP, o prédio destinado ao funcionamento do Patronato deverá conter estruturas adequadas e poderá ser público ou particular, sendo estabelecido que os Estados:","alternativas":{"A":"são proibidos de terceirizar as atividades de assistência psicossocial do órgão a particulares.","B":"deverão incentivar a criação de patronatos municipais e de consórcios comunitários de apoio carcerário.","C":"são obrigados a implantar centrais de monitoramento eletrônico geridas por psicólogos militares privados.","D":"transferirão a direção dos patronatos estaduais ao sindicato dos servidores das carreiras de segurança.","E":"deverão dotar cada comarca judiciária de um patronato oficial gerido por juízes singulares estáveis."},"resposta_correta":"B","comentario":"Nos termos do artigo 79 da Lei de Execução Penal, o legislador federal impôs o mandamento de que as secretarias de estado devem incentivar e fomentar a implantação de patronatos municipais e consórcios integrados com a comunidade para o apoio aos egressos."},{"id":348,"numero":348,"bloco":1,"materia":"Lei de Execução Penal","texto_base":null,"enunciado":"A unificação de penas constitui instituto aplicado pelo Juiz da Execução quando sobrevém nova condenação no curso do cumprimento da reprimenda penal. De acordo com o artigo 111 da LEP, sobrevindo condenação por crime anterior ou posterior ao início da execução, as penas serão unificadas, devendo o magistrado fixar o novo regime de cumprimento com base no:","alternativas":{"A":"valor total do prejuízo material causado ao erário público somado em todos os processos.","B":"somatório do restante da pena em andamento com a nova pena aplicada na sentença superveniente.","C":"histórico de comportamento funcional e nas avaliações do estágio probatório do plantão de tranca.","D":"parecer discricionário exarado de forma conjunta pela comissão técnica de classificação (CTC).","E":"princípio da anterioridade penal benéfica e na dosimetria penal de menor potencial ofensivo."},"resposta_correta":"B","comentario":"O artigo 111, parágrafo único, da LEP disciplina o instituto da unificação de penas supervenientes. Diante de nova condenação criminal no curso da execução, o magistrado realiza o somatório do restante da pena em andamento com a nova reprimenda aplicada para fixar o regime adequado."},{"id":349,"numero":349,"bloco":1,"materia":"Lei de Execução Penal","texto_base":null,"enunciado":"Considere a seguinte situação hipotética: Um reeducando que cumpre pena no regime semiaberto em uma comarca potiguar obtém o benefício de saída temporária para frequentar curso de ensino médio técnico profissionalizante na rede pública externa, deslocando-se diariamente sem vigilância armada direta. De acordo com o artigo 124 da LEP, a autorização de saída temporária para fins de frequência a curso de ensino profissionalizante ou de instrução de segundo grau ou superior durará:","alternativas":{"A":"no máximo sete dias consecutivos por período anual de forma improrrogável.","B":"pelo tempo necessário para o cumprimento das atividades escolares e frequência regular ao curso.","C":"trinta dias renováveis mediante parecer favorável assinado pelo conselho da comunidade local.","D":"duas horas diárias nas escalas ordinárias de plantão burocrático da unidade de tranca.","E":"o período determinado de forma discricionária pelo comandante da polícia militar de área."},"resposta_correta":"B","comentario":"Conforme preceitua o artigo 124 da LEP, quando a saída temporária for concedida especificamente para fins de frequência a cursos de instrução de segundo grau, nível superior ou técnico profissionalizante externo, a duração do benefício corresponderá ao tempo estritamente necessário para o cumprimento das atividades e aulas do curso."},{"id":350,"numero":350,"bloco":1,"materia":"Lei de Execução Penal","texto_base":null,"enunciado":"A execução das penas restritivas de direitos, qualificadas como penas alternativas ao cárcere na estrutura da execução penal, submete-se à fiscalização imediata do Juiz da Execução com o auxílio de órgãos auxiliares. Nos termos do artigo 149 da LEP, caberá ao Juiz da Execução designar a entidade pública ou privada conveniada junto à qual o apenado deverá cumprir a pena de:","alternativas":{"A":"Regime Disciplinar Diferenciado de isolamento em penitenciárias federais de segurança máxima.","B":"Prestação de Serviços à Comunidade ou limitação de fim de semana, fiscalizando o andamento do labor.","C":"Prisão Albergue domiciliar humanitária com monitoramento eletrônico via tornozeleira geográfica.","D":"Medida de Segurança ambulatorial preventiva com internação em hospitais psiquiátricos estaduais.","E":"Suspensão dos direitos políticos civis e cassação compulsória de subsídios funcionais."},"resposta_correta":"B","comentario":"É a aplicação literal do artigo 149 da LEP. Caberá ao Juízo da Execução Penal atuar na coordenação logística das penas restritivas de direitos, selecionando e designando formalmente as entidades públicas ou assistenciais conveniadas junto às quais o condenado cumprirá as obrigações alternativas de Prestação de Serviços à Comunidade ou limitação de fim de semana."},{"id":351,"numero":351,"bloco":2,"materia":"Lei de Execução Penal","texto_base":null,"enunciado":"A Lei de Execução Penal disciplina o procedimento para a aplicação de sanções disciplinares, estabelecendo garantias procedimentais para o reeducando investigado. Nos termos expressos do artigo 59 da LEP, não haverá aplicação de sanção disciplinar sem:","alternativas":{"A":"autorização prévia por escrito expedida pela Assembleia Legislativa.","B":"o pagamento de taxas de expediente para a oitiva de testemunhas.","C":"despacho motivado da autoridade competente, proferido em procedimento em que se assegurem o contraditório e a ampla defesa.","D":"a concordância e homologação verbal unânime de todos os detentos do pavilhão.","E":"a presença obrigatória de três peritos criminais oficiais da polícia científica."},"resposta_correta":"C","comentario":"É a redação literal do artigo 59 da LEP. Em respeito às garantias constitucionais do devido processo legal carcerário, nenhuma sanção disciplinar (seja leve, média ou grave) pode ser aplicada sem procedimento formal escrito que assegure ampla defesa e contraditório."},{"id":352,"numero":352,"bloco":2,"materia":"Lei de Execução Penal","texto_base":null,"enunciado":"O isolamento preventivo constitui medida cautelar administrativa aplicada pelo Diretor do estabelecimento. De acordo com o artigo 60 da LEP, o tempo de isolamento preventivo:","alternativas":{"A":"será integralmente desconsiderado no cômputo da sanção definitiva aplicada.","B":"será computado no período de duração da sanção disciplinar que vier a ser imposta.","C":"autoriza a prorrogação automática e vitalícia do regime fechado do detento.","D":"isenta o preso do cumprimento das normas do regulamento disciplinar carcerário comum.","E":"suspende de forma permanente o direito de petição do preso perante a Defensoria Pública."},"resposta_correta":"B","comentario":"Nos termos do artigo 60, parágrafo único, da LEP, o período em que o preso permanecer sob tranca preventiva na cela isolada por motivos de urgência administrativa será computado (descontado) no tempo da sanção disciplinar que vier a ser aplicada ao final do PAD."},{"id":353,"numero":353,"bloco":2,"materia":"Lei de Execução Penal","texto_base":null,"enunciado":"Considere a seguinte situação hipotética: Um detento que cumpre pena no regime semiaberto em uma comarca potiguar decide trabalhar na horta externa da unidade. No entanto, durante o horário do labor, o preso evade-se do local aproveitando-se da ausência de obstáculos físicos, sendo recapturado três dias depois pelas forças policiais. À luz das disposições expressas do artigo 50 da LEP, a fuga ou tentativa de fuga do condenado configura:","alternativas":{"A":"falta disciplinar de natureza leve passível unicamente de repreensão por escrito.","B":"crime de responsabilidade fiscal contra a administração tributária do estado.","C":"falta disciplinar de natureza grave.","D":"comportamento neutro que não interfere na contagem de prazos de benefícios.","E":"direito subjetivo decorrente do princípio da autodefesa e liberdade de locomoção."},"resposta_correta":"C","comentario":"O artigo 50, inciso II, da LEP cataloga de forma expressa que fugir ou tentar fugir do estabelecimento prisional ou dos locais de trabalho externo constitui cometimento de falta disciplinar de natureza grave."},{"id":354,"numero":354,"bloco":2,"materia":"Lei de Execução Penal","texto_base":null,"enunciado":"O livramento condicional submete o liberado ao cumprimento de condições fixadas pelo Juiz na audiência admonitória. Nos termos do artigo 132 da LEP, o magistrado poderá impor as chamadas condições facultativas, dentre as quais se inclui a obrigação de:","alternativas":{"A":"realizar doações financeiras mensais a partidos políticos registrados no tribunal.","B":"não mudar de residência sem comunicação ao Juízo e à autoridade incumbida da fiscalização.","C":"frequentar cultos religiosos oficiais de uma denominação indicada pelo Estado.","D":"exercer de forma permanente atividades de monitoramento eletrônico via satélite privado.","E":"abster-se de ler publicações ou relatórios de inteligência policial civil."},"resposta_correta":"B","comentario":"O artigo 132, § 2º, alínea \"b\", da LEP estabelece o rol de condições facultativas que o magistrado pode impor ao liberado condicional, destacando-se a obrigação de não mudar de residência sem prévia comunicação ao Juízo e à equipe de fiscalização."},{"id":355,"numero":355,"bloco":2,"materia":"Lei de Execução Penal","texto_base":null,"enunciado":"A fiscalização do cumprimento das penas de prestação de serviços à comunidade exige o acompanhamento dos relatórios de frequência enviados pelas entidades conveniadas. Nos termos do artigo 150 da LEP, a entidade que receber o apenado para a prestação de serviços enviará ao Juiz da Execução:","alternativas":{"A":"mensalmente, relatório circunstanciado das atividades do condenado.","B":"anualmente, a prestação de contas fiscais auditada por contadores públicos.","C":"semanalmente, a listagem de materiais industriais consumidos no labor.","D":"de forma verbal, a comunicação de ocorrências administrativas leves ordinárias.","E":"o comprovante de filiação partidária ativa dos diretores da instituição privada."},"resposta_correta":"A","comentario":"Conforme preceitua o artigo 150 da Lei de Execução Penal, as entidades públicas ou assistenciais conveniadas que acolhem o apenado para a prestação de serviços alternativos têm o dever legal de enviar mensalmente ao Juiz um relatório circunstanciado das atividades do condenado."},{"id":356,"numero":356,"bloco":2,"materia":"Lei de Execução Penal","texto_base":null,"enunciado":"Os estabelecimentos penais devem dispor de estruturas adequadas para garantir a separação da população carcerária masculina e feminina. De acordo com o artigo 82, § 1º, da Lei de Execução Penal, a mulher e o menor de 21 anos:","alternativas":{"A":"cumprirão a pena preferencialmente em estabelecimentos federais de segurança máxima.","B":"serão recolhidos a estabelecimentos distintos, adequados à sua condição pessoal.","C":"submetem-se ao confinamento em celas coletivas comuns mistas com os adultos.","D":"são dispensados do cumprimento das sanções disciplinares de advertência verbal.","E":"terão a guarda tática gerenciada de forma permanente por militares das forças armadas."},"resposta_correta":"B","comentario":"É a aplicação literal do artigo 82, § 1º, da LEP, que consagra critérios biológicos e de vulnerabilidade etária impositivos para a separação da massa carcerária, exigindo estabelecimentos distintos para mulheres e jovens menores de 21 anos."},{"id":357,"numero":357,"bloco":2,"materia":"Lei de Execução Penal","texto_base":null,"enunciado":"A interdição de estabelecimento penal constitui medida de controle de natureza judicial adotada quando a estrutura prisional não preencher os requisitos mínimos de salubridade e segurança. Nos termos do artigo 66, inciso VIII, da LEP, a competência para interditar, no todo ou em parte, estabelecimento penal que estiver funcionando em condições inadequadas pertence ao:","alternativas":{"A":"Governador do Estado por meio de decreto normativo isolado.","B":"Secretário de Estado da Administração Penitenciária de forma discricionária.","C":"Juiz da Execução.","D":"Promotor de Justiça titular da fiscalização das varas criminais regionais.","E":"Presidente da Assembleia Legislativa mediante provocação de comissão técnica."},"resposta_correta":"C","comentario":"O artigo 66, inciso VIII, da LEP confere ao Juiz da Execução Penal a competência exclusiva para decretar a interdição, no todo ou em parte, de estabelecimentos prisionais que apresentem problemas graves de salubridade, engenharia estrutural ou superlotação crônica."},{"id":358,"numero":358,"bloco":2,"materia":"Lei de Execução Penal","texto_base":null,"enunciado":"O trabalho externo para presos em regime semiaberto submete-se a regras de disciplina e responsabilidade diferenciadas daquelas exigidas para o regime fechado. De acordo com o artigo 37 da LEP, a autorização de trabalho externo para o preso em regime semiaberto:","alternativas":{"A":"depende de escolta armada e ostensiva permanente durante toda a jornada laboral.","B":"exige a aprovação unânime dos membros do conselho nacional de política criminal.","C":"depende de autorização judicial e submete- se a condições de comportamento e responsabilidade.","D":"fica restrita aos serviços prestados em obras públicas federais aduaneiras.","E":"cassa automaticamente o direito do apenado de realizar saídas temporárias."},"resposta_correta":"C","comentario":"Nos termos do artigo 37 da LEP, ao contrário do regime fechado (que exige obras públicas e limite de 20%), o trabalho externo para presos do regime semiaberto depende de autorização judicial e submete-se a condições de comportamento e responsabilidade do apenado, dispensando escolta armada ostensiva direta."},{"id":359,"numero":359,"bloco":2,"materia":"Lei de Execução Penal","texto_base":null,"enunciado":"Considere a seguinte situação hipotética: Um reeducando que cumpre pena no regime fechado trabalha na horta interna de uma penitenciária potiguar. Durante a realização do labor, o apenado agride fisicamente outro preso utilizando uma ferramenta de capina, causando-lhe lesões graves. De acordo com o artigo 126, § 6º, da LEP (redação da Lei nº 12.433/2011), o praticante de falta grave perde o direito ao tempo remido, estabelecendo o texto legal que o Juiz poderá revogar até o limite de:","alternativas":{"A":"metade (1/2) do tempo remido acumulado no prontuário carcerário.","B":"dois terços (2/3) dos dias de desconto obtidos por meio de trabalho industrial.","C":"até 1/3 (um terço) do tempo remido, recomeçando a contagem a partir da data da infração.","D":"a totalidade dos dias remidos conquistados pelo apenado desde o início do regime.","E":"um quarto (1/4) do tempo remido, estritamente se a falta envolver subversão da ordem."},"resposta_correta":"C","comentario":"O artigo 127 da LEP (redação da Lei nº 12.433/2011) limita a perda dos dias remidos decorrente de falta grave ao patamar máximo e intransigente de até um terço (1/3) do total de dias acumulados pelo apenado no prontuário carcerário."},{"id":360,"numero":360,"bloco":2,"materia":"Lei de Execução Penal","texto_base":null,"enunciado":"A revogação do livramento condicional constitui medida aplicada pelo Juiz da Execução quando o liberado descumpre as obrigações fixadas ou comete nova infração. Nos termos do artigo 140 da LEP, se a revogação for motivada por condenação por crime anterior ao benefício:","alternativas":{"A":"o tempo em que o apenado esteve em liberdade será computado como pena cumprida.","B":"computar-se-á como tempo de cumprimento de pena o período em que esteve solto.","C":"não se computará na limitação do tempo de pena o período em que esteve em liberdade. (Nota de ajuste literal: Art. 140 - Se a revogação for motivada por infração posterior, não se computará... Se for motivada por crime anterior, computar-se-á como tempo de cumprimento o período em que esteve solto). Assinale a alternativa que traz a correspondência do texto da LEP para condenação por crime anterior: A) o período em que esteve solto será totalmente desconsiderado no cômputo da pena. B) computar-se-á como tempo de cumprimento da pena o período em que esteve solto. C) haverá a remissão compulsória de metade do restante da pena privativa aplicada.","D":"o apenado perderá o direito de pleitear novos livramentos condicionais vitaliciamente.","E":"a competência para reavaliar o benefício migrará para o Tribunal de Justiça Militar."},"resposta_correta":"B","comentario":"De acordo com a literalidade do artigo 140 da LEP, se a revogação do livramento condicional for motivada por condenação por crime praticado anteriormente à concessão do benefício, computar-se-á como tempo de cumprimento da pena o período em que o apenado esteve solto no gozo do livramento."},{"id":361,"numero":361,"bloco":2,"materia":"Lei de Execução Penal","texto_base":null,"enunciado":"O indulto e a comutação de penas constituem causas extintivas ou redutoras da punibilidade concedidas de forma coletiva por Decreto do Presidente da República. Nos termos do artigo 193 da LEP, transitada em julgado a decisão judicial que concede o indulto ou a comutação, o Juiz da Execução:","alternativas":{"A":"submeterá a liberação do preso à aprovação prévia do Governador do Estado.","B":"ordenará a expedição do alvará de soltura ou retificará o cálculo de liquidação da pena.","C":"determinará a inclusão do apenado em Regime Disciplinar Diferenciado de isolamento.","D":"cobrará taxas judiciais proporcionais ao saldo remanescente do subsídio do funcionário.","E":"encaminhará os autos ao Tribunal de Contas para a auditoria orçamentária das multas."},"resposta_correta":"B","comentario":"Conforme preceitua o artigo 193 da LEP, uma vez homologado e transitado em julgado o Decreto presidencial de indulto (extinção) ou comutação (redução), compete ao Juiz da Execução ordenar a soltura imediata do apenado ou proceder à retificação dos cálculos de pena."},{"id":362,"numero":362,"bloco":2,"materia":"Lei de Execução Penal","texto_base":null,"enunciado":"A monitoração eletrônica de presos exige o respeito a deveres específicos por parte do monitorado para garantir a integridade do controle geográfico. Nos termos do artigo 146-C da LEP, o condenado autorizado a usar a tornozeleira eletrônica deve cumprir o seguinte dever:","alternativas":{"A":"realizar a manutenção preventiva mecânica do aparelho em oficinas privadas credenciadas.","B":"receber visitas diárias do Promotor de Justiça em sua residência particular comum.","C":"receber visitas do servidor responsável pela monitoração eletrônica, responder aos seus contatos e cumprir as orientações.","D":"abster-se de circular em vias urbanas municipais durante os períodos diurnos ordinários.","E":"recolher mensalmente taxas de utilização tecnológica ao fundo penitenciário estadual."},"resposta_correta":"C","comentario":"O artigo 146-C da LEP elenca os deveres do monitorado eletronicamente, destacando-se a obrigação impositiva de receber os servidores responsáveis pela fiscalização técnica, responder aos seus contatos e cumprir rigorosamente as orientações de perímetro."},{"id":363,"numero":363,"bloco":2,"materia":"Lei de Execução Penal","texto_base":null,"enunciado":"Considere a seguinte situação hipotética: Um reeducando que cumpre pena no regime fechado passa a apresentar reiterados problemas de comportamento, recusando-se a realizar a limpeza de sua cela e proferindo ofensas verbais leves contra a equipe de plantão durante as revistas de rotina. De acordo com o artigo 47 da LEP, a classificação das faltas disciplinares em leves e médias submete-se ao ordenamento de matriz local, estabelecendo a lei federal que as faltas graves são tipificadas em lei federal e as leves e médias:","alternativas":{"A":"são definidas por Decreto do Presidente da República de forma unificada nacional.","B":"serão especificadas pela legislação local (Estadual ou Distrital).","C":"ficam restritas ao catálogo normativo editado pelo sindicato dos policiais penais.","D":"dependem de provimento extraordinário assinado pelo juiz corregedor de comarca.","E":"são dirimidas discricionariamente pelo Diretor de Segurança em parecer verbal."},"resposta_correta":"B","comentario":"O artigo 47 da LEP positiva o princípio da reserva legal federal unicamente para a definição de faltas graves. O texto legal remete expressamente à legislação local (Códigos de Execução ou Regulamentos Estaduais) a competência para especificar e classificar as faltas leves e médias."},{"id":364,"numero":364,"bloco":2,"materia":"Lei de Execução Penal","texto_base":null,"enunciado":"A execução das penas restritivas de direitos pode ser convertida em pena privativa de liberdade quando o condenado frustrar a execução ou descumprir as condições fixadas. Nos termos do artigo 181 da LEP, a pena de prestação de serviços à comunidade converter-se-á em privativa de liberdade quando o condenado:","alternativas":{"A":"manifestar preferência por atividades laborais burocráticas em detrimento de manuais.","B":"mudar de residência para outra comarca sem autorização prévia por escrito do sindicato.","C":"descumprir injustificadamente as condições impostas ou recusar-se a realizar os serviços.","D":"sofrer punição por infrações de trânsito rodoviário na modalidade de natureza leve.","E":"pleitear a remissão de pena por estudo por meio de petição da Defensoria Pública."},"resposta_correta":"C","comentario":"Nos termos do artigo 181, § 1º, alínea \"a\", da LEP, as penas restritivas de direitos serão reconvertidas em prisão fechada ou detenção quando o apenado descumprir injustificadamente as restrições impostas ou recusar-se de forma peremptória a realizar as tarefas da prestação de serviços."},{"id":365,"numero":365,"bloco":2,"materia":"Lei de Execução Penal","texto_base":null,"enunciado":"O cômputo do tempo de pena cumprido pelo apenado submete-se a regras de liquidação gerenciadas pelo Juízo da Execução. Nos termos do artigo 66, inciso III, da LEP, compete ao Juiz da Execução realizar a liquidação da pena e decidir sobre:","alternativas":{"A":"a instauração inicial de inquéritos policiais por crimes funcionais de servidores.","B":"progressão e regressão de regimes, detração e remição da pena, e livramento condicional.","C":"a demissão sumária de policiais penais estáveis envolvidos em fraudes licitatórias.","D":"a privatização e terceirização logística das oficinas industriais dos pavilhões comuns.","E":"o reajuste automático dos subsídios das carreiras de segurança do funcionalismo."},"resposta_correta":"B","comentario":"O artigo 66, inciso III, da LEP delimita as competências jurisdicionais do Juízo da Execução Penal, cabendo-lhe processar e decidir analiticamente as progressões, regressões, detração, remição e concessão de livramentos condicionais."},{"id":366,"numero":366,"bloco":2,"materia":"Lei de Execução Penal","texto_base":null,"enunciado":"Os estabelecimentos penais destinados ao regime fechado submetem-se a requisitos de segurança máxima para conter fugas e garantir a incolumidade social. De acordo com o artigo 87 da LEP, a Penitenciária destina-se ao condenado à pena de:","alternativas":{"A":"reclusão, em regime fechado.","B":"detenção, em regime semiaberto.","C":"prisão simples, em regime aberto domiciliar humanitário.","D":"internação compulsória, em medida de segurança ambulatorial.","E":"limitação de fim de semana, na Casa do Albergado comum."},"resposta_correta":"A","comentario":"É a aplicação literal do artigo 87 da Lei de Execução Penal. A Penitenciária qualifica-se como o estabelecimento prisional adequado e impositivo destinado ao cumprimento das penas de reclusão em Regime Fechado."},{"id":367,"numero":367,"bloco":2,"materia":"Lei de Execução Penal","texto_base":null,"enunciado":"Considere a seguinte situação hipotética: Durante o procedimento de tranca noturna dos pavilhões comuns de um complexo carcerário potiguar, um detento maior e capaz recusa-se a entrar no bloco residencial e passa a quebrar deliberadamente a lâmpada, a fiação e o encanamento sanitário da ala. À luz das disposições da Lei de Execução Penal relativas às infrações de natureza material e patrimonial, o comportamento do reeducando configura falta grave, consubstanciada no ato de:","alternativas":{"A":"tentar ludibriar a contagem matinal por meio do uso de fardas clonadas.","B":"praticar fato previsto como crime doloso ou causar dano ao patrimônio público.","C":"exercer o direito de petição de forma desrespeitosa contra a diretoria superior.","D":"recusar-se a assinar termos de recebimento de materiais de higiene oficial.","E":"manifestar preferência por celas individuais dotadas de monitoração por rádio."},"resposta_correta":"B","comentario":"Conforme preceitua o artigo 50, inciso VI, combinado com o artigo 39, inciso IX, da LEP, o detento comete falta disciplinar de natureza grave ao destruir, danificar ou avariar as estruturas físicas ou patrimônio público pertencente ao complexo carcerário."},{"id":368,"numero":368,"bloco":2,"materia":"Lei de Execução Penal","texto_base":null,"enunciado":"A assistência educacional ao preso e ao internado compreenderá a instrução escolar e a formação profissional. Nos termos do artigo 17, § 1º, da LEP, o ensino de primeiro grau (ensino fundamental) no âmbito dos estabelecimentos penais possui caráter:","alternativas":{"A":"facultativo, ficando a critério do Diretor da unidade organizar ou não as turmas.","B":"obrigatório, integrando-se no sistema escolar da unidade federativa.","C":"restrito aos detentos que comprovem bom comportamento carcerário há mais de dois anos.","D":"condicionado ao pagamento de taxas de matrícula pelos familiares do reeducando.","E":"dispensado se o complexo carcerário estiver operando em nível de superlotação."},"resposta_correta":"B","comentario":"O artigo 17, § 1º, da LEP estabelece que a assistência educacional carcerária integrará o sistema de ensino da unidade federativa, possuindo o ensino de primeiro grau (ensino fundamental) caráter obrigatório na estrutura prisional."},{"id":369,"numero":369,"bloco":2,"materia":"Lei de Execução Penal","texto_base":null,"enunciado":"A execução da pena de multa submete-se a ritos e prazos específicos que garantem a cobrança da sanção patrimonial aplicada na sentença condenatória. Nos termos do artigo 164 da LEP, extraída a certidão da sentença condenatória com pena de multa, o condenado será intimado para realizar o pagamento no prazo de:","alternativas":{"A":"5 (cinco) dias corridos a partir da notificação formal judicial.","B":"10 (dez) dias, contados da data de intimação pessoal ou por edital.","C":"15 (quinze) dias úteis mediante depósito em conta bancária judicial específica.","D":"30 (trinta) dias consecutivos sob pena de conversão automática em prisão fechada.","E":"60 (sessenta) dias contados do trânsito em julgado do processo originário de mérito."},"resposta_correta":"B","comentario":"Nos termos do artigo 164 da LEP, transitada em julgado a sentença que aplica a pena de multa patrimonial, o apenado será formalmente intimado para realizar o adimplemento da sanção pecuniária no prazo impositivo de 10 dias."},{"id":370,"numero":370,"bloco":2,"materia":"Lei de Execução Penal","texto_base":null,"enunciado":"A regressão de regime consiste na transferência do condenado para qualquer dos regimes mais rigorosos, operada pelo Juiz da Execução após procedimento regular. De acordo com as disposições do artigo 118, § 2º, da LEP, nas hipóteses de regressão motivadas por falta grave ou novo crime, o preso:","alternativas":{"A":"será transferido de forma sumária e imediata sem direito a qualquer modalidade de manifestação.","B":"deverá ser ouvido previamente pelo magistrado penal em audiência de justificação.","C":"submete-se ao isolamento preventivo perpétuo em penitenciárias federais de segurança.","D":"perderá o direito de ser assistido por defensor público ou advogado dativo no processo.","E":"tem sua pena unificada com base no valor total do prejuízo material causado ao erário."},"resposta_correta":"B","comentario":"O artigo 118, § 2º, da LEP consagra o direito à ampla defesa na execução penal. Diante do pleito de regressão definitiva de regime motivado por falta grave ou novo crime, o apenado deve ser previamente ouvido pelo magistrado em audiência de justificação, sob pena de nulidade."},{"id":371,"numero":371,"bloco":2,"materia":"Lei de Execução Penal","texto_base":null,"enunciado":"Considere a seguinte situação hipotética: Um detento que cumpre pena no regime fechado trabalha regularmente na cozinha industrial instalada no interior de uma penitenciária do Rio Grande do Norte. O reeducando cumpre sua jornada laboral de forma exemplar, respeitando os horários e as diretrizes técnicas da equipe de nutrição. Nos termos do artigo 33 da Lei de Execução Penal, a jornada diária de trabalho do preso submete- se a limites temporais, estabelecendo o texto legal que a jornada não será:","alternativas":{"A":"inferior a 4 (quatro) nem superior a 6 (seis) horas, com descanso aos domingos e feriados.","B":"inferior a 6 (seis) nem superior a 8 (oito) horas, com descanso nos domingos e feriados.","C":"superior a 10 (dez) horas diárias de forma contínua e linear sob pena de nulidade funcional.","D":"fixada por critérios discricionários da empresa privada parceira das oficinas de campo.","E":"superior a 40 (quarenta) horas semanais ininterruptas sem direito a intervalos de repouso."},"resposta_correta":"B","comentario":"É a redação literal do artigo 33 da Lei de Execução Penal. Resguardando os limites humanitários contra a exploração, a jornada diária de trabalho do preso submete-se às balizas de no mínimo 6 horas e no máximo 8 horas diárias, garantindo-se descanso em domingos e feriados."},{"id":372,"numero":372,"bloco":2,"materia":"Lei de Execução Penal","texto_base":null,"enunciado":"O Patronato qualifica-se como órgão da execução penal de extrema importância para o apoio aos egressos e fiscalização de penas alternativas. Nos termos do artigo 78 da LEP, constitui dever e atribuição do Patronato, entre outras funções:","alternativas":{"A":"expedir alvarás de soltura humanitários individuais para conter epidemias de saúde carcerária.","B":"orientar os egressos e propiciar-lhes facilidades na obtenção de trabalho, moradia e reinserção social.","C":"homologar os cálculos de remissão por estudo apresentados pelas defesas técnicas em juízo.","D":"fiscalizar as escalas de plantão ordinárias das guarições armadas das muralhas estaduais.","E":"julgar em grau de recurso as decisões disciplinares exaradas por diretores de complexos."},"resposta_correta":"B","comentario":"O artigo 78 da LEP define as funções institucionais do Patronato, órgão de assistência pós-penitenciária focado em prestar acolhimento aos egressos e albergados, facilitando sua inserção no mercado de trabalho e moradia para evitar a reincidência."},{"id":373,"numero":373,"bloco":2,"materia":"Lei de Execução Penal","texto_base":null,"enunciado":"A remição de pena obtida por meio da leitura de obras literárias e elaboração de resenhas técnicas foi consolidada na execução penal contemporânea. De acordo com as diretrizes do Conselho Nacional de Justiça (Resolução CNJ nº 44/2013 e regras gerais da LEP), a leitura de cada obra literária aprovada por comissão técnica autoriza a remição de:","alternativas":{"A":"2 (dois) dias de pena aplicada na sentença originária de mérito criminal.","B":"4 (quatro) dias de pena, limitada ao teto máximo de 48 (quarenta e oito) dias por período anual.","C":"6 (seis) dias de pena de forma fixa e intransigente em todo e qualquer caso concreto.","D":"10 (dez) dias de desconto carcerário homologados pelo juiz corregedor de comarca.","E":"12 (doze) dias de pena vinculados ao preenchimento do requisito do bom comportamento."},"resposta_correta":"B","comentario":"A Resolução nº 44/2013 do CNJ, integrada às diretrizes de remição por estudo da LEP, consolidou que a leitura de obras literárias com elaboração de resenha autoriza o desconto de 4 dias de pena por obra, submetendo-se ao teto máximo de 12 obras por ano (48 dias de remição anual máxima)."},{"id":374,"numero":374,"bloco":2,"materia":"Lei de Execução Penal","texto_base":null,"enunciado":"O livramento condicional pode ser revogado ou extinto pelo decurso do tempo se não houver causas de suspensão ou revogação vigentes. Nos termos do artigo 146 da LEP, se até o término do período de prova o livramento condicional não for revogado, considera-se:","alternativas":{"A":"prorrogado o benefício de forma automática por igual período regulamentar de prova.","B":"extinta a pena privativa de liberdade aplicada na sentença condenatória originária.","C":"nula toda a marcha processual da execução penal comum por excesso de prazo.","D":"autorizada a imediata regressão provisória do apenado ao regime fechado de segurança.","E":"pendente a homologação da soltura definitiva por comissões especiais de deputados."},"resposta_correta":"B","comentario":"Conforme preceitua o artigo 146 da LEP, se transcorrer todo o período de prova fixado pelo magistrado sem que o livramento condicional tenha sido suspenso ou revogado por novas infrações, opera-se de forma automática a extinção definitiva da pena privativa de liberdade."},{"id":375,"numero":375,"bloco":2,"materia":"Lei de Execução Penal","texto_base":null,"enunciado":"Considere a seguinte situação hipotética: O Diretor de uma cadeia pública potiguar, diante de indícios robustos de que um detento está liderando a articulação de um motim pavimentar, decide aplicar-lhe a sanção disciplinar de isolamento na própria cela por dez dias consecutivos antes de formalizar a comunicação ao Juízo da Execução. À luz das regras que regulam a competência e o procedimento disciplinar no artigo 54 da LEP, a aplicação das sanções disciplinares de isolamento e suspensão de direitos:","alternativas":{"A":"compete de forma privativa e exclusiva ao Juiz da Execução Penal, mediante provocação motivada.","B":"é de competência da autoridade administrativa (Diretor do estabelecimento), que comunicará o fato ao Juiz da Execução.","C":"exige a anuência unânime dos membros do conselho penitenciário estipulada por escrito.","D":"submete-se à aprovação prévia do sindicato dos servidores públicos das carreiras de segurança.","E":"é vedada no ordenamento jurídico carcerário nacional contemporâneo por afrontar garantias civis."},"resposta_correta":"B","comentario":"O artigo 54 da LEP positiva a distribuição de competências disciplinares. A aplicação das sanções administrativas de advertência, repreensão, suspensão de regalias ou isolamento na cela (limite de 30 dias) compete à autoridade administrativa (Diretor do estabelecimento), que comunicará imediatamente o ato ao Juiz da Execução."},{"id":376,"numero":376,"bloco":1,"materia":"Legislação Específica","texto_base":null,"enunciado":"A Lei nº 13.869/2019 disciplina os crimes de abuso de autoridade, cometidos por agente público, servidor ou não, que, no exercício de suas funções ou a pretexto de exercê-las, abuse do poder que lhe foi conferido. Nos termos expressos do artigo 1º, § 1º, da referida lei, as condutas descritas no diploma só serão punidas se praticadas com a finalidade específica de:","alternativas":{"A":"gerar economia orçamentária para as contas da Secretaria de Administração Penitenciária.","B":"cumprir metas institucionais de produtividade fixadas de forma verbal pela chefia.","C":"prejudicar outrem ou beneficiar a si mesmo ou a terceiro, ou por mero capricho ou satisfação pessoal.","D":"demonstrar eficácia tática operacional em revistas estruturais nos pavilhões.","E":"resguardar o sigilo de relatórios de inteligência criminal sigilosos produzidos pelas forças armadas."},"resposta_correta":"C","comentario":"É a redação literal do artigo 1º, § 1º, da Lei nº 13.869/2019. A Nova Lei de Abuso de Autoridade exige a demonstração inequívoca do dolo específico (finalidade de prejudicar outrem, beneficiar a si ou a terceiro, ou por mero capricho/satisfação pessoal) para a tipificação de qualquer conduta descrita no diploma."},{"id":377,"numero":377,"bloco":1,"materia":"Legislação Específica","texto_base":null,"enunciado":"Os crimes previstos na Lei de Abuso de Autoridade (Lei nº 13.869/2019) submetem-se a regras específicas de ação penal e de responsabilização dos agentes. De acordo com o texto legal vigente, os crimes de abuso de autoridade são de ação penal:","alternativas":{"A":"pública condicionada à representação do Governador do Estado.","B":"privada exclusiva, dependendo de queixa- crime assinada por três advogados.","C":"pública incondicionada.","D":"pública condicionada à homologação prévia do conselho da comunidade local.","E":"privada subsidiária da pública de forma automática e compulsória."},"resposta_correta":"C","comentario":"Nos termos do artigo 3º da Lei nº 13.869/2019, todos os crimes de abuso de autoridade processam-se mediante ação penal pública incondicionada, admitindo-se a ação privada subsidiária da pública unicamente se o Ministério Público não oferecer a denúncia no prazo legal."},{"id":378,"numero":378,"bloco":1,"materia":"Legislação Específica","texto_base":null,"enunciado":"Considere a seguinte situação hipotética: Durante a realização de uma vistoria técnica extraordinária em uma cadeia pública potiguar, um Policial Penal de plantão, agindo movido por animosidade pessoal e com o claro intuito de constranger um detento, obriga-o a despir-se completamente diante da equipe e a permanecer em posição vexatória na frente da imprensa local que realizava uma cobertura jornalística autorizada. À luz do artigo 15 da Lei nº 13.869/2019, constranger o preso ou o detento, mediante violência, grave ameaça ou redução de sua capacidade de resistência, a submeter-se a situação vexatória ou a constrangimento não autorizado por lei configura:","alternativas":{"A":"mero desvio ético-disciplinar leve dispensado de apuração correcional.","B":"crime de abuso de autoridade, punido com pena de detenção e multa.","C":"ato de legítima defesa da segurança carcerária em momentos de iminente motim.","D":"crime doloso de tortura-castigo por envolver sofrimento moral imediato.","E":"irregularidade procedimental de trâmite burocrático de tranca institucional."},"resposta_correta":"B","comentario":"O artigo 15, inciso II, da Lei nº 13.869/2019 tipifica expressamente como crime de abuso de autoridade o ato de constranger o preso ou detento, mediante violência ou grave ameaça, a submeter-se a situação vexatória ou a constrangimento não autorizado por lei, punindo o agente com pena de detenção e multa."},{"id":379,"numero":379,"bloco":1,"materia":"Legislação Específica","texto_base":null,"enunciado":"A Lei nº 9.455/1997 define os crimes de tortura e estabelece as respectivas sanções penais e efeitos da condenação. De acordo com as disposições do referido diploma legal, a condenação por crime de tortura acarretará automaticamente:","alternativas":{"A":"o afastamento temporário das funções pelo prazo máximo de trinta dias úteis.","B":"a perda do cargo, função ou emprego público e a interdição para seu exercício pelo dobro do prazo da pena aplicada.","C":"a suspensão dos direitos políticos estaduais por cinco anos de forma improrrogável.","D":"o desconto imediato de parcelas remuneratórias revertidas ao fundo penitenciário.","E":"a obrigatoriedade de cumprimento da pena em regime aberto domiciliar humanitário."},"resposta_correta":"B","comentario":"Trata-se da aplicação da literalidade do artigo 1º, § 5º, da Lei nº 9.455/1997. A condenação pelo crime de tortura acarreta efeitos automáticos e impositivos na sentença: a perda do cargo público e a interdição para o exercício de nova função pública pelo dobro do prazo da pena privativa de liberdade aplicada."},{"id":380,"numero":380,"bloco":1,"materia":"Legislação Específica","texto_base":null,"enunciado":"A Lei de Tortura prevê modalidades específicas nas quais a conduta delituosa independe do emprego de violência física direta, focando na imposição de sofrimento. O ato de submeter alguém, sob sua guarda, poder ou autoridade, com emprego de violência ou grave ameaça, a intenso sofrimento físico ou mental, como forma de aplicar castigo pessoal ou medida preventiva, configura o crime de:","alternativas":{"A":"Tortura para a prática de crime (Tortura- crime).","B":"Tortura-castigo.","C":"Tortura preconceituosa ou discriminatória.","D":"Tortura por omissão ilegal desidiosa.","E":"Constrangimento ilegal qualificado patrimonial."},"resposta_correta":"B","comentario":"O artigo 1º, inciso II, da Lei de Tortura tipifica a modalidade da Tortura-castigo, caracterizada pela imposição de intenso sofrimento físico ou mental a alguém sob sua guarda, poder ou autoridade, movido pelo intuito de aplicar castigo pessoal ou medida preventiva."},{"id":381,"numero":381,"bloco":1,"materia":"Legislação Específica","texto_base":null,"enunciado":"Considere a seguinte situação hipotética: O Diretor de Segurança de um complexo carcerário potiguar toma conhecimento, por meio de relatórios escritos, de que agentes públicos de uma das alas estão aplicando agressões físicas ilegais e intencionais contra detentos para arrancar confissões sobre faltas disciplinares. O Diretor, com o objetivo de evitar desgastes institucionais, decide omitir-se e deixa de instaurar qualquer procedimento ou comunicar o fato às autoridades superiores. À luz do artigo 1º, § 2º, da Lei nº 9.455/1997, aquele que se omite em face das condutas de tortura, quando tinha o dever de evitá-las ou apurá-las, incorre na pena de:","alternativas":{"A":"reclusão de dois a oito anos, idêntica à do executor direto da tortura.","B":"detenção de um a quatro anos, qualificando-se como modalidade de tortura por omissão.","C":"suspensão administrativa simples sem reflexos na esfera criminal ordinária.","D":"demissão sumária por ato discricionário imediato do Governador do Estado.","E":"reclusão de quatro a dez anos, majorada pela condição de superior hierárquico."},"resposta_correta":"B","comentario":"Conforme preceitua o artigo 1º, § 2º, da Lei nº 9.455/1997, a omissão perante a tortura constitui crime autônomo (crime de conduta omissiva própria), punido de forma mitigada com pena de detenção de 1 a 4 anos, repelindo-se a equiparação à pena da tortura comissiva por execução direta."},{"id":382,"numero":382,"bloco":1,"materia":"Legislação Específica","texto_base":null,"enunciado":"A Lei nº 11.343/2006 (Lei de Drogas) institui o Sistema Nacional de Políticas Públicas sobre Drogas e prescreve medidas de prevenção, atenção e repressão ao tráfico ilícito. O crime de tráfico ilícito de entorpecentes, tipificado no artigo 33, caput, da referida lei, caracteriza-se por possuir um tipo penal multinuclear (vários verbos). Assinale a alternativa que apresenta uma conduta que não configura o crime de tráfico de drogas em sua modalidade dolosa pura.","alternativas":{"A":"Importar, exportar, remeter, preparar, produzir ou fabricar drogas sem autorização.","B":"Trazer consigo, transportar, ter em depósito, guardar ou entregar a consumo substância entorpecente.","C":"Adquirir, guardar, ter em depósito, transportar ou trouxer consigo, para consumo pessoal, drogas sem autorização legal.","D":"Vender, expor à venda, oferecer, ter em depósito, transportar, trazer consigo ou guardar substância entorpecente.","E":"Fornecer, ainda que gratuitamente, ministrar, entregar a consumo ou fornecer drogas sem autorização."},"resposta_correta":"C","comentario":"As condutas de adquirir, guardar, ter em depósito, transportar ou trazer consigo substâncias entorpecentes para consumo pessoal estão capituladas no artigo 28 da Lei nº 11.343/2006 (posse de drogas para consumo pessoal), crime que submete o agente a penas alternativas sem privação de liberdade, diferenciando-se do tráfico ilícito comercial do artigo 33."},{"id":383,"numero":383,"bloco":1,"materia":"Legislação Específica","texto_base":null,"enunciado":"O Estatuto do Desarmamento (Lei nº 10.826/2003) disciplina o registro, posse e porte de armas de fogo e munições no território nacional. O ato de portar, deter, adquirir, fornecer, receber, ter em depósito, transportar, trazer consigo, ocultar ou manter sob sua guarda arma de fogo, acessório ou munição, de uso permitido, sem autorização e em desacordo com determinação legal ou regulamentar, configura o crime de:","alternativas":{"A":"Posse irregular de arma de fogo de uso permitido.","B":"Porte ilegal de arma de fogo de uso permitido.","C":"Posse ou porte ilegal de arma de fogo de uso restrito.","D":"Disparo de arma de fogo em via pública urbana.","E":"Comércio ilegal de armas de fogo transnacional."},"resposta_correta":"B","comentario":"O artigo 14 da Lei nº 10.826/2003 tipifica o crime de Porte ilegal de arma de fogo de uso permitido, caracterizado pelo ato de portar, transportar ou trazer consigo o artefato ou munição fora das dependências de sua residência ou local de trabalho regular sem autorização."},{"id":384,"numero":384,"bloco":1,"materia":"Legislação Específica","texto_base":null,"enunciado":"O crime de posse irregular de arma de fogo de uso permitido diferencia-se do porte ilegal a partir do local geográfico onde o artefato é mantido pelo agente. Nos termos do artigo 12 da Lei nº 10.826/2003, configura posse irregular manter a arma de fogo de uso permitido sob sua guarda no interior de sua:","alternativas":{"A":"mochila ou vestimenta em via pública urbana municipal de livre circulação.","B":"residência ou dependência desta, ou, ainda, no seu local de trabalho, desde que seja o titular ou o responsável legal do estabelecimento.","C":"viatura automotiva particular estacionada regularmente em pátios de repartições públicas.","D":"sacola de viagem guardada de forma temporária em armários de rodoviárias estaduais.","E":"propriedade comercial privada de terceiros sem o consentimento dos respectivos gerentes."},"resposta_correta":"B","comentario":"É a redação expressa do artigo 12 do Estatuto do Desarmamento. O crime de Posse irregular de arma de fogo de uso permitido restringe-se estritamente à conduta de manter o armamento ou munição no interior da residência do agente (ou dependência desta) ou no seu local de trabalho regular, desde que este seja o dono ou responsável legal da empresa."},{"id":385,"numero":385,"bloco":1,"materia":"Legislação Específica","texto_base":null,"enunciado":"A Lei nº 8.072/1990 elenca o rol taxativo de Crimes Hediondos, submetendo-os a regimes de cumprimento de pena mais severos e restrições de benefícios. Com as modificações operadas pelo Pacote Anticrime (Lei nº 13.964/2019), o crime de roubo passou a figurar expressamente no rol dos crimes hediondos quando cometido circunstanciado pelo(a):","alternativas":{"A":"concurso de duas ou mais pessoas na modalidade simples patrimonial.","B":"emprego de arma de fogo ou se da violência resulta lesão corporal grave ou morte.","C":"restrição de liberdade da vítima por período inferior a dez minutos de tranca.","D":"subtração de substâncias explosivas destinadas a obras de infraestrutura agrícola.","E":"uso de chaves clonadas ou simulacros de plástico de armas de choque artesanais."},"resposta_correta":"B","comentario":"O Pacote Anticrime (Lei nº 13.964/2019) operou modificações profundas na Lei nº 8.072/1990, catalogando o roubo como crime hediondo unicamente quando circunstanciado pelo emprego de arma de fogo (seja de uso permitido, restrito ou proibido) ou se da violência resultar lesão corporal grave ou morte."},{"id":386,"numero":386,"bloco":1,"materia":"Legislação Específica","texto_base":null,"enunciado":"Considere a seguinte situação hipotética: Um indivíduo é preso em flagrante por Policiais Penais ao tentar arremessar para o interior de um presídio potiguar um pacote contendo 500 gramas de substância análoga à maconha. Lavrado o APF, a acusação capitula a conduta no crime de tráfico de drogas, exigindo a aplicação de uma causa de aumento de pena específica. Nos termos do artigo 40, inciso III, da Lei nº 11.343/2006, as penas dos crimes de tráfico de drogas são majoradas de um sexto a dois terços se a infração tiver sido cometida nas dependências ou imediações de:","alternativas":{"A":"agências bancárias privadas ou escritórios de contabilidade industrial salineira.","B":"estabelecimentos prisionais, de ensino ou hospitalares, sedes de entidades estudantis, sociais, culturais, recreativas, esportivas ou beneficentes, locais de trabalho coletivo, recintos onde se realizem espetáculos ou diversões de qualquer natureza, de serviços de tratamento de dependentes de drogas ou de reinserção social, de unidades militares ou policiais ou em transportes públicos.","C":"propriedades rurais destinadas de forma exclusiva ao cultivo comercial de cana-de- açúcar.","D":"feiras livres urbanas localizadas em comarcas que não possuam varas criminais ativas.","E":"residências particulares de servidores públicos ocupantes de cargos de direção superior."},"resposta_correta":"B","comentario":"Trata-se da reprodução literal do rol de locais que atraem a incidência da causa de aumento de pena (majorante) do tráfico de drogas fixado pelo artigo 40, inciso III, da Lei nº 11.343/2006, figurando os estabelecimentos prisionais e policiais em destaque."},{"id":387,"numero":387,"bloco":1,"materia":"Legislação Específica","texto_base":null,"enunciado":"A Lei de Abuso de Autoridade tipifica condutas que violam as garantias de trâmite das prisões e o respeito às ordens do Poder Judiciário. De acordo com o artigo 9º da Lei nº 13.869/2019, comete crime de abuso de autoridade o agente público que decreta medida de privação da liberdade em manifesta desconformidade com as hipóteses legais, bem como aquele que, dentro de prazo razoável, deixa de:","alternativas":{"A":"fixar o cardápio alimentar diário a ser fornecido às visitas no final de semana.","B":"conceder regalias administrativas aos detentos que apresentem bom comportamento.","C":"relaxar a prisão ilegal, após omissão da autoridade judiciária, ou de deferir liminar ou ordem de habeas corpus, quando manifestamente cabível.","D":"autorizar a transferência de presos provisórios para colônias agrícolas do semiaberto.","E":"homologar os relatórios de sindicâncias administrativas instauradas contra subordinados."},"resposta_correta":"C","comentario":"Conforme preceitua o artigo 9º, parágrafo único, incisos I e II, da Lei nº 13.869/2019, incorre nas mesmas penas de abuso de autoridade o agente público que, autoridade judiciária competente, deixa de relaxar a prisão ilegal ou de deferir ordem de habeas corpus manifestamente cabível dentro de prazo razoável."},{"id":388,"numero":388,"bloco":1,"materia":"Legislação Específica","texto_base":null,"enunciado":"Os crimes previstos na Lei de Abuso de Autoridade admitem a aplicação de penas restritivas de direitos em substituição às penas privativas de liberdade. Nos termos do artigo 5º do referido diploma legal, constituem penas restritivas de direitos substitutivas:","alternativas":{"A":"a perda total dos direitos políticos estaduais e o confisco imediato de bens familiares.","B":"a prestação de serviços à comunidade ou a entidades públicas, e a suspensão do exercício do cargo, da função ou do mandato, pelo prazo de 1 (um) a 6 (seis) meses, com a perda dos vencimentos e das vantagens.","C":"o isolamento preventivo em Regime Disciplinar Diferenciado de tranca por dez anos consecutivos.","D":"a demissão sumária de funções privadas e a proibição de circular na comarca após as dezoito horas.","E":"a prestação de serviços forçados agrícolas em fazendas modelo pertencentes ao Estado."},"resposta_correta":"B","comentario":"É a redação literal do artigo 5º da Lei de Abuso de Autoridade. As penas restritivas de direitos substitutivas são a prestação de serviços à comunidade e a suspensão do exercício do cargo ou função pelo prazo de 1 a 6 meses, acarretando a perda total da remuneração e vantagens no período."},{"id":389,"numero":389,"bloco":1,"materia":"Legislação Específica","texto_base":null,"enunciado":"A Lei dos Crimes Hediondos (Lei nº 8.072/1990) estabelece vedações drásticas no que concernem à concessão de benefícios aos condenados por esse grupo de delitos graves. De acordo com as normas expressas do artigo 2º, inciso I, da referida lei, os crimes hediondos, a prática da tortura, o tráfico ilícito de entorpecentes e drogas afins e o terrorismo são insuscetíveis de:","alternativas":{"A":"progressão de regime ou detração penal pelo tempo de prisão provisória.","B":"remição de pena obtida por meio de trabalho ou frequência a cursos de estudo.","C":"amnistia, graça e indulto, bem como de fiança.","D":"assistência técnica por advogado constituído ou defensor público dativo.","E":"isolamento cautelar preventivo em celas individuais por motivos de ordem interna."},"resposta_correta":"C","comentario":"O artigo 2º, inciso I, da Lei nº 8.072/1990 reflete os mandamentos constitucionais de severidade penal ao preceituar textualmente que os crimes hediondos e os equiparados (tráfico, tortura e terrorismo) são terminantemente insuscetíveis de anistia, graça, indulto e concessão de fiança."},{"id":390,"numero":390,"bloco":1,"materia":"Legislação Específica","texto_base":null,"enunciado":"O Estatuto do Desarmamento prevê uma causa de aumento de pena de caráter geral aplicável a diversos crimes tipificados no diploma quando o autor ostentar uma condição funcional específica. Nos termos do artigo 20 da Lei nº 10.826/2003, as penas dos crimes de porte, posse e comércio ilegal de armas são aumentadas da metade se forem praticados por integrantes de forças policiais ou agentes públicos das carreiras de:","alternativas":{"A":"auditoria fiscal fazendária, juntas comerciais ou custas judiciais estaduais.","B":"segurança pública (Art. 144 da CF/88, o que inclui a Polícia Penal) ou guardas municipais.","C":"assessoria jurídica privada ou representação diplomática internacional de fronteiras.","D":"intermediação sindical, engenharia civil estrutural ou trânsito rodoviário.","E":"fiscalização sanitária aduaneira ou agências regula
