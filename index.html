doras de previdência social."},"resposta_correta":"B","comentario":"Conforme estabelece o artigo 20 do Estatuto do Desarmamento, a prática de crimes de armas por agentes que integram as forças de segurança pública do artigo 144 da CF/88 (o que abrange a Polícia Penal) ou guardas municipais atrai uma majorante impositiva que aumenta a pena da metade, devido à quebra do dever de proteção estatal."},{"id":391,"numero":391,"bloco":1,"materia":"Legislação Específica","texto_base":null,"enunciado":"Considere a seguinte situação hipotética: Durante uma operação de fiscalização interna nos pavilhões de um complexo penitenciário, os Policiais Penais localizam uma arma de fogo de uso permitido municiada com três cartuchos intactos escondida no interior de um transformador elétrico desativado na cela de uma liderança de facção. À luz das disposições expressas do Estatuto do Desarmamento relativas a condutas qualificadas (Art. 16), introduzir, portar ou manter arma de fogo, acessório ou munição sem autorização legal no interior de estabelecimento prisional configura crime autônomo punido com pena de:","alternativas":{"A":"detenção de seis meses a um ano e multa na modalidade de infração leve de trâmite.","B":"reclusão, enquadrando-se nas condutas equiparadas de alta severidade penal, sem prejuízo das sanções disciplinares.","C":"suspensão administrativa simples de regalias carcerárias dispensada de ação penal.","D":"reclusão de dois a quatro anos, cumulada com a perda compulsória da nacionalidade nata.","E":"multa civil pecuniária a ser quitada pelos familiares do detento flagrado com o material."},"resposta_correta":"B","comentario":"Inovação introduzida pelo Pacote Anticrime no artigo 16, § 1º, inciso VI, do Estatuto do Desarmamento, transformando a conduta de introduzir ou manter arma, acessório ou munição sem autorização legal no interior de estabelecimentos prisionais em conduta equiparada a crime de uso restrito (reclusão)."},{"id":392,"numero":392,"bloco":1,"materia":"Legislação Específica","texto_base":null,"enunciado":"A Lei de Drogas prevê causas de diminuição de pena para o agente que cometer o crime de tráfico de forma isolada e sem vínculos estáveis com a criminalidade organizada (chamado doutrinariamente de \"Tráfico Privilegiado\"). Nos termos do artigo 33, § 4º, da Lei nº 11.343/2006, as penas do tráfico poderão ser reduzidas de um sexto a dois terços, desde que o agente seja:","alternativas":{"A":"réu primário, de bons antecedentes, não se dedique às atividades criminosas nem integre organização criminosa.","B":"menor de vinte e um anos de idade ou maior de setenta anos de idade na data da sentença.","C":"confesso em sede policial e comprove residência fixa no território do Estado por dez anos.","D":"funcionário público das carreiras de segurança e colabore de forma voluntária com a perícia.","E":"usuário crônico de substâncias entorpecentes em tratamento terapêutico ambulatorial."},"resposta_correta":"A","comentario":"O artigo 33, § 4º, da Lei nº 11.343/2006 positiva os quatro requisitos cumulativos obrigatórios para a concessão da causa de diminuição de pena do Tráfico Privilegiado: o agente deve ser primário, possuir bons antecedentes, não se dedicar a atividades criminosas e não integrar organizações criminosas."},{"id":393,"numero":393,"bloco":1,"materia":"Legislação Específica","texto_base":null,"enunciado":"A Lei nº 13.869/2019 tipifica como crime de abuso de autoridade a conduta do agente público que prolonga a execução de medida de restrição de liberdade de forma injustificada. De acordo com o artigo 22 do referido diploma legal, comete crime invadir ou adentrar, clandestina ou astuciosamente, ou à revelia do contexto legal, imóvel alheio ou suas dependências, bem como aquele que cumpre mandado de busca e apreensão domiciliar no seguinte período noturno:","alternativas":{"A":"após as dezoito horas e antes das vinte e duas horas de forma linear.","B":"após as 21h (vinte e uma horas) ou antes das 5h (cinco horas).","C":"durante todo o intervalo compreendido entre as dezoito horas e as seis horas da manhã.","D":"após a meia-noite, vedando-se o cumprimento de mandados judiciais na madrugada.","E":"por determinação verbal direta de autoridade policial de área sem controle do juiz."},"resposta_correta":"B","comentario":"O artigo 22, § 1º, inciso III, da Lei nº 13.869/2019 delimitou de forma literal o conceito de período noturno para fins de cumprimento de mandado de busca e apreensão domiciliar. Comete crime de abuso de autoridade o agente público que executa a medida após as 21h (vinte e uma horas) ou antes das 5h (cinco horas) da manhã."},{"id":394,"numero":394,"bloco":1,"materia":"Legislação Específica","texto_base":null,"enunciado":"O crime de tortura qualifica-se como crime hediondo por equiparação constitucional, submetendo-se a regras de inafiançabilidade e insuscetibilidade de graça ou anistia. De acordo com as causas de aumento de pena previstas no artigo 1º, § 4º, da Lei nº 9.455/1997, a pena do crime de tortura é aumentada de um sexto até um terço se o crime for cometido:","alternativas":{"A":"por agente público, ou contra criança, gestante, portador de deficiência, adolescente ou maior de 60 anos, ou mediante sequestro.","B":"em concurso de mais de dez pessoas na modalidade de motim carcerário pavimentar.","C":"contra patrimônio público imaterial das repartições estaduais ou agências fazendárias.","D":"fora dos limites territoriais da comarca onde o agente público exerce suas funções estáveis.","E":"por motivos de perseguição de natureza estritamente político-partidária de lideranças."},"resposta_correta":"A","comentario":"É a redação literal do artigo 1º, § 4º, da Lei nº 9.455/1997, que traz as três causas de aumento de pena clássicas da tortura: crime cometido por agente público, contra vulneráveis biológicos (criança, gestante, adolescente, deficiente ou idoso) ou mediante sequestro."},{"id":395,"numero":395,"bloco":1,"materia":"Legislação Específica","texto_base":null,"enunciado":"Considere a seguinte situação hipotética: Um indivíduo é abordado por uma guarnição armada portando sob suas vestes uma pistola de calibre 9mm de numeração raspada e suprimida por processo mecânico de abrasão, sem qualquer autorização legal de porte ou registro de propriedade. À luz das disposições expressas do Estatuto do Desarmamento (Art. 16, § 1º, inciso I), portar ou manter arma de fogo de uso permitido ou restrito com numeração, marca ou qualquer outro sinal de identificação raspado, suprimido ou adulterado configura conduta equiparada a:","alternativas":{"A":"porte ilegal de arma de fogo de uso permitido simples com atenuação de pena- base.","B":"posse ou porte ilegal de arma de fogo de uso restrito, sujeitando o agente às penas desta infração de maior gravidade.","C":"contravenção penal de menor potencial ofensivo dispensada de instauração de inquérito.","D":"comércio ilegal de armas de fogo transnacional integrado com organizações faccionadas.","E":"ato de legítima defesa da integridade física contra a precarização estrutural da segurança."},"resposta_correta":"B","comentario":"Conforme preceitua o artigo 16, § 1º, inciso I, da Lei nº 10.826/2003, a conduta de portar ou possuir arma de fogo (ainda que originalmente de uso permitido) com numeração raspada, suprimida ou adulterada foi equiparada pelo legislador ao crime de uso restrito, atraindo as sanções de maior gravidade."},{"id":396,"numero":396,"bloco":1,"materia":"Legislação Específica","texto_base":null,"enunciado":"A Lei de Drogas pune de forma diferenciada as condutas voltadas ao consumo pessoal e aquelas destinadas ao tráfico ilícito comercial. De acordo com o artigo 28 da Lei nº 11.343/2006, quem adquirir, guardar, tiver em depósito, transportar ou trouxer consigo, para consumo pessoal, drogas sem autorização legal submete-se às seguintes penas, as quais não incluem a privação de liberdade:","alternativas":{"A":"multa civil pecuniária compensatória e recolhimento domiciliar noturno obrigatório.","B":"advertência sobre os efeitos das drogas, prestação de serviços à comunidade e medida educativa de comparecimento a programa ou curso educativo.","C":"suspensão de direitos políticos estaduais e cassação de autorizações de trânsito rodoviário.","D":"isolamento preventivo em clínicas terapêuticas privadas credenciadas pelo Estado de forma compulsória.","E":"prestação de serviços forçados agrícolas em fazendas modelo pertencentes ao executivo."},"resposta_correta":"B","comentario":"O artigo 28 da Lei de Drogas (posse para consumo pessoal) passou por um processo de despenalização (afastamento de penas de prisão). O catálogo de sanções restringe-se a medidas alternativas pedagógicas: advertência sobre os efeitos, prestação de serviços e comparecimento a programas educativos."},{"id":397,"numero":397,"bloco":1,"materia":"Legislação Específica","texto_base":null,"enunciado":"Os efeitos da condenação previstos na Lei de Abuso de Autoridade (Lei nº 13.869/2019) dependem de requisitos específicos para sua aplicação na sentença criminal. Nos termos do artigo 4º do referido diploma legal, os efeitos de inabilitação para o exercício de cargo público (pelo prazo de 1 a 5 anos) e a perda do cargo, função ou mandato público são condicionados ao:","alternativas":{"A":"recebimento formal de representação verbal assinada por mais da metade dos detentos da ala.","B":"cometimento de crime que resulte em prejuízo material ao erário público superior a cinquenta mil reais.","C":"trânsito em julgado de sentença condenatória criminal, exigindo-se a reincidência em crime de abuso de autoridade, e não são automáticos (devem ser declarados motivadamente na sentença).","D":"parecer favorável e unânime exarado de forma conjunta pelos membros do conselho da comunidade.","E":"ato discricionário impositivo exarado por Decreto do Governador do Estado sem direito a recurso."},"resposta_correta":"C","comentario":"Nos termos do artigo 4º, parágrafo único, da Lei nº 13.869/2019, os efeitos de inabilitação temporária e perda do cargo não possuem caráter automático. Exigem o trânsito em julgado, a reincidência específica em crimes de abuso de autoridade e a fundamentação expressa e motivada do magistrado na sentença."},{"id":398,"numero":398,"bloco":1,"materia":"Legislação Específica","texto_base":null,"enunciado":"A Lei dos Crimes Hediondos passou por profundas modificações promovidas pelo Pacote Anticrime (Lei nº 13.964/2019), ampliando o catálogo de delitos considerados de altíssima severidade penal. Assinale a alternativa que apresenta um crime que foi expressamente incluído ou mantido como crime hediondo na Lei nº 8.072/1990 com base na legislação contemporânea vigente.","alternativas":{"A":"O furto simples de energia elétrica por meio de ligações clandestinas residenciais comuns.","B":"O crime de genocídio, o crime de posse ou porte ilegal de arma de fogo de uso proibido, o crime de comércio ilegal de armas de fogo e o crime de tráfico internacional de arma de fogo, acessório ou munição.","C":"O estelionato cometido contra entidades filantrópicas de assistência social carcerária privada.","D":"A apropriação indébita previdenciária praticada por servidores em estágio probatório estável.","E":"O crime de dano qualificado contra bens móveis ou semoventes de propriedades agrícolas cafeeiras."},"resposta_correta":"B","comentario":"Trata-se da aplicação das modificações operadas pelo Pacote Anticrime (Lei nº 13.964/2019) no artigo 1º, parágrafo único, da Lei nº 8.072/1990, elevando os crimes de genocídio, posse/porte de arma de uso proibido, comércio ilegal de armas e tráfico internacional de armamentos ao status de crimes hediondos."},{"id":399,"numero":399,"bloco":1,"materia":"Legislação Específica","texto_base":null,"enunciado":"A Lei de Drogas disciplina o procedimento para o perdão ou redução de penas em face da cooperação voluntária do investigado com as autoridades policiais ou judiciais (instituto da \"Delação Premiada\"). Nos termos do artigo 41 da Lei nº 11.343/2006, o indiciado ou acusado que colaborar voluntariamente com a investigação policial e o processo criminal na identificação dos demais coautores e na recuperação do produto do crime terá sua pena reduzida de:","alternativas":{"A":"um quarto a metade de forma fixa e linear em todo e qualquer caso concreto.","B":"um terço a dois terços, ou poderá ser concedido o perdão judicial pelo magistrado singular.","C":"metade a três quartos, exigindo-se a homologação prévia do promotor de justiça da área.","D":"um sexto a um terço, vedando-se a concessão de liberdade provisória com monitoramento eletrônico.","E":"dois terços à totalidade dos dias acumulados por remissão de pena por trabalho industrial."},"resposta_correta":"B","comentario":"Conforme o artigo 41 da Lei nº 11.343/2006, o instituto da colaboração premiada na Lei de Drogas autoriza o magistrado a reduzir a pena aplicada de um terço a dois terços ou, a depender da relevância dos dados fornecidos voluntariamente, conceder o benefício pleno do perdão judicial."},{"id":400,"numero":400,"bloco":1,"materia":"Legislação Específica","texto_base":null,"enunciado":"Considere a seguinte situação hipotética: Um indivíduo é preso em flagrante por Policiais Penais no parlatório de uma penitenciária estadual portando três munições intactas de calibre .50 (uso proibido), ocultadas no interior de um sapato que seria entregue a um interno de alta periculosidade. À luz do artigo 16 da Lei nº 10.826/2003 (com as modificações operadas pelo Pacote Anticrime), portar, possuir, adquirir, transportar ou manter sob sua guarda arma de fogo, acessório ou munição de uso proibido configura crime gravíssimo punido com pena de:","alternativas":{"A":"detenção de um a três anos e multa na modalidade de menor potencial ofensivo.","B":"reclusão de 4 (quatro) a 12 (doze) anos, qualificando-se como crime hediondo nos termos da legislação correlata.","C":"suspensão administrativa de visitas de familiares pelo prazo de vinte anos ininterruptos.","D":"reclusão de dois a quatro anos, cumulada com a perda compulsória da cidadania nacional.","E":"multa civil pecuniária diária a ser quitada de forma solidária pelo sindicato de classe."},"resposta_correta":"B","comentario":"Modificação estrutural e gravíssima promovida pelo Pacote Anticrime no artigo 16, caput, do Estatuto do Desarmamento. Portar, possuir, transportar ou introduzir armas ou munições de uso proibido (como calibre .50) configura crime autônomo punido com reclusão de 4 a 12 anos, qualificando-se legalmente como crime hediondo. PROCESSO PENAL (BLOCO 01)"},{"id":401,"numero":401,"bloco":1,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"O Código Penal brasileiro adota critérios específicos para regular a aplicação da lei penal no tempo e no espaço. Nos termos expressos do artigo 4º do diploma penal, considera-se praticado o crime no momento da ação ou omissão, ainda que outro seja o momento do resultado. O referido dispositivo consagra o Princípio da:","alternativas":{"A":"Ubiquidade.","B":"Atividade.","C":"Territorialidade mitigada.","D":"Consunção ou Absorção.","E":"Subsidiariedade implícita."},"resposta_correta":"B","comentario":"O artigo 4º do Código Penal adota expressamente a Teoria da Atividade para regular o tempo do crime, fixando que o crime considera-se praticado no exato momento da conduta (ação ou omissão), independentemente da data em que ocorra o resultado."},{"id":402,"numero":402,"bloco":1,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"A respeito da aplicação da lei penal no espaço, o artigo 6º do Código Penal preceitua que considera-se praticado o crime no lugar em que ocorreu a ação ou omissão, no todo ou em parte, bem como onde se produziu ou deveria produzir-se o resultado. Esse mandamento adota a Teoria da:","alternativas":{"A":"Atividade.","B":"Ubiquidade (ou Mista).","C":"Resultado.","D":"Territorialidade absoluta.","E":"Extraterritorialidade condicionada."},"resposta_correta":"B","comentario":"O artigo 6º do Código Penal adota a Teoria da Ubiquidade (ou Mista) para fixar o lugar do crime, considerando como local da infração tanto o espaço geográfico da conduta (ação/omissão) quanto o local onde se produziu ou deveria produzir-se o resultado."},{"id":403,"numero":403,"bloco":1,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"Considere a seguinte situação hipotética: Um Policial Penal potiguar, durante o recesso de seu plantão, depara-se com um indivíduo que acaba de subtrair o aparelho celular de uma senhora em plena via pública de Natal. Utilizando as técnicas operacionais adequadas, o servidor realiza a imobilização física do autor da infração e aguarda a chegada da viatura policial para os trâmites do flagrante. À luz das regras expressas do artigo 301 do Código de Processo Penal, qualquer do povo poderá e as autoridades policiais e seus agentes deverão prender quem quer que seja encontrado em flagrante delito. Portanto, a atuação do Policial Penal qualifica-se como flagrante:","alternativas":{"A":"Obrigatório (ou Compulsório).","B":"Facultativo.","C":"Presumido ou Ficto.","D":"Diferido ou Prorrogado.","E":"Provocado ou Esperado."},"resposta_correta":"A","comentario":"Nos termos do artigo 301 do CPP, o flagrante divide-se em facultativo (para qualquer do povo, direito de prender) e obrigatório/compulsório (para autoridades policiais e seus agentes, dever legal de prender). Como o Policial Penal integra os órgãos de segurança, sua atuação é uma emanação do flagrante obrigatório."},{"id":404,"numero":404,"bloco":1,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"O inquérito policial qualifica-se como procedimento administrativo inquisitivo e preparatório, destinado a colher elementos de autoria e materialidade para subsidiar a ação penal. Nos termos do artigo 17 do CPP, uma vez instaurado o inquérito policial, a autoridade policial (Delegado):","alternativas":{"A":"poderá determinar o seu arquivamento se constatar a ausência de dolo específico do indiciado.","B":"não poderá mandar arquivar autos de inquérito.","C":"submeterá o relatório final à aprovação prévia do sindicato das carreiras de segurança.","D":"remeterá os autos ao arquivo geral da delegacia se a vítima manifestar perdão judicial tácito.","E":"poderá arquivar o feito se o valor do prejuízo material for inferior a um salário mínimo."},"resposta_correta":"B","comentario":"O artigo 17 do CPP consagra o Princípio da Indisponibilidade do Inquérito Policial perante a autoridade policial. Uma vez instauradas as investigações, o Delegado é terminantemente proibido de arquivar os autos de ofício, competência que pertence exclusivamente ao Poder Judiciário mediante provocação do MP."},{"id":405,"numero":405,"bloco":1,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"O crime de peculato, previsto no artigo 312 do Código Penal, tutela a moralidade e o patrimônio da Administração Pública contra desvios praticados por seus próprios agentes. Configura a modalidade de peculato-furto (Art. 312, § 1º) quando o funcionário público:","alternativas":{"A":"apropriar-se de dinheiro, valor ou qualquer outro bem móvel, público ou particular, de que tem a posse em razão do cargo.","B":"desviar dinheiro ou valor público em proveito próprio ou alheio de forma direta.","C":"embora não tendo a posse do dinheiro, valor ou bem, o subtrai, ou concorre para que seja subtraído, em proveito próprio ou alheio, valendo-se da facilidade que lhe proporciona a qualidade de funcionário.","D":"recebe dinheiro ou vantagem indevida de particular para agilizar a concessão de atos administrativos.","E":"deixa de praticar ato de ofício por indulgência ou compadrio com subordinados de plantão."},"resposta_correta":"C","comentario":"O peculato-furto (Art. 312, § 1º, do CP) caracteriza-se quando o funcionário público não possui a posse originária do bem em razão do cargo, mas o subtrai (ou concorre para a subtração) valendo- se das facilidades, acessos ou prerrogativas que a função pública lhe outorga."},{"id":406,"numero":406,"bloco":1,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"O Código Penal conceitua o crime culposo no artigo 18, inciso II, estabelecendo as balizas de quebra do dever objetivo de cuidado. O crime qualifica-se como culposo quando o agente deu causa ao resultado por:","alternativas":{"A":"dolo específico, capricho pessoal ou motivo de satisfação egoísta.","B":"imperícia ou erro de hermenêutica judicial provado nos autos.","C":"imprudência, negligência ou imperícia.","D":"força maior, caso fortuito ou álea econômica extraordinária.","E":"coação moral irresistível ou obediência hierárquica impositiva."},"resposta_correta":"C","comentario":"O crime culposo (Art. 18, II, do CP) manifesta-se pela quebra do dever objetivo de cuidado voluntária do agente, exteriorizada por meio de três modalidades clássicas: a imprudência (conduta intempestiva/ativa), a negligência (omissão/desleixo) ou a imperícia (falta de aptidão técnica profissional)."},{"id":407,"numero":407,"bloco":1,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"Considere a seguinte situação hipotética: Um detento em cumprimento de pena em regime fechado consegue serrar as grades de sua cela e evade-se do complexo carcerário durante a madrugada, sem o emprego de qualquer modalidade de violência física ou grave ameaça contra os policiais penais de plantão na muralha. À luz das normas expressas do Código Penal relativas aos crimes contra a Administração da Justiça, a conduta de fugir do estabelecimento prisional, sem o uso de violência contra a pessoa:","alternativas":{"A":"configura o crime de evasão mediante violência contra a pessoa (Art. 352).","B":"constitui crime autônomo de desobediência qualificada patrimonial.","C":"é atípica na esfera penal, configurando estritamente falta disciplinar de natureza grave nos termos da LEP.","D":"submete o agente às penas do crime de dano qualificado de forma compulsória.","E":"gera a perda definitiva da nacionalidade nata por ato de rebeldia civil."},"resposta_correta":"C","comentario":"O crime de evasão mediante violência contra a pessoa (Art. 352 do CP) exige, de forma impositiva, o emprego de força física ou grave ameaça humana para sua tipificação penal. A fuga pacífica (sem violência contra agentes públicos), embora configure falta grave gravíssima nos termos da LEP, é fato atípico na esfera do Código Penal."},{"id":408,"numero":408,"bloco":1,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"O crime de corrupção passiva, capitulado no artigo 317 do Código Penal, pune o funcionário público que solicita ou recebe vantagem indevida em razão de suas atribuições funcionais. O parágrafo 1º do referido artigo prevê uma causa de aumento de pena (majorante) se, em consequência da vantagem ou promessa, o funcionário:","alternativas":{"A":"realiza vistorias estruturais extraordinárias nas celas comuns aos finais de semana.","B":"retarda ou deixa de praticar qualquer ato de ofício ou o pratica infringindo dever funcional.","C":"comunica imediatamente à chefia os indícios de desvios operacionais de colegas.","D":"participa de cursos de requalificação profissional fornecidos gratuitamente pelo Estado.","E":"manifestar preferência por atividades administrativas em detrimento das operacionais."},"resposta_correta":"B","comentario":"O artigo 317, § 1º, do Código Penal consagra a causa de aumento de pena da Corregedoria/Exaustão da corrupção passiva própria, elevando a sanção de um terço se o funcionário, em virtude da propina ou promessa recebida, efetivamente retarda, deixa de praticar ato de ofício ou o executa infringindo dever funcional."},{"id":409,"numero":409,"bloco":1,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"A Prisão Temporária submete-se aos regramentos estritos da Lei Federal nº 7.960/1989, qualificando-se como medida cautelar de tranca pré-processual. De acordo com os prazos fixados no ordenamento, a prisão temporária para crimes comuns terá a duração de:","alternativas":{"A":"24 horas, admitindo uma única prorrogação por igual período em casos de urgência.","B":"5 (cinco) dias, prorrogável por igual período em caso de extrema e comprovada necessidade.","C":"10 dias improrrogáveis, contados da data de cumprimento do respectivo mandado.","D":"15 dias, prorrogável uma vez por igual período mediante representação verbal do delegado.","E":"30 dias, prorrogável por igual período unicamente se o crime for hediondo ou equiparado."},"resposta_correta":"B","comentario":"Nos termos do artigo 2º da Lei nº 7.960/1989, a prisão temporária possui o prazo ordinário de 5 dias, admitindo uma única prorrogação por igual período (5+5 dias) mediante fundamentada e comprovada necessidade judicial. O prazo de 30+30 dias restringe-se aos crimes hediondos."},{"id":410,"numero":410,"bloco":1,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"A Ação Penal Pública incondicionada constitui a regra no ordenamento processual penal brasileiro. Nos termos do artigo 24 do CPP, a ação penal pública será promovida por denúncia do Ministério Público, mas a sua instauração dependerá de representação do ofendido quando a lei:","alternativas":{"A":"for omitida em relação à fixação da pena máxima em abstrato do crime.","B":"expressamente o exigir.","C":"submeter o julgamento ao rito especial do tribunal do júri de forma ampla.","D":"versar sobre infrações que causem prejuízo patrimonial ao erário superior a dez mil reais.","E":"for direcionada contra agentes públicos detentores de estabilidade constitucional."},"resposta_correta":"B","comentario":"O artigo 24 do Código de Processo Penal fixa a soberania da ação penal pública incondicionada. A necessidade de representação do ofendido (condição de procedibilidade) é uma exceção que exige determinação e previsão expressa no tipo legal."},{"id":411,"numero":411,"bloco":1,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"Considere a seguinte situação hipotética: Um Policial Penal potiguar, responsável pela guarda e conferência de bens apreendidos na rouparia de uma cadeia pública, percebe que um relógio de alto valor comercial pertencente a um detento recém- ingresso foi esquecido sobre a bancada. O servidor, ciente de que ninguém presenciava o ato, coloca o objeto em seu bolso e o leva para sua residência ao final do plantão. À luz das tipificações dos crimes praticados por funcionário público contra a administração em geral, a conduta descrita subsume-se perfeitamente ao crime de:","alternativas":{"A":"Concussão (Art. 316).","B":"Corrupção Passiva (Art. 317).","C":"Peculato-apropriação (Art. 312, caput, primeira parte).","D":"Prevaricação (Art. 319).","E":"Condescendência Criminosa (Art. 320)."},"resposta_correta":"C","comentario":"O peculato-apropriação (Art. 312, caput, primeira parte, do CP) consuma-se quando o funcionário público inverte a posse de dinheiro, valor ou bem móvel (público ou particular) de que tem a posse ou detenção legítima em razão das atribuições de seu cargo, passando a agir como se dono fosse."},{"id":412,"numero":412,"bloco":1,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"O crime de concussão (Art. 316 do Código Penal) diferencia-se da corrupção passiva a partir do núcleo do tipo (verbo comandor) utilizado pelo agente público no trato com o particular. O crime de concussão caracteriza-se pelo ato de:","alternativas":{"A":"Solicitar ou receber, para si ou para outrem, vantagem indevida em razão do cargo.","B":"Exigir, para si ou para outrem, direta ou indiretamente, ainda que fora da função ou antes de assumi-la, mas em razão dela, vantagem indevida.","C":"Oferecer ou prometer vantagem indevida a funcionário público para determiná-lo a praticar ato.","D":"Apropriar-se de dinheiro ou valor de que tem a posse em razão das atribuições do cargo.","E":"Retardar injustificadamente ato de ofício para satisfazer interesse ou sentimento pessoal."},"resposta_correta":"B","comentario":"O divisor de águas entre a concussão e a corrupção passiva reside no núcleo verbal. Se o funcionário público exige a vantagem indevida valendo-se do temor reverencial da farda, o crime é de Concussão (Art. 316). Se ele solicita, recebe ou aceita promessa, o crime é de Corrupção Passiva (Art. 317)."},{"id":413,"numero":413,"bloco":1,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"A queixa-crime constitui a peça inicial acusatória utilizada nas ações penais de natureza privada, de iniciativa exclusiva do ofendido. De acordo com o artigo 38 do Código de Processo Penal, salvo disposição em contrário, o ofendido decairá do direito de queixa ou de representação se não o exercer dentro do prazo de:","alternativas":{"A":"30 (trinta) dias, contados do dia em que o crime foi cometido de forma material.","B":"3 (três) meses, contados da lavratura do boletim de ocorrência na delegacia de área.","C":"6 (seis) meses, contado do dia em que veio a saber quem foi o autor do crime.","D":"1 (um) ano, contados da conclusão do relatório final do inquérito policial civil.","E":"tempo indeterminado, ficando a critério do juiz fixar o termo final do direito de petição."},"resposta_correta":"C","comentario":"O artigo 38 do CPP positiva o prazo decadencial de 6 meses para o exercício do direito de queixa (ação privada) ou de representação (ação pública condicionada), contados a partir do dia em que o ofendido toma conhecimento inequívoco de quem foi o autor da infração."},{"id":414,"numero":414,"bloco":1,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"O crime de prevaricação, capitulado no artigo 319 do Código Penal, exige um elemento subjetivo específico indispensável para sua consumação (o chamado dolo específico). O crime caracteriza-se pelo ato de retardar ou deixar de praticar, indevidamente, ato de ofício, ou praticá-lo contra disposição expressa de lei, para:","alternativas":{"A":"obter vantagem financeira indevida superior a um salário mínimo nacional.","B":"satisfazer interesse ou sentimento pessoal.","C":"beneficiar agências reguladoras estaduais do setor de vigilância terceirizada.","D":"camuflar erros de expediente cometidos por subordinados em estágio probatório.","E":"cumprir metas institucionais de produtividade fixadas de forma verbal pela chefia."},"resposta_correta":"B","comentario":"O crime de prevaricação (Art. 319 do CP) exige, como elemento subjetivo do tipo indispensável, o dolo específico de agir para satisfazer interesse ou sentimento pessoal (vigança, compadrio, preguiça, simpatia), repelindo-se a tipificação se o atraso decorrer de mera ineficiência burocrática geral."},{"id":415,"numero":415,"bloco":1,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"Considere a seguinte situação hipotética: Um Policial Penal potiguar, atuando no setor de triagem de visitas de um complexo carcerário, constata que a esposa de um detento tentava ingressar na unidade portando três chips de telefonia celular ocultados em suas vestimentas. Tomado por profundo sentimento de compaixão e indulgência face ao choro da visitante, o servidor decide liberá- la e deixa de efetuar a prisão e de instaurar o procedimento administrativo regular. À luz das condutas típicas previstas no Estatuto Repressor, o agente público praticou o crime de:","alternativas":{"A":"Prevaricação (Art. 319).","B":"Condescendência Criminosa (Art. 320).","C":"Advocacia Administrativa (Art. 321).","D":"Corrupção Passiva qualificada (Art. 317, § 2º).","E":"Facilitação de fuga de preso (Art. 351)."},"resposta_correta":"B","comentario":"O crime de condescendência criminosa (Art. 320 do CP) caracteriza-se quando o funcionário público, movido por indulgência (pena, compaixão, clemência), deixa de responsabilizar subordinado que cometeu infração no cargo ou, no caso do Policial Penal, deixa de levar o fato ao conhecimento da autoridade competente quando o infrator for particular/visitante sob sua fiscalização."},{"id":416,"numero":416,"bloco":1,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"O Código Penal consagra as Excludentes de Ilicitude no artigo 23, estabelecendo que não há crime quando o agente pratica o fato em circunstâncias específicas. Assinale a alternativa que apresenta uma causa legítima de excludente de ilicitude expressa no Estatuto Repressor.","alternativas":{"A":"Coação moral irresistível e obediência hierárquica de ordem não manifestamente ilegal.","B":"Estado de necessidade, legítima defesa, estrito cumprimento de dever legal ou exercício regular de direito.","C":"Erro de tipo essencial escusável e erro de proibição inevitável de forma conjunta.","D":"Embriaguez fortuita completa e desenvolvimento mental incompleto ou retardado.","E":"Insignificância material de bagatela e consentimento presumido do ofendido."},"resposta_correta":"B","comentario":"É a redação literal do artigo 23 do Código Penal, que consagra o rol das causas excludentes de ilicitude (ou de antijuridicidade): Estado de necessidade, legítima defesa, estrito cumprimento de dever legal e exercício regular de direito."},{"id":417,"numero":417,"bloco":1,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"A legítima defesa é uma das causas excludentes de ilicitude mais exaustivamente pormenorizadas pela legislação e doutrina. Nos termos do artigo 25 do Código Penal, entende-se em legítima defesa quem, usando moderadamente dos meios necessários, repele:","alternativas":{"A":"agressão justa ou justificável decorrente de ordens legais de superiores hierárquicos.","B":"perigo iminente gerado por desastres naturais ou ataques de animais ferozes em pátios.","C":"injusta agressão, atual ou iminente, a direito seu ou de outrem.","D":"prejuízo financeiro certo e mensurável causado ao patrimônio público imaterial.","E":"restrição temporária da liberdade de locomoção imposta por mandados judiciais válidos."},"resposta_correta":"C","comentario":"Trata-se da definição legal de legítima defesa contida no artigo 25 do Código Penal, exigindo-se o uso moderado dos meios necessários para repelir injusta agressão, atual (que ocorre agora) ou iminente (prestes a ocorrer), a direito próprio ou de terceiros."},{"id":418,"numero":418,"bloco":1,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"O artigo 302 do Código de Processo Penal elenca as hipóteses em que o indivíduo considera-se em flagrante delito, balizando a atuação das forças de segurança. Configura a modalidade de flagrante impróprio (ou imperfeito), nos termos do inciso III, quando o agente:","alternativas":{"A":"está cometendo a infração penal ou acaba de cometê-la de forma material.","B":"é perseguido, logo após, pela autoridade, pelo ofendido ou por qualquer pessoa, em situação que faça presumir ser autor da infração.","C":"é encontrado, logo depois, com instrumentos, armas, objetos ou papéis que façam presumir ser ele autor da infração.","D":"confessa voluntariamente a autoria do crime na presença de três testemunhas civis.","E":"apresenta-se espontaneamente na delegacia de polícia horas após a consumação do delito."},"resposta_correta":"B","comentario":"O flagrante impróprio, também denominado pela doutrina como imperfeito ou quase-flagrante (Art. 302, III, do CPP), exige o preenchimento do binômio: perseguição imediata logo após o crime + situação que faça presumir ser o agente o autor da infração."},{"id":419,"numero":419,"bloco":1,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"O crime de abandono de função, previsto no artigo 323 do Código Penal, pune o funcionário público que abandona o cargo, sem justa causa, antes de formalizar o desligamento. O crime sofre uma severa qualificadora (Art. 323, § 2º), elevando as penas, se do fato resulta:","alternativas":{"A":"prejuízo financeiro ao erário público superior a dez salários mínimos vigentes.","B":"interrupção de serviços burocráticos de almoxarifado ou protocolo central.","C":"dano público ou se o fato é praticado em lugar compreendido na faixa de fronteira.","D":"a necessidade de convocar policiais civis aposentados para cobrir a escala de plantão.","E":"a suspensão do direito de visitas de familiares aos finais de semana na unidade."},"resposta_correta":"C","comentario":"Conforme preceitua o artigo 323, § 2º, do Código Penal, o crime de abandono de função sofre majoração qualificada se da interrupção injustificada das atribuições resultar dano público ou se o cargo for exercido em limites territoriais de faixa de fronteira."},{"id":420,"numero":420,"bloco":1,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"Considere a seguinte situação hipotética: Durante a realização de uma contagem de presos em um pavilhão carcerário potiguar, um detento agride violentamente um Policial Penal desarmado utilizando um pedaço de concreto retirado da estrutura. Visando repelir a agressão atual que colocava em risco sua vida, outro Policial Penal saca sua arma oficial e desfere um disparo contra a perna do agressor, imobilizando-o. À luz das causas excludentes de ilicitude previstas no artigo 23 do Código Penal, o servidor público agiu amparado pela excludente da:","alternativas":{"A":"Coação moral irresistível.","B":"Legítima defesa.","C":"Estrito cumprimento de dever legal.","D":"Exercício regular de direito.","E":"Inimputabilidade penal provisória."},"resposta_correta":"B","comentario":"Diante de uma agressão violenta atual de um detento armada com concreto, o uso da arma oficial de forma moderada (disparo na perna) para resguardar a vida do companheiro de farda caracteriza perfeitamente o amparo da excludente de ilicitude da Legítima Defesa de terceiro (Art. 23, II, e Art. 25 do CP)."},{"id":421,"numero":421,"bloco":1,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"O crime de usurpação de função pública, tipificado no artigo 328 do Código Penal, integra os crimes praticados por particulares contra a administração em geral. O crime qualifica-se e sofre sensível aumento de pena (Art. 328, parágrafo único) se o culpado, ao usurpar a função:","alternativas":{"A":"afasta-se da comarca sem autorização prévia assinada pelo magistrado singular.","B":"faz-se acompanhar por menores de dezoito anos de idade na modalidade de concurso.","C":"aufere vantagem.","D":"danifica o patrimônio tecnológico ou maquinários oficiais pertencentes ao Estado.","E":"professa valores ideológicos contrários à dignidade das instituições de segurança."},"resposta_correta":"C","comentario":"O crime de usurpação de função pública (Art. 328 do CP) materializa-se quando o particular exerce indevidamente atribuições de cargo público. Se além do exercício clandestino o agente aufere vantagem econômica ou privilégios decorrentes da farsa, incide a qualificadora do parágrafo único."},{"id":422,"numero":422,"bloco":1,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"A Prisão Preventiva qualifica-se como medida cautelar de restrição da liberdade de caráter indeterminado, a ser decretada no curso da investigação ou do processo penal. Nos termos do artigo 311 do CPP, modificado pelo Pacote Anticrime, a prisão preventiva:","alternativas":{"A":"poderá ser decretada de ofício pelo juiz de direito durante a fase do inquérito policial.","B":"não pode ser decretada de ofício pelo juiz, exigindo requerimento do Ministério Público, do querelante ou do assistente, ou por representação da autoridade policial.","C":"depende da aprovação e homologação unânime por parte dos deputados estaduais da comarca.","D":"fica restrita aos crimes dolosos punidos com pena privativa de liberdade máxima inferior a 2 anos.","E":"caducará automaticamente se a instrução criminal processual superar o prazo de trinta dias."},"resposta_correta":"B","comentario":"O Pacote Anticrime (Lei nº 13.964/2019) sepultou a decretação da prisão preventiva de ofício pelo magistrado no direito processual penal brasileiro (Art. 311 do CPP). Atualmente, exige-se provocação do MP, representação do Delegado ou requerimento das partes em qualquer fase."},{"id":423,"numero":423,"bloco":1,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"O artigo 313 do Código de Processo Penal estabelece os requisitos de admissibilidade da prisão preventiva, balizando os crimes que comportam a tranca cautelar. Nos termos do inciso I do referido artigo, será admitida a decretação da prisão preventiva nos crimes dolosos punidos com pena privativa de liberdade máxima:","alternativas":{"A":"superior a 2 (dois) anos tão somente.","B":"superior a 4 (quatro) anos.","C":"superior a 6 (seis) anos de reclusão estrutural.","D":"inferior a 1 (um) ano na modalidade de infrações de menor potencial.","E":"idêntica à fixada para os crimes culposos de trânsito rodoviário."},"resposta_correta":"B","comentario":"Nos termos do artigo 313, inciso I, do CPP, a prisão preventiva é medida de exceção admissível unicamente nos crimes dolosos cujas penas privativas de liberdade máximas cominadas em abstrato sejam superiores a 4 anos."},{"id":424,"numero":424,"bloco":1,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"O crime de resistência, capitulado no artigo 329 do Código Penal, pune o particular que se opõe à execução de ato legal, mediante violência ou ameaça, a funcionário competente para executá-lo ou a quem lhe esteja prestando auxílio. O crime qualifica-se e eleva as penas se o ato, em razão da resistência:","alternativas":{"A":"causa prejuízo material ao erário público estadual superior a um salário mínimo.","B":"não se executa.","C":"exige a convocação de viaturas da polícia militar rodoviária integrada de área.","D":"resulta na lavratura do boletim de ocorrência fora do horário de expediente ordinário.","E":"gera desentendimentos interpessoais entre os servidores da guarnição armada."},"resposta_correta":"B","comentario":"O crime de resistência (Art. 329 do CP) qualifica- se no seu parágrafo 1º (Resistência Qualificada) se, em decorrência da violência ou ameaça empregada pelo particular contra a guarnição, o ato legal ordenado pelas autoridades (como a tranca ou a prisão) efetivamente não se executa."},{"id":425,"numero":425,"bloco":1,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"Considere a seguinte situação hipotética: Um indivíduo, conduzindo seu veículo particular pelas ruas de Natal, é abordado por uma equipe de fiscalização de trânsito. Instado a apresentar os documentos obrigatórios, o motorista joga a carteira de habilitação ao solo, profere insultos de baixo calão contra os agentes e grita publicamente que a corporação é composta por milicianos incompetentes. À luz das condutas típicas praticadas por particulares contra a Administração Pública, o cidadão praticou o crime de:","alternativas":{"A":"Resistência (Art. 329).","B":"Desobediência (Art. 330).","C":"Desacato (Art. 331).","D":"Calúnia qualificada (Art. 138).","E":"Constrangimento ilegal (Art. 146)."},"resposta_correta":"C","comentario":"O crime de desacato (Art. 331 do CP) consuma- se quando o particular profere ofensas, xingamentos ou gestos desrespeitosos contra funcionário público no exercício da função ou em razão dela, visando menoscabar e agredir o prestígio da Administração Pública."},{"id":426,"numero":426,"bloco":1,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"O crime de corrupção ativa, previsto no artigo 333 do Código Penal, pune o particular que interfere na lisura das funções públicas por meio de ofertas escusas. O crime caracteriza-se pelo ato de oferecer ou prometer vantagem indevida a funcionário público, para:","alternativas":{"A":"demonstrar apreço pessoal ou agradecimento por atos de cortesia burocrática simples.","B":"determiná-lo a praticar, retardar ou deixar de praticar ato de ofício.","C":"subsidiar o fundo penitenciário de assistência social carcerária privada da unidade.","D":"garantir que seus familiares tenham acesso preferencial aos pátios de visitação comuns.","E":"auxiliá-lo na aprovação em concursos públicos estaduais para cargos administrativos."},"resposta_correta":"B","comentario":"O crime de corrupção ativa (Art. 333 do CP) é crime formal e de autoria do particular, aperfeiçoando-se com o ato de oferecer ou prometer vantagem espúria a funcionário público com a finalidade de determiná-lo a praticar, retardar ou omitir ato de ofício regular."},{"id":427,"numero":427,"bloco":1,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"O inquérito policial possui características dogmáticas exaustivamente exploradas pelas bancas de concurso públicos. Dentre os atributos do inquérito policial, destaca-se o fato de ser um procedimento predominantemente:","alternativas":{"A":"oral, dispensando relatórios ou documentos reduzidos a termo por escrito.","B":"público absoluto, garantindo acesso irrestrito da imprensa a estratégias de investigação.","C":"escrito, inquisitivo, sigiloso (mitigado ao defensor nos termos da lei) e informativo.","D":"bilateral pleno, submetendo cada diligência de campo ao contraditório prévio do suspeito.","E":"revogável de ofício pelo Diretor do estabelecimento de onde o investigado fugiu."},"resposta_correta":"C","comentario":"O inquérito policial possui natureza de procedimento administrativo informativo, caracterizando-se por ser escrito (Art. 9º do CPP), inquisitivo (ausência de contraditório pleno), sigiloso (Art. 20 do CPP, ressalvado o acesso a provas já documentadas nos termos da Súmula Vinculante 14) e preparatório."},{"id":428,"numero":428,"bloco":1,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"O artigo 312 do Código de Processo Penal consagra os fundamentos para a decretação da prisão preventiva, que operam como o periculum libertatis da medida. A prisão preventiva poderá ser decretada como garantia da:","alternativas":{"A":"lucratividade comercial privada das empresas terceirizadas prestadoras de serviços.","B":"ordem pública, da ordem econômica, por conveniência da instrução criminal ou para assegurar a aplicação da lei penal.","C":"celeridade burocrática e redução do número de processos pendentes de julgamento na comarca.","D":"harmonia interpessoal entre os deputados integrantes da comissão de segurança da assembleia.","E":"satisfação econômica e reajuste salarial das carreiras do funcionalismo público estadual."},"resposta_correta":"B","comentario":"É a redação literal do artigo 32 do Código de Processo Penal. Os fundamentos que autorizam a decretação da cautelar preventiva residem na necessidade impositiva de garantir a ordem pública, ordem econômica, conveniência da instrução ou aplicação da lei penal."},{"id":429,"numero":429,"bloco":1,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"O Código Penal regula as causas que excluem a culpabilidade do agente (isenção de pena), focando na higidez mental e na capacidade de autodeterminação na data do fato. Nos termos do artigo 26, caput, do Estatuto Repressor, é isento de pena o agente que, por embriaguez completa proveniente de caso fortuito ou força maior, ou por doença mental ou desenvolvimento mental incompleto ou retardado, era, ao tempo da ação ou da omissão:","alternativas":{"A":"parcialmente capaz de entender o caráter ilícito do fato ou de determinar-se de acordo com esse entendimento.","B":"inteiramente incapaz de entender o caráter ilícito do fato ou de determinar-se de acordo com esse entendimento.","C":"reincidente confesso em crimes dolosos contra o patrimônio público de grande monta.","D":"assistido por curador nomeado de forma verbal pela diretoria do hospital de custódia.","E":"maior de dezoito anos de idade e menor de vinte e um anos de idade de forma linear."},"resposta_correta":"B","comentario":"O artigo 26 do Código Penal adota o critério biopsicológico para a inimputabilidade. É isento de pena (absolvição imprópria com medida de segurança) o agente que, por doença mental ou desenvolvimento incompleto, era, ao tempo da conduta, inteiramente incapaz de compreender o caráter ilícito do fato ou de determinar-se de acordo com esse entendimento."},{"id":430,"numero":430,"bloco":1,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"Considere a seguinte situação hipotética: Durante o trâmite de um inquérito policial instaurado para apurar um crime de furto qualificado, o Delegado de Polícia constata que o prazo legal fixado para a conclusão das investigações com o indiciado preso em flagrante esgotou-se, sem que as principais perícias de campo tenham sido concluídas. De acordo com as regras de prazos do inquérito policial expressas no artigo 10 do CPP, o inquérito deverá terminar no prazo de:","alternativas":{"A":"5 (cinco) dias, se o indiciado tiver sido preso em flagrante ou estiver preso preventivamente.","B":"10 (dez) dias, se o indiciado tiver sido preso em flagrante, ou estiver preso preventivamente, contado o prazo a partir do dia em que se executar a ordem de prisão.","C":"15 dias, prorrogáveis por igual período mediante autorização verbal do promotor de justiça.","D":"30 dias, se o indiciado estiver solto, vedada toda e qualquer modalidade de prorrogação temporal.","E":"60 dias contados da lavratura do boletim de ocorrência na delegacia de área respectiva."},"resposta_correta":"B","comentario":"Trata-se da regra de prazos contida no artigo 10, caput, do CPP. Estando o indiciado preso em flagrante ou preventivamente, o inquérito policial deve ser concluído no prazo improrrogável de 10 dias, contados a partir do dia seguinte ao da execução da tranca."},{"id":431,"numero":431,"bloco":1,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"O crime de contrabando, capitulado no artigo 334-A do Código Penal, tutela a integridade das fronteiras e a saúde pública contra a introdução de mercadorias proibidas. O crime de contrabando diferencia- se do descaminho porque consiste no ato de importar ou exportar mercadoria:","alternativas":{"A":"permitida, iludindo, no todo ou em parte, o pagamento de direito ou imposto devido.","B":"proibida.","C":"de origem estrangeira acompanhada de notas fiscais falsificadas por particulares.","D":"agrícola sem o recolhimento das taxas de vigilância sanitária estaduais comuns.","E":"industrial de luxo com destinação social a entidades filantrópicas comunitárias."},"resposta_correta":"B","comentario":"O crime de contrabando (Art. 334-A do CP) diferencia-se do descaminho pela natureza da mercadoria. O contrabando consiste na importação ou exportação de mercadoria proibida no país (ex: cigarros clandestinos, armas proscritas, pneus usados), protegendo a saúde e segurança pública."},{"id":432,"numero":432,"bloco":1,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"O crime de descaminho, previsto no artigo 334 do Código Penal, pune a ilusão tributária aduaneira de mercadorias permitidas. Conforme jurisprudência consolidada nos Tribunais Superiores (STF e STJ), aplica-se o Princípio da Insignificância (com consequente atipicidade da conduta) ao crime de descaminho quando o valor dos tributos iludidos for igual ou inferior ao patamar de:","alternativas":{"A":"um salário mínimo nacional vigente na data da consumação do delito.","B":"cinco mil reais, limite fixado para pequenos comerciantes de feiras livres.","C":"vinte mil reais, em consonância com os limites de execução fiscal da Fazenda Nacional.","D":"cinquenta mil reais, mediante homologação prévia do juiz corregedor de comarca.","E":"cem mil reais, se o réu comprovar primariedade e bons antecedentes carcerários."},"resposta_correta":"C","comentario":"Os Tribunais Superiores (STF e STJ) consolidaram o entendimento de que incide o princípio da insignificância no crime de descaminho (ilusão de imposto sobre mercadoria permitida) quando o valor total dos tributos federais sonegados for igual ou inferior a vinte mil reais (R$ 20.000,00)."},{"id":433,"numero":433,"bloco":1,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"A representação do ofendido nas ações penais públicas condicionadas qualifica-se como condição de procedibilidade da ação. De acordo com as normas expressas do Código de Processo Penal, a representação:","alternativas":{"A":"é irretratável em qualquer hipótese após o oferecimento do boletim de ocorrência.","B":"poderá ser retratada, depois de oferecida a denúncia, se houver concordância do juiz.","C":"poderá ser retratada antes de oferecida a denúncia.","D":"exige o reconhecimento de firma em cartório privado de notas para adquirir validade.","E":"suspende de forma permanente o transcurso do prazo de prescrição penal do crime."},"resposta_correta":"C","comentario":"O artigo 25 do Código de Processo Penal estabelece que a representação do ofendido será retratável (admite desistência por arrependimento) unicamente antes do oferecimento formal da denúncia pelo Ministério Público em juízo."},{"id":434,"numero":434,"bloco":1,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"O erro de tipo, regulado no artigo 20 do Código Penal, projeta-se sobre a representação da realidade pelo agente no momento do crime. Nos termos do mandamento contido no caput do referido artigo, o erro sobre elemento constitutivo do tipo legal de crime:","alternativas":{"A":"exclui o dolo, mas permite a punição por crime culposo, se previsto em lei.","B":"isenta o agente de pena em qualquer hipótese, vedando-se a punição culposa.","C":"transmuda o crime doloso em falta disciplinar de natureza leve carcerária automática.","D":"agrava a pena-base na sentença criminal pela aplicação do princípio da supremacia.","E":"submete o réu ao julgamento compulsório por comissões especiais de deputados estaduais."},"resposta_correta":"A","comentario":"Nos termos do artigo 20, caput, do Código Penal, o erro de tipo essencial afasta a representação dos elementos do crime, eliminando obrigatoriamente o dolo da conduta. Contudo, permite-se a punição por crime culposo, desde que a modalidade culposa esteja expressamente prevista em lei."},{"id":435,"numero":435,"bloco":1,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"Considere a seguinte situação hipotética: Um indivíduo ingressa clandestinamente no pátio de estacionamento de uma delegacia de polícia e arremessa uma pedra contra o para-brisa de uma viatura oficial da Polícia Civil, estilhaçando completamente o vidro estrutural do veículo público. À luz das tipificações dos crimes contra o patrimônio previstas no Código Penal (Art. 163, parágrafo único, inciso III), o agente praticou o crime de:","alternativas":{"A":"Dano simples.","B":"Dano qualificado, por ter sido cometido contra o patrimônio da União, de Estado, do Distrito Federal, de Município ou de autarquia, fundação pública, empresa pública, sociedade de economia mista ou empresa concessionária de serviços públicos.","C":"Furto qualificado pela destruição de obstáculo físico material.","D":"Sabotagem terrorista contra as instituições de segurança pública integradas.","E":"Contravenção penal de menor potencial ofensivo dispensada de ação penal."},"resposta_correta":"B","comentario":"Destruir patrimônio público materializado em viaturas oficiais pertencentes à estrutura do Estado (Polícia Civil) qualifica-se como crime de Dano Qualificado (Art. 163, parágrafo único, inciso III, do CP), afastando a capitulação de dano simples."},{"id":436,"numero":436,"bloco":1,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"O crime de denunciação caluniosa, capitulado no artigo 339 do Código Penal, integra os crimes contra a Administração da Justiça. O crime caracteriza- se pelo ato de dar causa à instauração de investigação policial, de processo judicial, de instauração de ação civil pública, de sindicância ou de processo administrativo disciplinar contra alguém, imputando-lhe crime de que o sabe:","alternativas":{"A":"culpado, com o objetivo de obter vantagem financeira indevida superior a um salário mínimo.","B":"inocente.","C":"coautor em concurso de agentes com menores de deiroito anos de idade de forma tácita.","D":"indiciado em relatórios de inteligência criminal sigilosos produzidos por forças armadas.","E":"reeducando em cumprimento de pena privativa de liberdade em regime fechado na comarca."},"resposta_correta":"B","comentario":"O crime de denunciação caluniosa (Art. 339 do CP) exige dolo direto e má-fé absoluta do agente, caracterizando-se pelo ato de movimentar a máquina policial ou judicial contra um cidadão imputando- lhe crime ou falta disciplinar de que o sabe categoricamente inocente."},{"id":437,"numero":437,"bloco":1,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"A ação penal privada subsidiária da pública constitui garantia fundamental instrumentária positivada na Constituição e no artigo 29 do CPP. A ação penal privada subsidiária será admitida se a ação pública não for intentada no prazo legal, cabendo ao Ministério Público:","alternativas":{"A":"requerer o arquivamento definitivo imediato da queixa-crime sem direito a recursos.","B":"aditar a queixa, repudiá-la e oferecer denúncia substitutiva, intervir em todos os termos do processo, fornecer elementos de prova, interpor recurso e, a todo tempo, no caso de negligência do querelante, retomar a ação como parte principal.","C":"transferir a titularidade da ação penal de forma vitalícia e definitiva ao querelante civil.","D":"suspender o andamento das investigações policiais civis conduzidas pelo delegado de área.","E":"cobrar taxas de expediente proporcionais ao saldo remanescente do subsídio do funcionário."},"resposta_correta":"B","comentario":"É a reprodução literal do artigo 29 do Código de Processo Penal, que regula as amplas e combativas atribuições do Ministério Público ao intervir na ação penal privada subsidiária da pública proposta em face de inércia do órgão ministerial."},{"id":438,"numero":438,"bloco":1,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"O Código Penal regula o tempo do crime e o lugar do crime a partir de teorias específicas. O artigo 6º adota a Teoria da Ubiquidade para fixar o lugar do crime, determinando que o local da infração penal corresponde ao espaço geográfico onde:","alternativas":{"A":"se produziu o resultado de forma exclusiva e isolada no tempo.","B":"ocorreu a ação ou omissão, no todo ou em parte, bem como onde se produziu ou deveria produzir-se o resultado.","C":"o boletim de ocorrência foi lavrado pela autoridade policial judiciária (Delegado).","D":"a vítima possui domicílio eleitoral ativo ou residência fixa há mais de cinco anos.","E":"o mandado de prisão preventiva foi cumprido pelas forças policiais de área."},"resposta_correta":"B","comentario":"Trata-se da redação do artigo 6º do Código Penal. O legislador pátrio adotou a Teoria da Ubiquidade (ou Mista) para a fixação do lugar do crime, abraçando tanto o local da conduta quanto o local do resultado ou onde este deveria produzir-se."},{"id":439,"numero":439,"bloco":1,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"O excesso punível projeta-se sobre as causas excludentes de ilicitude quando o agente extrapola os limites da moderação exigida pela lei. Nos termos do artigo 23, parágrafo único, do Código Penal, o agente, em qualquer das hipóteses de excludentes de ilicitude, responderá pelo excesso:","alternativas":{"A":"apenas se demonstrado dolo específico de causar prejuízo material superior a um salário mínimo.","B":"doloso ou culposo.","C":"de natureza puramente ético-disciplinar leve dispensado de ação penal ordinária.","D":"se houver representação assinada por comissões especiais de direitos humanos locais.","E":"de forma objetiva, aplicando-se a teoria do risco administrativo sistêmico estatal."},"resposta_correta":"B","comentario":"Conforme preceitua o artigo 23, parágrafo único, do Estatuto Repressor, afasta-se a impunidade perante excessos. O agente que extrapolar os limites da moderação na legítima defesa ou estado de necessidade responderá penalmente pelo excesso, seja na modalidade dolosa ou culposa."},{"id":440,"numero":440,"bloco":1,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"Considere a seguinte situação hipotética: Um indivíduo, fazendo-se passar por funcionário público da Secretaria de Fazenda, ingressa em um estabelecimento comercial em Natal e exige do proprietário o pagamento imediato de uma quantia em dinheiro para \"cancelar\" uma suposta multa fiscal inexistente, obtendo a vantagem econômica indevida. À luz das tipificações dos crimes praticados por particulares contra a Administração Pública, a conduta descrita subsume-se perfeitamente ao crime de:","alternativas":{"A":"Concussão (Art. 316).","B":"Corrupção Ativa (Art. 333).","C":"Usurpação de função pública qualificada pela vantagem (Art. 328, parágrafo único).","D":"Estelionato comum de bagatela (Art. 171).","E":"Tráfico de influência qualificado (Art. 332)."},"resposta_correta":"C","comentario":"Exigir vantagem econômica indevida fingindo a condição de fiscal fazendário configura o crime de Usurpação de Função Pública majorada pela vantagem (Art. 328, parágrafo único, do CP). Não confunda com Concussão, que exige que o autor seja efetivamente funcionário público."},{"id":441,"numero":441,"bloco":1,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"O crime de desacato (Art. 331 do Código Penal) foi objeto de profundos debates jurisprudenciais no cenário nacional contemporâneo. O Superior Tribunal de Justiça e o Supremo Tribunal Federal pacificaram o entendimento técnico-jurídico de que o crime de desacato:","alternativas":{"A":"foi revogado tacitamente pela Convenção Americana sobre Direitos Humanos (Pacto de São José).","B":"é plenamente constitucional e compatível com a Carta Magna, protegendo a moralidade e o prestígio da função pública.","C":"exige a presença física e concomitante do juiz de direito da comarca para se consumar.","D":"aplica-se unicamente se as ofensas forem proferidas por meio de mídias digitais escritas.","E":"constitui crime de ação penal privada dependente de queixa-crime assinada pelo lesado."},"resposta_correta":"B","comentario":"Após debates sobre a liberdade de expressão, o STF e o STJ pacificaram de forma definitiva que o crime de desacato (Art. 331 do CP) foi totalmente recebido pela CF/88, sendo constitucional e legítimo para a proteção do respeito e decoro impositivos das funções públicas."},{"id":442,"numero":442,"bloco":1,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"A revisão obrigatória da necessidade de manutenção da prisão preventiva foi instituída pelo Pacote Anticrime para combater custódias desproporcionais. Nos termos do artigo 316, parágrafo único, do CPP, decretada a prisão preventiva, o órgão emissor da decisão deverá revisar a necessidade de sua manutenção a cada:","alternativas":{"A":"30 (trinta) dias, mediante decisão fundamentada, de ofício, sob pena de tornar a prisão ilegal.","B":"60 (sessenta) dias, mediante decisão fundamentada, de ofício, sob pena de tornar a prisão ilegal.","C":"90 (noventa) dias, mediante decisão fundamentada, de ofício, sob pena de tornar a prisão ilegal.","D":"120 (cento e vinte) dias, contados do cumprimento do respectivo mandado de tranca.","E":"180 (cento e oitenta) dias, mediante provocação expressa do Ministério Público."},"resposta_correta":"C","comentario":"Inovação impositiva do Pacote Anticrime no artigo 316, parágrafo único, do CPP. O juiz que decretar a prisão preventiva fica obrigado a reavaliar e revisar a contemporaneidade e os motivos da tranca a cada 90 dias, sob pena de a prisão tornar-se ilegal."},{"id":443,"numero":443,"bloco":1,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"O crime de falso testemunho ou falsa perícia, capitulado no artigo 342 do Código Penal, integra as infrações contra a Administração da Justiça. O crime pune o testigo, perito, contador, tradutor ou intérprete que faz afirmação falsa, ou nega ou cala a verdade como testemunha em processo judicial ou administrativo. O parágrafo 2º do referido artigo preceitua que o fato deixa de ser punível (extingue-se a punibilidade) se, antes da sentença no processo em que ocorreu o ilícito, o agente:","alternativas":{"A":"comprova insuficiência de recursos econômicos por meio de certidões assistenciais.","B":"retrata-se ou declara a verdade.","C":"obtém o perdão judicial assinado pelo promotor de justiça da comarca de área.","D":"desiste de participar de futuras audiências instrutórias criminais comuns.","E":"filia-se a organizações não governamentais de proteção aos direitos civis."},"resposta_correta":"B","comentario":"Nos termos do artigo 342, § 2º, do Código Penal, o crime de falso testemunho admite retratação. Se a testemunha arrepender-se e declarar a verdade em juízo antes da prolação da sentença no processo original onde a mentira ocorreu, extingue-se a punibilidade."},{"id":444,"numero":444,"bloco":1,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"A audiência de custódia constitui garantia fundamental instrumentária de controle da legalidade das prisões positivada no artigo 310 do CPP. Após receber o auto de prisão em flagrante, o juiz deverá promover a audiência de custódia com a presença do preso, seu defensor e membro do Ministério Público, no prazo máximo de:","alternativas":{"A":"12 (doze) horas contadas da lavratura do boletim de ocorrência na delegacia.","B":"24 (vinte e quatro) horas.","C":"48 (quarenta e oito) horas de forma linear e improrrogável em qualquer caso.","D":"3 (três) dias úteis mediante notificação eletrônica prévia das coordenadorias.","E":"5 (cinco) dias contados do ingresso do detento provisório no pavilhão de tranca."},"resposta_correta":"B","comentario":"O artigo 310 do CPP impôs o prazo impositivo de até 24 horas (contadas do momento da captura em flagrante) para que o preso seja apresentado ao juiz de direito para a realização da audiência de custódia, avaliando-se torturas ou ilegalidades."},{"id":445,"numero":445,"bloco":1,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"Considere a seguinte situação hipotética: Um indivíduo, inconformado com a atuação de um Policial Penal que realizou a tranca de seu irmão em uma penitenciária, passa a desferir telefonemas anônimos para o celular particular do servidor, ameaçando causar-lhe mal injusto e grave (morte) caso este não facilite a entrada de materiais eletrônicos na cela. À luz das tipificações das infrações contra a Administração Pública previstas no Estatuto Repressor, a conduta de usar de violência ou grave ameaça, com o fim de favorecer interesse próprio ou alheio, contra autoridade ou qualquer outra pessoa que funciona ou é chamada a intervir em processo judicial, policial ou administrativo, subsume-se ao crime de:","alternativas":{"A":"Resistência (Art. 329).","B":"Coação no curso do processo (Art. 344).","C":"Exercício arbitrário das próprias razões (Art. 345).","D":"Ameaça qualificada simples (Art. 147).","E":"Constrangimento ilegal majorado (Art. 146)."},"resposta_correta":"B","comentario":"O crime de coação no curso do processo (Art. 344 do CP) consuma-se quando o agente emprega violência ou grave ameaça (como ameaça de morte por telefone) contra funcionário público ou testemunha com a finalidade de favorecer interesse em processo ou inquérito."},{"id":446,"numero":446,"bloco":1,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"O crime de descaminho (Art. 334 do Código Penal) caracteriza-se por iludir, no todo ou em parte, o pagamento de direito ou imposto devido pela entrada, saída ou consumo de mercadoria permitida. A consumação do crime de descaminho ocorre com o(a):","alternativas":{"A":"efetivo prejuízo material consolidado no encerramento do ano fiscal fazendário.","B":"liberação alfandegária e transposição da barreira aduaneira com a mercadoria iludida.","C":"lavratura do auto de infração fiscal pelos auditores tributários federais de campo.","D":"venda ou exposição à venda das mercadorias estrangeiras em feiras urbanas locais.","E":"recebimento formal da denúncia criminal oferecida pelo Ministério Público em juízo."},"resposta_correta":"B","comentario":"O descaminho é crime formal e de natureza tributária mitigada. Sua consumação perfeita no plano penal materializa-se no momento exato em que a mercadoria permitida transpõe a barreira alfandegária e entra no território nacional com a ilusão dos impostos devidos."},{"id":447,"numero":447,"bloco":1,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"O inquérito policial orienta-se pelo princípio da indisponibilidade relativa mitigada, remetendo-se ao Judiciário o controle sobre o seu encerramento. Nos termos do artigo 16 do CPP, o Ministério Público não poderá requerer a devolução do inquérito à autoridade policial, senão por:","alternativas":{"A":"motivo de conveniência e oportunidade financeira ou economia orçamentária do órgão.","B":"novas diligências, imprescindíveis ao oferecimento da denúncia.","C":"determinação verbal direta exarada pelo Governador do Estado em solenidades.","D":"insatisfação técnica em relação ao formato de catalogação das pastas digitais de dados.","E":"esgotamento total dos prazos de prescrição penal em abstrato fixados no código."},"resposta_correta":"B","comentario":"Trata-se da aplicação literal do artigo 16 do Código de Processo Penal. O Ministério Público só pode devolver os autos do inquérito policial à delegacia se demonstrar a necessidade premente de novas diligências que sejam estritamente imprescindíveis para o oferecimento da denúncia."},{"id":448,"numero":448,"bloco":1,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"O Código Penal regula as causas excludentes de ilicitude do Estado de Necessidade no artigo 24. Considera-se em estado de necessidade quem pratica o fato para salvar de perigo atual, que não provocou por sua vontade, nem podia de outro modo evitar, direito próprio ou alheio, cujo sacrifício, nas circunstâncias:","alternativas":{"A":"era razoável exigir-se por critérios de supremacia do interesse corporativo.","B":"não era razoável exigir-se.","C":"submetia-se à aprovação prévia dos membros do conselho da comunidade local.","D":"foi chancelado pelo dolo específico de obter vantagens financeiras indevidas.","E":"gerou prejuízo material superior ao dobro do valor do patrimônio protegido."},"resposta_correta":"B","comentario":"O artigo 24 do Código Penal define o estado de necessidade, exigindo-se que o perigo atual não tenha sido provocado voluntariamente pelo agente e que o sacrifício do bem jurídico protegido, nas circunstâncias concretas, não fosse razoável exigir-se."},{"id":449,"numero":449,"bloco":1,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"O crime de advocacia administrativa, capitulado no artigo 321 do Código Penal, pune o funcionário público que utiliza suas facilidades internas para interceder por particulares. O crime caracteriza-se pelo ato de patrocinar, direta ou indiretamente, interesse privado perante a administração pública:","alternativas":{"A":"com o emprego de violência, grave ameaça ou redução da capacidade de resistência.","B":"valendo-se da qualidade de funcionário.","C":"logrando êxito em obter o reajuste salarial automático das carreiras de tranca.","D":"fora do horário de expediente ordinário de escala fixado na guarnição de guarita.","E":"por motivos de perseguição de natureza estritamente político-partidária de classe."},"resposta_correta":"B","comentario":"O crime de advocacia administrativa (Art. 321 do CP) caracteriza-se pela conduta do funcionário público que atua como \"patrono\" de interesses privados de particulares perante a repartição pública, valendo-se das facilidades e acessos que o cargo lhe outorga."},{"id":450,"numero":450,"bloco":1,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"Considere a seguinte situação hipotética: Durante a realização de uma revista estrutural em um pavilhão carcerário do Rio Grande do Norte, os Policiais Penais localizam um aparelho telefônico celular ocultado sob o colchão de uma cela coletiva. Instaurado o procedimento de isolamento preventivo cautelar, um dos detentos assume voluntariamente de forma falsa a propriedade exclusiva do objeto para blindar o verdadeiro líder da galeria de sofrer faltas graves. À luz das condutas típicas contra a Administração da Justiça, o detento cometeu o crime de:","alternativas":{"A":"Falso testemunho (Art. 342).","B":"Autoacusação falsa (Art. 341).","C":"Favorecimento pessoal (Art. 348).","D":"Favorecimento real (Art. 349).","E":"Condescendência criminosa (Art. 320)."},"resposta_correta":"B","comentario":"O detento que assume falsamente perante os policiais penais a propriedade exclusiva de um celular apreendido para acobertar o verdadeiro dono comete o crime de Autoacusação Falsa (Art. 341 do CP), infração que integra os crimes contra a Administração da Justiça. PROCESSO PENAL (BLOCO 02)"},{"id":451,"numero":451,"bloco":2,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"O Código Penal brasileiro disciplina o concurso de pessoas no artigo 29, estabelecendo as regras de coautoria e participação. De acordo com o caput do referido artigo, quem, de qualquer modo, concorre para o crime:","alternativas":{"A":"responde por crime autônomo e independente, vedando-se a unidade de título jurídico.","B":"incide nas penas a este cominadas, na medida de sua culpabilidade.","C":"submete-se à aplicação da pena de morte de forma automática se o crime for hediondo.","D":"só pode ser punido se houver a confissão expressa do autor principal em juízo.","E":"responde de forma objetiva, aplicando-se a teoria do risco administrativo integral."},"resposta_correta":"B","comentario":"É a reprodução literal do caput do artigo 29 do Código Penal, que adota a Teoria Monista (ou Unitária) mitigada para o concurso de agentes, estabelecendo que todos os concorrentes respondem pelo mesmo crime, mas as penas são aplicadas individualmente na medida da culpabilidade de cada um."},{"id":452,"numero":452,"bloco":2,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"No que concerne à cooperação dolosamente distinta no concurso de pessoas (Art. 29, § 2º, do CP), se algum dos concorrentes quis participar de crime menos grave, ser-lhe-á aplicada a pena deste. Essa pena será aumentada até a metade, na hipótese de ter sido:","alternativas":{"A":"o crime cometido mediante o emprego de armas artesanais perfurantes intramuros.","B":"previsível o resultado mais grave.","C":"o prejuízo patrimonial superior a cinquenta salários mínimos nacionais vigentes.","D":"a conduta praticada por agente público detentor de estabilidade constitucional.","E":"o crime executado fora dos limites territoriais da comarca de área respectiva."},"resposta_correta":"B","comentario":"Nos termos do artigo 29, § 2º, do Código Penal, a regra da cooperação dolosamente distinta protege o agente que quis participar de crime menos grave. Contudo, se o resultado mais grave era perfeitamente previsível por critérios objetivos, incide a majorante que aumenta a pena até a metade."},{"id":453,"numero":453,"bloco":2,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"Considere a seguinte situação hipotética: Durante a realização de um procedimento de revista estrutural em um pavilhão carcerário, os Policiais Penais de plantão surpreendem um detento portando um bilhete manuscrito contendo ordens explícitas para a execução de um crime de homicídio contra um rival na rua. O bilhete seria entregue a um visitante. À luz das normas que regulam o iter criminis (caminho do crime), o plano de execução documentado no papel, sem que tenha havido qualquer ato inicial de execução material externa do homicídio, qualifica-se como ato de:","alternativas":{"A":"Preparação punível de forma autônoma pelo Código Penal.","B":"Cogitação ou preparação impunível na esfera penal, configurando estritamente falta grave nos termos da LEP.","C":"Tentativa imperfeita com redução obrigatória de dois terços da pena-base.","D":"Consumação antecipada por força da teoria do crime formal multinuclear.","E":"Desobediência qualificada contra a integridade das instituições de segurança."},"resposta_correta":"B","comentario":"Os atos preparatórios (conatus) qualificam-se como regra geral como fatos atípicos e impuníveis na esfera do Código Penal, salvo quando a lei tipifica a preparação como crime autônomo (ex: associação criminosa). Encontrar ordens escritas de homicídio antes do início da execução não configura tentativa de homicídio no CP, mas materializa falta disciplinar grave nos termos da LEP."},{"id":454,"numero":454,"bloco":2,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"O crime de condescendência criminosa, previsto no artigo 320 do Código Penal, pune o funcionário público que deixa, por indulgência, de responsabilizar subordinado que cometeu infração no exercício do cargo. Caso o subordinado infrator pertença a outra repartição e não esteja sob sua autoridade direta, o funcionário deve:","alternativas":{"A":"omitir-se para preservar a harmonia interpessoal das corporações.","B":"levar o fato ao conhecimento da autoridade competente.","C":"aplicar a sanção de advertência verbal de ofício por escrito.","D":"aguardar a conclusão do estágio probatório do colega para reclamar.","E":"divulgar as provas de forma anônima em canais de imprensa virtuais."},"resposta_correta":"B","comentario":"O crime de condescendência criminosa (Art. 320 do CP) exige que a autoridade tenha competência para punir o subordinado. Se a infração for cometida por funcionário de outra repartição fora de sua alçada hierárquica direta, o dever legal do servidor restringe-se a levar imediatamente o fato ao conhecimento da autoridade competente para a apuração."},{"id":455,"numero":455,"bloco":2,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"A desistência voluntária e o arrependimento eficaz são institutos de política criminal regulados no artigo 15 do Código Penal. Nos termos do mandamento legal, o agente que, voluntariamente, desiste de prosseguir na execução ou impede que o resultado se produza:","alternativas":{"A":"responde pelo crime consumado originariamente pretendido com atenuante de pena.","B":"só responde pelos atos já praticados.","C":"é isento de pena de forma absoluta por ausência de culpabilidade sistêmica.","D":"submete-se à aplicação compulsória de medidas de segurança ambulatoriais.","E":"responde por crime de tentativa de menor potencial ofensivo com perdão judicial."},"resposta_correta":"B","comentario":"A desistência voluntária e o arrependimento eficaz (Art. 15 do CP) configuram causas de exclusão da tipicidade da tentativa (doutrinariamente chamados de \"ponte de ouro\"). O agente que desiste voluntariamente da execução afasta a tentativa do crime cogitado, respondendo estritamente pelos atos que já foram efetivamente praticados no mundo real."},{"id":456,"numero":456,"bloco":2,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"O arrependimento posterior constitui causa de diminuição de pena que exige o preenchimento de requisitos temporais e materiais rígidos. Nos termos do artigo 16 do Código Penal, nos crimes cometidos sem violência ou grave ameaça à pessoa, reparado o dano ou restituída a coisa, até o recebimento da denúncia ou da queixa, por ato voluntário do agente, a pena será
