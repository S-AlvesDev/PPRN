reduzida de:","alternativas":{"A":"um quarto a metade de forma linear em todo e qualquer caso concreto.","B":"um a dois terços.","C":"metade a três quartos mediante homologação do Promotor de Justiça.","D":"um sexto a um terço, vedando-se a concessão de liberdade provisória.","E":"dois terços à totalidade dos dias acumulados por remissão carcerária."},"resposta_correta":"B","comentario":"Trata-se da redação literal do artigo 16 do Código Penal, que disciplina o arrependimento posterior. Exige-se crime sem violência/grave ameaça + reparação integral do dano/restituição da coisa + ato voluntário praticado até o limite temporal do recebimento formal da denúncia ou queixa para reduzir a pena de 1 a 2 terços."},{"id":457,"numero":457,"bloco":2,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"Considere a seguinte situação hipotética: Um indivíduo, com o objetivo de subtrair valores de uma agência bancária em Natal durante a noite, tenta explodir o cofre utilizando dinamites caseiras. No entanto, constata-se posteriormente que o cofre estava completamente vazio e desativado há anos, sendo absolutamente impossível a consumação do furto patrimonial por ineficácia do objeto. À luz da teoria do crime regulada no artigo 17 do Código Penal, não se pune a tentativa quando, por ineficácia absoluta do meio ou por absoluta impropriedade do objeto, é impossível consumar-se o crime. Trata-se do instituto do:","alternativas":{"A":"Crime impossível.","B":"Crime falho ou tentativa perfeita.","C":"Crime putativo por erro de tipo.","D":"Crime de ensaio ou provocado.","E":"Crime de flagrante diferido."},"resposta_correta":"A","comentario":"O artigo 17 do Código Penal consagra o instituto do Crime Impossível (ou tentativa inidônea). Adotando a Teoria Objetiva Temperada, o ordenamento afasta a punição da tentativa quando, por ineficácia absoluta do meio (ex: arma descarregada) ou por absoluta impropriedade do objeto (ex: tentar furtar cofre vazio desativado), a consumação do delito for materialmente impossível."},{"id":458,"numero":458,"bloco":2,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"O crime de advocacia administrativa, tipificado no artigo 321 do Código Penal, sofre uma severa qualificadora no seu parágrafo único, elevando as penas, se o interesse patrocinado pelo funcionário público perante a administração for de natureza:","alternativas":{"A":"transnacional ou envolver moedas estrangeiras flutuantes.","B":"ilegítima.","C":"coletiva ou de representação sindical de classe.","D":"agrária ou relacionado ao cultivo de cana- de-açúcar.","E":"sigilosa nos termos dos relatórios de inteligência militar."},"resposta_correta":"B","comentario":"Conforme preceitua o parágrafo único do artigo 321 do Código Penal, o crime de advocacia administrativa sofre uma qualificadora que eleva sensivelmente a reprimenda se o interesse privado de particular patrocinado pelo funcionário perante a Administração Pública for de natureza ilegítima."},{"id":459,"numero":459,"bloco":2,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"O erro de proibição, regulado no artigo 21 do Código Penal, projeta-se sobre a consciência da ilicitude pelo agente no momento da conduta. Nos termos do mandamento legal, o erro sobre a ilicitude do fato, se inevitável, isenta de pena; se evitável, poderá:","alternativas":{"A":"agravar a pena-base na metade pela aplicação do princípio da supremacia.","B":"diminuir a pena de um sexto a um quarto.","C":"transmudar o crime doloso em contravenção penal de bagatela automática.","D":"autorizar o juiz a conceder o perdão judicial de ofício por escrito.","E":"submeter o réu ao julgamento por comissões especiais de deputados."},"resposta_correta":"B","comentario":"O erro de proibição (Art. 21 do CP) recai sobre a consciência da ilicitude. Se o erro for inevitável (escusável), exclui-se a culpabilidade e o réu é isento de pena. Se o erro for considerado evitável (inescusável), o dolo e a culpabilidade se mantêm, mas o legislador concede uma causa de diminuição que reduz a pena de um sexto a um quarto."},{"id":460,"numero":460,"bloco":2,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"A coação moral irresistível e a obediência hierárquica são causas excludentes de culpabilidade (isenção de pena) fundadas na ausência de exigibilidade de conduta diversa. Nos termos do artigo 22 do Código Penal, se o fato é praticado sob coação moral irresistível ou em estrita obediência a ordem, não manifestamente ilegal, de superior hierárquico, só é punível o autor:","alternativas":{"A":"da coação ou da ordem.","B":"subordinado que executou materialmente a conduta de forma isolada.","C":"público que lavrou o boletim de ocorrência na delegacia de área.","D":"em concurso de agentes com menores de dezoito anos de idade de forma tácita.","E":"de forma objetiva, aplicando-se a teoria do risco administrativo integral."},"resposta_correta":"A","comentario":"O artigo 22 do Código Penal disciplina duas causas de exclusão da culpabilidade por inexigibilidade de conduta diversa: a coação moral irresistível e a obediência hierárquica a ordem não manifestamente ilegal. Em ambos os casos, confere-se a isenção de pena ao executor coagido ou subordinado, sendo punível de forma exclusiva o autor da coação ou o superior emissor da ordem criminosa."},{"id":461,"numero":461,"bloco":2,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"Considere a seguinte situação hipotética: Um Policial Penal potiguar de plantão na muralha externa de uma penitenciária estadual constata que um indivíduo do meio exterior tentava escalar a estrutura utilizando uma escorva de corda para resgatar um preso liderança de facção. O servidor aciona o alarme, aponta o fuzil oficial e grita determinando a imediata rendição do invasor. A conduta do agente público, voltada a impedir a fuga e prender o criminoso em estrito cumprimento dos mandamentos legais e regulamentares de sua profissão de segurança, ampara-se na excludente de ilicitude denominada:","alternativas":{"A":"Estado de necessidade carcerário.","B":"Legítima defesa presuntiva.","C":"Estrito cumprimento de dever legal.","D":"Exercício regular de direito individual.","E":"Coação física irresistível sistêmica."},"resposta_correta":"C","comentario":"Impedir fugas de terceiros e capturar criminosos em flagrante materializa a execução exata dos deveres funcionais e operacionais impostos por lei às carreiras de segurança pública, amparando-se na excludente de ilicitude do Estrito Cumprimento de Dever Legal (Art. 23, III, do CP)."},{"id":462,"numero":462,"bloco":2,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"O crime de contrabando, capitulado no artigo 334-A do Código Penal, preceitua em seu parágrafo 1º as condutas equiparadas que incorrem na mesma pena de reclusão de dois a cinco anos. Assinale a alternativa que apresenta uma conduta equiparada ao crime de contrabando.","alternativas":{"A":"Iludir, no todo ou em parte, o pagamento de imposto devido por entrada de bem permitido.","B":"Quem vende, expõe à venda, mantém em depósito ou, de qualquer forma, utiliza em atividade comercial mercadoria proibida por lei.","C":"Adquirir substâncias entorpecentes para o consumo pessoal sem autorização legal.","D":"Danificar patrimônio imaterial das repartições públicas fazendárias estaduais.","E":"Praticar fato previsto como crime doloso no interior de estabelecimentos penais."},"resposta_correta":"B","comentario":"O artigo 334-A, § 1º, inciso IV, do Código Penal tipifica como conduta equiparada ao crime de contrabando o ato de vender, expor à venda, manter em depósito ou utilizar em atividade comercial mercadoria proibida por lei ou regulamento, sujeitando o comerciante clandestino às penas de reclusão."},{"id":463,"numero":463,"bloco":2,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"O inquérito policial deve ser conduzido com observância estrita ao sigilo para garantir a eficiência das investigações e resguardar a intimidade das partes. De acordo com o artigo 20 do CPP, a autoridade assegurará no inquérito o sigilo necessário à elucidação do fato ou exigido pelo interesse da sociedade. O sigilo do inquérito policial, contudo, conforme a Súmula Vinculante 14 do STF, não é oponível ao:","alternativas":{"A":"jornalista de imprensa sensacionalista de rádio ou televisão local.","B":"defensor do investigado, que tem o direito de, no interesse do representado, ter acesso amplo aos elementos de prova que, já documentados em procedimento assistido, digam respeito ao exercício do direito de defesa.","C":"comandante tático operacional da polícia militar da área de fronteira.","D":"presidente da comissão de segurança pública da assembleia legislativa.","E":"Diretor de Segurança e Disciplina do complexo de onde o réu fugiu."},"resposta_correta":"B","comentario":"O Supremo Tribunal Federal editou a Súmula Vinculante 14 blindando as prerrogativas da defesa técnica. O sigilo do inquérito policial é a regra perante terceiros, mas não alcança o defensor do investigado, que possui o direito de amplo acesso a todos os elementos de prova que já estejam formalmente documentados e encartados nos autos."},{"id":464,"numero":464,"bloco":2,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"A quebra do sigilo telefônico (interceptação telefônica) difere da quebra do sigilo de dados telefônicos (histórico de chamadas). Conforme o artigo 5º, inciso XII, da CF/88 e legislação correlata, a interceptação telefônica submete-se à cláusula de reserva de jurisdição, exigindo ordem de magistrado para fins de investigação criminal ou instrução processual penal. A autoridade policial (Delegado), no curso do inquérito, não pode decretar a interceptação de ofício, cabendo- lhe:","alternativas":{"A":"realizar a escuta de forma clandestina e documentá-la no relatório final.","B":"representar ao juiz competente pela decretação da medida motivada.","C":"requerer a autorização verbal direta ao Promotor de Justiça de área.","D":"solicitar o monitoramento geográfico ao sindicato dos policiais penais.","E":"suspender o andamento do feito até o encerramento do ano fiscal ordinário."},"resposta_correta":"B","comentario":"O direito ao sigilo das comunicações telefônicas submete-se à cláusula constitucional de reserva de jurisdição (Art. 5º, XII, da CF). A autoridade policial no curso do inquérito não detém poder autônomo para quebrar sigilos ou escutar linhas, sendo obrigatório representar formal e motivadamente ao juiz de direito competente."},{"id":465,"numero":465,"bloco":2,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"Considere a seguinte situação hipotética: Durante o cumprimento de um mandado de busca e apreensão expedido pelo Juiz da Execução em uma residência em Natal, os policiais civis localizam uma CPU de computador que continha arquivos digitais com esquemas de contabilidade financeira de uma facção criminosa carcerária. O material é apreendido e lacrado. Para garantir a rastreabilidade, integridade e inviolabilidade dos arquivos digitais e do hardware apreendidos, os agentes do Estado devem observar rigorosamente os procedimentos da:","alternativas":{"A":"Autotutela judicial de mérito discricionário.","B":"Cadeia de Custódia, registrando cronologicamente todas as etapas de manipulação do vestígio.","C":"Presunção de legitimidade e veracidade administrativa mitigada.","D":"Inversão compulsória do ônus da prova processual penal ordinária.","E":"Publicidade restrita a meios de comunicação oficiais do executivo."},"resposta_correta":"B","comentario":"Conforme preceituam os artigos 158-A a 158-F do CPP (introduzidos pelo Pacote Anticrime), todo elemento físico ou digital bruto com potencial de vestígio deixado por crimes deve submeter-se de forma obrigatória ao protocolo da Cadeia de Custódia, garantindo a história cronológica, rastreabilidade e integridade da prova."},{"id":466,"numero":466,"bloco":2,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"O crime de falso testemunho (Art. 342 do Código Penal) sofre uma causa de aumento de pena de um sexto a um terço (Art. 342, § 1º) se o crime é praticado mediante suborno ou se cometido com o fim de obter prova destinada a produzir efeito em processo civil ou em:","alternativas":{"A":"sindicâncias internas sigilosas de empresas terceirizadas de vigilância privada.","B":"processo penal, ou em juízo eleitoral.","C":"acordos contratuais de direito privado comuns celebrados entre particulares.","D":"solenidades comunitárias organizadas por conselhos de bairros urbanos locais.","E":"avaliações periódicas de desempenho do estágio probatório de funcionários."},"resposta_correta":"B","comentario":"É a aplicação literal do artigo 342, § 1º, do Código Penal. O crime de falso testemunho sofre majoração de um sexto a um terceiro se praticado mediante suborno ou se o intuito do falso visar a produção de efeitos probatórios em sede de processo penal ou juízo eleitoral."},{"id":467,"numero":467,"bloco":2,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"A ação penal nos crimes contra a dignidade sexual (como o estupro, Art. 213 do CP) passou por profundas modificações legislativas promovidas pela Lei nº 13.718/2018. De acordo com a redação atual do artigo 225 do Código Penal, os crimes contra a dignidade sexual processam-se mediante ação penal:","alternativas":{"A":"privada exclusiva, dependendo de queixa- crime assinada por três advogados.","B":"pública condicionada à representação do ofendido ou de seus responsáveis.","C":"pública incondicionada.","D":"pública condicionada à homologação prévia do conselho da comunidade local.","E":"privada subsidiária da pública de forma compulsória em qualquer hipótese."},"resposta_correta":"C","comentario":"Profunda modificação promovida pela Lei nº 13.718/2018 no artigo 225 do Código Penal. Atualmente, todos os crimes contra a dignidade sexual (incluindo o estupro simples e qualificado) são crimes de ação penal pública incondicionada, sepultando a necessidade de representação da vítima."},{"id":468,"numero":468,"bloco":2,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"O artigo 312, § 2º, do Código de Processo Penal, introduzido pelo Pacote Anticrime, fixou balizas rígidas relativas à motivação da prisão preventiva. De acordo com o texto legal vigente, a decisão que decretar a prisão preventiva deve ser motivada e fundamentada em receio de perigo e na existência concreta de fatos:","alternativas":{"A":"pretéritos e históricos documentados nos antecedentes criminais antigos do réu.","B":"contemporâneos ou atuais que justifiquem a aplicação da medida cautelar.","C":"presumidos pela inteligência prisional com base em boatos de pátio carcerário.","D":"homologados por maioria absoluta dos deputados da assembleia legislativa.","E":"extraídos de enquetes informais de redes de comunicação virtual de mídias."},"resposta_correta":"B","comentario":"O Pacote Anticrime introduziu o artigo 312, § 2º, no CPP, positivando a exigência de contemporaneidade para as prisões cautelares. O magistrado é proibido de fundamentar a prisão preventiva em fatos antigos ou antecedentes passados isolados; exige-se a demonstração de fatos atuais e contemporâneos que justifiquem o perigo da liberdade do réu."},{"id":469,"numero":469,"bloco":2,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"O crime de corrupção de menores, tipificado no artigo 244-B do Estatuto da Criança e do Adolescente (ECA), foi objeto de pacificação jurisprudencial por meio da Súmula 500 do Superior Tribunal de Justiça (STJ). De acordo com a referida súmula, o crime de corrupção de menores é de natureza:","alternativas":{"A":"material, exigindo a prova técnica de que o jovem foi efetivamente corrompido.","B":"formal, configurando-se independentemente de prova da efetiva corrupção do menor, bastando a comprovação da participação do menor em delito em companhia de agente imputável.","C":"culposa, admitindo-se a isenção de pena por erro de tipo essencial escusável.","D":"privada subsidiária, dependendo de queixa- crime assinada pelos genitores.","E":"atípica na esfera penal, configurando estritamente infração civil de menor potencial."},"resposta_correta":"B","comentario":"O Superior Tribunal de Justiça editou a Súmula 500 pacificando que o crime de corrupção de menores (Art. 244-B do ECA) possui natureza de crime formal (de consumação antecipada). Para a configuração do delito, dispensa-se a prova técnica de que o jovem foi efetivamente corrompido, bastando comprovar que o imputado praticou infração penal em concurso com o menor."},{"id":470,"numero":470,"bloco":2,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"Considere a seguinte situação hipotética: Um indivíduo é preso em flagrante delito ao subtrair uma viatura oficial da Polícia Penal que estava estacionada regularmente na via pública em frente ao fórum criminal de Natal, com a chave na ignição durante a realização de uma escolta. À luz das qualificadoras do crime de furto previstas no Código Penal (Art. 155, § 4º-A, e parágrafos correlatos em sintonia com o patrimônio público), subtrair coisa móvel alheia pertencente ao patrimônio do Estado configura crime de furto qualificado ou atrai majoração específica. Assinale a alternativa que indica a exata tipificação do furto de bem público nos termos do artigo 155, § 6º (ou regras equivalentes do dano/furto qualificado do CP):","alternativas":{"A":"Furto simples de bagatela com aplicação do princípio da insignificância material.","B":"Furto majorado ou qualificado, aplicando-se as regras de proteção ao patrimônio público do Estado.","C":"Apropriação indébita previdenciária funcional com perda do cargo estável.","D":"Sabotagem de segurança pública qualificada por concurso de agentes civis.","E":"Contravenção penal de trânsito rodoviário dispensada de ação penal incondicionada."},"resposta_correta":"B","comentario":"Subtrair coisas móveis pertencentes ao acervo patrimonial do Estado (como viaturas, armas públicas ou insumos oficiais) agride o patrimônio público, atraindo as regras de maior severidade do Furto Qualificado ou majorado pela lesão ao erário, em sintonia com a tutela da Administração."},{"id":471,"numero":471,"bloco":2,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"O crime de favorecimento pessoal, capitulado no artigo 348 do Código Penal, integra os crimes contra a Administração da Justiça. O crime caracteriza- se pelo ato de auxiliar a autoridade de crime a esquivar-se à ação de autoridade pública, comovendo-se a lei a preceituar no seu parágrafo 2º que o fato deixa de ser punível (isenção de pena) se quem presta o auxílio é:","alternativas":{"A":"funcionário público ocupante de cargo de nível médio técnico administrativo estável.","B":"ascendente, descendente, cônjuge ou irmão do criminoso.","C":"menor de vinte e um anos de idade ou maior de setenta anos de idade na data.","D":"assistido por defensor público dativo nomeado de forma verbal pela vara criminal.","E":"filiado a partidos políticos de orientação estritamente assistencialista de classe."},"resposta_correta":"B","comentario":"Trata-se da escusa absolutória (isenção de pena) por razões de solidariedade familiar íntima contida no artigo 348, § 2º, do Código Penal. O crime de favorecimento pessoal deixa de ser punível se o auxílio prestado para a fuga do criminoso partir de seus ascendentes, descendentes, cônjuge ou irmãos."},{"id":472,"numero":472,"bloco":2,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"O crime de favorecimento real, previsto no artigo 349 do Código Penal, difere do favorecimento pessoal a partir do objeto da proteção fornecida pelo agente ao criminoso. O crime de favorecimento real caracteriza-se pelo ato de prestar a criminoso, fora dos casos de coautoria ou de receptação, auxílio destinado a:","alternativas":{"A":"esquivar-se à ação de autoridade pública fugindo dos limites territoriais da comarca.","B":"tornar seguro o proveito do crime.","C":"adulterar os dados de identificação biométrica dos prontuários eletrônicos policiais.","D":"registrar depoimentos falsos perante a comissão processante do PAD de área.","E":"coagir testemunhas de acusação por meio de telefonemas anônimos noturnos."},"resposta_correta":"B","comentario":"O divisor de águas entre os dois favorecimentos reside no objeto do auxílio. Se o agente ajuda o criminoso a fugir da polícia, comete favorecimento pessoal (Art. 348). Se o agente atua fora de coautoria para ajudar o criminoso a garantir e tornar seguro o proveito material do crime (esconder o dinheiro roubado, ocultar a res furtiva), comete Favorecimento Real (Art. 349)."},{"id":473,"numero":473,"bloco":2,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"A quebra do princípio da identidade física do juiz constitui nulidade processual penal no trâmite das ações penais comuns. De acordo com o artigo 399, § 2º, do CPP, introduzido pelas reformas de ritos, o juiz que presidir a instrução deverá:","alternativas":{"A":"transferir a coordenação das audiências instrutórias criminais ao seu substituto legal.","B":"proferir a sentença no processo.","C":"submeter o relatório de mérito à aprovação prévia do Promotor de Justiça de área.","D":"decretar a prisão preventiva do réu de ofício por motivos de conveniência fiscal.","E":"suspender o andamento das investigações policiais civis conduzidas pelo delegado."},"resposta_correta":"B","comentario":"É a redação literal do artigo 399, § 2º, do Código de Processo Penal, que positiva o Princípio da Identidade Física do Juiz no processo penal brasileiro, vinculando o magistrado que colheu as provas e presidiu a instrução ao dever de proferir a sentença penal do caso."},{"id":474,"numero":474,"bloco":2,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"O erro de proibição indireto (ou descriminante putativa por erro de proibição) projeta-se sobre a existência ou limites de uma causa excludente de ilicitude. O erro de proibição indireto verifica-se quando o agente supõe, erroneamente, que a sua conduta está amparada por uma:","alternativas":{"A":"lei complementar federal que foi revogada tacitamente por tratados internacionais.","B":"causa excludente de ilicitude permissiva que a lei na verdade não prevê ou cujos limites ele expande de forma imaginária.","C":"prerrogativa de soberania funcional vitalícia e hereditária de cargos comissionados.","D":"meta institucional de produtividade fixada de forma verbal pela chefia imediata.","E":"comissão especial de cidadãos eleitores instituída em conselhos comunitários locais."},"resposta_correta":"B","comentario":"O erro de proibição indireto (ou descriminante putativa por erro de proibição) manifesta-se no plano da culpabilidade. Ocorre quando o agente realiza a conduta percebendo perfeitamente a realidade dos fatos, mas supõe, por erro de proibição, que está autorizado a agir por uma causa excludente de ilicitude imaginária que a lei não prevê ou cujos limites ele expande de forma errônea (ex: achar que legítima defesa autoriza matar o agressor já imobilizado)."},{"id":475,"numero":475,"bloco":2,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"Considere a seguinte situação hipotética: Um indivíduo, conduzindo seu veículo particular por uma via urbana de Natal, é abordado por Policiais Penais em uma escolta extraordinária. O cidadão desobedece a ordem de parada, acelera o carro em direção à calçada e passa a proferir deboches públicos contra a guarnição armada. À luz das regras de competência e do poder de polícia das forças de segurança, desobedecer a ordem legal de funcionário público competente configura o crime de desobediência (Art. 330 do CP). No plano do processo penal, o crime de desobediência, por possuir pena máxima em abstrato não superior a dois anos, qualifica-se como:","alternativas":{"A":"crime de alta severidade penal a ser julgado prioritariamente pelo tribunal do júri.","B":"infração de menor potencial ofensivo, submetendo-se ao rito dos Juizados Especiais Criminais (Lei nº 9.099/1995).","C":"ato atípico na esfera criminal, configurando estritamente desvio ético-disciplinar civil.","D":"crime de ação penal privada dependente de queixa-crime assinada por três advogados.","E":"infração aduaneira de trânsito rodoviário de competência privativa da polícia federal."},"resposta_correta":"B","comentario":"O crime de desobediência (Art. 330 do CP) possui pena máxima em abstrato inferior a dois anos, enquadrando-se perfeitamente no conceito de infração de menor potencial ofensivo fixado pelo artigo 61 da Lei nº 9.099/1995, submetendo-se ao rito célere e desburocratizado dos Juizados Especiais Criminais (JECRIM)."},{"id":476,"numero":476,"bloco":2,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"O crime de falso testemunho ou falsa perícia (Art. 342 do Código Penal) qualifica-se como crime próprio, exigindo condições específicas do sujeito ativo. Contudo, a doutrina e a jurisprudência consagram que o crime admite a participação em concurso de agentes (Art. 29) se o terceiro (como o advogado ou familiar do réu):","alternativas":{"A":"induzir, instigar ou subornar a testemunha a mentir em juízo de forma dolosa.","B":"pagar as taxas de expediente judiciais para a distribuição de peças recursais ordinárias.","C":"protocolar as alegações finais de defesa técnica fora do horário bancário regular.","D":"indicar de forma verbal parceiros comerciais de preferência para a perícia de campo.","E":"manifestar preferência por audiências virtuais em detrimento das presenciais judiciais."},"resposta_correta":"A","comentario":"Embora o falso testemunho (Art. 342 do CP) seja crime próprio da testemunha, a jurisprudência pacífica dos Tribunais Superiores admite o concurso de agentes na modalidade de participação. O terceiro (advogado, familiar ou corréu) que instiga, induz ou suborna de forma dolosa a testemunha a faltar com a verdade em juízo responde em concurso como partícipe do falso testemunho."},{"id":477,"numero":477,"bloco":2,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"A prisão temporária, regulada pela Lei nº 7.960/1989, só pode ser decretada pelo Juiz de Direito se preenchidos os requisitos legais e em face de crimes específicos expressamente listados no rol taxativo da lei. Assinale a alternativa que apresenta um crime que não admite a decretação de prisão temporária por ausência de previsão no rol legal.","alternativas":{"A":"Homicídio doloso, sequestro ou cárcere privado, e roubo simples ou majorado.","B":"Estupro, extorsão mediante sequestro e epidemia com resultado morte.","C":"Furto simples ou estelionato comum na modalidade simples patrimonial de bagatela.","D":"Tráfico de drogas, crimes contra o sistema financeiro e genocídio.","E":"Quadrilha ou bando (associação criminosa) e envenenamento de água potável."},"resposta_correta":"C","comentario":"O rol do artigo 1º, inciso III, da Lei nº 7.960/1989 (Lei da Prisão Temporária) possui caráter estritamente taxativo (numerus clausus). Crimes patrimoniais simples como o furto simples e o estelionato comum não estão catalogados no texto legal, sendo terminantemente proibida a decretação de prisão temporária para essas infrações."},{"id":478,"numero":478,"bloco":2,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"O artigo 158 do Código de Processo Penal consagra o Princípio da Obrigatoriedade do Exame de Corpo de Delito. De acordo com o mandamento legal, quando a infração deixar vestígios, será indispensável o exame de corpo de delito, direto ou indireto, não podendo supri-lo a:","alternativas":{"A":"confissão do acusado.","B":"prova documental digital ou eletrônica sem assinatura de peritos criminais oficiais.","C":"oitiva de testemunhas que possuam vínculos de parentesco com a vítima lesada.","D":"realização de vistorias estruturais extraordinárias conduzidas pela inteligência prisional.","E":"juntada de certidões de antecedentes criminais sem anotações de faltas graves."},"resposta_correta":"A","comentario":"É a regra de ouro protetiva contida no artigo 158 do Código de Processo Penal. Quando a infração penal deixa vestígios materiais, o exame de corpo de delito direto ou indireto qualifica-se como prova pericial impositiva, estabelecendo a lei de forma categórica que nem mesmo a confissão do acusado possui o condão de suprir sua ausência."},{"id":479,"numero":479,"bloco":2,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"O erro provocado por terceiro está regulado no artigo 20, § 2º, do Código Penal. Nos termos do mandamento do Estatuto Repressor, se o erro de tipo for provocado por terceiro (como o médico que induz o enfermeiro a ministrar substância venenosa na enfermaria fingindo ser remédio):","alternativas":{"A":"ambos os agentes respondem pelo crime culposo de forma solidária e unificada em juízo.","B":"responde pelo crime o terceiro que determinou ou provocou o erro de forma dolosa.","C":"o executor material da conduta é punido com a pena do crime doloso qualificado máxima.","D":"extingue-se a responsabilidade civil objetiva do Estado pelos danos materiais causados.","E":"a competência para julgar a infração funcional migra para a corregedoria da SEAP."},"resposta_correta":"B","comentario":"Nos termos do artigo 20, § 2º, do Código Penal, o erro de tipo provocado por terceiro transfere integralmente a tipicidade e a responsabilidade penal ao autor da provocação. O executor material que atua ludibriado em erro escusável (o enfermeiro que aplica o veneno achando ser o remédio indicado pelo médico) não responde pelo crime, recaindo a punição dolosa sobre o terceiro que determinou o erro."},{"id":480,"numero":480,"bloco":2,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"Considere a seguinte situação hipotética: Durante a realização de uma oitiva instrutória em uma ação penal comum perante a vara criminal de Natal, uma testemunha regularmente compromissada nega a verdade de forma deliberada e mente sobre o álibi do réu. Constatando o falso testemunho em plena audiência, o magistrado dá voz de prisão em flagrante à testemunha. De acordo com o rito processual e penal comum, o crime de falso testemunho consuma-se no momento exato em que a:","alternativas":{"A":"sentença condenatória ou absolutória transitada em julgado é proferida no processo.","B":"testemunha encerra e assina o seu depoimento, concluindo-se o ato processual da oitiva.","C":"denúncia criminal oferecida pelo Ministério Público é recebida formalmente pelo juiz.","D":"defesa técnica protocolar as alegações finais de mérito na secretaria da vara criminal.","E":"inteligência prisional chancelar a falsidade por meio de relatórios técnicos de dados."},"resposta_correta":"B","comentario":"O crime de falso testemunho (Art. 342 do CP) possui natureza de crime formal (de consumação antecipada). Sua consumação perfeita opera-se no exato instante em que a testemunha encerra o seu depoimento e subscreve o termo da oitiva, completando o ato processual falso, independentemente do resultado final da ação penal principal."},{"id":481,"numero":481,"bloco":2,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"O crime de coação no curso do processo, capitulado no artigo 344 do Código Penal, protege a regularidade da marcha processual e a integridade de quem nela intervém. O crime qualifica-se e sofre sensível aumento de pena da metade (Art. 344, parágrafo único) se o processo envolver crime:","alternativas":{"A":"contra as finanças públicas ou infrações tributárias aduaneiras federais.","B":"contra a dignidade sexual de vulneráveis na modalidade de estupro de vulnerável.","C":"contra o patrimônio público imaterial das secretarias de estado de administração.","D":"praticado por funcionários públicos ocupantes de cargos de provimento efetivo estáveis.","E":"hediondo ou equiparado nos termos da legislação correlata nacional contemporânea."},"resposta_correta":"E","comentario":"Conforme preceitua o parágrafo único do artigo 344 do Código Penal (introduzido por reformas), o crime de coação no curso do processo sofre uma majorante que eleva a pena da metade se o processo judicial ou procedimento administrativo originário envolver a apuração de crime hediondo ou equiparado."},{"id":482,"numero":482,"bloco":2,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"O inquérito policial, por possuir natureza informativa e inquisitiva, não se submete à obrigatoriedade do contraditório pleno aplicável à ação penal judicial. No entanto, o Pacote Anticrime introduziu uma regra específica de defesa técnica obrigatória no artigo 14-A do CPP aplicável a servidores das carreiras de segurança pública (inclusive a Polícia Penal) quando investigados em inquéritos policiais por fatos relacionados ao:","alternativas":{"A":"desvio de insumos alimentares ou ferramentas de limpeza do almoxarifado central.","B":"uso da força letal praticados no exercício profissional, de forma consumada ou tentada.","C":"cometimento de crimes de trânsito rodoviário com viaturas oficiais fora da escala.","D":"atraso burocrático no preenchimento de planilhas de prontuários eletrônicos carcerários.","E":"exercício do direito de livre associação sindical ou paralisação de atividades de tranca."},"resposta_correta":"B","comentario":"Inovação impositiva introduzida pelo Pacote Anticrime no artigo 14-A do CPP. Constatada a instauração de inquérito ou investigação para apurar o uso da força letal (consumada ou tentada) por agentes públicos de segurança no exercício de suas funções, o órgão deve notificar o servidor para que este constitua defesa técnica (advogado) no prazo de 48 horas, garantindo a lisura técnica preliminar."},{"id":483,"numero":483,"bloco":2,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"O artigo 315 do Código de Processo Penal estabelece os requisitos formais de fundamentação das decisões judiciais que decretam, mantêm ou revogam as prisões cautelares. De acordo com o § 2º do referido artigo, introduzido pelo Pacote Anticrime, não se considera fundamentada qualquer decisão judicial que:","alternativas":{"A":"analisar as provas técnicas e os relatórios de inteligência de forma analítica e motivada.","B":"se limitar à indicação, à reprodução ou à paráfrase de ato normativo, sem explicar sua relação com a causa ou a decisão concreta.","C":"for proferida por juízes singulares estáveis aprovados em concursos públicos de provas e títulos.","D":"acolher integralmente os requerimentos de prisão cautelar oferecidos pelo Promotor de Justiça.","E":"documentar a decisão por escrito em vernáculo pátrio de forma elegante e escorreita."},"resposta_correta":"B","comentario":"O artigo 315, § 2º, inciso I, do CPP (redação do Pacote Anticrime) combateu os \"vôos cegos\" de fundamentação judicial. Não se considera fundamentada, sendo nula de pleno direito, a decisão que se limita a reproduzir, parafrasear ou indicar o texto de ato normativo ou artigo de lei, sem realizar a correlação analítica com os fatos concretos do caso."},{"id":484,"numero":484,"bloco":2,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"O crime de favorecimento pessoal (Art. 348 do Código Penal) exige que o auxílio prestado pelo agente ao criminoso vise frustrar a ação das autoridades públicas. Se o crime principal praticado pelo indivíduo auxiliado for punido com pena de detenção, a pena do favorecimento pessoal será de:","alternativas":{"A":"reclusão de dois a quatro anos e multa de forma compulsória e linear em qualquer caso.","B":"detenção, de um a seis meses, e multa.","C":"suspensão de direitos civis estaduais por cinco anos de forma improrrogável.","D":"isolamento preventivo em Regime Disciplinar Diferenciado de tranca carcerária de área.","E":"multa civil pecuniária diária a ser quitada de forma solidária pelos familiares do réu."},"resposta_correta":"B","comentario":"Trata-se da aplicação literal do artigo 348, caput, segunda parte, do Código Penal. O crime de favorecimento pessoal calibra sua pena com base na gravidade do crime principal cometido pelo indivíduo auxiliado. Se o crime principal for punido com pena de detenção, a sanção do favorecimento será de detenção de um a seis meses e multa."},{"id":485,"numero":485,"bloco":2,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"Considere a seguinte situação hipotética: Durante a realização de uma escolta tática terrestre de detentos perigosos em Natal, uma viatura oficial da Polícia Penal é cercada por automóveis particulares integrados por criminosos armados com fuzis. Diante da iminência de um resgate armado violento, os policiais penais efetuam disparos de armas automáticas contra os agressores, alvejando dois criminosos e abortando a ação. À luz das causas excludentes de ilicitude previstas no artigo 23 do Código Penal e consolidadas pela redação contemporânea do artigo 25, parágrafo único, do CP, o comportamento dos policiais penais configura legítima defesa, caracterizada pelo ato de repelir agressão injusta em defesa de direito próprio e da segurança pública. Portanto, os servidores agiram amparados pelo(a):","alternativas":{"A":"Estado de necessidade mitigado por sigilo.","B":"Legítima defesa, não cometendo crime pela exclusão de ilicitude.","C":"Estrito cumprimento de dever legal de tranca institucional.","D":"Exercício regular de direito individual funcional corporativo.","E":"Inimputabilidade penal provisória decorrente do estresse operacional."},"resposta_correta":"B","comentario":"Diante de um cerco armado com fuzis contra uma escolta oficial, o uso de armas automáticas pelos policiais penais para repelir a agressão atual injusta configura perfeitamente o amparo da excludente de ilicitude da Legítima Defesa própria e de terceiros (Art. 23, II, e Art. 25 do CP), excluindo o crime de homicídio ou lesões."},{"id":486,"numero":486,"bloco":2,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"O crime de descaminho, capitulado no artigo 334 do Código Penal, consuma-se com a ilusão tributária aduaneira de mercadorias permitidas. O parágrafo 3º do referido artigo prevê uma qualificadora que aplica a pena em dobro se o crime de descaminho for praticado em:","alternativas":{"A":"concurso de mais de dez pessoas na modalidade de organização faccionada integrada.","B":"transporte aéreo, marítimo ou fluvial.","C":"comarcas geográficas que não possuam sedes de varas criminais federais ativas.","D":"detrimento do patrimônio público imaterial das secretarias de estado de fazenda.","E":"estabelecimentos prisionais femininos estaduais de segurança média ou máxima."},"resposta_correta":"B","comentario":"Conforme preceitua o artigo 334, § 3º, do Código Penal, o crime de descaminho qualifica-se e sofre aplicação da pena em dobro se a ilusão tributária aduaneira for praticada utilizando-se de transporte aéreo, marítimo ou fluvial, devido à maior facilidade de escoamento e burla fiscal de larga escala."},{"id":487,"numero":487,"bloco":2,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"A ação penal pública condicionada à representação extingue-se se o ofendido decair do direito de manifestação no prazo legal de 6 meses. Na contagem do prazo decadencial de 6 meses para o oferecimento da representação no processo penal, adota-se a regra de direito material (Art. 10 do CP), o que significa que o prazo:","alternativas":{"A":"inclui o dia do começo e exclui o dia do vencimento de forma contínua e peremptória.","B":"interrompe-se nos sábados, domingos e feriados estaduais ou municipais secundários.","C":"computa-se excluindo o dia do começo e incluindo o dia do vencimento em dias úteis.","D":"suspende-se de forma automática durante o recesso administrativo do Poder Judiciário.","E":"é contínuo e peremptório, incluindo o dia do começo no cômputo temporal."},"resposta_correta":"E","comentario":"Erro comum de pegadinha processual. O prazo decadencial para o exercício da representação possui natureza de prazo de direito material (decadência do direito de agir). Nos termos do artigo 10 do CP, a contagem inclui obrigatoriamente o dia do começo no cômputo temporal e é contínua, não se suspendendo por finais de semana ou recessos forenses."},{"id":488,"numero":488,"bloco":2,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"O crime de violação de sigilo profissional, tipificado no artigo 325 do Código Penal, pune o funcionário público que revela fato de que tem ciência em razão do cargo e que deva permanecer em segredo. O crime sofre qualificadora e elevação de penas (Art. 325, § 2º) se da revelação do sigilo resulta:","alternativas":{"A":"prejuízo financeiro ao erário público estadual superior a dez salários mínimos.","B":"dano grave à Administração Pública ou a outrem.","C":"a necessidade de reformar as instalações físicas das guaritas de vigilância armada.","D":"a suspensão do direito de saídas temporárias de presos do regime semiaberto.","E":"desentendimentos interpessoais entre os membros da comissão especial de ética."},"resposta_correta":"B","comentario":"Nos termos do artigo 325, § 2º, do Código Penal, o crime de violação de sigilo profissional qualifica-se e sofre sensível elevação de penas se da revelação do segredo ou facilitação do acesso resultar dano grave à Administração Pública ou a direitos de outrem."},{"id":489,"numero":489,"bloco":2,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"O erro de tipo acidental (como o erro sobre a pessoa, Art. 20, § 3º, do Código Penal) projeta-se sobre a identidade da vítima no momento do crime. Nos termos das regras expressas do Estatuto Repressor, o erro quanto à pessoa contra a qual o crime é praticado:","alternativas":{"A":"isenta o agente de pena de forma absoluta por ausência de dolo e culpa sistêmicos.","B":"não exclui o dolo nem a culpa, e não se consideram as condições ou qualidades da vítima real, mas sim as da pessoa contra quem o agente queria praticar o crime.","C":"transmuda o crime doloso em falta disciplinar de natureza grave carcerária automática.","D":"afasta a aplicação de qualificadoras ou causas de aumento de pena vinculadas à idade.","E":"submete o réu ao julgamento compulsório por comissões especiais de jurados civis."},"resposta_correta":"B","comentario":"O erro sobre a pessoa (Art. 20, § 3º, do CP) qualifica-se como modalidade de erro de tipo acidental e irrelevante. O erro não afasta o dolo ou a culpa; o agente responde penalmente pelo crime considerando-se as condições, qualidades e nexo da vítima virtual pretendida (quem ele achava que estava matando), e não as da vítima real atingida por erro de mira/identidade."},{"id":490,"numero":490,"bloco":2,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"Considere a seguinte situação hipotética: Um indivíduo ingressa de forma clandestina e noturna no pátio de veículos apreendidos de uma delegacia de polícia potiguar e subtrai quatro pneus novos de uma viatura oficial da Polícia Civil que estava desativada para manutenção. À luz das tipificações dos crimes contra o patrimônio previstas no Código Penal (Art. 155, § 4º, e regras de furto de bem público), a subtração de componentes eletrônicos ou peças de veículos pertencentes à Administração Pública direta do Estado configura o crime de:","alternativas":{"A":"Furto simples de bagatela com aplicação do princípio da insignificância material.","B":"Furto qualificado ou majorado pela lesão ao patrimônio público estatal.","C":"Peculato-furto funcional praticado por particulares em concurso de agentes.","D":"Sabotagem material contra as instituições de segurança pública integradas de área.","E":"Contravenção penal de trânsito rodoviário dispensada de ação penal incondicionada."},"resposta_correta":"B","comentario":"Subtrair peças, componentes ou patrimônio móvel pertencente a viaturas oficiais da estrutura do Estado (Polícia Civil) atenta contra as burras públicas, subsumindo- se perfeitamente às qualificadoras ou majorantes do Furto Qualificado pela lesão ao patrimônio público, repelindo- se o furto simples."},{"id":491,"numero":491,"bloco":2,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"O crime de advocacia administrativa (Art. 321 do Código Penal) configura infração funcional de menor potencial ofensivo em sua modalidade simples, cuja pena máxima não supera um ano de detenção. No que concerne à ação penal para o processamento do crime de advocacia administrativa, esta é de natureza:","alternativas":{"A":"privada exclusiva, dependendo de queixa- crime assinada por três advogados inscritos.","B":"pública condicionada à representação do Secretário de Estado da Administração de área.","C":"pública incondicionada.","D":"pública condicionada à homologação prévia do conselho da comunidade da comarca.","E":"privada subsidiária da pública compulsória em face de inércia da corregedoria geral."},"resposta_correta":"C","comentario":"O crime de advocacia administrativa (Art. 321 do CP) atenta contra os crimes praticados por funcionário público contra a administração em geral, processando- se de forma universal mediante ação penal pública incondicionada."},{"id":492,"numero":492,"bloco":2,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"O crime de autoacusação falsa, capitulado no artigo 341 do Código Penal, protege a integridade e a veracidade da Administração da Justiça contra fraudes processuais. O crime pune o indivíduo que acusar-se, perante a autoridade, de crime inexistente ou:","alternativas":{"A":"praticado por outrem.","B":"culposo de trânsito rodoviário de menor potencial ofensivo dispensado de pena.","C":"punido com pena de multa pecuniária a ser quitada de forma solidária por familiares.","D":"cometido em concurso de agentes com menores de dezoito anos de idade de forma tácita.","E":"tipificado na lei de abuso de autoridade por agentes públicos estáveis funcionais."},"resposta_correta":"A","comentario":"O crime de autoacusação falsa (Art. 341 do CP) materializa-se quando o indivíduo acusa-se falsamente perante a autoridade policial ou judicial do cometimento de um crime inexistente ou que sabe ter sido perpetrado por outrem, visando blindar o verdadeiro autor da infração."},{"id":493,"numero":493,"bloco":2,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"A prisão preventiva pode ser revogada pelo Juiz de Direito no curso do processo se este constatar a ausência de motivos para a sua manutenção, bem como ser novamente decretada. Nos termos do artigo 316, caput, do CPP, o juiz poderá, de ofício ou a requerimento das partes, revogar a prisão preventiva se, no correr do processo, verificar a:","alternativas":{"A":"insuficiência crônica de recursos econômicos do réu provada por certidões assistenciais.","B":"falta de motivo para que ela subsista, bem como de novo decretá-la, se sobrevierem razões que a justifiquem.","C":"interposição do recurso de apelação perante o Tribunal de Justiça do Estado pelo réu.","D":"ausência de defensor público ou advogado dativo durante as audiências instrutórias.","E":"ocorrência de greve geral de servidores das carreiras da segurança pública estadual."},"resposta_correta":"B","comentario":"É a redação literal do artigo 316, caput, do Código de Processo Penal. A prisão preventiva é pautada pela cláusula da rebus sic stantibus. Desaparecidos os motivos causadores do periculum libertatis, o juiz deve revogar a cautelar de ofício ou a requerimento, mantendo o poder de decretá-la novamente se novos fatos surgirem."},{"id":494,"numero":494,"bloco":2,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"O excesso culposo nas excludentes de ilicitude (Art. 23, parágrafo único, do CP) verifica-se quando o agente, ao repelir uma agressão em legítima defesa ou atuar em estado de necessidade, excede os limites da moderação por erro de cálculo escusável. No que concerne à punição do excesso culposo, esta exige que a modalidade:","alternativas":{"A":"culposa do crime praticado no excesso esteja expressamente prevista em lei.","B":"dolosa do crime tenha sido chancelada pelo dolo específico de obter vantagens indevidas.","C":"infração funcional tenha sido catalogada como falta disciplinar grave na LEP.","D":"representação criminal do ofendido tenha sido homologada pelo juiz de direito de área.","E":"responsabilidade civil objetiva de risco administrativo tenha sido provada nos autos."},"resposta_correta":"A","comentario":"Conforme preceitua o artigo 23, parágrafo único, do Código Penal, o excesso culposo nas excludentes exige, para fins de punição criminal do agente, que a modalidade culposa do crime praticado no excesso (ex: homicídio culposo ou lesão culposa) esteja expressamente tipificada e prevista em lei penal estrita."},{"id":495,"numero":495,"bloco":2,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"Considere a seguinte situação hipotética: Durante a realização de uma audiência de instrução e julgamento na vara criminal de Natal, o réu, insatisfeito com as perguntas formuladas pelo Promotor de Justiça, passa a proferir insultos de baixo calão, deboches explícitos e ameaças de morte contra o membro do Ministério Público em pleno ato judicial. À luz das tipificações das infrações contra a Administração da Justiça previstas no Estatuto Repressor, a conduta de usar de violência ou grave ameaça contra autoridade que funciona em processo judicial subsume-se perfeitamente ao crime de:","alternativas":{"A":"Desacato (Art. 331).","B":"Coação no curso do processo (Art. 344).","C":"Resistência qualificada (Art. 329, § 1º).","D":"Calúnia majorada simples (Art. 138).","E":"Constrangimento ilegal qualificado (Art. 146)."},"resposta_correta":"B","comentario":"Desferir insultos graves combinados com ameaças de morte contra o Promotor de Justiça em plena audiência com o fim de constrangê-lo ou favorecer interesse em processo criminal qualifica-se perfeitamente como o crime de Coação no Curso do Processo (Art. 344 do CP), infração autônoma que absorve o desacato devido à grave ameaça em ato judicial."},{"id":496,"numero":496,"bloco":2,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"O inquérito policial qualifica-se como procedimento inquisitivo desprovido de contraditório obrigatório. De acordo com o artigo 5º, inciso II, do CPP, nos crimes de ação pública, o inquérito policial poderá ser iniciado de ofício pela autoridade policial (Delegado) ou mediante:","alternativas":{"A":"portaria verbal e informal ditada pelo chefe da guarnição armada da muralha prisional.","B":"requisição da autoridade judiciária ou do Ministério Público, ou a requerimento do ofendido ou de quem tiver qualidade para representá-lo.","C":"autorização prévia por escrito expedida por maioria absoluta dos deputados estaduais.","D":"solicitação anônima veiculada em canais de imprensa virtual sensacionalista locais.","E":"representação assinada de forma unânime pelos membros do conselho da comunidade."},"resposta_correta":"B","comentario":"É a reprodução literal do artigo 5º, inciso II, do Código de Processo Penal, que elenca as formas legítimas de instauração do inquérito policial nos crimes de ação pública, destacando-se a requisição do Juiz ou MP e o requerimento do ofendido."},{"id":497,"numero":497,"bloco":2,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"O crime de condescendência criminosa (Art. 320 do Código Penal) integra os crimes praticados por funcionário público contra a administração em geral. O núcleo do tipo (verbo comandor) que caracteriza a conduta do funcionário na condescendência criminosa é:","alternativas":{"A":"Exigir ou solicitar vantagem econômica indevida de particular para praticar ato.","B":"Deixar, por indulgência, de responsabilizar subordinado que cometeu infração no exercício do cargo ou, quando lhe falte competência, não levar o fato ao conhecimento da autoridade competente.","C":"Patrocinar interesse privado perante a administração pública valendo-se do cargo.","D":"Retardar ou deixar de praticar, indevidamente, ato de ofício, para satisfazer interesse pessoal.","E":"Apropriar-se de dinheiro ou valor público de que tem a posse em razão das atribuições."},"resposta_correta":"B","comentario":"O crime de condescendência criminosa (Art. 320 do CP) caracteriza-se pela conduta omissiva do funcionário público que, movido por indulgência, deixa de responsabilizar subordinado infrator ou deixa de levar o fato ao conhecimento da chefia competente quando lhe falte atribuição de punição direta."},{"id":498,"numero":498,"bloco":2,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"O erro sobre a pessoa, regulado no artigo 20, § 3º, do Código Penal, constitui modalidade de erro de tipo acidental que não isenta o agente de pena. De acordo com as regras de regência do Estatuto Repressor, o crime cometido com erro sobre a pessoa pune o agente considerando-se as:","alternativas":{"A":"condições e qualidades da vítima real que sofreu efetivamente a agressão física no evento.","B":"condições ou qualidades da pessoa contra quem o agente queria praticar o crime.","C":"normas de menor severidade penal fixadas para as infrações de menor potencial de bagatela.","D":"causas excludentes de ilicitude do estrito cumprimento de dever legal de forma presumida.","E":"diretrizes de dosimetria penal estipuladas discricionariamente pelo magistrado singular."},"resposta_correta":"B","comentario":"Nos termos do artigo 20, § 3º, do Estatuto Repressor, o erro sobre a pessoa não afasta a tipicidade ou a aplicação da pena. O ordenamento jurídico impõe uma ficção jurídica: o réu será julgado e apenado considerando-se as condições ou qualidades da pessoa contra quem ele queria praticar o crime (a vítima pretendida)."},{"id":499,"numero":499,"bloco":2,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"A ação penal privada subsidiária da pública, quando admitida em face da inércia do Ministério Público, submete-se a prazos decadenciais impositivos para o seu exercício pelo querelante. De acordo com as normas expressas do Código de Processo Penal, o prazo para propor a ação privada subsidiária é de:","alternativas":{"A":"30 (trinta) dias, contados do esgotamento do prazo legal do Ministério Público.","B":"6 (seis) meses, contados do dia em que se esgotar o prazo do Ministério Público para o oferecimento da denúncia.","C":"1 (um) ano, contados da data de lavratura do relatório final do inquérito policial civil.","D":"3 (três) meses, contados da notificação formal do arquivamento do feito pelo juiz.","E":"tempo indeterminado, ficando a critério do promotor fixar o termo inicial do direito."},"resposta_correta":"B","comentario":"Conforme preceitua o artigo 38 do CPP, em perfeita simetria com a ação privada originária, o prazo decadencial para que o querelante proponha a ação penal privada subsidiária da pública é de 6 meses, contados a partir do dia seguinte ao exato esgotamento do prazo legal do Ministério Público para oferecer a denúncia ou requerer o arquivamento."},{"id":500,"numero":500,"bloco":2,"materia":"Direito Penal e Processo Penal","texto_base":null,"enunciado":"Considere a seguinte situação hipotética: Durante a realização de um procedimento de revista estrutural e triagem de correspondências em uma cadeia pública do Rio Grande do Norte, os Policiais Penais localizam, ocultado no interior de um rádio de pilha enviado a um preso, um pacote contendo 200 gramas de substância análoga à cocaína. O material é apreendido e acondicionado com lacre numerado. À luz das tipificações das infrações penais e processuais estudadas ao longo deste módulo e em sintonia com a Lei de Drogas (Lei nº 11.343/2006, Art. 33, c/c Art. 40, III), introduzir ou tentar introduzir substâncias entorpecentes em estabelecimentos prisionais configura crime de tráfico de drogas majorado, processando-se mediante ação penal pública incondicional. Portanto, a conduta do infrator:","alternativas":{"A":"configura fato atípico na esfera criminal, gerando estritamente desvios éticos funcionais.","B":"constitui o crime de tráfico ilícito de entorpecentes, majorado por ter sido cometido nas dependências de estabelecimento prisional.","C":"submete o agente às penas do crime de descaminho qualificado pela barreira aduaneira.","D":"qualifica-se como contravenção penal de menor potencial ofensivo dispensada de ação pública.","E":"gera a perda definitiva da nacionalidade nata e a cassação vitalícia de direitos civis."},"resposta_correta":"B","comentario":"Tentar introduzir entorpecentes em estabelecimentos penais amolda-se perfeitamente ao crime de tráfico ilícito de drogas (Art. 33 da Lei nº 11.343/2006), incidindo de forma impositiva a causa de aumento de pena (majorante) do artigo 40, inciso III, por ter sido o crime cometido nas dependências de unidade prisional do Estado, processando-se via ação pública incondicionada."}];</script>
<script>/* ============================================================
   PPRN 500 — núcleo: dados, persistência e estatísticas
   ============================================================ */
const BANCO = window.__QUESTOES__;
const TOTAL_Q = BANCO.length;
const MAPA_Q = {};
BANCO.forEach(q => { MAPA_Q[q.id] = q; });

const MATERIAS = (() => {
  const m = {};
  BANCO.forEach(q => {
    if (!m[q.materia]) m[q.materia] = { nome: q.materia, ids: [], blocos: new Set() };
    m[q.materia].ids.push(q.id);
    m[q.materia].blocos.add(q.bloco);
  });
  return Object.values(m).map(x => ({
    nome: x.nome, ids: x.ids, total: x.ids.length,
    blocos: [...x.blocos].sort((a, b) => a - b)
  })).sort((a, b) => b.total - a.total || a.nome.localeCompare(b.nome, 'pt'));
})();
const NOMES_MATERIAS = MATERIAS.map(m => m.nome);

/* ---------------- persistência ---------------- */
const CHAVE = 'pprn500.v1';
const armazem = (() => {
  try {
    const t = '__t__';
    localStorage.setItem(t, '1'); localStorage.removeItem(t);
    return {
      ok: true,
      ler: k => localStorage.getItem(k),
      gravar: (k, v) => localStorage.setItem(k, v)
    };
  } catch (e) {
    const mem = {};
    return { ok: false, ler: k => mem[k] ?? null, gravar: (k, v) => { mem[k] = v; } };
  }
})();

const estadoInicial = () => ({
  respostas: {},      // id -> {ultima, correta, tentativas, acertos, erros, ts}
  favoritos: [],
  historico: [],
  log: [],            // {t: timestamp, c: 0|1} — para o gráfico de evolução
  contador: 0
});

let S = (() => {
  try {
    const bruto = armazem.ler(CHAVE);
    if (!bruto) return estadoInicial();
    return Object.assign(estadoInicial(), JSON.parse(bruto));
  } catch (e) { return estadoInicial(); }
})();

let salvarPendente = null;
function salvar() {
  clearTimeout(salvarPendente);
  salvarPendente = setTimeout(() => {
    try { armazem.gravar(CHAVE, JSON.stringify(S)); } catch (e) { /* cota cheia */ }
  }, 120);
}

/* ---------------- registro de respostas ---------------- */
function registrar(id, letra) {
  const q = MAPA_Q[id];
  const acertou = letra === q.resposta_correta;
  const r = S.respostas[id] || { tentativas: 0, acertos: 0, erros: 0 };
  r.tentativas++;
  acertou ? r.acertos++ : r.erros++;
  r.ultima = letra;
  r.correta = acertou;
  r.ts = Date.now();
  S.respostas[id] = r;
  S.log.push({ t: Date.now(), c: acertou ? 1 : 0 });
  if (S.log.length > 3000) S.log = S.log.slice(-3000);
  salvar();
  return acertou;
}

function alternarFavorito(id) {
  const i = S.favoritos.indexOf(id);
  if (i >= 0) S.favoritos.splice(i, 1); else S.favoritos.push(id);
  salvar();
  return i < 0;
}
const ehFavorito = id => S.favoritos.includes(id);

/* ---------------- estatísticas ---------------- */
function pct(a, b) { return b > 0 ? Math.round((a / b) * 100) : 0; }

function statsGerais() {
  let tentativas = 0, acertos = 0, erros = 0;
  Object.values(S.respostas).forEach(r => {
    tentativas += r.tentativas; acertos += r.acertos; erros += r.erros;
  });
  const unicas = Object.keys(S.respostas).length;
  return {
    tentativas, acertos, erros, unicas,
    naoRespondidas: TOTAL_Q - unicas,
    taxaAcerto: pct(acertos, tentativas),
    taxaErro: pct(erros, tentativas),
    cobertura: pct(unicas, TOTAL_Q),
    simulados: S.historico.length
  };
}

function statsMateria(nome) {
  const mat = MATERIAS.find(m => m.nome === nome);
  let tentativas = 0, acertos = 0, erros = 0, unicas = 0;
  mat.ids.forEach(id => {
    const r = S.respostas[id];
    if (!r) return;
    unicas++; tentativas += r.tentativas; acertos += r.acertos; erros += r.erros;
  });
  return {
    nome, total: mat.total, blocos: mat.blocos,
    unicas, naoRespondidas: mat.total - unicas,
    tentativas, acertos, erros,
    taxaAcerto: pct(acertos, tentativas),
    taxaErro: pct(erros, tentativas),
    cobertura: pct(unicas, mat.total)
  };
}

const todasStatsMaterias = () => MATERIAS.map(m => statsMateria(m.nome));

/* faixas de desempenho */
function nivel(taxa, tentativas) {
  if (!tentativas) return { i: -1, rot: 'Sem dados', cls: 'lv-x', ico: '·' };
  if (taxa >= 90) return { i: 3, rot: 'Excelente', cls: 'lv-3', ico: '🏆' };
  if (taxa >= 80) return { i: 2, rot: 'Bom desempenho', cls: 'lv-2', ico: '🟢' };
  if (taxa >= 60) return { i: 1, rot: 'Em desenvolvimento', cls: 'lv-1', ico: '🟡' };
  return { i: 0, rot: 'Precisa melhorar', cls: 'lv-0', ico: '🔴' };
}

/* questões erradas: erradas ao menos uma vez */
function idsErradas() {
  return Object.keys(S.respostas)
    .filter(id => S.respostas[id].erros > 0)
    .map(Number)
    .sort((a, b) => S.respostas[b].ts - S.respostas[a].ts);
}

/* ---------------- seleção de questões ---------------- */
function embaralhar(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function selecionar({ materias, quantidade, ordem, filtro }) {
  let ids = BANCO
    .filter(q => !materias || materias.length === 0 || materias.includes(q.materia))
    .map(q => q.id);
  if (filtro === 'novas') ids = ids.filter(id => !S.respostas[id]);
  if (filtro === 'erradas') ids = ids.filter(id => S.respostas[id] && S.respostas[id].erros > 0);
  if (filtro === 'favoritas') ids = ids.filter(id => ehFavorito(id));
  if (ordem === 'aleatoria') ids = embaralhar(ids);
  else ids = ids.sort((a, b) => a - b);
  if (quantidade) ids = ids.slice(0, quantidade);
  return ids;
}

/* ---------------- formatação ---------------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function dataBR(ts) {
  const d = new Date(ts);
  const p = n => String(n).padStart(2, '0');
  return `${p(d.getDate())}/${p(d.getMonth() + 1)}/${d.getFullYear()} às ${p(d.getHours())}:${p(d.getMinutes())}`;
}
const diaBR = ts => {
  const d = new Date(ts); const p = n => String(n).padStart(2, '0');
  return `${p(d.getDate())}/${p(d.getMonth() + 1)}`;
};

/* ============================================================
   Ícones e gráficos (SVG inline, sem dependências externas)
   ============================================================ */
const ICO = {
  inicio: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9.5 21v-6h5v6"/></svg>',
  questoes: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h11l5 5v11H4z"/><path d="M15 4v5h5"/><path d="M8.5 13h7M8.5 16.5h4.5"/></svg>',
  simulado: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 13V9"/><path d="M9 2h6"/></svg>',
  desempenho: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  erradas: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m9 9 6 6M15 9l-6 6"/></svg>',

/* ---------------- gráficos ---------------- */
function barrasMaterias(dados) {
  const linhas = dados.filter(d => d.tentativas > 0);
  if (!linhas.length) return '<p class="muted" style="font-size:13.5px;margin:0">Responda algumas questões para ver o gráfico por matéria.</p>';
  const alturaLinha = 30, larg = 640, esqPad = 176, dirPad = 46;
  const h = linhas.length * alturaLinha + 26;
  const larguraUtil = larg - esqPad - dirPad;
  let svg = `<svg class="chart" viewBox="0 0 ${larg} ${h}" role="img" aria-label="Aproveitamento por matéria">`;
  [0, 25, 50, 75, 100].forEach(g => {
    const x = esqPad + (g / 100) * larguraUtil;
    svg += `<line class="gridline" x1="${x}" y1="4" x2="${x}" y2="${h - 20}"/>`;
    svg += `<text class="lbl-sm" x="${x}" y="${h - 6}" text-anchor="middle">${g}%</text>`;
  });
  linhas.forEach((d, i) => {
    const y = 8 + i * alturaLinha;
    const w = (d.taxaAcerto / 100) * larguraUtil;
    const nv = nivel(d.taxaAcerto, d.tentativas);
    const cor = nv.i >= 2 ? 'var(--brand)' : nv.i === 1 ? 'var(--amber)' : 'var(--wrong)';
    const nome = d.nome.length > 26 ? d.nome.slice(0, 25) + '…' : d.nome;
    svg += `<text class="lbl-val" x="${esqPad - 10}" y="${y + 14}" text-anchor="end">${esc(nome)}</text>`;
    svg += `<rect x="${esqPad}" y="${y + 4}" width="${larguraUtil}" height="13" rx="6.5" fill="var(--line-2)"/>`;
    svg += `<rect x="${esqPad}" y="${y + 4}" width="${Math.max(w, 2)}" height="13" rx="6.5" fill="${cor}"/>`;
    svg += `<text class="lbl-val" x="${esqPad + larguraUtil + 8}" y="${y + 14.5}">${d.taxaAcerto}%</text>`;
  });
  return svg + '</svg>';
}

function rosca(percentual, tamanho = 132) {
  const r = tamanho / 2 - 13, c = 2 * Math.PI * r, meio = tamanho / 2;
  const cor = percentual >= 80 ? 'var(--brand)' : percentual >= 60 ? 'var(--amber)' : 'var(--wrong)';
  return `<svg class="chart donut" viewBox="0 0 ${tamanho} ${tamanho}" width="${tamanho}" height="${tamanho}" role="img" aria-label="Aproveitamento ${percentual}%">
    <circle cx="${meio}" cy="${meio}" r="${r}" fill="none" stroke="var(--line-2)" stroke-width="13"/>
    <circle cx="${meio}" cy="${meio}" r="${r}" fill="none" stroke="${cor}" stroke-width="13"
      stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - percentual / 100)}"
      transform="rotate(-90 ${meio} ${meio})"/>
    <text x="${meio}" y="${meio + 2}" text-anchor="middle" font-size="27" font-weight="700"
      font-family="var(--ff-ui)" fill="var(--ink)" style="font-variant-numeric:tabular-nums">${percentual}%</text>
    <text x="${meio}" y="${meio + 20}" text-anchor="middle" font-size="10" font-weight="700"
      letter-spacing="1.6" font-family="var(--ff-ui)" fill="var(--ink-3)">ACERTOS</text>
  </svg>`;
}

/* evolução: taxa de acerto acumulada em janelas de 20 respostas */
function linhaEvolucao(log) {
  if (log.length < 5) return '<p class="muted" style="font-size:13.5px;margin:0">A curva de evolução aparece a partir de 5 respostas registradas.</p>';
  const janela = Math.max(10, Math.round(log.length / 12));
  const pontos = [];
  for (let i = janela; i <= log.length; i += Math.max(1, Math.round(janela / 2))) {
    const fatia = log.slice(Math.max(0, i - janela), i);
    pontos.push({ x: i, y: Math.round(fatia.reduce((s, r) => s + r.c, 0) / fatia.length * 100) });
  }
  if (pontos[pontos.length - 1].x !== log.length) {
    const fatia = log.slice(-janela);
    pontos.push({ x: log.length, y: Math.round(fatia.reduce((s, r) => s + r.c, 0) / fatia.length * 100) });
  }
  const larg = 640, alt = 190, pl = 34, pr = 12, pt = 12, pb = 26;
  const ux = larg - pl - pr, uy = alt - pt - pb;
  const maxX = pontos[pontos.length - 1].x || 1;
  const px = p => pl + (p.x / maxX) * ux;
  const py = p => pt + uy - (p.y / 100) * uy;
  let d = pontos.map((p, i) => `${i ? 'L' : 'M'}${px(p).toFixed(1)} ${py(p).toFixed(1)}`).join(' ');
  const area = `${d} L${px(pontos[pontos.length - 1]).toFixed(1)} ${pt + uy} L${px(pontos[0]).toFixed(1)} ${pt + uy} Z`;
  let svg = `<svg class="chart" viewBox="0 0 ${larg} ${alt}" role="img" aria-label="Evolução do aproveitamento">`;
  [0, 25, 50, 75, 100].forEach(g => {
    const y = pt + uy - (g / 100) * uy;
    svg += `<line class="gridline" x1="${pl}" y1="${y}" x2="${larg - pr}" y2="${y}"/>`;
    svg += `<text class="lbl-sm" x="${pl - 7}" y="${y + 3.5}" text-anchor="end">${g}</text>`;
  });
  svg += `<path d="${area}" fill="var(--brand-soft)" opacity=".75"/>`;
  svg += `<path d="${d}" fill="none" stroke="var(--brand)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>`;
  pontos.forEach(p => { svg += `<circle cx="${px(p).toFixed(1)}" cy="${py(p).toFixed(1)}" r="2.6" fill="var(--brand-dark)"/>`; });
  svg += `<text class="lbl-sm" x="${pl}" y="${alt - 7}">resposta 1</text>`;
  svg += `<text class="lbl-sm" x="${larg - pr}" y="${alt - 7}" text-anchor="end">resposta ${maxX}</text>`;
  return svg + '</svg>';
}

/* barras verticais: acertos x erros por matéria */
function colunasAcertoErro(dados) {
  const linhas = dados.filter(d => d.tentativas > 0);
  if (!linhas.length) return '<p class="muted" style="font-size:13.5px;margin:0">Nenhuma resposta registrada ainda.</p>';
  const larg = 640, alt = 210, pl = 30, pr = 10, pt = 12, pb = 54;
  const uy = alt - pt - pb, ux = larg - pl - pr;
  const passo = ux / linhas.length;
  const larguraBarra = Math.min(26, passo * 0.34);
  const maxV = Math.max(...linhas.map(d => Math.max(d.acertos, d.erros)), 1);
  let svg = `<svg class="chart" viewBox="0 0 ${larg} ${alt}" role="img" aria-label="Acertos e erros por matéria">`;
  [0, 0.5, 1].forEach(f => {
    const y = pt + uy - f * uy;
    svg += `<line class="gridline" x1="${pl}" y1="${y}" x2="${larg - pr}" y2="${y}"/>`;
    svg += `<text class="lbl-sm" x="${pl - 6}" y="${y + 3.5}" text-anchor="end">${Math.round(maxV * f)}</text>`;
  });
  linhas.forEach((d, i) => {
    const cx = pl + passo * i + passo / 2;
    const ha = (d.acertos / maxV) * uy, he = (d.erros / maxV) * uy;
    svg += `<rect x="${cx - larguraBarra - 2}" y="${pt + uy - ha}" width="${larguraBarra}" height="${Math.max(ha, 1)}" rx="3" fill="var(--brand)"/>`;
    svg += `<rect x="${cx + 2}" y="${pt + uy - he}" width="${larguraBarra}" height="${Math.max(he, 1)}" rx="3" fill="var(--wrong)"/>`;
    const partes = d.nome.split(' ');
    const curto = partes.length > 1 ? partes[0].slice(0, 9) + (partes[1] ? ' ' + partes[1].slice(0, 7) : '') : d.nome.slice(0, 11);
    svg += `<text class="lbl-sm" transform="translate(${cx} ${pt + uy + 11}) rotate(28)" text-anchor="start">${esc(curto)}</text>`;
  });
  return svg + '</svg>';
}

        </div>

          <button class="chip ${cfgSim.materias.length === 0 ? 'on' : ''}" data-simmat="__todas__">Todas as matérias</button>
          ${mats.map(m => `<button class="chip ${cfgSim.materias.includes(m.nome) ? 'on' : ''}" data-simmat="${esc(m.nome)}">${esc(m.nome)}<small>${m.total}</small></button>`).join('')}
        </div>

        </div>

      <div class="field" style="margin-bottom:0">
        <label>Filtro adicional</label>
        <div class="chips">
          ${[['todas', 'Todas'], ['novas', 'Só inéditas para mim'], ['erradas', 'Só as que errei'], ['favoritas', 'Só favoritas']]

    <div class="summary-bar" style="margin-top:18px">

      <button class="btn" data-acao="iniciar-simulado" ${qtdReal ? '' : 'disabled'}>Iniciar simulado ${ICO.seta}</button>

/* ============================================================
   4. DESEMPENHO
   ============================================================ */
function vistaDesempenho() {
  const g = statsGerais();
  const todas = todasStatsMaterias();
  const comDados = todas.filter(m => m.tentativas > 0).sort((a, b) => b.taxaAcerto - a.taxaAcerto);
  const semDados = todas.filter(m => m.tentativas === 0);

  if (!comDados.length) return `<div class="view">
    <p class="eyebrow">Análise</p><h1>Meu desempenho</h1>
    ${vazio('📊', 'Ainda não há dados', 'Responda pelo menos uma questão para que a análise por matéria seja calculada.', 'questoes', 'Ir para as questões')}</div>`;

  const tabela = (linhas, chaveTaxa, rotuloTaxa) => `
    <div class="card card-pad" style="overflow-x:auto">
      <table class="tbl">
        <thead><tr><th>Matéria</th><th class="num">Respostas</th><th class="num">Acertos</th><th class="num">Erros</th><th class="num">${rotuloTaxa}</th><th>Faixa</th></tr></thead>
        <tbody>${linhas.map(m => {
          const nv = nivel(m.taxaAcerto, m.tentativas);
          return `<tr><td class="nome">${esc(m.nome)}<div class="muted" style="font-weight:400;font-size:11.5px">${m.unicas} de ${m.total} questões vistas</div></td>
            <td class="num">${m.tentativas}</td><td class="num" style="color:var(--brand)">${m.acertos}</td>
            <td class="num" style="color:var(--wrong)">${m.erros}</td>
            <td class="num"><b>${m[chaveTaxa]}%</b></td>
            <td><span class="lv ${nv.cls}">${nv.rot}</span></td></tr>`;
        }).join('')}</tbody>
      </table>
    </div>`;

  const recomendacoes = comDados.map(m => {
    const nv = nivel(m.taxaAcerto, m.tentativas);
    const txt = nv.i === 3 ? `Excelente. Seu aproveitamento em <b>${esc(m.nome)}</b> é de <b>${m.taxaAcerto}%</b>. Mantenha o ritmo com revisões espaçadas.`
      : nv.i === 2 ? `Bom desempenho em <b>${esc(m.nome)}</b>: <b>${m.taxaAcerto}%</b>. Faltam ${m.naoRespondidas} questões da matéria para você fechar o ciclo.`
      : nv.i === 1 ? `<b>${esc(m.nome)}</b> está em <b>${m.taxaAcerto}%</b>. Vale resolver mais questões e reler os comentários das que você errou.`
      : `Atenção: você tem apenas <b>${m.taxaAcerto}%</b> de aproveitamento em <b>${esc(m.nome)}</b>. Recomendamos priorizar essa matéria nos próximos estudos.`;
    return `<div class="rec r${nv.i}"><span class="rec-i">${nv.ico}</span><div><p>${txt}</p>
      <button class="btn btn-sm btn-ghost" style="margin-top:9px" data-treinar="${esc(m.nome)}">Treinar agora</button></div></div>`;
  }).join('');

  return `
  <div class="view">
    <p class="eyebrow">Análise</p>
    <h1>Meu desempenho</h1>
    <p class="lead">Taxa de acerto = acertos ÷ respostas registradas × 100. Questões não respondidas ficam de fora do cálculo.</p>

    <div class="card card-pad section">
      <div class="score">
        ${rosca(g.taxaAcerto)}
        <div class="score-nums">
          <div><span>Respostas</span><b class="tnum">${g.tentativas}</b></div>
          <div><span>Acertos</span><b class="tnum v-ok">${g.acertos}</b></div>
          <div><span>Erros</span><b class="tnum v-bad">${g.erros}</b></div>
          <div><span>Taxa de erro</span><b class="tnum">${g.taxaErro}%</b></div>
          <div><span>Questões vistas</span><b class="tnum">${g.unicas}<span style="font-size:14px;color:var(--ink-3)">/${TOTAL_Q}</span></b></div>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-head"><div><h2>Aproveitamento por matéria</h2></div></div>
      <div class="card card-pad chart-wrap">${barrasMaterias(comDados)}</div>
    </div>

    <div class="section">
      <div class="section-head"><div><h2>🟢 Maior taxa de acerto</h2><p class="lead">Da melhor para a pior.</p></div></div>
      ${tabela(comDados, 'taxaAcerto', 'Aproveitamento')}
    </div>

    <div class="section">
      <div class="section-head"><div><h2>🔴 Maior taxa de erro</h2><p class="lead">Comece por aqui na próxima sessão.</p></div></div>
      ${tabela(comDados.slice().sort((a, b) => b.taxaErro - a.taxaErro), 'taxaErro', 'Taxa de erro')}
    </div>

    <div class="section">
      <div class="section-head"><div><h2>Acertos × erros</h2></div></div>
      <div class="card card-pad chart-wrap">${colunasAcertoErro(comDados)}
        <div class="legend"><span><i style="background:var(--brand)"></i>Acertos</span><span><i style="background:var(--wrong)"></i>Erros</span></div>
      </div>
    </div>

    <div class="section">
      <div class="section-head"><div><h2>Recomendações de estudo</h2></div></div>
      <div class="grid" style="gap:9px">${recomendacoes}</div>
    </div>

    ${semDados.length ? `
    <div class="section">
      <div class="section-head"><div><h2>Ainda sem dados</h2><p class="lead">Matérias que você não respondeu nenhuma vez.</p></div></div>
      <div class="chips">${semDados.map(m => `<button class="chip" data-treinar="${esc(m.nome)}">${esc(m.nome)}<small>${m.total}</small></button>`).join('')}</div>
    </div>` : ''}
  </div>`;
}

/* ============================================================
   5. ERRADAS
   ============================================================ */
function vistaErradas() {
  let ids = idsErradas();
  const materiasComErro = [...new Set(ids.map(id => MAPA_Q[id].materia))];
  if (filtroErradas !== 'todas') ids = ids.filter(id => MAPA_Q[id].materia === filtroErradas);

  if (!idsErradas().length) return `<div class="view">
    <p class="eyebrow">Recuperação</p><h1>Questões que errei</h1>
    ${vazio('🎯', 'Nenhum erro registrado', 'Assim que você errar uma questão ela aparece aqui, com o comentário e o número de vezes que caiu no mesmo ponto.', 'questoes', 'Responder questões')}</div>`;

  const pendentes = ids.filter(id => !S.respostas[id].correta).length;
  return `
  <div class="view">
    <p class="eyebrow">Recuperação</p>
    <h1>Questões que errei</h1>
    <p class="lead">${idsErradas().length} questão(ões) já foram erradas pelo menos uma vez. ${pendentes} ainda está(ão) errada(s) na última tentativa.</p>

      <button class="btn" data-acao="revisar-erradas">Revisar questões erradas ${ICO.seta}</button>

    <div class="section">
      <div class="chips" style="margin-bottom:13px">
        <button class="chip ${filtroErradas === 'todas' ? 'on' : ''}" data-filtroerr="todas">Todas<small>${idsErradas().length}</small></button>
        ${materiasComErro.map(m => `<button class="chip ${filtroErradas === m ? 'on' : ''}" data-filtroerr="${esc(m)}">${esc(m)}<small>${idsErradas().filter(i => MAPA_Q[i].materia === m).length}</small></button>`).join('')}

  return `
  <div class="view">
    <p class="eyebrow">Salvas</p>
    <h1>Questões favoritas</h1>
    <p class="lead">${S.favoritos.length} questão(ões) marcadas com estrela.</p>

    <div class="summary-bar" style="position:static;margin-top:18px">
      <div class="sb-txt">Monte uma sessão só com o que você separou.</div>

    </div>

    <div class="section">
      <div class="chips" style="margin-bottom:13px">
        <button class="chip ${filtroFavoritas === 'todas' ? 'on' : ''}" data-filtrofav="todas">Todas<small>${S.favoritos.length}</small></button>
        ${mats.map(m => `<button class="chip ${filtroFavoritas === m ? 'on' : ''}" data-filtrofav="${esc(m)}">${esc(m)}<small>${S.favoritos.filter(i => MAPA_Q[i].materia === m).length}</small></button>`).join('')}
      </div>
