ilitar e Polícia Penal) subordinam-se diretamente ao:","alternativas":{"A":"Presidente do Tribunal de Justiça do Estado.","B":"Procurador-Geral de Justiça do Ministério Público.","C":"Governador do Estado.","D":"Superintendente Regional da Polícia Federal.","E":"Presidente da Assembleia Legislativa."},"resposta_correta":"C","comentario":"De acordo com a arquitetura do pacto federativo e o artigo 144, § 6º, da CF/88, as forças policiais da estrutura central do Estado (incluindo a Polícia Penal) subordinam-se diretamente ao Chefe do Executivo estadual, o Governador."},{"id":188,"numero":188,"bloco":2,"materia":"Direito Constitucional","texto_base":null,"enunciado":"Os cargos em comissão e as funções de confiança constituem instrumentos de preenchimento de vagas na estrutura da Administração Pública voltados a atender funções de liderança técnica. Nos termos do artigo 37, inciso V, da CF/88, as funções de confiança e os cargos em comissão destinam-se apenas às atribuições de:","alternativas":{"A":"execução operacional mecânica, vigilância patrimonial e portaria burocrática.","B":"direção, chefia e assessoramento.","C":"investigação criminal de campo, perícia técnica e inteligência aérea.","D":"intermediação sindical, auditoria contábil externa e trânsito rodoviário.","E":"assessoria jurídica privada e representação diplomática internacional."},"resposta_correta":"B","comentario":"É a redação expressa do artigo 37, inciso V, da Constituição Federal de 1988. As funções de confiança (exclusivas de servidores efetivos) e os cargos em comissão destinam-se exclusivamente às atribuições de direção, chefia e assessoramento."},{"id":189,"numero":189,"bloco":2,"materia":"Direito Constitucional","texto_base":null,"enunciado":"A autonomia financeira e orçamentária dos entes federativos submete- se às balizas fixadas pela Constituição Federal. Dentre as vedações expressas relativas à remuneração dos servidores públicos, o artigo 37, inciso XIII, estabelece textualmente que:","alternativas":{"A":"é permitida a vinculação ou equiparação de quaisquer espécies remuneratórias para o efeito de pessoal do serviço público.","B":"é vedada a vinculação ou equiparação de quaisquer espécies remuneratórias para o efeito de pessoal do serviço público.","C":"os policiais penais terão seus subsídios reajustados de forma automática sempre que houver aumento do salário mínimo federal.","D":"o teto remuneratório dos policiais militares estaduais vincula-se ao subsídio dos senadores da República.","E":"permite-se o pagamento de gratificações extraordinárias por produtividade sem previsão em lei ordinária."},"resposta_correta":"B","comentario":"O artigo 37, inciso XIII, da Carta Magna proíbe terminantemente a vinculação ou a equiparação de quaisquer espécies remuneratórias para o efeito de pessoal do serviço público, visando evitar aumentos salariais em cascata automática sem lei."},{"id":190,"numero":190,"bloco":2,"materia":"Direito Constitucional","texto_base":null,"enunciado":"Considere a seguinte situação hipotética: Durante a tramitação de uma PEC (Proposta de Emenda à Constituição) na Assembleia Legislativa do Rio Grande do Norte, um grupo de deputados estaduais apresenta um texto que visa extinguir a Polícia Penal estadual e transferir suas atribuições de vigilância penitenciária para uma empresa privada terceirizada. Diante do panorama constitucional inaugurado pela Emenda Constitucional nº 104/2019 no artigo 144, a proposta dos parlamentares é inconstitucional, pois a Polícia Penal qualifica- se como:","alternativas":{"A":"órgão facultativo municipal cuja existência depende de leis orgânicas locais.","B":"instituição permanente de segurança pública do Estado, de preenchimento exclusivo por concurso público.","C":"ramificação auxiliar das forças armadas de defesa nacional exterior.","D":"autarquia financeira autônoma de livre dissolução pelo chefe do executivo.","E":"comissão temporária de fiscalização administrativa sem poder de polícia armada."},"resposta_correta":"B","comentario":"Com a promulgação da EC nº 104/2019, a Polícia Penal foi alçada ao status de órgão permanente de segurança pública, dotada de competências típicas e exclusivas de Estado, o que impede juridicamente sua extinção ou privatização para empresas terceirizadas."},{"id":191,"numero":191,"bloco":2,"materia":"Direito Constitucional","texto_base":null,"enunciado":"A criação de autarquias e a autorização para a instituição de empresas públicas, sociedades de economia mista e fundações submetem-se ao Princípio da Reserva Legal. De acordo com o artigo 37, inciso XIX, da Constituição Federal de 1988:","alternativas":{"A":"somente por lei específica poderá ser criada autarquia e autorizada a instituição de empresa pública, de sociedade de economia mista e de fundação.","B":"o Governador do Estado pode criar empresas públicas por meio de decreto autônomo extraordinário.","C":"as fundações públicas prescindem de lei complementar para definir suas áreas de atuação técnica.","D":"as sociedades de economia mista estaduais serão criadas de forma automática por portaria fazendária.","E":"admite-se a criação de autarquias penitenciárias por meio de resolução do Conselho da Comunidade."},"resposta_correta":"A","comentario":"É a aplicação literal do artigo 37, inciso XIX, da CF/88. A criação de autarquias exige lei específica (outorga legal), enquanto a instituição de empresas públicas, sociedades de economia mista e fundações depende de autorização legal."},{"id":192,"numero":192,"bloco":2,"materia":"Direito Constitucional","texto_base":null,"enunciado":"O teto remuneratório da Administração Pública constitui barreira moral e fiscal limitadora dos subsídios e vencimentos dos agentes públicos. Nos termos do artigo 37, inciso XI, da Constituição Federal de 1988, a remuneração e o subsídio dos ocupantes de cargos, funções e empregos públicos na administração direta dos Estados não poderão exceder o subsídio mensal, no âmbito do Poder Executivo, do:","alternativas":{"A":"Presidente da República.","B":"Governador do Estado.","C":"Deputado Estadual mais votado.","D":"Procurador-Geral de Justiça do Ministério Público.","E":"Desembargador do Tribunal de Justiça."},"resposta_correta":"B","comentario":"Nos termos do artigo 37, inciso XI, da Constituição Federal, o subteto remuneratório dos servidores do Poder Executivo estadual é o subsídio mensal do Governador do Estado."},{"id":193,"numero":193,"bloco":2,"materia":"Direito Constitucional","texto_base":null,"enunciado":"A publicidade dos atos administrativos sofre modulação constitucional para garantir a moralidade e a eficiência das contratações do Estado. O artigo 37, inciso XXI, da CF/88 estabelece que, ressalvados os casos especificados na legislação, as obras, serviços, compras e alienações serão contratados mediante processo de licitação pública que assegure igualdade de condições a todos os concorrentes, o qual somente permitirá as exigências de qualificação técnica e econômica essenciais para a:","alternativas":{"A":"maximização do lucro financeiro das empresas transnacionais concorrentes.","B":"garantia do cumprimento das obrigações.","C":"exclusão de microempresas locais do certame licitatório estadual.","D":"satisfação dos interesses pessoais dos membros da comissão de contratação.","E":"comprovação de filiação partidária ativa dos diretores da empresa."},"resposta_correta":"B","comentario":"Conforme o artigo 37, inciso XXI, da Constituição Federal, os procedimentos licitatórios só podem exigir critérios de qualificação técnica e econômica que sejam estritamente essenciais para garantir o cumprimento das obrigações contratuais pactuadas com o Estado."},{"id":194,"numero":194,"bloco":2,"materia":"Direito Constitucional","texto_base":null,"enunciado":"O direito à livre associação sindical é garantido ao servidor público civil pelo artigo 37, inciso VI, da Constituição Federal. No que concerne à abrangência desse direito e à sua aplicação prática no plano estatutário, o mandamento constitucional preceitua que:","alternativas":{"A":"é garantido ao servidor público civil o direito à livre associação sindical.","B":"a associação sindical dos servidores públicos depende de autorização prévia por escrito do Governador.","C":"o servidor público civil em estágio probatório é proibido de se filiar a sindicatos de classe.","D":"os sindicatos de servidores públicos possuem competência para fixar o valor dos tributos estaduais.","E":"exige-se que a entidade sindical esteja em funcionamento há pelo menos vinte anos na comarca."},"resposta_correta":"A","comentario":"O artigo 37, inciso VI, da Constituição Federal garante ao servidor público civil o direito à livre associação sindical, submetendo-se às regras gerais de organização e registro sindical do país."},{"id":195,"numero":195,"bloco":2,"materia":"Direito Constitucional","texto_base":null,"enunciado":"Considere a seguinte situação hipotética: O Diretor de uma cadeia pública potiguar, insatisfeito com a publicação de matérias jornalísticas críticas sobre a infraestrutura da unidade, edita uma portaria interna proibindo terminantemente a entrada de qualquer cidadão portando a certidão de atos públicos obtida por direito de petição na repartição. À luz do artigo 5º, inciso XXXIII, da CF/88, todos têm direito a receber dos órgãos públicos informações de seu interesse particular, ou de interesse coletivo ou geral, que serão prestadas no prazo da lei, sob pena de responsabilidade, ressalvadas aquelas cujo sigilo seja imprescindível à:","alternativas":{"A":"segurança da sociedade e do Estado.","B":"manutenção do prestígio político do Diretor da unidade prisional.","C":"proteção de interesses comerciais de empresas de vigilância terceirizada.","D":"ocultação de erros burocráticos cometidos pela comissão de licitação.","E":"preservação da imagem institucional do Governador do Estado nas mídias."},"resposta_correta":"A","comentario":"É a redação expressa do artigo 5º, inciso XXXIII, da CF/88. O acesso a informações públicas é a regra democrática, admitindo-se o sigilo unicamente quando a informação for imprescindível para a segurança da sociedade e do Estado."},{"id":196,"numero":196,"bloco":2,"materia":"Direito Constitucional","texto_base":null,"enunciado":"Dentre as vedações que limitam a publicidade oficial dos atos administrativos, o artigo 37, § 1º, da Constituição Federal impõe um freio moralizador impessoal de extrema importância. De acordo com o texto da Carta Magna, a publicidade dos atos, programas, obras, serviços e campanhas dos órgãos públicos deverá ter caráter educativo, informativo ou de orientação social, dela não podendo constar:","alternativas":{"A":"o valor total dos recursos financeiros públicos empregados na obra.","B":"a indicação dos prazos previstos para a conclusão e entrega do serviço à comunidade.","C":"nomes, símbolos ou imagens que caracterizem promoção pessoal de autoridades ou servidores públicos.","D":"as justificativas técnicas que motivaram a dispensa do certame licitatório ordinário.","E":"os nomes dos engenheiros e arquitetos responsáveis pela execução da estrutura física."},"resposta_correta":"C","comentario":"O artigo 37, § 1º, consagra o Princípio da Impessoalidade na publicidade institucional, proibindo terminantemente que constem nomes, símbolos ou imagens que caracterizem promoção pessoal de autoridades ou partidos políticos com dinheiro público."},{"id":197,"numero":197,"bloco":2,"materia":"Direito Constitucional","texto_base":null,"enunciado":"O artigo 144, § 6º, da Constituição Federal de 1988 fixa a natureza jurídica e a subordinação estrutural de determinadas forças de segurança locais. Nos termos expressos do dispositivo constitucional, as polícias militares e os corpos de bombeiros militares são considerados:","alternativas":{"A":"forças reservas e auxiliares do Exército.","B":"ramificações autônomas da Polícia Federal de fronteiras.","C":"comissões administrativas temporárias de segurança civil municipal.","D":"órgãos de fiscalização alfandegária e repressão tributária integrada.","E":"corporações de soberania jurídica internacional subordinadas à ONU."},"resposta_correta":"A","comentario":"Nos termos do artigo 144, § 6º, da Constituição Federal de 1988, as polícias militares e os corpos de bombeiros militares estaduais qualificam-se legalmente como forças reservas e auxiliares do Exército Brasileiro."},{"id":198,"numero":198,"bloco":2,"materia":"Direito Constitucional","texto_base":null,"enunciado":"O direito de acesso a cargos públicos é garantido aos brasileiros que preencham os requisitos estabelecidos em lei. No que concerns aos cidadãos estrangeiros, a redação do artigo 37, inciso I, com as alterações promovidas pelas reformas constitucionais, estabelece que os cargos, empregos e funções públicas são acessíveis:","alternativas":{"A":"aos estrangeiros, de forma ampla e irrestrita, independentemente de requisitos legais.","B":"aos estrangeiros, na forma da lei.","C":"unicamente se o estrangeiro comprovar casamento civil com cônjuge brasileiro nato.","D":"aos estrangeiros apenas para o exercício de mandatos políticos eletivos majoritários.","E":"terminantemente proibidos a estrangeiros em toda e qualquer modalidade de preenchimento."},"resposta_correta":"B","comentario":"É a redação do artigo 37, inciso I, da CF/88. Os cargos públicos são acessíveis aos brasileiros que preencham os requisitos da lei e aos estrangeiros, na forma que a lei ordinária (estatuto) fixar."},{"id":199,"numero":199,"bloco":2,"materia":"Direito Constitucional","texto_base":null,"enunciado":"As contratações por tempo determinado para atender a necessidade temporária de excepcional interesse público constituem exceção à regra do concurso público ordinário. Nos termos do artigo 37, inciso IX, da Constituição Federal de 1988, a lei estabelecerá os casos de contratação por tempo determinado para atender a:","alternativas":{"A":"necessidade temporária de excepcional interesse público.","B":"flutuação de caixa financeiro decorrente de crises cambiais internacionais.","C":"substituição permanente de servidores públicos que entrem em greve tática armada.","D":"execução de obras de embelezamento estético de palácios governamentais litorâneos.","E":"realização de auditorias fiscais independentes em empresas privadas salineiras."},"resposta_correta":"A","comentario":"O artigo 37, inciso IX, positiva a contratação temporária temporária por excepcional interesse público como regime de exceção administrativa, exigindo tempo determinado e situação de emergência técnica."},{"id":200,"numero":200,"bloco":2,"materia":"Direito Constitucional","texto_base":null,"enunciado":"Considere a seguinte situação hipotética: Um cidadão comete uma infração de trânsito em uma via urbana do Rio Grande do Norte e é abordado por um corpo de segurança estruturado pelo município. O agente municipal aplica-lhe a multa e realiza a retenção do veículo, alegando que atua imbuído do poder de polícia da segurança pública municipal. À luz do artigo 144, § 8º, da Constituição Federal, as guardas municipais são destinadas à proteção dos bens, serviços e instalações dos Municípios, o que, consoante entendimento pacificado do STF, abrange o poder de polícia de trânsito. Portanto, as guardas municipais:","alternativas":{"A":"possuem competência constitucional para exercer a fiscalização de trânsito e aplicar sanções nas vias municipais.","B":"são proibidas de atuar no trânsito, competência que pertence exclusivamente à Polícia Federal.","C":"exercem funções privativas de polícia judiciária e apuração de crimes militares estaduais.","D":"possuem caráter vitalício e imunidade penal absoluta perante juízes singulares criminais.","E":"respondem diretamente ao comando do Ministério da Defesa do Governo Federal."},"resposta_correta":"A","comentario":"O artigo 144, § 8º, define que as guardas municipais destinam-se à proteção de bens, serviços e instalações. O STF pacificou que a fiscalização e a aplicação de multas de trânsito integram os serviços municipais de mobilidade, convalidando a competência plena das guardas nessa seara."},{"id":201,"numero":201,"bloco":1,"materia":"Direito Administrativo","texto_base":null,"enunciado":"O Direito Administrativo brasileiro estrutura-se a partir de um conjunto de princípios e institutos dogmáticos que regulam a atividade funcional do Estado. Quanto às suas fontes e codificação, o Direito Administrativo qualifica-se como um ramo do direito:","alternativas":{"A":"privado e inteiramente codificado em um único diploma legal federal.","B":"público e não codificado, cujas fontes principais são a lei, a doutrina, a jurisprudência e os costumes.","C":"internacional, subordinado de forma cogente às resoluções burocráticas da ONU.","D":"difuso, que se confunde integralmente com as normas do Código de Defesa do Consumidor.","E":"consuetudinário puro, que rejeita a aplicação de leis escritas ou decretos do Executivo."},"resposta_correta":"B","comentario":"O Direito Administrativo integra o ramo do Direito Público e caracteriza-se por não ser codificado em um único texto legal (como ocorre com o Código Penal). Suas bases normativas são fragmentadas em diversas leis, decretos, construções doutrinárias e precedentes jurisprudenciais."},{"id":202,"numero":202,"bloco":1,"materia":"Direito Administrativo","texto_base":null,"enunciado":"O princípio da autotutela confere à Administração Pública a prerrogativa de exercer o controle sobre os seus próprios atos. Nos termos da jurisprudência sumulada do Supremo Tribunal Federal (Súmula 473), a Administração pode:","alternativas":{"A":"revogar os seus próprios atos por motivo de ilegalidade, independentemente de contraditório.","B":"anular os seus próprios atos, quando eivados de vícios que os tornam ilegais, ou revogá-los, por motivo de conveniência ou oportunidade.","C":"convalidar atos praticados com vício insanável de objeto mediante autorização verbal do Governador.","D":"suspender a vigência de leis complementares estaduais sempre que houver greve nas polícias.","E":"delegar o poder de polícia originário a empresas privadas terceirizadas de forma irrestrita."},"resposta_correta":"B","comentario":"É a transcrição exata da Súmula 473 do STF. O princípio da autotutela confere à Administração a capacidade de rever seus próprios atos sob duas vertentes: legalidade (anulação com efeitos retroativos) ou conveniência e oportunidade (revogação com efeitos para a frente)."},{"id":203,"numero":203,"bloco":1,"materia":"Direito Administrativo","texto_base":null,"enunciado":"Considere a seguinte situação hipotética: O Secretário de Administração Penitenciária do Rio Grande do Norte edita uma resolução disciplinar aplicando a penalidade de suspensão a um Policial Penal. No entanto, constata-se posteriormente que o servidor não cometeu a infração descrita e que os fatos narrados na portaria de instauração são completamente inexistentes. Diante dos requisitos de validade do Ato Administrativo, a ausência de correspondência entre a realidade prática e os fundamentos jurídicos do ato enseja a sua nulidade por vício de:","alternativas":{"A":"Competência.","B":"Forma.","C":"Finalidade.","D":"Motivo.","E":"Objeto."},"resposta_correta":"D","comentario":"O motivo consiste na situação de fato e de direito que autoriza ou determina a prática do ato administrativo. Se a situação de fato descrita (a infração do servidor) é falsa ou juridicamente inexistente, o ato é nulo por vício insanável de Motivo (aplicação da Teoria dos Motivos Determinantes)."},{"id":204,"numero":204,"bloco":1,"materia":"Direito Administrativo","texto_base":null,"enunciado":"Os atributos do ato administrativo qualificam as decisões estatais com prerrogativas de autoridade frente aos administrados. O atributo por meio do qual os atos administrativos se presumem editados em estrita conformidade com o ordenamento jurídico e com base em fatos verdadeiros até prova em contrário denomina-se:","alternativas":{"A":"Imperatividade.","B":"Presunção de Legitimidade e Veracidade.","C":"Autoexecutoriedade.","D":"Tipicidade penal mitigada.","E":"Discricionariedade sistêmica."},"resposta_correta":"B","comentario":"A presunção de legitimidade (consonância com a lei) e de veracidade (fatos alegados como verdadeiros) acompanha os atos administrativos desde sua edição, transferindo o ônus da prova de erro ou ilegalidade ao administrado que o contesta."},{"id":205,"numero":205,"bloco":1,"materia":"Direito Administrativo","texto_base":null,"enunciado":"No âmbito da organização administrativa, o Estado pode desempenhar suas atribuições por meio da Administração Direta ou outorgá-las a entidades da Administração Indireta. O processo técnico- jurídico de criação de uma entidade dotada de personalidade jurídica própria (como uma autarquia), mediante a transferência da titularidade e da execução de um serviço público, denomina-se:","alternativas":{"A":"Desconcentração.","B":"Descentralização.","C":"Centralização imediata.","D":"Avocação compulsória.","E":"Encampação unilateral."},"resposta_correta":"B","comentario":"A descentralização consiste na distribuição de competências estatais para outra pessoa jurídica, seja ela criada pelo próprio Estado (Administração Indireta) ou um particular (concessionário), implicando a quebra da hierarquia orgânica."},{"id":206,"numero":206,"bloco":1,"materia":"Direito Administrativo","texto_base":null,"enunciado":"O Poder de Polícia é a prerrogativa conferida à Administração Pública para restringir, frenar ou condicionar o exercício de direitos individuais e atividades privadas em benefício do interesse público. O ciclo de polícia divide-se em fases específicas, sendo pacífico na doutrina que a fase que não pode ser delegada a pessoas jurídicas de direito privado é a de:","alternativas":{"A":"Fiscalização de trânsito material.","B":"Consentimento de polícia operacional.","C":"Ordem de polícia (legislação/restrição originária).","D":"Aplicação mecânica de multas de trânsito padronizadas.","E":"Preparação logística de pátios de retenção."},"resposta_correta":"C","comentario":"O ciclo de polícia divide-se em: Ordem de Polícia, Consentimento, Fiscalização e Sanção. O STF pacificou que os atos que envolvem a fixação da restrição originária (Ordem de Polícia) e a aplicação da penalidade (Sanção coercitiva) são indelegáveis a particulares."},{"id":207,"numero":207,"bloco":1,"materia":"Direito Administrativo","texto_base":null,"enunciado":"Considere a seguinte situação hipotética: O Diretor de Segurança e Disciplina de um complexo carcerário potiguar expede uma ordem de serviço determinando que os Policiais Penais passem a realizar a contagem diária dos detentos três vezes por dia, fixando horários estritos para o procedimento interno. A edição desse ato administrativo, que visa organizar a rotina operacional e coordenar as atividades dos servidores subordinados no âmbito do presídio, decorre do exercício do Poder:","alternativas":{"A":"Regulamentar ou Normativo.","B":"Disciplinar.","C":"Hierárquico.","D":"Vinculado estrito.","E":"De Polícia judiciária."},"resposta_correta":"C","comentario":"O Poder Hierárquico fundamenta a relação de subordinação na Administração, facultando à autoridade superior emitir ordens, instruções e comandos para coordenar as rotinas operacionais e gerenciais de seus subordinados diretos."},{"id":208,"numero":208,"bloco":1,"materia":"Direito Administrativo","texto_base":null,"enunciado":"Os atos administrativos classificam-se a partir de sua margem de liberdade de escolha conferida pela lei ao agente público. O ato no qual a lei estabelece de antemão todos os aspectos da conduta, não deixando ao administrador qualquer margem de valoração quanto à conveniência e oportunidade do ato, classifica-se como:","alternativas":{"A":"Ato Discricionário.","B":"Ato Vinculado.","C":"Ato Complexo.","D":"Ato Composto.","E":"Ato Enunciativo."},"resposta_correta":"B","comentario":"O ato administrativo vinculado é aquele cujo regramento legal preestabelece de forma rígida todos os elementos e condições de emanação do ato, eliminando qualquer juízo de conveniência, oportunidade ou valoração subjetiva pelo administrador."},{"id":209,"numero":209,"bloco":1,"materia":"Direito Administrativo","texto_base":null,"enunciado":"A Lei nº 14.133/2021 (Nova Lei de Licitações e Contratos Administrativos) unificou o regime de contratações públicas no Brasil. Dentre as modalidades de licitação expressamente previstas no novo diploma legal, assinale a alternativa que apresenta uma modalidade criada ou mantida por essa lei.","alternativas":{"A":"Tomada de Preços.","B":"Convite.","C":"Diálogo Competitivo.","D":"RDC (Regime Diferenciado de Contratações).","E":"Pregão eletrônico internacional de seguros privados."},"resposta_correta":"C","comentario":"A Lei nº 14.133/2021 inovou no ordenamento ao criar a modalidade do Diálogo Competitivo (Art. 32), destinada a contratações que envolvam inovações tecnológicas ou soluções complexas, extinguindo o Convite e a Tomada de Preços."},{"id":210,"numero":210,"bloco":1,"materia":"Direito Administrativo","texto_base":null,"enunciado":"As sanções aplicadas aos servidores públicos decorrem do poder disciplinar da Administração e devem ser precedidas de regular processo. O ato por meio do qual a autoridade extingue um ato administrativo válido por motivos de conveniência e oportunidade, haja vista que ele se tornou inconveniente para o interesse público, denomina-se:","alternativas":{"A":"Anulação.","B":"Revogação.","C":"Cassação.","D":"Caducidade.","E":"Convalidação."},"resposta_correta":"B","comentario":"A revogação constitui o desfazimento de um ato administrativo perfeitamente válido e legítimo, operado de forma discricionária pela própria Administração, motivado por critérios de conveniência e oportunidade supervenientes."},{"id":211,"numero":211,"bloco":1,"materia":"Direito Administrativo","texto_base":null,"enunciado":"Considere a seguinte situação hipotética: Um Policial Penal estável do Rio Grande do Norte sofre um grave acidente automobilístico fora do horário de serviço, resultando em limitações físicas definitivas que o impedem de realizar as atividades de contenção física e vigilância armada nas muralhas. Submetido a inspeção por junta médica oficial do Estado, o servidor é considerado apto para o exercício de atribuições burocráticas e administrativas compatíveis com sua nova limitação. O provimento derivado do servidor em cargo de atribuições e responsabilidades compatíveis com a limitação que tenha sofrido em sua capacidade física ou mental verifica-se por meio do instituto da:","alternativas":{"A":"Recondução.","B":"Readaptação.","C":"Reintegração.","D":"Reversão.","E":"Reconvenção."},"resposta_correta":"B","comentario":"A readaptação constitui forma de provimento derivado pela qual o servidor estável é investido em cargo de atribuições compatíveis com a limitação física ou mental superveniente que tenha sofrido, atestada por junta médica oficial."},{"id":212,"numero":212,"bloco":1,"materia":"Direito Administrativo","texto_base":null,"enunciado":"Os bens públicos submetem-se a regimes jurídicos especiais que garantem sua proteção e destinação ao interesse coletivo. De acordo com a classificação doutrinária e legal dos bens públicos quanto à sua destinação, os edifícios de penitenciárias, cadeias públicas e quartéis de polícia classificam-se como:","alternativas":{"A":"Bens de uso comum do povo.","B":"Bens de uso especial.","C":"Bens dominicais ou dominiais.","D":"Bens semoventes residenciais.","E":"Bens públicos de uso compulsório individual."},"resposta_correta":"B","comentario":"Os bens públicos de uso especial são aqueles destinados especificamente à execução de serviços administrativos ou à prestação de serviços públicos pelo Estado, englobando edifícios de repartições, presídios, hospitais públicos e escolas estatais."},{"id":213,"numero":213,"bloco":1,"materia":"Direito Administrativo","texto_base":null,"enunciado":"O Poder Regulamentar (ou Normativo) confere aos Chefes do Poder Executivo a atribuição de expedir decretos e regulamentos para a fiel execução das leis. O decreto que, de forma excepcional e nos termos do artigo 84, inciso VI, da Constituição Federal, pode dispor sobre organização e funcionamento da administração quando não implicar aumento de despesa nem criação ou extinção de órgãos, denomina-se:","alternativas":{"A":"Decreto Regulamentar Executivo.","B":"Decreto Autônomo.","C":"Decreto de Urgência Extraordinária.","D":"Decreto de Intervenção Federal.","E":"Decreto de Delegação Legislativa."},"resposta_correta":"B","comentario":"O decreto autônomo (Art. 84, VI, da CF) qualifica-se como exceção ao poder regulamentar acessório, pois retira sua força diretiva diretamente do texto constitucional, permitindo ao Chefe do Executivo organizar a administração sem criar despesas ou novos órgãos."},{"id":214,"numero":214,"bloco":1,"materia":"Direito Administrativo","texto_base":null,"enunciado":"A centralização e a desconcentração são técnicas de distribuição de competências no âmbito do serviço público. A distribuição interna de competências que ocorre dentro de uma mesma pessoa jurídica, caracterizada pela criação de órgãos públicos destituídos de personalidade jurídica própria, configura o fenômeno da:","alternativas":{"A":"Descentralização por serviços.","B":"Desconcentração.","C":"Terceirização logística.","D":"Privatização orgânica.","E":"Avocação hierárquica."},"resposta_correta":"B","comentario":"A desconcentração constitui técnica eminentemente interna de distribuição de competências operacionais dentro dos domínios da própria pessoa jurídica, resultando na criação de órgãos públicos (unidades desprovidas de personalidade jurídica própria, como delegacias ou coordenadorias)."},{"id":215,"numero":215,"bloco":1,"materia":"Direito Administrativo","texto_base":null,"enunciado":"Considere a seguinte situação hipotética: Com o objetivo de modernizar o fornecimento de refeições para a população carcerária de uma cadeia pública, a Secretaria de Estado realiza um procedimento de licitação para contratar uma empresa privada especializada na confecção e entrega de marmitas. O contrato administrativo é assinado, estipulando direitos e deveres para ambas as partes. De acordo com a Lei nº 14.133/2021, as prerrogativas da Administração Pública de alterar ou rescindir o contrato unilateralmente, aplicar sanções e fiscalizar sua execução, decorrem das chamadas:","alternativas":{"A":"Cláusulas Pétreas Administrativas.","B":"Cláusulas Exorbitantes.","C":"Condições de Bilateralidade Pura.","D":"Prerrogativas de Soberania Privada.","E":"Normas de Eficácia Contratual Limitada."},"resposta_correta":"B","comentario":"As cláusulas exorbitantes constituem prerrogativas de supremacia conferidas pelo regime de direito público à Administração nos contratos administrativos, permitindo alterações unilaterais, rescisões impositivas e aplicação de multas contratuais direta."},{"id":216,"numero":216,"bloco":1,"materia":"Direito Administrativo","texto_base":null,"enunciado":"Os atos administrativos necessitam preencher cinco requisitos ou elementos estruturais obrigatórios para adquirirem validade jurídica. O elemento que se define como o efeito jurídico imediato que o ato produz, ou seja, a alteração no mundo jurídico que o ato diretamente determina, denomina-se:","alternativas":{"A":"Competência.","B":"Forma.","C":"Motivo.","D":"Objeto.","E":"Finalidade."},"resposta_correta":"D","comentario":"O objeto (ou conteúdo) do ato administrativo materializa o efeito jurídico imediato pretendido pelo ato (ex: no ato de demissão, o objeto é a extinção do vínculo funcional do servidor com o Estado)."},{"id":217,"numero":217,"bloco":1,"materia":"Direito Administrativo","texto_base":null,"enunciado":"A Lei nº 14.133/2021 regula as hipóteses em que a Administração Pública fica dispensada ou inexigível de realizar o procedimento de licitação ordinário. Nos termos expressos do artigo 74 do referido diploma legal, a licitação é inexigível quando houver:","alternativas":{"A":"caso de emergência ou de calamidade pública decretada.","B":"inviabilidade de competição, como na contratação de profissional de setor artístico consagrado pela opinião pública.","C":"valor estimado da contratação inferior a cinquenta mil reais para bens comuns.","D":"intervenção militar iminente para a contenção de rebeliões carcerárias.","E":"rescisão contratual amigável decorrente de falência da empresa terceirizada."},"resposta_correta":"B","comentario":"A inexigibilidade de licitação (Art. 74 da Lei nº 14.133/2021) fundamenta-se juridicamente na inviabilidade de competição, figurando a contratação de profissionais do setor artístico consagrados pela crítica ou opinião pública como hipótese clássica."},{"id":218,"numero":218,"bloco":1,"materia":"Direito Administrativo","texto_base":null,"enunciado":"O desvio de poder (ou desvio de finalidade) constitui uma das modalidades de abuso de autoridade que macula o ato administrativo de nulidade insanável. O desvio de finalidade caracteriza-se quando o agente público pratica o ato administrativo mirando fim:","alternativas":{"A":"idêntico ao expressamente determinado no texto da lei ordinária vigente.","B":"diverso daquele que a lei lhe atribuiu, agindo por interesses pessoais, perseguição ou favoritismo.","C":"idêntico ao interesse social e ao bem comum fixados pela doutrina majoritária.","D":"estritamente financeiro voltado a gerar economia orçamentária ao erário estadual.","E":"técnico-operacional chancelado pela chefia imediata da repartição pública."},"resposta_correta":"B","comentario":"O desvio de poder (ou desvio de finalidade) materializa-se quando o agente público atua dentro dos limites de sua competência material, mas desvia o resultado do ato para atingir fim pessoal, favoritismo ou perseguição alheia ao interesse público legal fixado."},{"id":219,"numero":219,"bloco":1,"materia":"Direito Administrativo","texto_base":null,"enunciado":"Os serviços públicos podem ser prestados diretamente pelo Estado ou delegados a particulares mediante regimes de concessão ou permissão. A delegação da prestação de um serviço público, feita pelo poder concedente mediante licitação na modalidade de concorrência, a pessoa jurídica ou consórcio de empresas que demonstre capacidade para seu desempenho, por sua conta e risco e por prazo determinado, configura o instituto da:","alternativas":{"A":"Autorização de serviço público.","B":"Concessão de serviço público.","C":"Permissão precária simplificada.","D":"Terceirização administrativa direta.","E":"Parceria público-privada pura."},"resposta_correta":"B","comentario":"Conforme as leis de regência das concessões (Lei nº 8.987/95) e a nova lei de licitações, a concessão de serviço público materializa-se na delegação contratual por prazo determinado de serviços do Estado a consórcios ou pessoas jurídicas por sua conta e risco mediante concorrência."},{"id":220,"numero":220,"bloco":1,"materia":"Direito Administrativo","texto_base":null,"enunciado":"Considere a seguinte situação hipotética: Durante a realização de uma escolta tática de presos em uma via de Natal, uma viatura oficial da Polícia Penal colide violentamente contra o veículo de um cidadão particular que estava estacionado regularmente. O acidente causa danos materiais vultosos ao carro do particular, sem que tenha havido qualquer culpa deste no evento. À luz das normas administrativas e constitucionais vigentes relativas à Responsabilidade Civil do Estado, o particular lesado:","alternativas":{"A":"deve processar criminalmente o Governador do Estado por omissão administrativa sistêmica.","B":"tem direito à indenização pelos danos materiais causados, respondendo o Estado de forma objetiva, independentemente da prova de dolo ou culpa do policial condutor.","C":"não possui direito a ressarcimento por configurar o ato policial legítimo exercício regular de direito.","D":"deve provar o dolo e a intenção deliberada do policial de causar o acidente para obter indenização.","E":"submete-se ao julgamento prévio do Conselho da Comunidade para fixar o valor do conserto."},"resposta_correta":"B","comentario":"O Brasil adota a Responsabilidade Civil Objetiva do Estado sob a vertente do Risco Administrativo (Art. 37, § 6º, da CF). Provada a conduta oficial (policial dirigindo) e o dano ao particular estacionado (nexo de causalidade), o Estado é obrigado a indenizar, independentemente de provar a culpa do motorista público."},{"id":221,"numero":221,"bloco":1,"materia":"Direito Administrativo","texto_base":null,"enunciado":"O controle da Administração Pública divide-se entre o controle interno e o externo, a depender do órgão que o executa. O controle exercido pelo Poder Legislativo, com o auxílio técnico do Tribunal de Contas do Estado (TCE), voltado a fiscalizar os aspectos financeiros, orçamentários e patrimoniais do Poder Executivo, classifica-se como controle:","alternativas":{"A":"Administrativo hierárquico puro.","B":"Externo.","C":"Interno institucional.","D":"Judicial de mérito discricionário.","E":"Social direto por ouvidoria."},"resposta_correta":"B","comentario":"O controle externo caracteriza-se quando exercido por um Poder sobre os atos do outro. A fiscalização contábil, financeira e orçamentária executada pelo Poder Legislativo com o auxílio indispensável do Tribunal de Contas materializa o controle externo legítimo."},{"id":222,"numero":222,"bloco":1,"materia":"Direito Administrativo","texto_base":null,"enunciado":"Os contratos administrativos podem sofrer alterações no curso de sua execução para manter o equilíbrio econômico- financeiro ou adequar-se às necessidades técnicas da Administração. A ocorrência de um evento extraordinário, imprevisível e inevitável, alheio à vontade das partes, que altera profundamente as condições de execução do contrato, configura o conceito de:","alternativas":{"A":"Fato do Príncipe.","B":"Álea Econômica Ordinária.","C":"Caso Fortuito ou Força Maior.","D":"Fato da Administração Puro.","E":"Culpa Concorrente Unilateral."},"resposta_correta":"C","comentario":"A ocorrência de caso fortuito ou força maior (álea extraordinária) constitui evento imprevisível e inevitável de impacto profundo que altera a equação econômico-financeira original do contrato, autorizando a revisão das cláusulas ou a rescisão sem penalidades."},{"id":223,"numero":223,"bloco":1,"materia":"Direito Administrativo","texto_base":null,"enunciado":"O abuso de poder desdobra-se em duas modalidades clássicas exaustivamente exploradas pela doutrina administrativa. A modalidade caracterizada quando o agente público atua além dos limites de sua competência legal, invadindo atribuições de outra autoridade ou praticando ato para o qual não tinha previsão legal, denomina-se:","alternativas":{"A":"Desvio de Finalidade.","B":"Excesso de Poder.","C":"Omissão Administrativa Neutra.","D":"Erro de Hermenêutica Operacional.","E":"Prerrogativa de Soberania Funcional."},"resposta_correta":"B","comentario":"O excesso de poder qualifica-se como modalidade de abuso de autoridade ligada ao vício do elemento Competência. Ocorre quando o funcionário excede os limites geográficos, temporais ou materiais fixados pela lei para sua atuação legítima."},{"id":224,"numero":224,"bloco":1,"materia":"Direito Administrativo","texto_base":null,"enunciado":"Considere a seguinte situação hipotética: O Governador do Rio Grande do Norte edita um decreto contendo instruções detalhadas para a aplicação uniforme de uma nova lei estadual que reorganizou a carreira e os subsídios dos Policiais Penais. A expedição desse decreto executivo decorre do regular exercício do Poder:","alternativas":{"A":"Disciplinar.","B":"Regulamentar (ou Normativo).","C":"Hierárquico.","D":"De Polícia originário.","E":"Judiciário delegado."},"resposta_correta":"B","comentario":"O Poder Regulamentar (ou Normativo) faculta e impõe aos chefes do Poder Executivo a edição de atos normativos secundários (decretos regulamentares) destinados a pormenorizar e dar fiel execução aos comandos abstratos contidos nas leis votadas pelo Legislativo."},{"id":225,"numero":225,"bloco":1,"materia":"Direito Administrativo","texto_base":null,"enunciado":"Dentre as entidades que compõem a Administração Pública Indireta, destaca-se aquela criada sob a forma de pessoa jurídica de direito público, mediante lei específica, destinada a executar atividades típicas da Administração Pública que requeiram gestão administrativa e financeira descentralizada. Essa entidade é a:","alternativas":{"A":"Empresa Pública.","B":"Sociedade de Economia Mista.","C":"Autarquia.","D":"Fundação Privada Subsidiária.","E":"Organização Social Terceirizada (OS)."},"resposta_correta":"C","comentario":"A autarquia é a entidade da Administração Indireta de personalidade jurídica pública criada por lei específica para o desempenho de funções estritamente típicas e exclusivas de Estado que exijam gestão descentralizada (ex: INSS, DETRAN)."},{"id":226,"numero":226,"bloco":1,"materia":"Direito Administrativo","texto_base":null,"enunciado":"A invalidação dos atos administrativos produz efeitos retroativos no tempo que impactam as relações estabelecidas. O ato administrativo eivado de ilegalidade insanável, quando anulado pela própria Administração ou pelo Poder Judiciário, gera efeitos que retroagem à data de sua edição. Esses efeitos retroativos denominam- se tecnicamente:","alternativas":{"A":"Efeitos Ex Nunc (não retroativos).","B":"Efeitos Ex Tunc (retroativos).","C":"Efeitos Diferidos Programáticos.","D":"Efeitos Repristinatórios Automáticos.","E":"Efeitos de Convalidação Ulterior."},"resposta_correta":"B","comentario":"A anulação do ato administrativo opera com efeitos retroativos no tempo (ex tunc), desfazendo o ato desde a data de sua origem e apagando os seus efeitos jurídicos ilegítimos como se o ato jamais tivesse existido (salvo a proteção de terceiros de boa-fé)."},{"id":227,"numero":227,"bloco":1,"materia":"Direito Administrativo","texto_base":null,"enunciado":"A Lei nº 14.133/2021 prevê critérios específicos de desempate e preferências nas licitações públicas como fomento econômico. De acordo com as diretrizes do novo diploma legal, em igualdade de condições, como primeiro critério de desempate, será assegurada preferência para os bens e serviços produzidos ou prestados por:","alternativas":{"A":"empresas transnacionais estrangeiras com sede em paraísos fiscais.","B":"empresas que comprovem doações financeiras a partidos políticos locais.","C":"empresas estabelecidas no território do Estado licitante.","D":"microempresas familiares geridas por servidores aposentados.","E":"cooperativas rurais que cultivem produtos agrícolas de cana-de-açúcar."},"resposta_correta":"C","comentario":"Nos termos do artigo 60 da Lei nº 14.133/2021, em caso de empate definitivo entre propostas comerciais equivalentes, o primeiro critério de desempate legal foca em prestigiar os bens e serviços produzidos ou prestados por empresas estabelecidas no território do Estado ou Município licitante."},{"id":228,"numero":228,"bloco":1,"materia":"Direito Administrativo","texto_base":null,"enunciado":"O Poder Disciplinar faculta à Administração Pública apurar infrações e aplicar penalidades aos seus agentes e a particulares que possuam vínculo jurídico específico com o Estado. Assinale a alternativa que descreve uma legítima expressão do Poder Disciplinar.","alternativas":{"A":"A interdição de um restaurante comercial privado pela vigilância sanitária.","B":"A aplicação de uma multa de trânsito a um motorista particular na rodovia.","C":"A aplicação da pena de suspensão a um policial penal após a conclusão de PAD.","D":"A apreensão de mercadorias contrabandeadas na barreira alfandegária.","E":"A fixação de horários de abertura e fechamento de agências bancárias."},"resposta_correta":"C","comentario":"O Poder Disciplinar manifesta-se estritamente sobre indivíduos submetidos a um vínculo de supremacia especial com o Estado (servidores públicos estatutários ou particulares sob contrato). Aplicar suspensão a policial após PAD é emanação direta e legítima desse poder."},{"id":229,"numero":229,"bloco":1,"materia":"Direito Administrativo","texto_base":null,"enunciado":"Os atos administrativos podem ser classificados quanto à sua formação em atos simples, complexos e compostos. O ato administrativo que exige, para a sua formação perfeita, a manifestação de vontade de dois ou mais órgãos diferentes, que se fundem para dar corpo a um único ato, classifica-se como:","alternativas":{"A":"Ato Simples.","B":"Ato Composto.","C":"Ato Complexo.","D":"Ato Enunciativo.","E":"Ato Precário."},"resposta_correta":"C","comentario":"O ato administrativo complexo é aquele cuja formação existencial perfeita pressupõe a conjunção de vontades independentes de dois ou mais órgãos estatais que se fundem (ex: concessão de aposentadoria de servidor, que exige a manifestação do órgão de origem e a homologação pelo Tribunal de Contas)."},{"id":230,"numero":230,"bloco":1,"materia":"Direito Administrativo","texto_base":null,"enunciado":"Considere a seguinte situação hipotética: Uma fundação autárquica estadual, visando alienar um conjunto de veículos oficiais considerados inservíveis para a frota administrativa, organiza um procedimento de licitação pública para selecionar a proposta que ofereça o maior lance financeiro pelos bens. Nos termos da Lei nº 14.133/2021, a modalidade de licitação própria e obrigatória para a alienação de bens móveis inservíveis ou de produtos legalmente apreendidos denomina-se:","alternativas":{"A":"Concorrência.","B":"Pregão.","C":"Leilão.","D":"Concurso.","E":"Diálogo Competitivo."},"resposta_correta":"C","comentario":"De acordo com o artigo 28 e 31 da Nova Lei de Licitações (Lei nº 14.133/2021), o Leilão consolidou-se como a modalidade licitatória universal e impositiva para a alienação de bens móveis inservíveis, produtos legalmente apreendidos ou bens imóveis da Administração."},{"id":231,"numero":231,"bloco":1,"materia":"Direito Administrativo","texto_base":null,"enunciado":"As agências reguladoras brasileiras qualificam-se como entidades dotadas de regime jurídico especial no âmbito da Administração Indireta. A doutrina e a jurisprudência consolidam que as agências reguladoras integram a categoria das:","alternativas":{"A":"Empresas públicas de fins lucrativos patrimoniais.","B":"Sociedades de economia mista sob controle acionário privado.","C":"Autarquias sob regime especial, dotadas de maior autonomia.","D":"Fundações privadas de assistência social sindical.","E":"Organizações da Sociedade Civil de Interesse Público (OSCIP)."},"resposta_correta":"C","comentario":"As agências reguladoras (ANATEL, ANVISA, etc.) são estruturadas juridicamente sob a forma de autarquias sob regime especial, dotadas por lei de maior independência administrativa, estabilidade de dirigentes e autonomia financeira para regular setores econômicos estratégicos."},{"id":232,"numero":232,"bloco":1,"materia":"Direito Administrativo","texto_base":null,"enunciado":"Os atributos do ato administrativo conferem coercitividade e imperatividade às decisões estatais. O atributo que confere à Administração Pública a prerrogativa de executar as suas próprias decisões diretamente, inclusive com o emprego da força se necessário, sem a necessidade de autorização prévia do Poder Judiciário, denomina-se:","alternativas":{"A":"Tipicidade orgânica.","B":"Autoexecutoriedade.","C":"Presunção de Legitimidade.","D":"Vinculação impositiva.","E":"Caducidade extintiva."},"resposta_correta":"B","comentario":"A autoexecutoriedade confere à Administração Pública a prerrogativa de materializar e executar coativamente suas decisões no mundo prático sem depender de autorização judicial prévia, amparada na urgência e na supremacia do interesse coletivo."},{"id":233,"numero":233,"bloco":1,"materia":"Direito Administrativo","texto_base":null,"enunciado":"A convalidação constitui técnica administrativa voltada a sanar vícios sanáveis em atos administrativos ilegais, evitando a necessidade de anulação de atos benéficos ao interesse público. Nos termos da doutrina amplamente majoritária, os elementos do ato administrativo que admitem convalidação, por apresentarem vícios de natureza puramente sanável, são:","alternativas":{"A":"o Motivo e o Objeto de forma irrestrita.","B":"a Finalidade e o Motivo.","C":"a Competência (desde que não seja exclusiva) e a Forma (desde que não seja essencial).","D":"o Objeto e a Finalidade em qualquer hipótese.","E":"a Competência exclusiva e o Objeto ilícito."},"resposta_correta":"C","comentario":"Admite- se a convalidação de atos administrativos com defeitos leves quando o vício residir na Competência (desde que não seja matéria de competência exclusiva de outra autoridade) ou na Forma (desde que a forma desobedecida não seja essencial e impositiva para a validade do ato)."},{"id":234,"numero":234,"bloco":1,"materia":"Direito Administrativo","texto_base":null,"enunciado":"Considere a seguinte situação hipotética: O Comando do Plantão Penitenciário de uma cadeia pública potiguar, constatando que um detento destruiu deliberadamente a lâmpada e a fiação elétrica de sua cela, determina o imediato isolamento cautelar do interno em cela separada por motivos de segurança e ordem interna. A medida administrativa adotada pelo superior hierárquico carcerário ampara-se de forma direta no atributo do poder de polícia denominado:","alternativas":{"A":"Discricionariedade mitigada por sigilo.","B":"Autoexecutoriedade, que autoriza a execução imediata da medida sem ordem do juiz.","C":"Presunção de Inocência processual diferida.","D":"Imperatividade patrimonial impositiva.","E":"Vinculação estrita de legalidade penal."},"resposta_correta":"B","comentario":"A autoexecutoriedade do poder de polícia confere aos agentes de segurança pública a autoridade tática impositiva de realizar intervenções imediatas (como isolar cela ou apreender ferramentas perigosas) de forma direta para manter a ordem prisional, dispensando mandados judiciais."},{"id":235,"numero":235,"bloco":1,"materia":"Direito Administrativo","texto_base":null,"enunciado":"A responsabilidade civil das pessoas jurídicas de direito privado prestadoras de serviços públicos submete-se ao modelo da responsabilidade objetiva. Para que o cidadão lesado obtenha a reparação civil em juízo contra a concessionária, exige-se a comprovação do tripé composto por:","alternativas":{"A":"conduta culposa do agente, dano material de grande monta e dolo da chefia superior.","B":"conduta administrativa, dano suportado e o nexo de causalidade entre a conduta e o dano.","C":"erro de diagnóstico técnico, ineficiência orçamentária comprovada e notificação prévia.","D":"infração disciplinar grave, absolvição penal transitada em julgado e dolo específico.","E":"dolo do funcionário, testemunhas presenciais da sociedade e autorização judicial."},"resposta_correta":"B","comentario":"A configuração da responsabilidade civil objetiva exige unicamente o preenchimento do tripé causal clássico: conduta administrativa do agente público, dano material ou moral suportado pelo particular e o nexo de causalidade linear que interliga a conduta ao dano."},{"id":236,"numero":236,"bloco":1,"materia":"Direito Administrativo","texto_base":null,"enunciado":"A Lei nº 14.133/2021 veda o direcionamento de licitações por meio da exigência arbitrária de marcas ou especificações exclusivas que restrinjam o caráter competitivo do certame. Contudo, a indicação de marca pela Administração é legítima quando houver:","alternativas":{"A":"interesse pessoal e explícito dos membros da comissão de contratação do órgão.","B":"necessidade de padronização, devidamente justificada em parecer técnico.","C":"patrocínio financeiro direto oferecido pela empresa fabricante ao Estado.","D":"recomendação de natureza estritamente político-partidária da Assembleia.","E":"indicação unânime realizada pelos detentos do estabelecimento carcerário."},"resposta_correta":"B","comentario":"Embora a regra proíba o direcionamento de marcas nas licitações, a indicação de marca pela Administração é considerada legítima pela Lei nº 14.133/2021 quando motivada por critérios de padronização logística, compatibilidade técnica ou manutenção de frotas devidamente provados por parecer técnico escrito."},{"id":237,"numero":237,"bloco":1,"materia":"Direito Administrativo","texto_base":null,"enunciado":"Dentre os poderes da Administração Pública, destaca-se aquele que faculta à autoridade superior rever os atos dos subordinados, avocar competências não exclusivas e delegar atribuições administrativas. Esse poder é o:","alternativas":{"A":"Poder Regulamentar.","B":"Poder Disciplinar.","C":"Poder Hierárquico.","D":"Poder de Polícia.","E":"Poder Vinculado."},"resposta_correta":"C","comentario":"O Poder Hierárquico estrutura a pirâmide administrativa do Estado, conferindo à autoridade superior a prerrogativa funcional permanente de chefiar, fiscalizar, avocar atribuições não exclusivas e delegar parcelas de suas competências aos subordinados."},{"id":238,"numero":238,"bloco":1,"materia":"Direito Administrativo","texto_base":null,"enunciado":"Os atos administrativos classificados como \"atos de império\" caracterizam-se pelas prerrogativas de autoridade com que são editados pelo Estado. Em contraposição, os atos nos quais a Administração atua em igualdade de condições com o particular, despida de suas prerrogativas de supremacia (como a assinatura de um contrato de locação comum), classificam-se como:","alternativas":{"A":"Atos de Gestão.","B":"Atos de Expediente.","C":"Atos de Polícia judiciária.","D":"Atos Vinculados estritos.","E":"Atos Normativos abstratos."},"resposta_correta":"A","comentario":"Os atos de gestão são aqueles praticados pela Administração Pública despida de suas prerrogativas de império e supremacia horizontal vertical, situando-se em pé de igualdade jurídica civil com o particular contratante (ex: locação de prédio comum)."},{"id":239,"numero":239,"bloco":1,"materia":"Direito Administrativo","texto_base":null,"enunciado":"Considere a seguinte situação hipotética: Uma autarquia estadual responsável pela gestão de estradas publica um edital de licitação. O certame transcorre regularmente, mas nenhuma empresa interessada comparece para apresentar propostas no dia fixado. Nos termos da Lei nº 14.133/2021, a licitação na qual não aparecem interessados interessados em participar do certame qualifica-se como licitação:","alternativas":{"A":"Deserta, autorizando a contratação direta se o procedimento não puder ser repetido sem prejuízo.","B":"Fracassada, exigindo a anulação automática de todos os atos orçamentários do órgão.","C":"Inexigível de forma absoluta por inviabilidade material de competição sistêmica.","D":"Nula por vício insanável de objeto e finalidade administrativa interna.","E":"Revogada por motivo de força maior decorrente de crises cambiais financeiras."},"resposta_correta":"A","comentario":"A licitação deserta caracteriza-se pelo absenteísmo total de licitantes interessados no certame. Constatada a deserção, a Lei nº 14.133/2021 autoriza a contratação direta por dispensa de licitação se o procedimento não puder ser repetido sem prejuízo material ao órgão."},{"id":240,"numero":240,"bloco":1,"materia":"Direito Administrativo","texto_base":null,"enunciado":"As fundações públicas instituídas pelo Estado podem ostentar personalidade jurídica de direito público ou de direito privado. Quando criada com personalidade jurídica de direito público, a fundação pública equipara-se inteiramente às:","alternativas":{"A":"Sociedades de economia mista sob controle acionário majoritário.","B":"Empresas públicas prestadoras de serviços comerciais lucrativos.","C":"Autarquias, submetendo-se ao regime jurídico administrativo comum.","D":"Organizações Sociais Terceirizadas de livre dissolução civil.","E":"Agências de fomento financeiro internacional de fronteiras."},"resposta_correta":"C","comentario":"As fundações públicas de direito público (fundações autárquicas) são consideradas ramificações equivalentes às autarquias, integrando o regime jurídico administrativo de direito público, gozando de imunidade tributária e prazos processuais diferenciados."},{"id":241,"numero":241,"bloco":1,"materia":"Direito Administrativo","texto_base":null,"enunciado":"O Princípio da Supremacia do Interesse Público sobre o interesse privado constitui um dos pilares do regime jurídico administrativo. Esse princípio fundamental:","alternativas":{"A":"está expressamente positivado no rol de direitos do artigo 5º da CF/88.","B":"qualifica-se como princípio implícito que legitima as prerrogativas de autoridade do Estado.","C":"autoriza o confisco total e imediato de bens particulares sem direito a indenização.","D":"cede espaço para que o interesse particular prevaleça em contratos licitatórios comuns.","E":"é vedado pelo ordenamento jurídico nacional contemporâneo por afrontar direitos civis."},"resposta_correta":"B","comentario":"O Princípio da Supremacia do Interesse Público qualifica-se como um princípio implícito (pedra de toque) do regime jurídico administrativo, fundamentando as prerrogativas de autoridade e a verticalidade das decisões estatais frente ao interesse privado."},{"id":242,"numero":242,"bloco":1,"materia":"Direito Administrativo","texto_base":null,"enunciado":"A caducidade constitui uma das formas de extinção dos atos administrativos e das concessões de serviços públicos. A extinção do ato por caducidade verifica-se quando:","alternativas":{"A":"o beneficiário do ato comete uma falta grave e descumpre as condições fixadas na licitação.","B":"sobrevém legislação nova que torna inviável a permanência da situação jurídica outorgada.","C":"a Administração revoga o ato por motivos de mera conveniência e oportunidade financeira.","D":"o ato administrativo exara todos os seus efeitos jurídicos e materiais programados no tempo.","E":"o destinatário do ato falece, extinguindo-se a obrigação personalíssima decorrente."},"resposta_correta":"B","comentario":"A caducidade extingue o ato administrativo de forma superveniente quando o Estado edita uma nova legislação que proíbe ou torna juridicamente impossível a permanência daquela atividade ou situação anteriormente autorizada."},{"id":243,"numero":243,"bloco":1,"materia":"Direito Administrativo","texto_base":null,"enunciado":"Considere a seguinte situação hipotética: Um Policial Penal potiguar, durante o exercício de suas funções operacionais na escolta de um reeducando, presencia um princípio de incêndio em um transformador elétrico localizado na calçada de uma via pública. O servidor aciona os bombeiros e isola a área utilizando fitas zebradas da corporação. O isolamento físico da área e a restrição temporária da circulação de pedestres na calçada decorrem do exercício do Poder:","alternativas":{"A":"Disciplinar funcional carcerário.","B":"De Polícia, na modalidade de ato de execução imediata voltado à segurança pública.","C":"Regulamentar abstrato de chefia.","D":"Vinculado estrito de dosimetria penal.","E":"Judiciário delegado extraordinário."},"resposta_correta":"B","comentario":"O isolamento de áreas e calçadas diante de incêndios ou riscos iminentes materializa a execução imediata e legítima do Poder de Polícia em sua vertente de segurança pública e preservação da integridade social, restringindo direitos de trânsito individuais em prol do bem comum."},{"id":244,"numero":244,"bloco":1,"materia":"Direito Administrativo","texto_base":null,"enunciado":"A Lei nº 14.133/2021 instituiu o Portal Nacional de Contratações Públicas (PNCP) como sítio eletrônico oficial destinado à divulgação centralizada dos atos de licitação. De acordo com o novo diploma legal, a publicidade dos editais no PNCP é requisito impositivo para a:","alternativas":{"A":"isenção fiscal das empresas estrangeiras concorrentes no certame.","B":"eficácia do ato convocatório e regularidade do andamento da contratação.","C":"delegação do poder de polícia originário a consórcios privados.","D":"dispensa obrigatória da assinatura de contratos administrativos escritos.","E":"prorrogação vitalícia e automática de parcerias público-privadas."},"resposta_correta":"B","comentario":"A divulgação unificada dos editais e dos atos de contratação no Portal Nacional de Contratações Públicas (PNCP) constitui requisito obrigatório e impositivo fixado pela Lei nº 14.133/2021 para a eficácia jurídica e regularidade do andamento do certame."},{"id":245,"numero":245,"bloco":1,"materia":"Direito Administrativo","texto_base":null,"enunciado":"O ato administrativo que apresenta vício insanável em seu elemento Finalidade é considerado nulo de pleno direito. A doutrina unificada aponta que o vício de finalidade:","alternativas":{"A":"admite convalidação retroativa se houver interesse financeiro do Diretor do órgão.","B":"é insuscetível de convalidação, visto que a busca do interesse público é barreira intransigente.","C":"configura mero erro formal de expediente passível de correção por apostilamento simples.","D":"transmuda o ato administrativo em contrato de direito privado comum automático.","E":"extingue a responsabilidade civil objetiva do Estado pelos danos causados pelo ato."},"resposta_correta":"B","comentario":"O elemento Finalidade vincula-se ao Princípio da Impessoalidade e à busca permanente do bem comum. O ato administrativo que nasce com vício na finalidade (desvio de poder) abriga defeito insanável e gravíssimo, sendo insuscetível de convalidação administrativa."},{"id":246,"numero":246,"bloco":1,"materia":"Direito Administrativo","texto_base":null,"enunciado":"A revogação do ato administrativo produz efeitos que não retroagem no tempo, respeitando os direitos adquiridos até o momento da extinção. Os efeitos gerados a partir do momento da decisão de revogação para a frente denominam-se tecnicamente:","alternativas":{"A":"Efeitos Ex Tunc.","B":"Efeitos Ex Nunc.","C":"Efeitos Repristinatórios.","D":"Efeitos Convalidadores Extraordinários.","E":"Efeitos Diferidos Mitigados."},"resposta_correta":"B","comentario":"A revogação do ato administrativo opera com efeitos prospectivos (ex nunc), ou seja, do momento da decisão de revogação para a frente, preservando intactos os efeitos e os direitos consolidados no passado sob a égide do ato extinto."},{"id":247,"numero":247,"bloco":1,"materia":"Direito Administrativo","texto_base":null,"enunciado":"As sociedades de economia mista e as empresas públicas compõem a categoria das entidades estatais exploradoras de atividade econômica ou prestadoras de serviços. Quanto à composição de seu capital social, a Sociedade de Economia Mista caracteriza-se obrigatoriamente por possuir capital:","alternativas":{"A":"100% público, pertencente de forma exclusiva à União Federal.","B":"100% privado, captado em fundos de pensão internacionais.","C":"misto, composto por recursos públicos e privados, restando a maioria das ações com direito a voto sob o controle do Poder Público.","D":"oriundo de doações filantrópicas de entidades do terceiro setor (ONGs).","E":"flutuante, determinado de forma diária pelas oscilações da bolsa de valores."},"resposta_correta":"C","comentario":"A Sociedade de Economia Mista caracteriza-se obrigatoriamente pela conjugação de capitais de origem pública e privada (daí o nome economia mista), exigindo o ordenamento que o controle acionário e a maioria das ações com direito a voto pertençam de forma permanente ao Ente Público controlador."},{"id":248,"numero":248,"bloco":1,"materia":"Direito Administrativo","texto_base":null,"enunciado":"Considere a seguinte situação hipotética: A Secretaria de Estado da Administração Penitenciária realiza um pregão eletrônico para a aquisição de novos radiotransmissores portáteis. Concluída a fase de lances, o pregoeiro adjudica o objeto à empresa vencedora e encaminha os autos ao Secretário, que ratifica integralmente a legalidade de todos os atos praticados no certame. O ato administrativo de competência da autoridade superior que encerra o procedimento licitatório e confirma a regularidade jurídica de todas as suas etapas denomina-se:","alternativas":{"A":"Adjudicação.","B":"Homologação.","C":"Habilitação técnica.","D":"Classificação final.","E":"Publicação em PNCP."},"resposta_correta":"B","comentario":"A homologação é o ato administrativo de controle de legalidade operado pela autoridade superior que encerra formalmente o procedimento de licitação, atestando a regularidade jurídica de todas as etapas e chancelando a fase de contratação."},{"id":249,"numero":249,"bloco":1,"materia":"Direito Administrativo","texto_base":null,"enunciado":"A teoria do risco administrativo fundamenta a responsabilidade objetiva do Estado, admitindo contudo causas excludentes que rompem o nexo de causalidade. Assinale a alternativa que descreve uma causa legítima de exclusão absoluta da responsabilidade civil do Estado.","alternativas":{"A":"A imperícia ou cansaço físico do servidor condutor da viatura oficial.","B":"A falta crônica de investimentos orçamentários na infraestrutura das vias públicas.","C":"A culpa exclusiva da vítima no evento danoso devidamente comprovada.","D":"O trânsito em julgado de sentença condenatória criminal contra o autor do dano.","E":"A ocorrência de greve geral de servidores das carreiras da segurança pública."},"resposta_correta":"C","comentario":"A prova cabal de que o dano material ou físico decorreu de culpa exclusiva da vítima constitui causa clássica de exclusão do nexo de causalidade no risco administrativo, isentando o Estado do dever de indenizar pela quebra da linearidade do evento."},{"id":250,"numero":250,"bloco":1,"materia":"Direito Administrativo","texto_base":null,"enunciado":"No que concerne às sanções contratuais reguladas pela Lei nº 14.133/2021, o contratado que descumprir injustificadamente as obrigações pactuadas submete-se a penalidades administrativas aplicadas pelo órgão contratante. Dentre as sanções previstas no artigo 156 do novo diploma legal, a penalidade mais severa, que impede o particular de licitar ou contratar com a Administração Pública de todos os entes federativos por prazo de até cinco anos, denomina-se:","alternativas":{"A":"Advertência escrita simples.","B":"Multa pecuniária compensatória diária.","C":"Impedimento de licitar e contratar.","D":"Declaração de inidoneidade para licitar ou contratar.","E":"Cassação imediata do registro cadastral de marcas comerciais."},"resposta_correta":"D","comentario":"Dentre o catálogo de sanções contratuais fixado pelo artigo 156 da Lei nº 14.133/2021, a Declaração de Inidoneidade constitui a penalidade mais severa e abrangente, proibindo o particular faltoso de licitar ou contratar com a totalidade da Administração Pública do país por período de até cinco anos."},{"id":251,"numero":251,"bloco":2,"materia":"Direito Administrativo","texto_base":null,"enunciado":"A Lei nº 8.429/1992 (Lei de Improbidade Administrativa - LIA), profundamente alterada pela Lei nº 14.230/2021, passou a exigir critérios rígidos de tipificação para a responsabilização do agente público. De acordo com o texto legal vigente, para que uma conduta seja configurada como ato de improbidade administrativa, exige-se a presença de:","alternativas":{"A":"culpa simples ou imperícia administrativa comprovada em sindicância ordinária.","B":"dolo específico, caracterizado pela vontade livre e consciente de alcançar o resultado ilícito tipificado em lei.","C":"prejuízo material ao erário superior a cem salários mínimos nacionais de forma compulsória.","D":"representação assinada por comissão especial de deputados da comarca respectiva.","E":"omissão burocrática involuntária decorrente de cansaço ou sobrecarga de trabalho."},"resposta_correta":"B","comentario":"A Lei nº 14.230/2021 sepultou a responsabilidade culposa na improbidade administrativa. Atualmente, todo e qualquer ato de improbidade exige a demonstração do dolo específico, caracterizado pela vontade livre e consciente de alcançar o resultado ilícito tipificado em lei."},{"id":252,"numero":252,"bloco":2,"materia":"Direito Administrativo","texto_base":null,"enunciado":"A Lei de Improbidade Administrativa divide os atos ímprobos em três categorias fundamentais de acordo com a natureza da violação. O ato de improbidade que decorre de qualquer ação ou omissão dolosa que enseje, efetivamente, perda patrimonial, desvio, apropriação, malbaratamento ou dilapidação dos bens ou haveres das entidades públicas, classifica-se como ato que:","alternativas":{"A":"importa em enriquecimento ilícito.","B":"causa prejuízo ao erário.","C":"atenta contra os princípios da Administração Pública de forma pura.","D":"configura mera infração disciplinar de cortesia que dispensa anotação.","E":"resulta em responsabilidade civil objetiva de risco administrativo."},"resposta_correta":"B","comentario":"O artigo 10 da LIA define os atos de improbidade que causam prejuízo ao erário. Caracterizam-se por ação ou omissão dolosa que resulte em efetiva perda patrimonial, desvio, apropriação ou dilapidação de bens públicos."},{"id":253,"numero":253,"bloco":2,"materia":"Direito Administrativo","texto_base":null,"enunciado":"Considere a seguinte situação hipotética: Um Policial Penal potiguar, valendo- se das facilidades de seu cargo de chefia em uma cadeia pública, aceita receber mensalmente uma quantia financeira de familiares de um detento para garantir que este permaneça em cela individual com regalias proibidas aos demais internos. À luz das disposições expressas do artigo 9º da Lei nº 8.429/1992, a conduta descrita configura ato de improbidade administrativa que:","alternativas":{"A":"atenta contra os princípios da Administração Pública tão somente.","B":"causa prejuízo ao erário de forma exclusiva por perda de insumos de limpeza.","C":"importa enriquecimento ilícito, por auferir qualquer tipo de vantagem patrimonial indevida em razão do exercício do cargo.","D":"qualifica-se como comportamento eticamente exemplar de assistência social carcerária privada.","E":"submete-se ao arquivamento automático pela aplicação do princípio da insignificância material."},"resposta_correta":"C","comentario":"Receber vantagem econômica indevida (propina, comissão, etc.) em razão do exercício do cargo para conceder facilidades ou regalias carcerárias subsume-se perfeitamente ao artigo 9º da Lei nº 8.429/1992, configurando improbidade por Enriquecimento Ilícito."},{"id":254,"numero":254,"bloco":2,"materia":"Direito Administrativo","texto_base":null,"enunciado":"As sanções aplicáveis em face da prática de atos de improbidade administrativa são autônomas e possuem natureza civil- política, não se confundindo com as penas criminais. Dentre as penalidades expressamente previstas no artigo 12 da LIA para os atos que importam enriquecimento ilícito, destaca-se a:","alternativas":{"A":"pena de morte por fuzilamento militar extraordinário.","B":"suspensão dos direitos políticos por até 14 (quatorze) anos.","C":"cassação vitalícia e hereditária da cidadania nacional do réu.","D":"advertência verbal simples lavrada perante o Conselho da Comunidade.","E":"proibição definitiva de circulação em vias públicas urbanas após as dezoito horas."},"resposta_correta":"B","comentario":"Nos termos do artigo 12, inciso I, da LIA (redação da Lei nº 14.230/2021), a sanção de suspensão dos direitos políticos para os atos de enriquecimento ilícito possui o prazo de até 14 anos."},{"id":255,"numero":255,"bloco":2,"materia":"Direito Administrativo","texto_base":null,"enunciado":"O processo administrativo estadual submete-se a princípios e prazos específicos que garantem a segurança jurídica dos administrados e a eficiência das apurações. O instituto por meio do qual a autoridade superior atrai para si, de forma temporária e por motivos devidamente justificados, a competência atribuída a um órgão subordinado, denomina-se:","alternativas":{"A":"Delegação de competência.","B":"Avocação de competência.","C":"Convalidação hierárquica.","D":"Caducidade orgânica.","E":"Encampação unilateral."},"resposta_correta":"B","comentario":"A avocação consiste na atração temporária e motivada, por órgão superior, de competência originariamente atribuída a um órgão subordinado. É medida de exceção decorrente do poder hierárquico."},{"id":256,"numero":256,"bloco":2,"materia":"Direito Administrativo","texto_base":null,"enunciado":"Os agentes públicos classificam- se em categorias distintas a depender da natureza do vínculo estabelecido com o Estado. Os cidadãos convocados para prestar serviços específicos e temporários ao Estado, desprovidos de vínculo empregatício ou estatutário permanente (como os jurados do Tribunal do Júri e os mesários eleitorais), enquadram-se na categoria de:","alternativas":{"A":"Agentes Políticos.","B":"Agentes Administrativos estáveis.","C":"Agentes Honoríficos.","D":"Agentes Credenciados.","E":"Agentes de Fato necessários."},"resposta_correta":"C","comentario":"Os agentes honoríficos são cidadãos convocados para prestar serviços específicos e transitórios ao Estado em razão de sua condição cívica ou honorífica, sem vínculo profissional permanente, como os jurados e os mesários."},{"id":257,"numero":257,"bloco":2,"materia":"Direito Administrativo","texto_base":null,"enunciado":"Considere a seguinte situação hipotética: A Secretaria de Estado da Administração Penitenciária instaura um Processo Administrativo Disciplinar (PAD) para apurar uma suposta infração funcional cometida por um Policial Penal. No curso da instrução, a comissão processante nega ao servidor o direito de produzir provas testemunhais e impede o acesso de seu advogado aos relatórios de inteligência que basearam a acusação. Sob a ótica do Direito Administrativo e do devido processo legal, os atos praticados pela comissão violam de forma frontal os princípios do(a):","alternativas":{"A":"Supremacia do interesse corporativo e publicidade restrita.","B":"Contraditório e da Ampla Defesa, gerando a nulidade absoluta do procedimento disciplinar.","C":"Discricionariedade técnica e presunção de culpa retroativa.","D":"Economicidade e celeridade burocrática ex officio.","E":"Hierarquia militarizada e delegação compulsória de defesa."},"resposta_correta":"B","comentario":"O Processo Administrativo Disciplinar (PAD) submete-se obrigatoriamente às garantias constitucionais do contraditório e da ampla defesa (Art. 5º, LV, da CF). Negar a produção de provas legítimas e sonegar o acesso aos autos gera a nulidade absoluta do procedimento por cerceamento de defesa."},{"id":258,"numero":258,"bloco":2,"materia":"Direito Administrativo","texto_base":null,"enunciado":"O artigo 11 da Lei nº 8.429/1992 elenca os atos de improbidade administrativa que atentam contra os princípios da Administração Pública. De acordo com as recentes alterações promovidas pela Lei nº 14.230/2021, o rol desse artigo passou a ser considerado taxativo, configurando improbidade a seguinte conduta dolosa:","alternativas":{"A":"o mero atraso burocrático no preenchimento de planilhas de almoxarifado.","B":"frustrar a licitude de concurso público ou de processo seletivo para ingresso na administração pública.","C":"conceder progressão de regime ao detento que preencher os requisitos da Lei de Execução Penal.","D":"realizar vistorias estruturais nas celas comuns durante o horário de repouso noturno.","E":"subscrever portarias de lotação de servidores em conformidade com as regras de conveniência."},"resposta_correta":"B","comentario":"A Lei nº 14.230/2021 transformou o rol do artigo 11 da LIA (atos contra os princípios) em um rol taxativo. Dentre as condutas mantidas e tipificadas expressamente no inciso V, encontra-se o ato de frustrar a licitude de concurso público ou processo seletivo."},{"id":259,"numero":259,"bloco":2,"materia":"Direito Administrativo","texto_base":null,"enunciado":"No âmbito do processo administrativo, a delegação de competência constitui instrumento de gestão voltado a otimizar os fluxos de trabalho. Nos termos das regras gerais que regulam o processo administrativo, o ato de delegação:","alternativas":{"A":"transfere de forma definitiva e irrevogável a titularidade da competência fixada em lei.","B":"pode ser revogado a qualquer tempo pela autoridade delegante, possuindo caráter eminentemente discricionário e temporário.","C":"exige a aprovação prévia por maioria absoluta dos deputados da Assembleia Legislativa.","D":"é proibido se o destinatário da delegação for um servidor público ocupante de cargo de nível médio.","E":"torna a autoridade delegante imune a qualquer modalidade de responsabilidade civil regressiva."},"resposta_correta":"B","comentario":"A delegação transfere temporariamente apenas o exercício da competência, mantendo a autoridade delegante a titularidade. Por possuir caráter precário, a delegação pode ser revogada a qualquer tempo por ato discricionário da autoridade de origem."},{"id":260,"numero":260,"bloco":2,"materia":"Direito Administrativo","texto_base":null,"enunciado":"A prescrição extingue o direito do Estado de aplicar sanções ou mover ações em face de ilícitos administrativos ou atos de improbidade pelo decurso do tempo. Nos termos do artigo 23 da Lei nº 8.429/1992, com a redação dada pela Lei nº 14.230/2021, a ação para a aplicação das sanções previstas nesta lei prescreve em:","alternativas":{"A":"2 (dois) anos, contados da data de publicação do edital do concurso público.","B":"5 (cinco) anos, contados do dia em que o agente público cessar o exercício do mandato ou cargo em comissão.","C":"8 (oito) anos, contados a partir da data de ocorrência do fato ou, no caso de infrações permanentes, do dia em que cessou a permanência.","D":"10 (dez) anos improrrogáveis, contados do recebimento formal da denúncia pelo juiz.","E":"tempo indeterminado, sendo os atos que causam prejuízo ao erário imprescritíveis em toda e qualquer modalidade de ação de sanção civil."},"resposta_correta":"C","comentario":"Inovação estrutural da Lei nº 14.230/2021. O artigo 23 fixou o prazo de prescrição unificado de 8 anos, contados a partir da data de ocorrência do fato ou, no caso de infrações permanentes, do dia em que cessou a permanência."},{"id":261,"numero":261,"bloco":2,"materia":"Direito Administrativo","texto_base":null,"enunciado":"Considere a seguinte situação hipotética: Um indivíduo, fazendo-se passar por Policial Penal por meio do uso de uma farda falsa e distintivo clonado, passa a exercer de forma voluntária e clandestina a vigilância e triagem de visitas na recepção de uma cadeia pública, sem que a direção do presídio tenha conhecimento da fraude. A doutrina do Direito Administrativo classifica o indivíduo que pratica atos de gestão ou segurança pública simulando a condição de agente público sem qualquer ato formal de investidura como um:","alternativas":{"A":"Agente Político derivado.","B":"Agente Público honorífico.","C":"Agente de Fato usurpador (Usurpador de função pública).","D":"Agente Administrativo terceirizado precário.","E":"Agente Credenciado extraordinário de fronteiras."},"resposta_correta":"C","comentario":"O usurpador de função pública é o indivíduo que pratica atos fingindo a condição de agente público sem qualquer investidura legal. Diferencia- se do agente de fato (que possui uma investidura, ainda que eivada de vício). Os atos do usurpador são considerados juridicamente inexistentes."},{"id":262,"numero":262,"bloco":2,"materia":"Direito Administrativo","texto_base":null,"enunciado":"Os atos de improbidade administrativa exigem legitimidade ativa específica para a propositura da respectiva ação judicial de responsabilização civil. De acordo com o artigo 17 da LIA, modificado pela Lei nº 14.230/2021, a ação de improbidade administrativa será proposta exclusivamente pelo:","alternativas":{"A":"Sindicato da respectiva categoria profissional lesada.","B":"Ministério Público.","C":"Con
