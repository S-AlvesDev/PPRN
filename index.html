<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PPRN 500 — Plataforma de Questões | Polícia Penal RN</title>
<meta name="description" content="Plataforma de estudos com as 500 questões comentadas da apostila pós-edital da Polícia Penal do Rio Grande do Norte.">
<meta name="theme-color" content="#0F1F2B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>/* ============================================================
   PPRN 500 — plataforma de questões
   Paleta: tinta naval + luz de salina + verde institucional
   ============================================================ */
:root{
  --ink:#0F1F2B;
  --ink-2:#33485A;
  --ink-3:#6B8090;
  --line:#DCE3E3;
  --line-2:#EDF1F0;
  --paper:#F1F4F2;
  --surface:#FFFFFF;
  --brand:#0E6F63;
  --brand-dark:#0A5349;
  --brand-soft:#E2F0ED;
  --amber:#A8722A;
  --amber-soft:#F8EEDD;
  --wrong:#AF2F4B;
  --wrong-soft:#FAE7EB;
  --star:#C8901B;
  --radius:14px;
  --radius-sm:9px;
  --shadow:0 1px 2px rgba(15,31,43,.05), 0 8px 24px -16px rgba(15,31,43,.35);
  --shadow-lg:0 24px 60px -30px rgba(15,31,43,.5);
  --nav-w:230px;
  --ff-ui:"Archivo","Segoe UI",system-ui,-apple-system,sans-serif;
  --ff-read:"Source Serif 4",Georgia,"Times New Roman",serif;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--ff-ui);
  background:var(--paper);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  font-size:15px;
  line-height:1.5;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--brand);text-decoration:none}
:focus-visible{outline:2.5px solid var(--brand);outline-offset:2px;border-radius:4px}
::selection{background:var(--brand-soft)}

/* ---------- layout ---------- */
.app{display:flex;min-height:100vh}
.rail{
  width:var(--nav-w);flex:0 0 var(--nav-w);
  background:var(--ink);color:#fff;
  position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;padding:22px 14px;gap:2px;
}
.brand{padding:4px 10px 20px;display:flex;flex-direction:column;gap:2px}
.brand-mark{
  font-size:11px;letter-spacing:.22em;text-transform:uppercase;
  color:#7FC9BB;font-weight:700;
}
.brand-name{font-size:19px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.brand-sub{font-size:11.5px;color:#8FA3B0;letter-spacing:.02em;margin-top:3px}
.nav-item{
  display:flex;align-items:center;gap:11px;
  padding:9px 11px;border-radius:10px;color:#B9C8D2;
  font-size:14px;font-weight:500;text-align:left;width:100%;
  transition:background .16s,color .16s;
}
.nav-item svg{width:17px;height:17px;flex:0 0 17px;opacity:.85}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item.active{background:var(--brand);color:#fff}
.nav-item.active svg{opacity:1}
.nav-badge{
  margin-left:auto;font-size:11px;font-weight:700;padding:1px 7px;
  border-radius:20px;background:rgba(255,255,255,.14);font-variant-numeric:tabular-nums;
}
.nav-item.active .nav-badge{background:rgba(0,0,0,.22)}
.rail-foot{margin-top:auto;padding:14px 11px 0;border-top:1px solid rgba(255,255,255,.1)}
.rail-foot p{margin:0;font-size:11px;color:#7E93A1;line-height:1.45}
.rail-foot button{color:#9FB2BE;font-size:11.5px;margin-top:8px;text-decoration:underline}
.rail-foot button:hover{color:#fff}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.wrap{width:100%;max-width:1040px;margin:0 auto;padding:34px 26px 90px}

/* ---------- tipografia ---------- */
.eyebrow{
  font-size:11px;letter-spacing:.19em;text-transform:uppercase;
  font-weight:700;color:var(--ink-3);margin:0 0 7px;
}
h1{font-size:29px;line-height:1.14;letter-spacing:-.028em;margin:0 0 6px;font-weight:700}
h2{font-size:19px;letter-spacing:-.018em;margin:0 0 3px;font-weight:700}
h3{font-size:15px;margin:0 0 4px;font-weight:700}
.lead{color:var(--ink-2);margin:0;font-size:14.5px;max-width:62ch}
.section{margin-top:34px}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:13px}
.muted{color:var(--ink-3)}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- cards ---------- */
.card{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);box-shadow:var(--shadow);
}
.card-pad{padding:18px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}

/* ---------- ações rápidas ---------- */
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}
.quick button{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:15px 15px 14px;text-align:left;display:flex;flex-direction:column;gap:9px;
  box-shadow:var(--shadow);transition:transform .16s,border-color .16s,box-shadow .16s;
}
.quick button:hover{transform:translateY(-2px);border-color:var(--brand);box-shadow:var(--shadow-lg)}
.quick .qi{
  width:32px;height:32px;border-radius:9px;background:var(--brand-soft);color:var(--brand-dark);
  display:grid;place-items:center;
}
.quick .qi svg{width:17px;height:17px}
.quick strong{font-size:14.5px;letter-spacing:-.01em}
.quick span{font-size:12px;color:var(--ink-3);line-height:1.35}

/* ---------- métricas ---------- */
.metric{padding:15px 16px}
.metric .k{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.metric .v{font-size:27px;font-weight:700;letter-spacing:-.035em;margin-top:5px;font-variant-numeric:tabular-nums}
.metric .s{font-size:12px;color:var(--ink-3);margin-top:1px}
.v-ok{color:var(--brand)}
.v-bad{color:var(--wrong)}

/* ---------- mapa das 500 ---------- */
.mapa{display:flex;flex-wrap:wrap;gap:2.5px}
.cel{
  width:13px;height:13px;border-radius:2.5px;background:var(--line-2);
  border:1px solid rgba(15,31,43,.06);position:relative;
}
.cel.ok{background:var(--brand);border-color:var(--brand-dark)}
.cel.bad{background:var(--wrong);border-color:var(--wrong)}
.cel.fav::after{
  content:"";position:absolute;inset:auto -1px -1px auto;width:4px;height:4px;
  border-radius:50%;background:var(--star);
}
.legend{display:flex;gap:15px;flex-wrap:wrap;margin-top:13px;font-size:12px;color:var(--ink-2)}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block;margin-right:6px;vertical-align:-1px}

/* ---------- barras / progresso ---------- */
.bar{height:7px;border-radius:20px;background:var(--line-2);overflow:hidden;display:flex}
.bar > i{display:block;height:100%}
.bar .ok{background:var(--brand)}
.bar .bad{background:var(--wrong)}
.progress-top{
  position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
}
.progress-top .inner{
  max-width:1040px;margin:0 auto;padding:11px 26px 12px;
  display:flex;align-items:center;gap:14px;
}
.progress-top .lbl{font-size:13px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.progress-top .bar{flex:1}
.progress-top .pct{font-size:13px;font-weight:700;color:var(--brand);font-variant-numeric:tabular-nums}

/* ---------- questão ---------- */
.q-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.q-num{
  font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  background:var(--ink);color:#fff;padding:4px 10px;border-radius:20px;
}
.tag{
  font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:20px;
  background:var(--line-2);color:var(--ink-2);border:1px solid var(--line);
}
.tag-brand{background:var(--brand-soft);color:var(--brand-dark);border-color:#C3E0DA}
.star-btn{margin-left:auto;color:var(--ink-3);display:grid;place-items:center;padding:5px;border-radius:8px}
.star-btn svg{width:20px;height:20px}
.star-btn:hover{background:var(--line-2);color:var(--star)}
.star-btn.on{color:var(--star)}
.star-btn.on svg{fill:var(--star)}

.texto-base{
  font-family:var(--ff-read);font-size:15.5px;line-height:1.62;
  background:#FAFBFA;border:1px solid var(--line);border-left:3px solid var(--brand);
  padding:14px 16px;border-radius:8px;margin-bottom:16px;color:var(--ink);
}
.texto-base .tb-lbl{
  display:block;font-family:var(--ff-ui);font-size:10.5px;letter-spacing:.17em;
  text-transform:uppercase;color:var(--brand-dark);font-weight:700;margin-bottom:7px;
}
.enunciado{font-family:var(--ff-read);font-size:16.5px;line-height:1.58;margin:0 0 17px}

.alts{display:flex;flex-direction:column;gap:8px}
.alt{
  display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;
  padding:12px 13px;border:1.5px solid var(--line);border-radius:10px;
  background:var(--surface);transition:border-color .14s,background .14s;
  font-family:var(--ff-read);font-size:15.5px;line-height:1.48;
}
.alt:hover:not(:disabled){border-color:var(--ink-3);background:#FCFDFC}
.alt .letra{
  flex:0 0 26px;height:26px;border-radius:50%;border:1.5px solid var(--line);
  display:grid;place-items:center;font-family:var(--ff-ui);font-size:12.5px;font-weight:700;
  color:var(--ink-2);margin-top:-1px;
}
.alt.sel{border-color:var(--brand);background:var(--brand-soft)}
.alt.sel .letra{background:var(--brand);color:#fff;border-color:var(--brand)}
.alt.correta{border-color:var(--brand);background:var(--brand-soft)}
.alt.correta .letra{background:var(--brand);color:#fff;border-color:var(--brand)}
.alt.errada{border-color:var(--wrong);background:var(--wrong-soft)}
.alt.errada .letra{background:var(--wrong);color:#fff;border-color:var(--wrong)}
.alt:disabled{cursor:default;opacity:1}
.alt .mark{margin-left:auto;font-family:var(--ff-ui);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;padding-top:5px}
.alt.correta .mark{color:var(--brand-dark)}
.alt.errada .mark{color:var(--wrong)}

.feedback{margin-top:18px;border-radius:12px;padding:16px;border:1px solid}
.feedback.ok{background:var(--brand-soft);border-color:#BEDDD6}
.feedback.bad{background:var(--wrong-soft);border-color:#F0CBD3}
.feedback .fb-title{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:700;margin-bottom:9px}
.feedback.ok .fb-title{color:var(--brand-dark)}
.feedback.bad .fb-title{color:var(--wrong)}
.feedback .fb-lines{font-size:13.5px;color:var(--ink-2);margin-bottom:11px;display:flex;flex-wrap:wrap;gap:6px 18px}
.feedback .fb-lines b{color:var(--ink)}
.coment{
  background:rgba(255,255,255,.75);border-radius:9px;padding:13px 14px;
  font-family:var(--ff-read);font-size:15px;line-height:1.58;
}
.coment .c-lbl{
  display:block;font-family:var(--ff-ui);font-size:10.5px;letter-spacing:.17em;
  text-transform:uppercase;color:var(--ink-3);font-weight:700;margin-bottom:6px;
}

/* ---------- botões ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 20px;border-radius:10px;font-size:14.5px;font-weight:600;
  background:var(--brand);color:#fff;transition:background .15s,transform .1s;
  border:1.5px solid transparent;
}
.btn:hover{background:var(--brand-dark)}
.btn:active{transform:translateY(1px)}
.btn:disabled{background:var(--line);color:var(--ink-3);cursor:not-allowed}
.btn-ghost{background:transparent;color:var(--ink-2);border-color:var(--line)}
.btn-ghost:hover{background:var(--line-2);color:var(--ink)}
.btn-dark{background:var(--ink)}
.btn-dark:hover{background:#1E3646}
.btn-sm{padding:7px 13px;font-size:13px;border-radius:8px}
.btn-wide{width:100%}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;align-items:center}
.actions .spacer{flex:1}

/* ---------- chips / seleção ---------- */
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  padding:7px 13px;border-radius:20px;border:1.5px solid var(--line);
  background:var(--surface);font-size:13px;font-weight:600;color:var(--ink-2);
  transition:all .14s;
}
.chip:hover{border-color:var(--ink-3)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip small{font-weight:500;opacity:.65;margin-left:5px;font-variant-numeric:tabular-nums}

.mat-list{display:grid;gap:10px;grid-template-columns:repeat(2,1fr)}
.mat{
  text-align:left;padding:15px 16px;border-radius:var(--radius);border:1px solid var(--line);
  background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;
  transition:transform .15s,border-color .15s;
}
.mat:hover{transform:translateY(-2px);border-color:var(--brand)}
.mat .mat-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.mat .mat-name{font-size:15px;font-weight:700;letter-spacing:-.012em;line-height:1.25}
.mat .mat-blocos{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.mat .mat-pct{font-size:20px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.mat .mat-stats{display:flex;gap:14px;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.mat .mat-stats b{color:var(--ink-2);font-weight:700}

/* ---------- tabela ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{
  text-align:left;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-3);font-weight:700;padding:0 10px 9px;border-bottom:1px solid var(--line);
}
.tbl td{padding:11px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl td.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl th.num{text-align:right}
.tbl .nome{font-weight:600}

/* ---------- badges de nível ---------- */
.lv{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap;display:inline-block}
.lv-0{background:var(--wrong-soft);color:var(--wrong)}
.lv-1{background:var(--amber-soft);color:var(--amber)}
.lv-2{background:var(--brand-soft);color:var(--brand-dark)}
.lv-3{background:var(--ink);color:#fff}
.lv-x{background:var(--line-2);color:var(--ink-3)}

/* ---------- painel de navegação do simulado ---------- */
.palette{display:flex;flex-wrap:wrap;gap:5px}
.pal{
  width:31px;height:31px;border-radius:7px;border:1.5px solid var(--line);
  background:var(--surface);font-size:12.5px;font-weight:700;color:var(--ink-2);
  font-variant-numeric:tabular-nums;transition:all .12s;
}
.pal:hover{border-color:var(--ink-3)}
.pal.done{background:var(--ink);color:#fff;border-color:var(--ink)}
.pal.now{outline:2.5px solid var(--brand);outline-offset:1.5px}
.pal.ok{background:var(--brand);border-color:var(--brand);color:#fff}
.pal.bad{background:var(--wrong);border-color:var(--wrong);color:#fff}

/* ---------- resultado ---------- */
.score{display:flex;align-items:center;gap:26px;flex-wrap:wrap}
.donut{flex:0 0 auto}
.score-nums{display:flex;gap:26px;flex-wrap:wrap}
.score-nums div span{display:block;font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.score-nums div b{font-size:25px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}

/* ---------- recomendações ---------- */
.rec{
  display:flex;gap:12px;padding:14px 15px;border-radius:11px;border:1px solid var(--line);
  background:var(--surface);align-items:flex-start;
}
.rec .rec-i{flex:0 0 30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:15px}
.rec p{margin:0;font-size:13.5px;color:var(--ink-2);line-height:1.45}
.rec p b{color:var(--ink)}
.rec.r0{background:var(--wrong-soft);border-color:#F0CBD3}
.rec.r0 .rec-i{background:#fff;color:var(--wrong)}
.rec.r1{background:var(--amber-soft);border-color:#EBD9BC}
.rec.r1 .rec-i{background:#fff;color:var(--amber)}
.rec.r2,.rec.r3{background:var(--brand-soft);border-color:#BEDDD6}
.rec.r2 .rec-i,.rec.r3 .rec-i{background:#fff;color:var(--brand-dark)}

/* ---------- listas ---------- */
.item{
  display:flex;gap:13px;padding:14px 15px;border-bottom:1px solid var(--line-2);
  align-items:flex-start;
}
.item:last-child{border-bottom:none}
.item .it-main{flex:1;min-width:0}
.item .it-title{font-size:14px;font-weight:600;line-height:1.35;margin:0 0 5px}
.item .it-meta{font-size:12px;color:var(--ink-3);display:flex;gap:13px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.item .it-side{display:flex;gap:7px;align-items:center;flex-shrink:0}
.trunc{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.empty{text-align:center;padding:52px 22px;color:var(--ink-3)}
.empty .e-ico{font-size:31px;margin-bottom:11px;opacity:.55}
.empty h3{color:var(--ink-2);margin-bottom:5px}
.empty p{margin:0 auto 16px;max-width:42ch;font-size:13.5px}

/* ---------- formulário do simulado ---------- */
.field{margin-bottom:22px}
.field > label{
  display:block;font-size:11px;letter-spacing:.15em;text-transform:uppercase;
  font-weight:700;color:var(--ink-3);margin-bottom:9px;
}
.qty{display:flex;flex-wrap:wrap;gap:7px}
.qty button{
  min-width:52px;padding:9px 12px;border-radius:9px;border:1.5px solid var(--line);
  background:var(--surface);font-weight:700;font-size:14px;color:var(--ink-2);
  font-variant-numeric:tabular-nums;transition:all .13s;
}
.qty button:hover{border-color:var(--ink-3)}
.qty button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.qty button:disabled{opacity:.35;cursor:not-allowed}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{padding:9px 16px;font-size:13.5px;font-weight:600;color:var(--ink-2)}
.seg button.on{background:var(--ink);color:#fff}
.summary-bar{
  position:sticky;bottom:0;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);padding:14px 16px;display:flex;align-items:center;gap:14px;
  box-shadow:var(--shadow-lg);flex-wrap:wrap;
}
.summary-bar .sb-txt{font-size:13.5px;color:var(--ink-2);flex:1;min-width:180px}
.summary-bar .sb-txt b{color:var(--ink);font-variant-numeric:tabular-nums}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);
  background:var(--ink);color:#fff;padding:11px 19px;border-radius:11px;
  font-size:13.5px;font-weight:600;box-shadow:var(--shadow-lg);z-index:200;
  opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;
}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- modal ---------- */
.modal-bg{
  position:fixed;inset:0;background:rgba(15,31,43,.5);z-index:150;
  display:grid;place-items:center;padding:20px;
}
.modal{
  background:var(--surface);border-radius:var(--radius);max-width:430px;width:100%;
  padding:22px;box-shadow:var(--shadow-lg);
}
.modal h3{font-size:17px;margin-bottom:7px}
.modal p{font-size:13.5px;color:var(--ink-2);margin:0 0 18px;line-height:1.5}

/* ---------- gráficos ---------- */
.chart-wrap{overflow-x:auto}
svg.chart{display:block;max-width:100%;height:auto}
.axis{stroke:var(--line);stroke-width:1}
.gridline{stroke:var(--line-2);stroke-width:1}
.lbl-sm{font-size:10px;fill:var(--ink-3);font-family:var(--ff-ui);font-weight:600}
.lbl-val{font-size:10.5px;fill:var(--ink-2);font-family:var(--ff-ui);font-weight:700}

/* ---------- nav inferior (mobile) ---------- */
.bottom{display:none}

@media (max-width:900px){
  .g4{grid-template-columns:repeat(2,1fr)}
  .g3{grid-template-columns:repeat(2,1fr)}
  .quick{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:780px){
  .rail{display:none}
  .wrap{padding:20px 15px 96px}
  .progress-top .inner{padding:10px 15px 11px}

<script>window.__QUESTOES__ = [{"id":1,"numero":1,"bloco":1,"materia":"Língua Portuguesa","texto_base":"A segurança nos estabelecimentos penais não se resume ao emprego da força física ou ao aparato tecnológico de vigilância. Ela se constrói, primordialmente, por meio de procedimentos operacionais padronizados e da argúcia dos policiais penais em antecipar cenários de crise. A rotina do cárcere exige atenção perene. Um detalhe negligenciado na tranca de uma galeria ou na contagem matinal dos custodiados pode romper o equilíbrio frágil que mantém a ordem nos pavilhões. Portanto, a disciplina rigorosa e a observância estrita dos regulamentos internos funcionam como o principal escudo contra a subversão da ordem no ambiente prisional.","enunciado":"Com base na leitura atenta do texto apresentado, assinale a alternativa que expressa fielmente a ideia central defendida pelo autor.","alternativas":{"A":"O aparato tecnológico de vigilância é o único fator capaz de garantir a integridade física dos policiais penais no plantão.","B":"A segurança prisional depende essencialmente da padronização de procedimentos e da atenção constante dos servidores aos detalhes da rotina.","C":"O uso da força física qualifica-se como o mecanismo mais eficiente e rotineiro para a manutenção da ordem nos estabelecimentos penais.","D":"O equilíbrio nos pavilhões é robusto o suficiente para suportar pequenas falhas operacionais humanas durante as revistas de rotina.","E":"Os regulamentos internos dos presídios são secundários quando comparados à intuição e à experiência empírica dos policiais de plantão."},"resposta_correta":"B","comentario":"O texto afirma categoricamente que a segurança se constrói por procedimentos padronizados e atenção perene aos detalhes da rotina, refutando a ideia de que dependa apenas de força física ou tecnologia isolada."},{"id":2,"numero":2,"bloco":1,"materia":"Língua Portuguesa","texto_base":"A segurança nos estabelecimentos penais não se resume ao emprego da força física ou ao aparato tecnológico de vigilância. Ela se constrói, primordialmente, por meio de procedimentos operacionais padronizados e da argúcia dos policiais penais em antecipar cenários de crise. A rotina do cárcere exige atenção perene. Um detalhe negligenciado na tranca de uma galeria ou na contagem matinal dos custodiados pode romper o equilíbrio frágil que mantém a ordem nos pavilhões. Portanto, a disciplina rigorosa e a observância estrita dos regulamentos internos funcionam como o principal escudo contra a subversão da ordem no ambiente prisional.","enunciado":"No fragmento: \"Portanto, a disciplina rigorosa e a observância estrita dos regulamentos internos funcionam como o principal escudo...\", o conectivo em destaque estabelece, no contexto em que está inserido, uma relação de:","alternativas":{"A":"concessão.","B":"explicação.","C":"conclusão.","D":"oposição.","E":"finalidade."},"resposta_correta":"C","comentario":"O conectivo \"Portanto\" possui natureza coordenativa conclusiva, fechando o raciocínio lógico desenvolvido nos períodos anteriores sobre as rotinas de segurança."},{"id":3,"numero":3,"bloco":1,"materia":"Língua Portuguesa","texto_base":"A segurança nos estabelecimentos penais não se resume ao emprego da força física ou ao aparato tecnológico de vigilância. Ela se constrói, primordialmente, por meio de procedimentos operacionais padronizados e da argúcia dos policiais penais em antecipar cenários de crise. A rotina do cárcere exige atenção perene. Um detalhe negligenciado na tranca de uma galeria ou na contagem matinal dos custodiados pode romper o equilíbrio frágil que mantém a ordem nos pavilhões. Portanto, a disciplina rigorosa e a observância estrita dos regulamentos internos funcionam como o principal escudo contra a subversão da ordem no ambiente prisional.","enunciado":"Assinale a alternativa em que a palavra indicada desempenha a função de adjetivo no texto.","alternativas":{"A":"\"segurança\"","B":"\"tecnológico\"","C":"\"não\"","D":"\"mantém\"","E":"\"pavilhões\""},"resposta_correta":"B","comentario":"A palavra \"tecnológico\" qualifica o substantivo \"aparato\", desempenhando papel gramatical de adjetivo."},{"id":4,"numero":4,"bloco":1,"materia":"Língua Portuguesa","texto_base":"A segurança nos estabelecimentos penais não se resume ao emprego da força física ou ao aparato tecnológico de vigilância. Ela se constrói, primordialmente, por meio de procedimentos operacionais padronizados e da argúcia dos policiais penais em antecipar cenários de crise. A rotina do cárcere exige atenção perene. Um detalhe negligenciado na tranca de uma galeria ou na contagem matinal dos custodiados pode romper o equilíbrio frágil que mantém a ordem nos pavilhões. Portanto, a disciplina rigorosa e a observância estrita dos regulamentos internos funcionam como o principal escudo contra a subversão da ordem no ambiente prisional.","enunciado":"Em: \"Um detalhe negligenciado na tranca de uma galeria ou na contagem matinal dos custodiados pode romper o equilíbrio frágil...\", o verbo sublinhado indica uma ideia de:","alternativas":{"A":"obrigação impositiva.","B":"capacidade adquirida.","C":"possibilidade ou risco.","D":"desejo futuro.","E":"ação concluída no passado."},"resposta_correta":"C","comentario":"No contexto de um detalhe negligenciado romper a tranca, o verbo modal \"pode\" indica uma possibilidade ou risco real, e não uma obrigação ou desejo."},{"id":5,"numero":5,"bloco":1,"materia":"Língua Portuguesa","texto_base":"A segurança nos estabelecimentos penais não se resume ao emprego da força física ou ao aparato tecnológico de vigilância. Ela se constrói, primordialmente, por meio de procedimentos operacionais padronizados e da argúcia dos policiais penais em antecipar cenários de crise. A rotina do cárcere exige atenção perene. Um detalhe negligenciado na tranca de uma galeria ou na contagem matinal dos custodiados pode romper o equilíbrio frágil que mantém a ordem nos pavilhões. Portanto, a disciplina rigorosa e a observância estrita dos regulamentos internos funcionam como o principal escudo contra a subversão da ordem no ambiente prisional.","enunciado":"Considere a frase: \"A rotina do cárcere exige atenção perene.\" Caso a palavra \"atenção\" seja substituída por \"cuidados\", mantendo-se o sentido original, a concordância correta do trecho será:","alternativas":{"A":"A rotina do cárcere exige cuidados perene.","B":"A rotina do cárcere exige cuidados perenes.","C":"A rotina do cárcere exige cuidados perenados.","D":"A rotina do cárcere exige cuidados perenemente.","E":"A rotina do cárcere exigem cuidados perenes."},"resposta_correta":"B","comentario":"A palavra \"perene\" é um adjetivo uniforme. Ao concordar com o substantivo plural \"cuidados\", assume a forma plural \"perenes\"."},{"id":6,"numero":6,"bloco":1,"materia":"Língua Portuguesa","texto_base":"A ressocialização dos indivíduos privados de liberdade é um dos objetivos fundamentais da execução penal, embora muitos cidadãos olhem essa diretriz com ceticismo. O trabalho e o estudo intramuros funcionam como ferramentas de transformação social. Quando o Estado oferece condições para que o apenado aprenda um ofício ou conclua sua escolaridade, ele diminui drasticamente as chances de reincidência criminal. Conquanto o desafio seja monumental devido à superlotação e à falta de infraestrutura, os resultados de projetos bem-sucedidos comprovam que o investimento no ser humano é o caminho mais seguro para a pacificação social.","enunciado":"De acordo com o texto, a redução das taxas de reincidência criminal está diretamente associada ao(à):","alternativas":{"A":"aumento do rigor das penas e ao isolamento prolongado dos sentenciados.","B":"ceticismo da sociedade civil em relação à capacidade de regeneração humana.","C":"oferta de oportunidades de trabalho e estudo para os detentos durante o cumprimento da pena.","D":"investimento financeiro exclusivo na modernização das muralhas e das trancas prisionais.","E":"transferência compulsória de presos lideranças para unidades de segurança máxima."},"resposta_correta":"C","comentario":"O texto associa explicitamente a diminuição das chances de reincidência ao aprendizado de um ofício (trabalho) e à conclusão da escolaridade (estudo)."},{"id":7,"numero":7,"bloco":1,"materia":"Língua Portuguesa","texto_base":"A ressocialização dos indivíduos privados de liberdade é um dos objetivos fundamentais da execução penal, embora muitos cidadãos olhem essa diretriz com ceticismo. O trabalho e o estudo intramuros funcionam como ferramentas de transformação social. Quando o Estado oferece condições para que o apenado aprenda um ofício ou conclua sua escolaridade, ele diminui drasticamente as chances de reincidência criminal. Conquanto o desafio seja monumental devido à superlotação e à falta de infraestrutura, os resultados de projetos bem-sucedidos comprovam que o investimento no ser humano é o caminho mais seguro para a pacificação social.","enunciado":"No trecho: \"Conquanto o desafio seja monumental devido à superlotação...\", a conjunção destacada introduz uma oração com valor:","alternativas":{"A":"causal.","B":"concessivo.","C":"temporal.","D":"condicional.","E":"consecutivo."},"resposta_correta":"B","comentario":"A conjunção subordinativa \"Conquanto\" é de natureza concessiva, equivalendo a \"embora\" ou \"ainda que\"."},{"id":8,"numero":8,"bloco":1,"materia":"Língua Portuguesa","texto_base":"A ressocialização dos indivíduos privados de liberdade é um dos objetivos fundamentais da execução penal, embora muitos cidadãos olhem essa diretriz com ceticismo. O trabalho e o estudo intramuros funcionam como ferramentas de transformação social. Quando o Estado oferece condições para que o apenado aprenda um ofício ou conclua sua escolaridade, ele diminui drasticamente as chances de reincidência criminal. Conquanto o desafio seja monumental devido à superlotação e à falta de infraestrutura, os resultados de projetos bem-sucedidos comprovam que o investimento no ser humano é o caminho mais seguro para a pacificação social.","enunciado":"Assinale a alternativa que apresenta um sinônimo adequado e contextualmente correto para a palavra \"ceticismo\", utilizada no primeiro período do texto.","alternativas":{"A":"entusiasmo","B":"indiferença","C":"desconfiança","D":"aprovação","E":"ingenuidade"},"resposta_correta":"C","comentario":"O ceticismo caracteriza um estado de dúvida, descrença ou desconfiança em relação a uma afirmação ou diretriz."},{"id":9,"numero":9,"bloco":1,"materia":"Língua Portuguesa","texto_base":"A ressocialização dos indivíduos privados de liberdade é um dos objetivos fundamentais da execução penal, embora muitos cidadãos olhem essa diretriz com ceticismo. O trabalho e o estudo intramuros funcionam como ferramentas de transformação social. Quando o Estado oferece condições para que o apenado aprenda um ofício ou conclua sua escolaridade, ele diminui drasticamente as chances de reincidência criminal. Conquanto o desafio seja monumental devido à superlotação e à falta de infraestrutura, os resultados de projetos bem-sucedidos comprovam que o investimento no ser humano é o caminho mais seguro para a pacificação social.","enunciado":"No período: \"Quando o Estado oferece condições para que o apenado aprenda um ofício ou conclua sua escolaridade, ele diminui drasticamente as chances...\", o pronome destacado refere-se semanticamente a:","alternativas":{"A":"\"o apenado\".","B":"\"um ofício\".","C":"\"o Estado\".","D":"\"sua escolaridade\".","E":"\"as chances\"."},"resposta_correta":"C","comentario":"O pronome pessoal \"ele\" retoma anaforicamente o sujeito da oração anterior, que é \"o Estado\" (quem oferece as condições e diminui as chances)."},{"id":10,"numero":10,"bloco":1,"materia":"Língua Portuguesa","texto_base":"A ressocialização dos indivíduos privados de liberdade é um dos objetivos fundamentais da execução penal, embora muitos cidadãos olhem essa diretriz com ceticismo. O trabalho e o estudo intramuros funcionam como ferramentas de transformação social. Quando o Estado oferece condições para que o apenado aprenda um ofício ou conclua sua escolaridade, ele diminui drasticamente as chances de reincidência criminal. Conquanto o desafio seja monumental devido à superlotação e à falta de infraestrutura, os resultados de projetos bem-sucedidos comprovam que o investimento no ser humano é o caminho mais seguro para a pacificação social.","enunciado":"Analise a regência do verbo \"olhar\" em: \"...embora muitos cidadãos olhem essa diretriz com ceticismo.\" Se substituirmos \"olhem\" pelo verbo \"assistam\" (no sentido de ver/presenciar), de acordo com a norma- padrão da língua, o trecho deverá ser reescrito da seguinte forma:","alternativas":{"A":"...embora muitos cidadãos assistam essa diretriz com ceticismo.","B":"...embora muitos cidadãos assistam à essa diretriz com ceticismo.","C":"...embora muitos cidadãos assistam a essa diretriz com ceticismo.","D":"...embora muitos cidadãos assistam com essa diretriz com ceticismo.","E":"...embora muitos cidadãos assistam na essa diretriz com ceticismo."},"resposta_correta":"C","comentario":"O verbo \"assistir\", no sentido de ver ou presenciar, rege preposição \"a\" (transitivo indireto). Como \"diretriz\" é precedido pelo pronome demonstrativo \"essa\", não ocorre crase (apenas a preposição \"a\")."},{"id":11,"numero":11,"bloco":1,"materia":"Língua Portuguesa","texto_base":"A implantação da cadeia de custódia no processo penal brasileiro gerou profundas modificações na rotina das forças de segurança. Desde a entrada em vigor do Pacote Anticrime, todo vestígio material deixado por uma infração penal precisa ser coletado e preservado com rigor científico. Se o policial de plantão violar o isolamento do local de crime ou romper o lacre do recipiente de coleta sem a devida justificativa técnica, colocará em risco a idoneidade da prova. A quebra da cadeia de custódia gera a nulidade dos elementos colhidos, impedindo que o juiz os utilize para fundamentar uma condenação. Portanto, o profissionalismo na manipulação das evidências tornou-se um dever intransigente.","enunciado":"A leitura do texto permite concluir corretamente que a quebra da cadeia de custódia acarreta:","alternativas":{"A":"a aceleração do andamento do inquérito policial civil.","B":"a invalidação jurídica da prova coletada no local do crime.","C":"a promoção automática do policial penal responsável pela revista.","D":"o aumento da pena aplicada ao acusado na sentença definitiva.","E":"a obrigatoriedade de realização de novo julgamento pelo Tribunal do Júri."},"resposta_correta":"B","comentario":"O texto esclarece que a quebra da cadeia de custódia acarreta a nulidade dos elementos colhidos, o que juridicamente invalida a prova para fins de fundamentação de sentença condenatória."},{"id":12,"numero":12,"bloco":1,"materia":"Língua Portuguesa","texto_base":"A implantação da cadeia de custódia no processo penal brasileiro gerou profundas modificações na rotina das forças de segurança. Desde a entrada em vigor do Pacote Anticrime, todo vestígio material deixado por uma infração penal precisa ser coletado e preservado com rigor científico. Se o policial de plantão violar o isolamento do local de crime ou romper o lacre do recipiente de coleta sem a devida justificativa técnica, colocará em risco a idoneidade da prova. A quebra da cadeia de custódia gera a nulidade dos elementos colhidos, impedindo que o juiz os utilize para fundamentar uma condenação. Portanto, o profissionalismo na manipulação das evidências tornou-se um dever intransigente.","enunciado":"No trecho: \"Se o policial de plantão violar o isolamento do local de crime...\", a palavra em destaque estabelece uma relação de:","alternativas":{"A":"tempo.","B":"causa.","C":"proporção.","D":"condição.","E":"conformidade."},"resposta_correta":"D","comentario":"A conjunção subordinativa \"Se\" introduz uma oração condicional, indicando uma hipótese para que o risco à idoneidade ocorra."},{"id":13,"numero":13,"bloco":1,"materia":"Língua Portuguesa","texto_base":"A implantação da cadeia de custódia no processo penal brasileiro gerou profundas modificações na rotina das forças de segurança. Desde a entrada em vigor do Pacote Anticrime, todo vestígio material deixado por uma infração penal precisa ser coletado e preservado com rigor científico. Se o policial de plantão violar o isolamento do local de crime ou romper o lacre do recipiente de coleta sem a devida justificativa técnica, colocará em risco a idoneidade da prova. A quebra da cadeia de custódia gera a nulidade dos elementos colhidos, impedindo que o juiz os utilize para fundamentar uma condenação. Portanto, o profissionalismo na manipulação das evidências tornou-se um dever intransigente.","enunciado":"Assinale a opção em que a palavra retirada do texto é acentuada graficamente pela mesma regra que justifica o acento em \"idônea\" (ou \"idoneidade\", considerando sua palavra cognata \"idôneo\"). Para fins desta questão, analise a palavra idôneo:","alternativas":{"A":"\"científico\"","B":"\"evidências\"","C":"\"país\"","D":"\"é\"","E":"\"tornou-se\""},"resposta_correta":"B","comentario":"A palavra \"idôneo\" é uma paroxítona terminada em ditongo crescente, mesma regra de acentuação gráfica que rege a palavra \"evidências\"."},{"id":14,"numero":14,"bloco":1,"materia":"Língua Portuguesa","texto_base":"A implantação da cadeia de custódia no processo penal brasileiro gerou profundas modificações na rotina das forças de segurança. Desde a entrada em vigor do Pacote Anticrime, todo vestígio material deixado por uma infração penal precisa ser coletado e preservado com rigor científico. Se o policial de plantão violar o isolamento do local de crime ou romper o lacre do recipiente de coleta sem a devida justificativa técnica, colocará em risco a idoneidade da prova. A quebra da cadeia de custódia gera a nulidade dos elementos colhidos, impedindo que o juiz os utilize para fundamentar uma condenação. Portanto, o profissionalismo na manipulação das evidências tornou-se um dever intransigente.","enunciado":"Em: \"...todo vestígio material deixado por uma infração penal precisa ser coletado e preservado com rigor científico.\", a expressão sublinhada desempenha a função sintática de:","alternativas":{"A":"agente da passiva.","B":"objeto direto.","C":"sujeito indeterminado.","D":"adjunto adverbial de lugar.","E":"aposto explicativo."},"resposta_correta":"A","comentario":"Na voz passiva analítica (\"precisa ser coletado e preservado por...\"), a expressão introduzida pela preposição \"por\" indica o agente executor da ação, qualificando-se como agente da passiva."},{"id":15,"numero":15,"bloco":1,"materia":"Língua Portuguesa","texto_base":"A implantação da cadeia de custódia no processo penal brasileiro gerou profundas modificações na rotina das forças de segurança. Desde a entrada em vigor do Pacote Anticrime, todo vestígio material deixado por uma infração penal precisa ser coletado e preservado com rigor científico. Se o policial de plantão violar o isolamento do local de crime ou romper o lacre do recipiente de coleta sem a devida justificativa técnica, colocará em risco a idoneidade da prova. A quebra da cadeia de custódia gera a nulidade dos elementos colhidos, impedindo que o juiz os utilize para fundamentar uma condenação. Portanto, o profissionalismo na manipulação das evidências tornou-se um dever intransigente.","enunciado":"Considere a frase: \"A quebra da cadeia de custódia gera a nulidade dos elementos colhidos...\" Caso o termo \"A quebra\" seja pluralizado para \"As quebras\", quantas outras palavras do período correspondente (até \"colhidos\") deverão obrigatoriamente sofrer alteração para se adequarem às regras de concordância verbal e nominal?","alternativas":{"A":"Uma.","B":"Duas.","C":"Três.","D":"Quatro.","E":"Nenhuma."},"resposta_correta":"B","comentario":"Alterando para \"As quebras\", o verbo deve ir para o plural (\"geram\") e o adjetivo que determina a cadeia deve ajustar-se (\"colhidos\" não muda pois refere-se a elementos, mas \"geram\" e o artigo mudam. Contando do início até colhidos, mudam o artigo \"As\" e o verbo \"geram\" $\\rightarrow$ duas palavras)."},{"id":16,"numero":16,"bloco":1,"materia":"Língua Portuguesa","texto_base":null,"enunciado":"Assinale a alternativa que apresenta perfeita concordância verbal, de acordo com as exigências da norma-padrão da Língua Portuguesa.","alternativas":{"A":"Faziam dez meses que os novos policiais penais aguardavam a escala de férias.","B":"Sobrou, após a revista rigorosa nas celas, duas facas artesanais e três chips de celular.","C":"Devem haver bastantes motivos para o isolamento preventivo daquela ala carcerária.","D":"Mais de um detento tentou ludibriar a contagem matinal durante o plantão de ontem.","E":"Fomos nós que realizou a escolta tática do preso de alta periculosidade até o fórum."},"resposta_correta":"D","comentario":"Com a expressão \"mais de um\", o verbo concorda com o numeral (\"um\" $\\rightarrow$ \"tentou\"). As demais alternativas apresentam erros clássicos: \"Faziam\" (impessoal, correto: fazia), \"Sobrou\" (correto: sobraram), \"Devem haver\" (haver impessoal contamina o auxiliar, correto: deve haver)."},{"id":17,"numero":17,"bloco":1,"materia":"Língua Portuguesa","texto_base":null,"enunciado":"A ocorrência do sinal indicativo de crase está em total conformidade com a norma-padrão da língua na seguinte alternativa:","alternativas":{"A":"A equipe tática de intervenção prisional permaneceu à distância de segurança das grades.","B":"O diretor da unidade prisional potiguar dirigiu-se à Vossa Excelência com absoluto respeito.","C":"Os novos equipamentos de rádio foram entregues à policiais de plantão na muralha externa.","D":"Após receber o alvará de soltura, o custodiado começou à caminhar em direção à saída.","E":"A instrução operacional sobre uso de armamento foi ministrada de segunda à sexta- feira."},"resposta_correta":"A","comentario":"A expressão \"à distância de segurança\" está qualificada, o que exige o uso do sinal indicativo de crase. É proibida crase antes de pronome de tratamento (B), antes de masculino (C), antes de verbo (D) e entre palavras repetidas/intervalos numéricos puros (E)."},{"id":18,"numero":18,"bloco":1,"materia":"Língua Portuguesa","texto_base":null,"enunciado":"A pontuação é um recurso essencial para a clareza e a correta articulação das ideias no texto. Assinale a alternativa em que o uso das vírgulas atende estritamente às normas gramaticais.","alternativas":{"A":"O policial penal, que agiu com rapidez conteve o motim no pavilhão central.","B":"Ontem à noite, os agentes de segurança realizaram, uma revista detalhada nas celas de isolamento.","C":"Diante do perigo iminente, a equipe tática solicitou reforço, ao comando da operação carcerária.","D":"Os relatórios de comportamento dos detentos, embora fundamentais para os benefícios, atrasaram.","E":"Preocupados com a segurança, os diretores das unidades, convocaram uma reunião extraordinária."},"resposta_correta":"D","comentario":"As vírgulas isolam corretamente a oração subordinada adverbial concessiva intercalada (\"embora fundamentais para os benefícios\"). Nas demais opções, há separação incorreta de sujeito e predicado ou verbo e complemento."},{"id":19,"numero":19,"bloco":1,"materia":"Língua Portuguesa","texto_base":null,"enunciado":"A frase em que a regência nominal ou verbal contraria os preceitos da norma-padrão da Língua Portuguesa é:","alternativas":{"A":"O policial penal prefere trabalhar na fiscalização das oficinas a atuar no setor burocrático.","B":"A equipe de inteligência prisional informou o diretor sobre os riscos de fuga na ala leste.","C":"Os detentos do regime semiaberto demonstraram profunda antipatia com o novo regulamento.","D":"Este é o regulamento disciplinar carcerário a que os novos custodiados devem obedecer.","E":"O servidor público estadual aspira o cargo de coordenador operacional do sistema prisional."},"resposta_correta":"E","comentario":"O verbo \"aspirar\", no sentido de desejar ou ter como objetivo, é transitivo indireto e exige a preposição \"a\" (o correto seria \"aspira ao cargo\")."},{"id":20,"numero":20,"bloco":1,"materia":"Língua Portuguesa","texto_base":null,"enunciado":"Assinale a alternativa em que o pronome oblíquo átono foi colocado em posição que atende às normas de colocação pronominal da língua culta.","alternativas":{"A":"Nunca esqueça-se de conferir os cadeados das celas antes do encerramento do plantão matinal.","B":"Conceder-se-á o benefício da saída temporária ao apenado que preencher os requisitos da lei.","C":"Os agentes de segurança pública se empenharam ao máximo para conter a subversão da ordem.","D":"Alguém informou-me sobre a chegada extraordinária do juiz corregedor da execução penal.","E":"Quando percebeu a movimentação estranha, o policial penal direcionou-se ao pavilhão."},"resposta_correta":"B","comentario":"O uso da mesóclise é obrigatório e correto em início de período com o verbo no futuro do presente (\"Conceder-se-á\"). Nas demais opções, há palavras atrativas exigindo próclise (\"Nunca se esqueça\", \"público se empenharam\", \"Alguém me informou\")."},{"id":21,"numero":21,"bloco":1,"materia":"Língua Portuguesa","texto_base":"O uso de algemas durante a movimentação de presos é um procedimento essencial para a segurança dos policiais penais e a prevenção de fugas, contudo, sua aplicação não pode ser discricionária ou abusiva. A Súmula Vinculante 11 do Supremo Tribunal Federal balizou a atuação do Estado ao exigir justificativa por escrito para o emprego do artefato. A força policial legítima manifesta-se pela técnica e pelo respeito aos limites legais. Quando o servidor atua movido pelo capricho pessoal ou pelo desejo de impor humilhação desnecessária ao custodiado, ele transmuda o ato de segurança em crime de abuso de autoridade. Portanto, a legalidade deve guiar cada ação operacional intramuros.","enunciado":"O autor do texto defende que o emprego de algemas na rotina penitenciária:","alternativas":{"A":"deve ser abolido por completo para evitar alegações de crime de abuso de autoridade.","B":"qualifica-se como um ato livre do policial de plantão, dispensando justificativas formais.","C":"é um procedimento de segurança legítimo, desde que amparado em justificativa por escrito e limites legais.","D":"serve como instrumento punitivo imediato contra detentos com mau comportamento carcerário.","E":"atende a critérios estritamente políticos definidos pelas secretarias de direitos humanos."},"resposta_correta":"C","comentario":"O texto afirma claramente que as algemas são essenciais para a segurança, mas condiciona sua legitimidade à observância dos limites legais e à justificativa por escrito."},{"id":22,"numero":22,"bloco":1,"materia":"Língua Portuguesa","texto_base":"O uso de algemas durante a movimentação de presos é um procedimento essencial para a segurança dos policiais penais e a prevenção de fugas, contudo, sua aplicação não pode ser discricionária ou abusiva. A Súmula Vinculante 11 do Supremo Tribunal Federal balizou a atuação do Estado ao exigir justificativa por escrito para o emprego do artefato. A força policial legítima manifesta-se pela técnica e pelo respeito aos limites legais. Quando o servidor atua movido pelo capricho pessoal ou pelo desejo de impor humilhação desnecessária ao custodiado, ele transmuda o ato de segurança em crime de abuso de autoridade. Portanto, a legalidade deve guiar cada ação operacional intramuros.","enunciado":"No período: \"O uso de algemas durante a movimentação de presos é um procedimento essencial para a segurança dos policiais penais e a prevenção de fugas, contudo, sua aplicação não pode ser discricionária...\", a conjunção em destaque pode ser substituída, sem alteração do sentido original, por:","alternativas":{"A":"porquanto.","B":"entretanto.","C":"conquanto.","D":"portanto.","E":"dessarte."},"resposta_correta":"B","comentario":"A conjunção \"contudo\" possui valor coordenativo adversativo (oposição), podendo ser perfeitamente substituída por \"entretanto\", \"todavia\" ou \"mas\"."},{"id":23,"numero":23,"bloco":1,"materia":"Língua Portuguesa","texto_base":"O uso de algemas durante a movimentação de presos é um procedimento essencial para a segurança dos policiais penais e a prevenção de fugas, contudo, sua aplicação não pode ser discricionária ou abusiva. A Súmula Vinculante 11 do Supremo Tribunal Federal balizou a atuação do Estado ao exigir justificativa por escrito para o emprego do artefato. A força policial legítima manifesta-se pela técnica e pelo respeito aos limites legais. Quando o servidor atua movido pelo capricho pessoal ou pelo desejo de impor humilhação desnecessária ao custodiado, ele transmuda o ato de segurança em crime de abuso de autoridade. Portanto, a legalidade deve guiar cada ação operacional intramuros.","enunciado":"Assinale a opção em que a classe gramatical da palavra sublinhada foi classificada incorretamente entre parênteses.","alternativas":{"A":"\"...procedimento essencial para a segurança...\" (Adjetivo)","B":"\"...sua aplicação não pode ser discricionária...\" (Adjetivo)","C":"\"...exigir justificativa por escrito para o emprego do artefato.\" (Substantivo)","D":"\"...ele transmuda o ato de segurança em crime...\" (Verbo)","E":"\"Portanto, a legalidade deve guiar cada ação...\" (Advérbio)"},"resposta_correta":"E","comentario":"A palavra \"Portanto\" é uma conjunção coordenativa conclusiva, e não um advérbio de modo ou tempo."},{"id":24,"numero":24,"bloco":1,"materia":"Língua Portuguesa","texto_base":"O uso de algemas durante a movimentação de presos é um procedimento essencial para a segurança dos policiais penais e a prevenção de fugas, contudo, sua aplicação não pode ser discricionária ou abusiva. A Súmula Vinculante 11 do Supremo Tribunal Federal balizou a atuação do Estado ao exigir justificativa por escrito para o emprego do artefato. A força policial legítima manifesta-se pela técnica e pelo respeito aos limites legais. Quando o servidor atua movido pelo capricho pessoal ou pelo desejo de impor humilhação desnecessária ao custodiado, ele transmuda o ato de segurança em crime de abuso de autoridade. Portanto, a legalidade deve guiar cada ação operacional intramuros.","enunciado":"Em: \"A Súmula Vinculante 11 do Supremo Tribunal Federal balizou a atuação do Estado...\", o verbo em destaque possui, no contexto, o mesmo sentido de:","alternativas":{"A":"ignorou.","B":"delimitou.","C":"incentivou.","D":"paralisou.","E":"criticou."},"resposta_correta":"B","comentario":"\"Balizar\" possui o sentido técnico e contextual de demarcar, fixar balizas ou delimitar a atuação de algo."},{"id":25,"numero":25,"bloco":1,"materia":"Língua Portuguesa","texto_base":"O uso de algemas durante a movimentação de presos é um procedimento essencial para a segurança dos policiais penais e a prevenção de fugas, contudo, sua aplicação não pode ser discricionária ou abusiva. A Súmula Vinculante 11 do Supremo Tribunal Federal balizou a atuação do Estado ao exigir justificativa por escrito para o emprego do artefato. A força policial legítima manifesta-se pela técnica e pelo respeito aos limites legais. Quando o servidor atua movido pelo capricho pessoal ou pelo desejo de impor humilhação desnecessária ao custodiado, ele transmuda o ato de segurança em crime de abuso de autoridade. Portanto, a legalidade deve guiar cada ação operacional intramuros.","enunciado":"Considere o período: \"Quando o servidor atua movido pelo capricho pessoal (...), ele transmuda o ato de segurança em crime...\" A oração introduzida por \"Quando\" expressa uma circunstância de:","alternativas":{"A":"causa.","B":"concessão.","C":"tempo.","D":"finalidade.","E":"consequência."},"resposta_correta":"C","comentario":"A conjunção subordinativa \"Quando\" introduz uma circunstância puramente temporal em relação ao fato principal da oração."},{"id":26,"numero":26,"bloco":1,"materia":"Língua Portuguesa","texto_base":null,"enunciado":"Assinale a alternativa que preenche, correta e respectivamente, as lacunas da frase abaixo, observando os preceitos de regência e crase da norma-padrão. O policial penal demonstrou total aversão _____ desorganização do pátio e pediu _____ equipe de plantão que ficasse atenta _____ movimentações dos detentos.","alternativas":{"A":"à – à – as","B":"a – a – às","C":"à – a – às","D":"à – à – às","E":"a – à – as"},"resposta_correta":"D","comentario":"\"Aversão\" exige a preposição \"a\" que, somada ao artigo de \"organização\", gera \"à\". \"Pediu\" exige objeto indireto de pessoa (\"à equipe\"). Atenta rege a preposição \"a\" que, somada ao artigo plural \"as\", gera \"às\"."},{"id":27,"numero":27,"bloco":1,"materia":"Língua Portuguesa","texto_base":null,"enunciado":"A frase em que a concordância nominal está em total desacordo com as normas gramaticais da língua culta é:","alternativas":{"A":"É proibida a entrada de aparelhos telefônicos ou componentes eletrônicos nas celas.","B":"As policiais penais mesmas realizaram a revista minuciosa nas visitantes do pavilhão B.","C":"Seguem anexos aos relatórios de plantão as fotos das ferramentas artesanais apreendidas.","D":"Os novos coletes balísticos fornecidos pela Secretaria de Estado são bastante resistentes.","E":"Os servidores públicos carcerários andavam meio preocupados com os alertas da inteligência."},"resposta_correta":"C","comentario":"O adjetivo \"anexo\" deve concordar com o substantivo a que se refere. Como se refere a \"as fotos\" (feminino plural), o correto seria \"Seguem anexas (...) as fotos\"."},{"id":28,"numero":28,"bloco":1,"materia":"Língua Portuguesa","texto_base":null,"enunciado":"Considere a frase: \"A inteligência prisional interceptou os planos de fuga da facção criminosa.\" Passando-se a frase para a voz passiva analítica, a forma verbal correta obtida será:","alternativas":{"A":"Tinham sido interceptados.","B":"Foram interceptados.","C":"Interceptaram-se.","D":"Seria interceptado.","E":"Fora interceptado."},"resposta_correta":"B","comentario":"O verbo original está no pretérito perfeito do indicativo (\"interceptou\"). Na voz passiva analítica, o verbo auxiliar \"ser\" assume o mesmo tempo e modo, concordando com o novo sujeito no plural (\"os planos foram interceptados\")."},{"id":29,"numero":29,"bloco":1,"materia":"Língua Portuguesa","texto_base":null,"enunciado":"Assinale a alternativa em que há erro na grafia de alguma palavra ou expressão sublinhada.","alternativas":{"A":"Os policiais penais queriam saber o porquê de tanta agitação na galeria leste.","B":"Os detentos foram isolados por que desobedeceram as ordens do chefe do plantão.","C":"A sindicância administrativa foi aberta para investigar por que o cadeado quebrou.","D":"A rebelião começou e ninguém compreendeu o por que de tanta violência repentina.","E":"O pavilhão central passou por reformas porque as paredes estruturais estavam danificadas."},"resposta_correta":"D","comentario":"Quando precedido de artigo ou pronome substantivado, adquirindo o valor de substantivo, a grafia correta deve ser \"o porquê\" (junto e com acento circunflexo). A alternativa D grafou de forma separada (\"o por que\"), incorrendo em erro ortográfico."},{"id":30,"numero":30,"bloco":1,"materia":"Língua Portuguesa","texto_base":null,"enunciado":"Assinale a alternativa que apresenta oração com sujeito indeterminado.","alternativas":{"A":"Choveu granizo sobre a guarita externa da muralha prisional durante a madrugada.","B":"Necessita-se de novos investimentos em segurança tecnológica nas unidades potiguares.","C":"Foram apreendidos três aparelhos celulares escondidos no rádio de pilha do custodiado.","D":"O Diretor de Segurança e Disciplina assinou os relatórios de comportamento dos internos.","E":"Havia muitos visitantes aguardando a liberação da entrada na recepção do presídio."},"resposta_correta":"B","comentario":"O emprego do verbo transitivo indireto \"Necessitar\" acompanhado da partícula de indeterminação do sujeito \"se\" torna o sujeito indeterminado."},{"id":31,"numero":31,"bloco":1,"materia":"Língua Portuguesa","texto_base":"O gerenciamento de crises no ambiente carcerário pressupõe o domínio de técnicas de negociação e o uso escalonado da força. Quando ocorre uma subversão da ordem, a primeira resposta da Polícia Penal deve ser o isolamento do pavilhão e o estabelecimento de um canal de diálogo. A intervenção tática armada qualifica-se como o último recurso, a ser empregado apenas quando esgotadas todas as possibilidades de solução pacífica e houver risco iminente à vida de reféns ou dos próprios servidores. Agir com impetuosidade ou precipitação em um ambiente conflagrado é um erro tático imperdoável, que costuma cobrar um preço alto em vidas humanas.","enunciado":"Com base no texto, a intervenção tática armada em uma crise carcerária deve ocorrer:","alternativas":{"A":"imediatamente após o início de qualquer manifestação verbal de insubordinação.","B":"de forma concomitante às negociações preliminares conduzidas pela ouvidoria geral.","C":"apenas como último recurso, após esgotadas as vias pacíficas e diante de risco iminente à vida.","D":"sempre que o Diretor do Estabelecimento considerar o diálogo uma perda de tempo administrativa.","E":"por determinação exclusiva do Conselho da Comunidade, sem a interferência dos policiais de plantão."},"resposta_correta":"C","comentario":"O texto consagra de forma literal que a intervenção armada é o último recurso, condicionado ao esgotamento das vias pacíficas de diálogo e ao risco iminente de vida."},{"id":32,"numero":32,"bloco":1,"materia":"Língua Portuguesa","texto_base":"O gerenciamento de crises no ambiente carcerário pressupõe o domínio de técnicas de negociação e o uso escalonado da força. Quando ocorre uma subversão da ordem, a primeira resposta da Polícia Penal deve ser o isolamento do pavilhão e o estabelecimento de um canal de diálogo. A intervenção tática armada qualifica-se como o último recurso, a ser empregado apenas quando esgotadas todas as possibilidades de solução pacífica e houver risco iminente à vida de reféns ou dos próprios servidores. Agir com impetuosidade ou precipitação em um ambiente conflagrado é um erro tático imperdoável, que costuma cobrar um preço alto em vidas humanas.","enunciado":"No fragmento: \"...a ser empregado apenas quando esgotadas todas as possibilidades de solução pacífica e houver risco iminente à vida...\", o termo em destaque possui o significado de:","alternativas":{"A":"que está prestes a acontecer.","B":"de altíssima qualidade ou nobreza.","C":"oculto ou de difícil percepção.","D":"que ocorreu no passado recente.","E":"duvidoso ou sem comprovação técnica."},"resposta_correta":"B","comentario":"Erro comum de pegadinha da banca. No contexto de risco, \"iminente\" significa algo que está prestes a ocorrer (urgente). Não confundir com \"eminente\" (ilustre, importante)."},{"id":33,"numero":33,"bloco":1,"materia":"Língua Portuguesa","texto_base":"O gerenciamento de crises no ambiente carcerário pressupõe o domínio de técnicas de negociação e o uso escalonado da força. Quando ocorre uma subversão da ordem, a primeira resposta da Polícia Penal deve ser o isolamento do pavilhão e o estabelecimento de um canal de diálogo. A intervenção tática armada qualifica-se como o último recurso, a ser empregado apenas quando esgotadas todas as possibilidades de solução pacífica e houver risco iminente à vida de reféns ou dos próprios servidores. Agir com impetuosidade ou precipitação em um ambiente conflagrado é um erro tático imperdoável, que costuma cobrar um preço alto em vidas humanas.","enunciado":"No período: \"Agir com impetuosidade ou precipitação em um ambiente conflagrado é um erro tático imperdoável, que costuma cobrar um preço alto em vidas humanas.\", a palavra em destaque exerce o papel gramatical de:","alternativas":{"A":"conjunção explicativa.","B":"pronome relativo.","C":"conjunção integrante.","D":"preposição acidental.","E":"partícula de realce."},"resposta_correta":"B","comentario":"O termo \"que\" retoma o substantivo antecedente \"um erro tático imperdoável\", introduzindo uma oração subordinada adjetiva explicativa, o que o caracteriza sintaticamente como pronome relativo."},{"id":34,"numero":34,"bloco":1,"materia":"Língua Portuguesa","texto_base":"O gerenciamento de crises no ambiente carcerário pressupõe o domínio de técnicas de negociação e o uso escalonado da força. Quando ocorre uma subversão da ordem, a primeira resposta da Polícia Penal deve ser o isolamento do pavilhão e o estabelecimento de um canal de diálogo. A intervenção tática armada qualifica-se como o último recurso, a ser empregado apenas quando esgotadas todas as possibilidades de solução pacífica e houver risco iminente à vida de reféns ou dos próprios servidores. Agir com impetuosidade ou precipitação em um ambiente conflagrado é um erro tático imperdoável, que costuma cobrar um preço alto em vidas humanas.","enunciado":"Assinale a alternativa que apresenta a correta divisão silábica da palavra \"negociação\", retirada do texto.","alternativas":{"A":"ne - go - ci - a - çã - o","B":"ne - go - cia - ção","C":"ne - go - ci - a - ção","D":"neg - o - ci - a - ção","E":"ne - go - ci - aç - ão"},"resposta_correta":"B","comentario":"Na palavra \"negociação\", o encontro vocálico final constitui um ditongo crescente, permanecendo na mesma sílaba. A divisão correta é ne-go-cia- ção."},{"id":35,"numero":35,"bloco":1,"materia":"Língua Portuguesa","texto_base":"O gerenciamento de crises no ambiente carcerário pressupõe o domínio de técnicas de negociação e o uso escalonado da força. Quando ocorre uma subversão da ordem, a primeira resposta da Polícia Penal deve ser o isolamento do pavilhão e o estabelecimento de um canal de diálogo. A intervenção tática armada qualifica-se como o último recurso, a ser empregado apenas quando esgotadas todas as possibilidades de solução pacífica e houver risco iminente à vida de reféns ou dos próprios servidores. Agir com impetuosidade ou precipitação em um ambiente conflagrado é um erro tático imperdoável, que costuma cobrar um preço alto em vidas humanas.","enunciado":"Considere o trecho: \"...a primeira resposta da Polícia Penal deve ser o isolamento do pavilhão...\" Se substituirmos \"a primeira resposta\" por \"os primeiros atos\", a alteração correta da forma verbal sublinhada, atendendo à concordância, será:","alternativas":{"A":"deve ser","B":"devem ser","C":"devem serem","D":"devem serdes","E":"devia ser"},"resposta_correta":"B","comentario":"Mudando o sujeito para o plural (\"os primeiros atos\"), a locução verbal que atua com o infinitivo concorda obrigatoriamente no plural: \"devem ser\"."},{"id":36,"numero":36,"bloco":1,"materia":"Língua Portuguesa","texto_base":null,"enunciado":"Assinale a alternativa em que o uso do acento indicador de crase é opcional (facultativo), de acordo com as normas gramaticais.","alternativas":{"A":"O policial penal entregou os relatórios de comportamento diretamente à diretora da unidade.","B":"A equipe tática realizou a escolta dos presos de alta periculosidade à meia-noite.","C":"O comandante do plantão penitenciário fez referência elogiosa à nossa equipe tática.","D":"Os novos coletes balísticos e algemas foram fornecidos àquela equipe de plantão na muralha.","E":"O coordenador do sistema carcerário potiguar decidiu ir à Natal para a reunião técnica."},"resposta_correta":"C","comentario":"Antes de pronomes possessivos femininos singulares (\"nossa\"), o uso do artigo é facultativo, tornando o sinal indicativo de crase opcional."},{"id":37,"numero":37,"bloco":1,"materia":"Língua Portuguesa","texto_base":null,"enunciado":"A frase em que a grafia da palavra sublinhada atende perfeitamente às normas ortográficas vigentes é:","alternativas":{"A":"A inteligência prisional realizou a apreensão de um objeto de uso proíbido na cela 4.","B":"O detento agiu com muita malisa ao tentar esconder o chip eletrônico sob o colchão.","C":"O Diretor de Segurança e Disciplina agiu com extrema sensatez ao mediar o conflito.","D":"Os policiais penais agiram com rapidez para paralizar o avanço da tentativa de fuga.","E":"É fundamental manter a estabilidade psicológica durante o gerenciamento de crises."},"resposta_correta":"C","comentario":"A palavra \"sensatez\" é grafada corretamente com \"z\". As demais alternativas apresentam erros: \"proibido\" não tem acento no i (não forma hiato isolado na regra antiga e atual), \"malícia\" é com c, \"paralisar\" é com s (derivado de paralisia)."},{"id":38,"numero":38,"bloco":1,"materia":"Língua Portuguesa","texto_base":null,"enunciado":"Assinale a alternativa em que a regência do verbo \"lembrar\" está em total desacordo com a norma-padrão da Língua Portuguesa.","alternativas":{"A":"O policial penal lembrou-se do número do lacre do recipiente de vestígios.","B":"O comandante do plantão lembrou os agentes sobre os riscos do repouso noturno.","C":"Os novos custodiados não se lembraram de ler as regras do regulamento disciplinar.","D":"O Diretor lembrou ao secretário as demandas urgentes de infraestrutura das celas.","E":"O servidor público carcerário lembrou o regulamento interno com precisão absoluta."},"resposta_correta":"B","comentario":"O verbo \"lembrar\", quando não é pronominal, é transitivo direto em relação à coisa lembrada, ou exige estrutura de dupla regência. Dizer \"lembrou os agentes sobre os riscos\" contraria o padrão gramatical, que exige \"lembrou aos agentes os riscos\" ou \"lembrou os agentes dos riscos\" (pronominal). A alternativa B apresenta desvio técnico de regência padrão."},{"id":39,"numero":39,"bloco":1,"materia":"Língua Portuguesa","texto_base":null,"enunciado":"A pontuação é elemento decisivo para a construção do sentido do texto. Assinale a alternativa que apresenta pontuação inteiramente correta.","alternativas":{"A":"Os presos, que cumprem pena no regime fechado, não possuem direito à saída temporária.","B":"O Processo Administrativo Disciplinar, foi instaurado para apurar, a conduta do detento.","C":"Regularmente, os policiais penais participam de cursos, de requalificação profissional.","D":"Balizados pela lei, os agentes de segurança carcerária, agiram com absoluto rigor técnico.","E":"A Corregedoria Geral da SEAP investigou os desvios, mas, não encontrou provas materiais."},"resposta_correta":"A","comentario":"As vírgulas isolam corretamente a oração subordinada adjetiva explicativa (\"que cumprem pena no regime fechado\"). Nas demais opções, ocorrem separações indevidas de termos essenciais."},{"id":40,"numero":40,"bloco":1,"materia":"Língua Portuguesa","texto_base":null,"enunciado":"Em qual das alternativas abaixo a palavra \"bastante\" desempenha a função de advérbio, permanecendo invariável?","alternativas":{"A":"Havia bastantes celulares escondidos no encanamento sanitário da ala prisional.","B":"Os policiais penais realizaram bastantes revistas estruturais no pavilhão leste.","C":"Os detentos ficaram bastante preocupados com a transferência para o presídio federal.","D":"A secretaria estadual dispõe de bastantes recursos para modernizar as muralhas prisionais.","E":"Foram apresentadas bastantes justificativas por escrito para o emprego de algemas."},"resposta_correta":"C","comentario":"Modificando o adjetivo \"preocupados\", a palavra \"bastante\" desempenha papel de advérbio de intensidade, classe de palavras invariável por excelência. Nos demais casos, funciona como pronome adjetivo pluralizável (\"bastantes celulares\")."},{"id":41,"numero":41,"bloco":1,"materia":"Língua Portuguesa","texto_base":"O monitoramento eletrônico de presos representa uma inovação tecnológica que otimiza a fiscalização penal e reduz os custos de custódia do Estado. O uso de tornozeleiras eletrônicas, contudo, impõe deveres rígidos ao monitorado. O indivíduo que rompe o equipamento ou permite o descarregamento intencional de sua bateria comete uma falta disciplinar de natureza grave, legitimando a imediata revogação da prisão domiciliar pelo Juiz da Execução. A tecnologia é uma aliada da segurança, mas necessita de fiscalização humana rigorosa. Cabe à central de monitoramento, operada por policiais penais qualificados, emitir os alertas em tempo real e coordenar as equipes de rua para a pronta captura dos infratores.","enunciado":"De acordo com o texto, o descarregamento intencional da bateria da tornozeleira eletrônica pelo preso monitorado gera como consequência jurídica imediata:","alternativas":{"A":"a extinção definitiva de sua punibilidade penal pelo perdão judicial tácito.","B":"o direito automático de migrar para o regime aberto sem restrições geográficas.","C":"a configuração de falta grave e a legitimidade para a revogação da prisão domiciliar.","D":"a aplicação de sanção pecuniária a ser paga pelos familiares do reeducando.","E":"a obrigatoriedade de transferência para uma colônia agrícola do semiaberto."},"resposta_correta":"C","comentario":"O texto explicita que o descarregamento intencional da bateria configura falta disciplinar grave, conferindo legitimidade jurídica para que o Juiz da Execução revogue a prisão domiciliar."},{"id":42,"numero":42,"bloco":1,"materia":"Língua Portuguesa","texto_base":"O monitoramento eletrônico de presos representa uma inovação tecnológica que otimiza a fiscalização penal e reduz os custos de custódia do Estado. O uso de tornozeleiras eletrônicas, contudo, impõe deveres rígidos ao monitorado. O indivíduo que rompe o equipamento ou permite o descarregamento intencional de sua bateria comete uma falta disciplinar de natureza grave, legitimando a imediata revogação da prisão domiciliar pelo Juiz da Execução. A tecnologia é uma aliada da segurança, mas necessita de fiscalização humana rigorosa. Cabe à central de monitoramento, operada por policiais penais qualificados, emitir os alertas em tempo real e coordenar as equipes de rua para a pronta captura dos infratores.","enunciado":"No período: \"...representa uma inovação tecnológica que otimiza a fiscalização penal...\", a palavra em destaque pode ser substituída, sem alteração de sentido no contexto, por:","alternativas":{"A":"dificulta.","B":"aperfeiçoa.","C":"encarece.","D":"paralisa.","E":"questiona."},"resposta_correta":"B","comentario":"O verbo \"otimizar\" assume o significado contextual de extrair o melhor rendimento, melhorar, aperfeiçoar ou tornar ótimo o andamento de um procedimento."},{"id":43,"numero":43,"bloco":1,"materia":"Língua Portuguesa","texto_base":"O monitoramento eletrônico de presos representa uma inovação tecnológica que otimiza a fiscalização penal e reduz os custos de custódia do Estado. O uso de tornozeleiras eletrônicas, contudo, impõe deveres rígidos ao monitorado. O indivíduo que rompe o equipamento ou permite o descarregamento intencional de sua bateria comete uma falta disciplinar de natureza grave, legitimando a imediata revogação da prisão domiciliar pelo Juiz da Execução. A tecnologia é uma aliada da segurança, mas necessita de fiscalização humana rigorosa. Cabe à central de monitoramento, operada por policiais penais qualificados, emitir os alertas em tempo real e coordenar as equipes de rua para a pronta captura dos infratores.","enunciado":"Assinale a alternativa que apresenta uma palavra proparoxítona retirada do texto.","alternativas":{"A":"\"eletrônicas\"","B":"\"tecnológica\"","C":"\"infratores\"","D":"\"Faltam apenas as alternativas A e B\" (Analise as palavras \"eletrônicas\" e \"tecnológica\". Ambas atendem à regra?)","E":"\"tecnológica\" e \"eletrônicas\" são proparoxítonas, enquanto \"fiscalização\" é oxítona. Assinale a opção que indica uma proparoxítona legítima: \"tecnológica\". (Nota de ajuste do padrão AVALIA: Assinale a alternativa que indica apenas uma proparoxítona do texto). A) \"inovação\" B) \"tornozeleiras\" C) \"tecnológica\" D) \"disciplinar\" E) \"fiscalização\""},"resposta_correta":"C","comentario":"A palavra \"tecnológica\" possui a antepenúltima síclaba como tônica (tec-no-ló-gi-ca), enquadrando-se na regra geral de que todas as proparoxítonas devem ser acentuadas."},{"id":44,"numero":44,"bloco":1,"materia":"Língua Portuguesa","texto_base":"O monitoramento eletrônico de presos representa uma inovação tecnológica que otimiza a fiscalização penal e reduz os custos de custódia do Estado. O uso de tornozeleiras eletrônicas, contudo, impõe deveres rígidos ao monitorado. O indivíduo que rompe o equipamento ou permite o descarregamento intencional de sua bateria comete uma falta disciplinar de natureza grave, legitimando a imediata revogação da prisão domiciliar pelo Juiz da Execução. A tecnologia é uma aliada da segurança, mas necessita de fiscalização humana rigorosa. Cabe à central de monitoramento, operada por policiais penais qualificados, emitir os alertas em tempo real e coordenar as equipes de rua para a pronta captura dos infratores.","enunciado":"No fragmento: \"...Cabe à central de monitoramento, operada por policiais penais qualificados, emitir os alertas...\", a oração entre vírgulas possui o valor gramatical de:","alternativas":{"A":"adjetivo (oração restritiva).","B":"adjetivo (oração explicativa).","C":"advérbio (oração temporal).","D":"substantivo (oração integrante).","E":"conjunção (oração concessiva)."},"resposta_correta":"B","comentario":"A oração reduzida de particípio \"operada por policiais...\" qualifica o substantivo central antecedente \"central de monitoramento\", estando isolada por vírgulas, o que a caracteriza como adjetiva explicativa."},{"id":45,"numero":45,"bloco":1,"materia":"Língua Portuguesa","texto_base":"O monitoramento eletrônico de presos representa uma inovação tecnológica que otimiza a fiscalização penal e reduz os custos de custódia do Estado. O uso de tornozeleiras eletrônicas, contudo, impõe deveres rígidos ao monitorado. O indivíduo que rompe o equipamento ou permite o descarregamento intencional de sua bateria comete uma falta disciplinar de natureza grave, legitimando a imediata revogação da prisão domiciliar pelo Juiz da Execução. A tecnologia é uma aliada da segurança, mas necessita de fiscalização humana rigorosa. Cabe à central de monitoramento, operada por policiais penais qualificados, emitir os alertas em tempo real e coordenar as equipes de rua para a pronta captura dos infratores.","enunciado":"Considere o período: \"A tecnologia é uma aliada da segurança, mas necessita de fiscalização humana rigorosa.\" O conectivo destacado estabelece valor coordenado:","alternativas":{"A":"aditivo.","B":"conclusivo.","C":"adversativo.","D":"explicativo.","E":"alternativo."},"resposta_correta":"C","comentario":"O conectivo \"mas\" possui natureza de conjunção coordenativa adversativa, introduzindo uma ideia de oposição ou ressalva em relação à afirmação do período anterior."},{"id":46,"numero":46,"bloco":1,"materia":"Língua Portuguesa","texto_base":null,"enunciado":"Assinale a alternativa que indica o correto emprego do pronome de acordo com a norma culta.","alternativas":{"A":"O diretor da unidade prisional potiguar chamou ele para prestar esclarecimentos na sala.","B":"Para mim realizar a escolta do preso de alta periculosidade, necessito de autorização judicial.","C":"Os novos coletes balísticos e algemas foram entregues para eu testar no estande de tiro.","D":"Não houveram desentendimentos entre eu e você durante o plantão penitenciário matinal.","E":"Os policiais penais viram os detentos conversando e mandaram eles retornarem às celas."},"resposta_correta":"C","comentario":"O pronome pessoal reto \"eu\" funciona corretamente como sujeito do verbo no infinitivo (\"para eu testar\"). É incorreto usar \"para mim testar\", bem como usar pronome reto como objeto direto (\"chamou ele\", \"mandaram eles\")."},{"id":47,"numero":47,"bloco":1,"materia":"Língua Portuguesa","texto_base":null,"enunciado":"Assinale a frase em que o uso do acento indicador de crase é proibido pela norma gramatical da Língua Portuguesa.","alternativas":{"A":"Os policiais penais realizaram a entrega do preso provisório à autoridade judiciária competente.","B":"A fiscalização remota de presos por meio de tornozeleira eletrônica estendeu-se à todas as comarcas.","C":"A equipe tática de intervenção prisional potiguar permaneceu fiel à doutrina de segurança máxima.","D":"O Juiz da Execução Penal deferiu o direito de saída temporária àquela detenta do regime semiaberto.","E":"As oficinas de trabalho carcerário industrial funcionam de duas à cinco horas da tarde."},"resposta_correta":"B","comentario":"É terminantemente proibido o uso do sinal indicativo de crase antes de pronomes indefinidos ou expressões plurais indeterminadas precedidas por preposição singular (\"à todas\"). O correto seria apenas \"a todas\"."},{"id":48,"numero":48,"bloco":1,"materia":"Língua Portuguesa","texto_base":null,"enunciado":"A concordância verbal está em total conformidade com a norma-padrão da língua na seguinte alternativa:","alternativas":{"A":"Grande parte dos policiais penais potiguares participou do curso tático extraordinário.","B":"Se não intervirem com rapidez, os agentes de segurança perderão o controle do pátio central.","C":"Hão de existir novas vagas para o concurso público da Polícia Penal no próximo ano.","D":"Fui eu que organizou os relatórios de apreensão de entorpecentes intramuros ontem.","E":"Choveram reclamações dos familiares dos presos em relação ao novo horário de visitas."},"resposta_correta":"A","comentario":"Havendo sujeito coletivo partitivo (\"Grande parte dos...\"), o verbo pode concordar legitimamente com o núcleo do coletivo no singular (\"participou\"). As outras opções trazem erros: \"intervirem\" (correto: intervierem), \"Hão de existir\" (correto: Há de existir se impessoal, mas como existir é pessoal, hão de existir está correto gramaticalmente, contudo a alternativa A é a mais precisa e consensual da banca). Ajuste técnico: Em B, o verbo intervir no futuro do subjuntivo é intervierem. Em A, concordância perfeita."},{"id":49,"numero":49,"bloco":1,"materia":"Língua Portuguesa","texto_base":null,"enunciado":"Assinale a alternativa que apresenta a correta classificação sintática do termo sublinhado na frase abaixo. O Diretor do estabelecimento prisional potiguar foi considerado justo por toda a equipe de plantão.","alternativas":{"A":"Objeto Direto.","B":"Adjunto Adnominal.","C":"Predicativo do Sujeito.","D":"Predicativo do Objeto.","E":"Complemento Nominal."},"resposta_correta":"C","comentario":"O termo \"justo\" qualifica e refere-se diretamente ao sujeito passivo da oração (\"O Diretor\"), estando ligado por um verbo na voz passiva com função de ligação institucional, o que o classifica como predicativo do sujeito."},{"id":50,"numero":50,"bloco":1,"materia":"Língua Portuguesa","texto_base":null,"enunciado":"No processo de reescrita de frases, deve-se manter a correção gramatical e o sentido original do texto. Assinale a opção que reescreve de forma correta e elegante o seguinte período: \"A disciplina é a espinha dorsal do cárcere, por isso as regras devem ser cumpridas sem hesitação.\"","alternativas":{"A":"Porque as regras devem ser cumpridas sem hesitação, a disciplina é a espinha dorsal do cárcere.","B":"A disciplina constitui a espinha dorsal do cárcere; por conseguinte, as regras devem ser observadas sem hesitação.","C":"Embora as regras devam ser cumpridas sem hesitação, a disciplina permanece como a espinha dorsal do cárcere.","D":"Conquanto a disciplina seja a espinha dorsal do cárcere, as regras cumprem-se sem hesitações burocráticas.","E":"A disciplina é a espinha dorsal do cárcere, contudo as regras precisam ser cumpridas sem qualquer hesitação."},"resposta_correta":"B","comentario":"A reescrita preserva com exatidão a relação de causa/consequência original por meio da locução conjuntiva conclusiva \"por conseguinte\", mantendo a elegância e a correção gramatical exigidas pela norma culta."},{"id":51,"numero"
