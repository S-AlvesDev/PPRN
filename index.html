function htmlItemQuestao(id, mostrarErros) {
  const q = MAPA_Q[id], r = S.respostas[id];
  const st = !r ? '' : r.correta
    ? '<span class="lv lv-2">Acertou na última</span>'
    : '<span class="lv lv-0">Errou na última</span>';
  return `<div class="item">
    <div class="it-main">
      <p class="it-title trunc">Questão ${q.numero} — ${esc(q.enunciado.slice(0, 150))}${q.enunciado.length > 150 ? '…' : ''}</p>
      <div class="it-meta">
        <span>${esc(q.materia)}</span><span>Bloco ${String(q.bloco).padStart(2, '0')}</span>
        ${r ? `<span>${r.tentativas} tentativa(s)</span>` : ''}
        ${mostrarErros && r ? `<span style="color:var(--wrong)">errou ${r.erros}×</span>` : ''}
        ${ehFavorito(id) ? '<span style="color:var(--star)">★ favorita</span>' : ''}
      </div>
    </div>
    <div class="it-side">${st}<button class="btn btn-sm btn-ghost" data-abrir="${id}">Refazer</button></div>
  </div>`;
}

/* ============================================================
   7. HISTÓRICO
   ============================================================ */
function vistaHistorico() {
  if (!S.historico.length) return `<div class="view">
    <p class="eyebrow">Registro</p><h1>Histórico de estudos</h1>
    ${vazio('🗂️', 'Nenhum simulado concluído', 'Cada simulado finalizado fica registrado aqui com o resultado completo e o desempenho questão a questão.', 'simulados', 'Montar simulado')}</div>`;

  const lista = S.historico.slice().reverse();
  const media = Math.round(lista.reduce((s, h) => s + h.aproveitamento, 0) / lista.length);
  return `
  <div class="view">
    <p class="eyebrow">Registro</p>
    <h1>Histórico de estudos</h1>
    <p class="lead">${lista.length} simulado(s) concluído(s) · aproveitamento médio de ${media}%.</p>
    <div class="card section">${lista.map(htmlItemHistorico).join('')}</div>
  </div>`;
}

function htmlItemHistorico(h) {
  const nv = nivel(h.aproveitamento, h.total);
  return `<div class="item">
    <div class="it-main">
      <p class="it-title">Simulado #${h.numero} — ${esc(h.materias)}</p>
      <div class="it-meta">
        <span>${h.total} questões</span><span style="color:var(--brand)">${h.acertos} acertos</span>
        <span style="color:var(--wrong)">${h.erros} erros</span><span>${dataBR(h.data)}</span>
      </div>
    </div>
    <div class="it-side">
      <span class="lv ${nv.cls}">${h.aproveitamento}%</span>
      <button class="btn btn-sm btn-ghost" data-hist="${h.id}">Ver resultado</button>
    </div>
  </div>`;
}

function vistaDetalhe() {
  const h = S.historico.find(x => x.id === DETALHE);
  if (!h) { ir('historico'); return ''; }
  const porMateria = {};
  h.itens.forEach(it => {
    const q = MAPA_Q[it.qid];
    porMateria[q.materia] = porMateria[q.materia] || { t: 0, a: 0 };
    porMateria[q.materia].t++; if (it.correta) porMateria[q.materia].a++;
  });
  return `
  <div class="view">
    <button class="btn btn-sm btn-ghost" data-ir="historico" style="margin-bottom:15px">${ICO.volta} Voltar ao histórico</button>
    <p class="eyebrow">Simulado #${h.numero} · ${dataBR(h.data)}</p>
    <h1>${esc(h.materias)}</h1>
    <div class="card card-pad section">
      <div class="score">${rosca(h.aproveitamento)}
        <div class="score-nums">
          <div><span>Questões</span><b class="tnum">${h.total}</b></div>
          <div><span>Acertos</span><b class="tnum v-ok">${h.acertos}</b></div>
          <div><span>Erros</span><b class="tnum v-bad">${h.erros}</b></div>
          <div><span>Taxa de erro</span><b class="tnum">${100 - h.aproveitamento}%</b></div>
        </div>
      </div>
    </div>
    <div class="section">
      <div class="section-head"><h2>Por matéria neste simulado</h2></div>
      <div class="card card-pad" style="overflow-x:auto"><table class="tbl">
        <thead><tr><th>Matéria</th><th class="num">Questões</th><th class="num">Acertos</th><th class="num">Erros</th><th class="num">Aproveitamento</th></tr></thead>
        <tbody>${Object.entries(porMateria).sort((a, b) => (b[1].a / b[1].t) - (a[1].a / a[1].t)).map(([m, v]) =>
          `<tr><td class="nome">${esc(m)}</td><td class="num">${v.t}</td><td class="num" style="color:var(--brand)">${v.a}</td>
           <td class="num" style="color:var(--wrong)">${v.t - v.a}</td><td class="num"><b>${pct(v.a, v.t)}%</b></td></tr>`).join('')}
        </tbody></table></div>
    </div>
    <div class="section">
      <div class="section-head"><h2>Questão a questão</h2></div>
      <div class="card">${h.itens.map((it, i) => {
        const q = MAPA_Q[it.qid];
        return `<div class="item">
          <div class="it-side" style="align-self:center"><span class="pal ${it.correta ? 'ok' : 'bad'}" style="pointer-events:none">${i + 1}</span></div>
          <div class="it-main">
            <p class="it-title trunc">Questão ${q.numero} — ${esc(q.enunciado.slice(0, 130))}${q.enunciado.length > 130 ? '…' : ''}</p>
            <div class="it-meta"><span>${esc(q.materia)}</span>
              <span>sua resposta: <b>${it.escolhida || '—'}</b></span>
              <span>gabarito: <b>${q.resposta_correta}</b></span></div>
          </div>
          <div class="it-side"><button class="btn btn-sm btn-ghost" data-abrir="${q.id}">Rever</button></div>
        </div>`;
      }).join('')}</div>
    </div>
    <div class="actions"><button class="btn" data-ir="simulados">Fazer novo simulado</button></div>
  </div>`;
}

function vazio(ico, titulo, texto, destino, rotulo) {
  return `<div class="card"><div class="empty"><div class="e-ico">${ico}</div><h3>${titulo}</h3><p>${texto}</p>
    <button class="btn" data-ir="${destino}">${rotulo}</button></div></div>`;
}

/* ============================================================
   Sessões de estudo e simulado
   ============================================================ */
function abrirSessao({ tipo, ids, titulo, origem }) {
  if (!ids.length) { aviso('Nenhuma questão disponível com esses filtros.'); return; }
  SESSAO = { tipo, ids, titulo, origem, idx: 0, escolhas: {}, revelado: {}, inicio: Date.now() };
  ir('sessao');
}

function vistaSessao() {
  const s = SESSAO;
  const q = MAPA_Q[s.ids[s.idx]];
  const simulado = s.tipo === 'simulado';
  const escolhida = s.escolhas[q.id] || null;
  const revelado = !!s.revelado[q.id];
  const respondidas = Object.keys(s.escolhas).length;
  const progresso = Math.round((simulado ? respondidas : (revelado ? s.idx + 1 : s.idx)) / s.ids.length * 100);
  const r = S.respostas[q.id];

  const alt = letra => {
    const txt = q.alternativas[letra];
    if (txt === undefined) return '';
    let cls = '', marca = '';
    if (revelado) {
      if (letra === q.resposta_correta) { cls = 'correta'; marca = 'Gabarito'; }
      else if (letra === escolhida) { cls = 'errada'; marca = 'Sua resposta'; }
    } else if (letra === escolhida) cls = 'sel';
    return `<button class="alt ${cls}" data-alt="${letra}" ${revelado ? 'disabled' : ''}>
      <span class="letra">${letra}</span><span>${esc(txt)}</span>${marca ? `<span class="mark">${marca}</span>` : ''}</button>`;
  };

  const acertou = revelado && escolhida === q.resposta_correta;

  return `
  <div class="progress-top"><div class="inner">
    <span class="lbl">Questão ${s.idx + 1} de ${s.ids.length}</span>
    <div class="bar"><i class="ok" style="width:${progresso}%"></i></div>
    <span class="pct">${progresso}%</span>
    <button class="btn btn-sm btn-ghost" data-acao="sair-sessao">Sair</button>
  </div></div>

  <div class="wrap view">
    <p class="eyebrow">${esc(s.titulo)}</p>

    <div class="card card-pad">
      <div class="q-head">
        <span class="q-num">Questão ${String(q.numero).padStart(2, '0')}</span>
        <span class="tag tag-brand">${esc(q.materia)}</span>
        <span class="tag">Bloco ${String(q.bloco).padStart(2, '0')}</span>
        ${r ? `<span class="tag">já respondida ${r.tentativas}×</span>` : ''}
        <button class="star-btn ${ehFavorito(q.id) ? 'on' : ''}" data-fav="${q.id}"
          aria-label="${ehFavorito(q.id) ? 'Remover dos favoritos' : 'Salvar nos favoritos'}" title="Favoritar">${ICO.estrela}</button>
      </div>

      ${q.texto_base ? `<div class="texto-base"><span class="tb-lbl">Texto de apoio</span>${esc(q.texto_base)}</div>` : ''}
      <p class="enunciado">${esc(q.enunciado)}</p>
      <div class="alts">${['A', 'B', 'C', 'D', 'E'].map(alt).join('')}</div>

      ${revelado ? `
      <div class="feedback ${acertou ? 'ok' : 'bad'}">
        <div class="fb-title">${acertou ? '✅ Você acertou!' : '❌ Você errou!'}</div>
        <div class="fb-lines">
          <span>Sua resposta: <b>${escolhida ? escolhida + ') ' + esc(q.alternativas[escolhida].slice(0, 60)) + (q.alternativas[escolhida].length > 60 ? '…' : '') : 'em branco'}</b></span>
          <span>Resposta correta: <b>${q.resposta_correta}</b></span>
        </div>
        <div class="coment"><span class="c-lbl">Comentário da apostila</span>${esc(q.comentario)}</div>
      </div>` : ''}

      <div class="actions">
        ${s.idx > 0 ? `<button class="btn btn-ghost" data-acao="anterior">${ICO.volta} Anterior</button>` : ''}
        ${!revelado && !simulado ? `<button class="btn" data-acao="responder" ${escolhida ? '' : 'disabled'}>Responder</button>` : ''}
        ${revelado || simulado ? (s.idx < s.ids.length - 1
          ? `<button class="btn" data-acao="proxima">Próxima questão ${ICO.seta}</button>`
          : (simulado ? '' : `<button class="btn" data-acao="encerrar-estudo">Encerrar sessão</button>`)) : ''}
        <span class="spacer"></span>
        ${simulado ? `<button class="btn btn-dark" data-acao="finalizar">Finalizar simulado</button>` : ''}
      </div>
    </div>

    ${simulado ? `
    <div class="section">
      <div class="section-head"><div><h2>Navegação</h2><p class="lead">${respondidas} de ${s.ids.length} respondidas. Você pode voltar e mudar qualquer resposta antes de finalizar.</p></div></div>
      <div class="card card-pad"><div class="palette">
        ${s.ids.map((id, i) => `<button class="pal ${s.escolhas[id] ? 'done' : ''} ${i === s.idx ? 'now' : ''}" data-pular="${i}">${i + 1}</button>`).join('')}
      </div></div>
    </div>` : ''}
  </div>`;
}

/* ---------------- finalização do simulado ---------------- */
function finalizarSimulado() {
  const s = SESSAO;
  const itens = s.ids.map(id => {
    const escolhida = s.escolhas[id] || null;
    const correta = escolhida === MAPA_Q[id].resposta_correta;
    if (escolhida) registrar(id, escolhida);
    return { qid: id, escolhida, correta };
  });
  const acertos = itens.filter(i => i.correta).length;
  const materias = [...new Set(s.ids.map(id => MAPA_Q[id].materia))];
  S.contador = (S.contador || 0) + 1;
  const reg = {
    id: 'h' + Date.now(),
    numero: S.contador,
    data: Date.now(),
    total: s.ids.length,
    acertos,
    erros: s.ids.length - acertos,
    aproveitamento: pct(acertos, s.ids.length),
    emBranco: itens.filter(i => !i.escolhida).length,
    materias: materias.length > 2 ? `${materias.length} matérias` : materias.join(' + '),
    duracao: Date.now() - s.inicio,
    itens
  };
  S.historico.push(reg);
  if (S.historico.length > 80) S.historico = S.historico.slice(-80);
  salvar();
  RESULTADO = reg;
  SESSAO = null;
  VISTA = 'resultado';
  window.scrollTo(0, 0);
  render();
}

function vistaResultado() {
  const h = RESULTADO;
  const nv = nivel(h.aproveitamento, h.total);
  const porMateria = {};
  h.itens.forEach(it => {
    const m = MAPA_Q[it.qid].materia;
    porMateria[m] = porMateria[m] || { t: 0, a: 0 };
    porMateria[m].t++; if (it.correta) porMateria[m].a++;
  });
  const mins = Math.round(h.duracao / 60000);
  const erradas = h.itens.filter(i => !i.correta).map(i => i.qid);

  return `<div class="wrap view">
    <p class="eyebrow">Simulado #${h.numero} concluído</p>
    <h1>Resultado</h1>
    <p class="lead">${h.total} questões · ${mins < 1 ? 'menos de 1 minuto' : mins + ' minuto(s)'}${h.emBranco ? ` · ${h.emBranco} em branco (contadas como erro)` : ''}</p>

    <div class="card card-pad section">
      <div class="score">${rosca(h.aproveitamento, 148)}
        <div class="score-nums">
          <div><span>Total</span><b class="tnum">${h.total}</b></div>
          <div><span>Acertos</span><b class="tnum v-ok">${h.acertos}</b></div>
          <div><span>Erros</span><b class="tnum v-bad">${h.erros}</b></div>
          <div><span>% acertos</span><b class="tnum">${h.aproveitamento}%</b></div>
          <div><span>% erros</span><b class="tnum">${100 - h.aproveitamento}%</b></div>
        </div>
      </div>
      <div class="bar" style="margin-top:20px;height:12px">
        <i class="ok" style="width:${h.aproveitamento}%"></i><i class="bad" style="width:${100 - h.aproveitamento}%"></i>
      </div>
      <p style="margin:13px 0 0"><span class="lv ${nv.cls}">${nv.ico} ${nv.rot}</span></p>
    </div>

    <div class="section">
      <div class="section-head"><h2>Desempenho por matéria</h2></div>
      <div class="card card-pad" style="overflow-x:auto"><table class="tbl">
        <thead><tr><th>Matéria</th><th class="num">Questões</th><th class="num">Acertos</th><th class="num">Erros</th><th class="num">Aproveitamento</th></tr></thead>
        <tbody>${Object.entries(porMateria).sort((a, b) => (b[1].a / b[1].t) - (a[1].a / a[1].t)).map(([m, v]) =>
          `<tr><td class="nome">${esc(m)}</td><td class="num">${v.t}</td><td class="num" style="color:var(--brand)">${v.a}</td>
           <td class="num" style="color:var(--wrong)">${v.t - v.a}</td><td class="num"><b>${pct(v.a, v.t)}%</b></td></tr>`).join('')}
        </tbody></table></div>
    </div>

    <div class="section">
      <div class="section-head"><h2>Gabarito do simulado</h2><span class="muted" style="font-size:12.5px">toque em uma questão para reler o comentário</span></div>
      <div class="card card-pad"><div class="palette">
        ${h.itens.map((it, i) => `<button class="pal ${it.correta ? 'ok' : 'bad'}" data-abrir="${it.qid}" title="Questão ${MAPA_Q[it.qid].numero} — ${it.correta ? 'acertou' : 'errou'}">${i + 1}</button>`).join('')}
      </div></div>
    </div>

    <div class="actions">
      ${erradas.length ? `<button class="btn" data-rever-erradas='${erradas.join(',')}'>Revisar as ${erradas.length} que errei</button>` : ''}
      <button class="btn btn-ghost" data-ir="simulados">Novo simulado</button>
      <button class="btn btn-ghost" data-ir="desempenho">Ver meu desempenho</button>
      <button class="btn btn-ghost" data-ir="inicio">Voltar ao início</button>
    </div>
  </div>`;
}

/* ============================================================
   Render + eventos
   ============================================================ */
function render() {
  document.getElementById('rail-nav').innerHTML = htmlNav();
  document.getElementById('bottom-nav').innerHTML = htmlBottom();
  let html = '';
  if (VISTA === 'sessao') html = vistaSessao();
  else if (VISTA === 'resultado') html = vistaResultado();
  else {
    const mapa = {
      inicio: vistaInicio, questoes: vistaQuestoes, simulados: vistaSimulados,
      desempenho: vistaDesempenho, erradas: vistaErradas, favoritas: vistaFavoritas,
      historico: vistaHistorico, detalhe: vistaDetalhe
    };
    html = `<div class="wrap">${(mapa[VISTA] || vistaInicio)()}</div>`;
  }
  app.innerHTML = html;
}

function confirmar(titulo, texto, rotulo, aoConfirmar) {
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true"><h3>${titulo}</h3><p>${texto}</p>
    <div style="display:flex;gap:9px;justify-content:flex-end">
      <button class="btn btn-ghost" data-x="nao">Cancelar</button>
      <button class="btn" data-x="sim">${rotulo}</button></div></div>`;
  bg.addEventListener('click', e => {
    if (e.target === bg || e.target.dataset.x === 'nao') bg.remove();
    if (e.target.dataset.x === 'sim') { bg.remove(); aoConfirmar(); }
  });
  document.body.appendChild(bg);
  bg.querySelector('[data-x="sim"]').focus();
}

document.addEventListener('click', e => {
  const alvo = sel => e.target.closest(sel);
  let el;

  if ((el = alvo('[data-ir]'))) { ir(el.dataset.ir); return; }

  /* --- seleção de matéria (tela de questões) --- */
  if ((el = alvo('[data-materia]'))) {
    const m = el.dataset.materia;
    const i = selMaterias.indexOf(m);
    i >= 0 ? selMaterias.splice(i, 1) : selMaterias.push(m);
    render(); return;
  }
  if ((el = alvo('[data-filtroq]'))) { filtroQuestoes = el.dataset.filtroq; render(); return; }
  if ((el = alvo('[data-ordemq]'))) { ordemQuestoes = el.dataset.ordemq; render(); return; }

  /* --- configuração do simulado --- */
  if ((el = alvo('[data-qtd]'))) { cfgSim.qtd = +el.dataset.qtd; render(); return; }
  if ((el = alvo('[data-simmat]'))) {
    const m = el.dataset.simmat;
    if (m === '__todas__') cfgSim.materias = [];
    else {
      const i = cfgSim.materias.indexOf(m);
      i >= 0 ? cfgSim.materias.splice(i, 1) : cfgSim.materias.push(m);
    }
    render(); return;
  }
  if ((el = alvo('[data-simordem]'))) { cfgSim.ordem = el.dataset.simordem; render(); return; }
  if ((el = alvo('[data-simfiltro]'))) { cfgSim.filtro = el.dataset.simfiltro; render(); return; }

  /* --- filtros de listas --- */
  if ((el = alvo('[data-filtroerr]'))) { filtroErradas = el.dataset.filtroerr; render(); return; }
  if ((el = alvo('[data-filtrofav]'))) { filtroFavoritas = el.dataset.filtrofav; render(); return; }
  if ((el = alvo('[data-hist]'))) { DETALHE = el.dataset.hist; VISTA = 'detalhe'; window.scrollTo(0, 0); render(); return; }

  /* --- favoritar --- */
  if ((el = alvo('[data-fav]'))) {
    const on = alternarFavorito(+el.dataset.fav);
    aviso(on ? 'Salva nas favoritas ⭐' : 'Removida das favoritas');
    render(); return;
  }

  /* --- abrir uma questão isolada --- */
  if ((el = alvo('[data-abrir]'))) {
    const volta = ['erradas', 'favoritas', 'historico'].includes(VISTA) ? VISTA : VISTA === 'detalhe' ? 'historico' : 'inicio';
    abrirSessao({ tipo: 'estudo', ids: [+el.dataset.abrir], titulo: 'Revisão de questão', origem: volta });
    return;
  }
  if ((el = alvo('[data-treinar]'))) {
    const m = el.dataset.treinar;
    abrirSessao({ tipo: 'estudo', ids: selecionar({ materias: [m], ordem: 'aleatoria', filtro: 'todas' }), titulo: `Estudo · ${m}`, origem: 'questoes' });
    return;
  }
  if ((el = alvo('[data-rever-erradas]'))) {
    abrirSessao({ tipo: 'estudo', ids: el.dataset.reverErradas.split(',').map(Number), titulo: 'Revisão do simulado', origem: 'erradas' });
    return;
  }

  /* --- alternativas --- */
  if ((el = alvo('[data-alt]')) && SESSAO) {
    const q = MAPA_Q[SESSAO.ids[SESSAO.idx]];
    if (SESSAO.revelado[q.id]) return;
    SESSAO.escolhas[q.id] = el.dataset.alt;
    render(); return;
  }
  if ((el = alvo('[data-pular]')) && SESSAO) { SESSAO.idx = +el.dataset.pular; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }

  /* --- ações --- */
  if ((el = alvo('[data-acao]'))) {
    const a = el.dataset.acao;

    if (a === 'limpar-materias') { selMaterias = []; render(); return; }

    if (a === 'iniciar-estudo') {
      abrirSessao({
        tipo: 'estudo',
        ids: selecionar({ materias: selMaterias, ordem: ordemQuestoes, filtro: filtroQuestoes }),
        titulo: selMaterias.length ? `Estudo · ${selMaterias.join(', ')}` : 'Estudo · todas as matérias',
        origem: 'questoes'
      }); return;
    }

    if (a === 'iniciar-simulado') {
      const ids = selecionar({ materias: cfgSim.materias, quantidade: cfgSim.qtd, ordem: cfgSim.ordem, filtro: cfgSim.filtro });
      abrirSessao({
        tipo: 'simulado', ids,
        titulo: `Simulado · ${ids.length} questões · ${cfgSim.materias.length ? cfgSim.materias.join(', ') : 'todas as matérias'}`,
        origem: 'simulados'
      }); return;
    }

    if (a === 'revisar-erradas') {
      const ids = embaralhar(idsErradas());
      if (!ids.length) { aviso('Você ainda não errou nenhuma questão.'); return; }
      abrirSessao({ tipo: 'estudo', ids, titulo: 'Revisão · questões que errei', origem: 'erradas' });
      return;
    }
    if (a === 'revisar-favoritas') {
      abrirSessao({ tipo: 'estudo', ids: S.favoritos.slice().sort((x, y) => x - y), titulo: 'Estudo · favoritas', origem: 'favoritas' });
      return;
    }

    if (a === 'responder' && SESSAO) {
      const q = MAPA_Q[SESSAO.ids[SESSAO.idx]];
      const letra = SESSAO.escolhas[q.id];
      if (!letra) return;
      registrar(q.id, letra);
      SESSAO.revelado[q.id] = true;
      render(); return;
    }
    if (a === 'proxima' && SESSAO) {
      SESSAO.idx = Math.min(SESSAO.idx + 1, SESSAO.ids.length - 1);
      render(); window.scrollTo({ top: 0, behavior: 'smooth' }); return;
    }
    if (a === 'anterior' && SESSAO) {
      SESSAO.idx = Math.max(0, SESSAO.idx - 1);
      render(); window.scrollTo({ top: 0, behavior: 'smooth' }); return;
    }
    if (a === 'encerrar-estudo') { aviso('Sessão encerrada. Estatísticas atualizadas.'); ir(SESSAO.origem || 'inicio'); return; }

    if (a === 'sair-sessao' && SESSAO) {
      const s = SESSAO;
      if (s.tipo === 'simulado' && Object.keys(s.escolhas).length) {
        confirmar('Sair do simulado?', 'As respostas dadas até aqui serão descartadas e o simulado não entrará no histórico.', 'Sair mesmo assim', () => ir(s.origem || 'inicio'));
      } else ir(s.origem || 'inicio');
      return;
    }

    if (a === 'finalizar' && SESSAO) {
      const faltam = SESSAO.ids.length - Object.keys(SESSAO.escolhas).length;
      if (faltam > 0) {
        confirmar('Finalizar com questões em branco?', `Faltam ${faltam} questão(ões) sem resposta. Elas serão contadas como erro.`, 'Finalizar', finalizarSimulado);
      } else confirmar('Finalizar simulado?', 'Você verá o resultado completo e não poderá mais alterar as respostas.', 'Ver resultado', finalizarSimulado);
      return;
    }

    if (a === 'zerar') {
      confirmar('Apagar todo o progresso?', 'Respostas, estatísticas, favoritas e histórico serão removidos deste navegador. As questões continuam disponíveis.', 'Apagar tudo', () => {
        S = estadoInicial(); salvar(); aviso('Progresso apagado.'); ir('inicio');
      });
      return;
    }
  }
});

/* atalhos de teclado durante a sessão */
document.addEventListener('keydown', e => {
  if (!SESSAO || e.metaKey || e.ctrlKey || e.altKey) return;
  const q = MAPA_Q[SESSAO.ids[SESSAO.idx]];
  const k = e.key.toUpperCase();
  if (['A', 'B', 'C', 'D', 'E'].includes(k) && !SESSAO.revelado[q.id] && q.alternativas[k]) {
    SESSAO.escolhas[q.id] = k; render(); e.preventDefault(); return;
  }
  if (e.key === 'Enter') {
    if (SESSAO.tipo !== 'simulado' && !SESSAO.revelado[q.id] && SESSAO.escolhas[q.id]) {
      registrar(q.id, SESSAO.escolhas[q.id]); SESSAO.revelado[q.id] = true; render();
    } else if (SESSAO.idx < SESSAO.ids.length - 1) {
      SESSAO.idx++; render(); window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    e.preventDefault();
  }
  if (e.key === 'ArrowRight' && SESSAO.idx < SESSAO.ids.length - 1) { SESSAO.idx++; render(); }
  if (e.key === 'ArrowLeft' && SESSAO.idx > 0) { SESSAO.idx--; render(); }
});

/* ---------------- start ---------------- */
render();
if (!armazem.ok) {
  setTimeout(() => aviso('Sem acesso ao armazenamento: o progresso vale só para esta aba.'), 700);
}
</script>
