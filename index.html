selho da Comunidade ou comissão de direitos humanos local.","D":"Governador do Estado por meio de decreto autônomo extraordinário.","E":"Cidadão eleitor por meio de petição de ação popular simplificada."},"resposta_correta":"B","comentario":"Conforme a redação atual do artigo 17 da LIA, com as modificações promovidas pela Lei nº 14.230/2021, a legitimidade ativa para a propositura da ação de improbidade administrativa pertence exclusivamente ao Ministério Público."},{"id":263,"numero":263,"bloco":2,"materia":"Direito Administrativo","texto_base":null,"enunciado":"No processo administrativo, determinados atos e competências são considerados intransferíveis e insuscetíveis de delegação para outros órgãos ou agentes, visando resguardar a segurança jurídica e a hierarquia. Assinale a alternativa que apresenta uma matéria que não pode ser objeto de delegação de acordo com as regras gerais do processo administrativo.","alternativas":{"A":"A instrução probatória documental de sindicâncias administrativas bipartidas.","B":"A edição de atos de caráter normativo, a decisão de recursos administrativos e as matérias de competência exclusiva do órgão ou autoridade.","C":"A catalogação física de insumos de limpeza recebidos no almoxarifado central.","D":"A assinatura de termos de recebimento informal de brinde oferecido por particulares.","E":"A fiscalização de trânsito rodoviário e aplicação de advertências verbais simples."},"resposta_correta":"B","comentario":"As regras gerais do processo administrativo estabelecem três matérias de reserva absoluta e indelegáveis: a edição de atos de caráter normativo, a decisão de recursos administrativos e as matérias de competência exclusiva do órgão."},{"id":264,"numero":264,"bloco":2,"materia":"Direito Administrativo","texto_base":null,"enunciado":"A vacância constitui o ato administrativo que declara o cargo público como desocupado, gerando a abertura de vaga para novo preenchimento por concurso. Dentre as modalidades expressas de vacância previstas nos estatutos funcionais em consonância com a norma geral, encontra-se a:","alternativas":{"A":"Nomeação originária.","B":"Promoção vertical.","C":"Exoneração ou Demissão.","D":"Readaptação médica provisória.","E":"Reintegração judicial retroativa."},"resposta_correta":"C","comentario":"A vacância declara o cargo como vago. As modalidades clássicas são a exoneração (a pedido ou de ofício sem caráter punitivo), a demissão (sanção expulsória), a aposentadoria, o falecimento e a posse em outro cargo inacumulável."},{"id":265,"numero":265,"bloco":2,"materia":"Direito Administrativo","texto_base":null,"enunciado":"Considere a seguinte situação hipotética: Um cidadão potiguar ingressa com uma petição perante a Secretaria de Administração Penitenciária requerendo a emissão de uma certidão de tempo de permanência de um familiar que esteve detido em uma unidade do Estado. O órgão administrativo recebe o pedido, mas permanece em silêncio absoluto e deixa de proferir qualquer decisão ou resposta no prazo legal fixado na lei do processo. A omissão injustificada da Administração Pública diante do dever legal de decidir configura uma ilegalidade por omissão, violando de forma direta o princípio do(a):","alternativas":{"A":"Eficiência e a garantia da razoável duração do processo.","B":"Supremacia mitigada do interesse privado corporativo.","C":"Publicidade restrita a meios de comunicação digitais.","D":"Autotutela judicial de mérito discricionário.","E":"Inversão compulsória do ônus da prova administrativa."},"resposta_correta":"A","comentario":"O silêncio e a omissão injustificada da Administração violam o Princípio da Eficiência e o direito constitucional à razoável duração do processo e à celeridade de sua tramitação (Art. 5º, LXXVIII, da CF), ensejando controle judicial para impor a obrigação de decidir."},{"id":266,"numero":266,"bloco":2,"materia":"Direito Administrativo","texto_base":null,"enunciado":"O enriquecimento ilícito constitui uma das condutas mais severamente reprimidas pela Lei de Improbidade Administrativa. Nos termos do artigo 9º da LIA, com as alterações vigentes, constitui ato de improbidade que importa enriquecimento ilícito adquirir, para si ou para outrem, no exercício de mandato, de cargo, de emprego ou de função pública, bens de qualquer natureza cujo valor seja:","alternativas":{"A":"superior a cem salários mínimos, independentemente da comprovação de origem dos recursos.","B":"desproporcional à evolução do patrimônio ou à renda do agente público.","C":"inferior ao subsídio fixado em lei ordinária para o cargo de Governador do Estado.","D":"oriundo de heranças familiares devidamente documentadas em cartórios privados.","E":"flutuante e determinado pelas oscilações diárias do mercado financeiro salineiro."},"resposta_correta":"B","comentario":"O artigo 9º, inciso VII, da LIA tipifica como ato de enriquecimento ilícito a evolução patrimonial desproporcional à renda ou ao subsídio oficial do agente público, operando-se a inversão do ônus para que o servidor comprove a origem lícita dos recursos."},{"id":267,"numero":267,"bloco":2,"materia":"Direito Administrativo","texto_base":null,"enunciado":"A Lei de Improbidade Administrativa prevê a possibilidade de indisponibilidade de bens do réu como medida cautelar voltada a garantir o integral ressarcimento do erário em caso de futura condenação. De acordo com o artigo 16 da LIA, modificado pela Lei nº 14.230/2021, o pedido de indisponibilidade de bens:","alternativas":{"A":"exige a prova cabal de perigo de dano iminente ou de eficácia do provimento final (periculum in mora), demonstrando que o réu está dilapidando o patrimônio.","B":"prescinde de fundamentação técnica, sendo decretado de forma automática com o recebimento da ação.","C":"pode abranger os valores correspondentes à aplicação da penalidade de multa civil de forma antecipada.","D":"recairá prioritariamente sobre as contas bancárias destinadas ao recebimento de salários ou subsídios ordinários.","E":"submete-se à aprovação unânime dos membros do Conselho da Comunidade local."},"resposta_correta":"A","comentario":"A Lei nº 14.230/2021 passou a exigir a demonstração do perigo de dano iminente (periculum in mora) para a decretação da indisponibilidade de bens, exigindo a prova de que o réu está tentando dilapidar o patrimônio para frustrar o ressarcimento."},{"id":268,"numero":268,"bloco":2,"materia":"Direito Administrativo","texto_base":null,"enunciado":"O processo administrativo estadual orienta-se pelo princípio do formalismo moderado (ou informalismo relativo). Esse princípio estabelece que as formas e formalidades processuais administrativas:","alternativas":{"A":"devem ser observadas com rigor sacramental absoluto, sob pena de nulidade imediata de todo e qualquer ato de expediente.","B":"devem ser interpretadas de forma flexível, funcionando como meios para assegurar a proteção dos direitos e a correta formação da vontade estatal, sem apegos excessivos a burocracias.","C":"são dispensadas de forma total, autorizando-se o processo estritamente verbal e sem registros por escrito.","D":"submetem-se às regras de trâmite fixadas de forma discricionária pelo sindicato da respectiva categoria profissional.","E":"impedem que o investigado apresente alegações orais durante a realização do interrogatório disciplinar."},"resposta_correta":"B","comentario":"O princípio do formalismo moderado impõe que as formalidades no processo administrativo não assumam caráter de fim em si mesmas. Devem ser interpretadas de forma flexível para garantir os direitos dos administrados e a busca da verdade real, repelindo burocracias inúteis."},{"id":269,"numero":269,"bloco":2,"materia":"Direito Administrativo","texto_base":null,"enunciado":"Os serviços públicos concedidos submetem-se ao princípio da continuidade, o que significa que as atividades essenciais entregues à população não podem sofrer interrupções abruptas. Contudo, a Lei nº 8.987/1995 autoriza a interrupção do serviço em situações específicas. Assinale a alternativa que apresenta uma hipótese legítima de interrupção regular do serviço público por parte da concessionária.","alternativas":{"A":"Paralisação motivada pelo interesse político pessoal do diretor da empresa parceira.","B":"Interrupção por motivos de ordem técnica ou de segurança das instalações, ou por inadimplemento do usuário, após prévio aviso.","C":"Suspensão imediata decorrente de greve deflagrada de forma clandestina pelos servidores públicos do órgão regulador.","D":"Interrupção compulsória nos dias de feriados estaduais ou municipais secundários.","E":"Paralisação total determinada por oscilações inflacionárias do mercado financeiro internacional."},"resposta_correta":"B","comentario":"A Lei de Concessões (Lei nº 8.987/95) autoriza a interrupção regular do serviço público em duas hipóteses: situações de emergência técnica/segurança ou por inadimplemento financeiro do usuário, exigindo-se neste último caso prévio aviso por escrito."},{"id":270,"numero":270,"bloco":2,"materia":"Direito Administrativo","texto_base":null,"enunciado":"Considere a seguinte situação hipotética: Um cidadão potiguar responde a um processo administrativo perante a Secretaria de Fazenda do Estado. Notificado para apresentar suas alegações finais, o administrado decide protocolar uma peça escrita contendo expressões vulgares, deboches explícitos e insultos de natureza pessoal direcionados aos servidores que compõem a junta de julgamento. À luz dos deveres do administrado no processo administrativo, o cidadão descumpriu frontalmente a obrigação legal de:","alternativas":{"A":"prestar informações de natureza estritamente financeira de seus familiares.","B":"proceder com lealdade, urbanidade e boa- fé, sem formular pretensões destituídas de fundamento verdadeiro.","C":"recolher taxas de expediente prévias para a distribuição de peças recursais ordinárias.","D":"fazer-se representar obrigatoriamente por três advogados inscritos na Ordem dos Advogados do Brasil (OAB).","E":"submeter suas alegações à aprovação unânime do Conselho da Comunidade local."},"resposta_correta":"B","comentario":"O administrado possui o dever legal de proceder perante a Administração Pública com lealdade, urbanidade e boa-fé, sendo terminantemente proibido o emprego de insultos ou termos ofensivos contra os agentes públicos no processo."},{"id":271,"numero":271,"bloco":2,"materia":"Direito Administrativo","texto_base":null,"enunciado":"Dentre as sanções cominadas em face da prática de atos de improbidade administrativa que causam prejuízo ao erário, o artigo 12, inciso II, da LIA estabelece balizas específicas para o ressarcimento e a aplicação de multas. O valor da multa civil aplicável nessa hipótese será equivalente:","alternativas":{"A":"a até cem vezes o valor do subsídio mensal percebido pelo agente público.","B":"ao valor do dano efetivamente causado ao erário público estadual ou municipal.","C":"ao dobro do valor do faturamento bruto anual da empresa privada concorrente.","D":"a cinco salários mínimos federais de forma fixa e intransigente.","E":"à perda integral dos bens móveis e semoventes residenciais adquiridos por herança."},"resposta_correta":"B","comentario":"Nos termos do artigo 12, inciso II, da LIA, para os atos de improbidade que causam prejuízo ao erário, a multa civil será fixada em valor equivalente ao reflexo financeiro do dano efetivamente sofrido pelas burras públicas."},{"id":272,"numero":272,"bloco":2,"materia":"Direito Administrativo","texto_base":null,"enunciado":"O princípio do impulso oficial (ou da oficialidade) rege a marcha do processo administrativo. De acordo com esse princípio fundamental, a Administração Pública:","alternativas":{"A":"depende obrigatoriamente da provocação permanente do administrado para dar andamento a cada fase processual.","B":"tem o poder e o dever de iniciar o processo de ofício e impulsionar a sua marcha até a decisão final, independentemente da inércia das partes.","C":"é proibida de realizar diligências de campo sem autorização prévia emitida pelo Poder Judiciário.","D":"deve suspender o trâmite dos processos disciplinares durante o recesso parlamentar anual.","E":"transfere a coordenação das audiências instrutórias ao sindicato da respectiva categoria profissional."},"resposta_correta":"B","comentario":"O princípio do impulso oficial (ou da oficialidade) determina que, uma vez iniciado o processo administrativo, a Administração tem o dever de impulsionar a marcha dos atos de ofício até a decisão final, sem depender da inércia ou provocação das partes interessadas."},{"id":273,"numero":273,"bloco":2,"materia":"Direito Administrativo","texto_base":null,"enunciado":"A responsabilidade administrativa dos servidores públicos e a aplicação de sanções éticas ou disciplinares são esferas independentes da responsabilidade criminal. Contudo, a legislação administrativa e a jurisprudência consagram o reflexo da esfera penal sobre a administrativa na hipótese em que a sentença criminal absolutória fundar-se em:","alternativas":{"A":"insuficiência crônica de provas materiais colhidas no inquérito policial civil.","B":"negativa de autoria ou inexistência material do fato, devidamente reconhecidas pelo juízo penal.","C":"prescrição da pretensão punitiva do Estado pelo decurso do tempo regulamentar.","D":"concessão de perdão judicial tácito motivado por clemência do magistrado singular.","E":"aplicação do princípio da insignificância material em crimes de furto simples de bagatela."},"resposta_correta":"B","comentario":"A regra geral consagra a independência das instâncias. Todavia, a absolvição penal repercute obrigatoriamente na esfera administrativa, vinculando o órgão e extinguindo o PAD, se a sentença criminal reconhecer categoricamente a negativa de autoria ou a inexistência material do fato."},{"id":274,"numero":274,"bloco":2,"materia":"Direito Administrativo","texto_base":null,"enunciado":"Considere a seguinte situação hipotética: O Diretor de uma unidade penitenciária do Rio Grande do Norte, diante de indícios de desvios funcionais na entrega de insumos alimentícios por uma empresa terceirizada, decide instaurar uma investigação prévia simplificada, de caráter puramente informativo e sem caráter punitivo imediato, voltada a colher elementos preliminares de autoria e materialidade antes de formalizar o PAD. O procedimento administrativo preparatório e inquisitivo que visa angariar elementos de informação preliminares para subsidiar a eventual instauração de Processo Administrativo Disciplinar denomina-se:","alternativas":{"A":"Inquérito Civil Público.","B":"Sindicância Investigatória (ou Preparatória).","C":"Tomada de Contas Especial.","D":"Ação de Improbidade Cautelar.","E":"Processo de Cassação Ad Nutum."},"resposta_correta":"B","comentario":"A sindicância investigatória (ou preparatória) qualifica-se como procedimento puramente informativo e preliminar, desprovido de caráter punitivo imediato, voltado a colher indícios mínimos de autoria e materialidade para subsidiar a abertura de um PAD."},{"id":275,"numero":275,"bloco":2,"materia":"Direito Administrativo","texto_base":null,"enunciado":"A Lei nº 8.429/1992 estabelece regras estritas para a configuração do elemento subjetivo nos atos de improbidade que atentam contra os princípios da Administração Pública. De acordo com o artigo 11, § 1º, do referido diploma legal, a tipificação dos atos de improbidade que atentam contra os princípios exige a demonstração de lesão relevante a bem jurídico tutelado e:","alternativas":{"A":"a comprovação de enriquecimento ilícito do agente público de forma concomitante obrigatória.","B":"a prova cabal de prejuízo financeiro efetivo e mensurável ao erário público superior a dez mil reais.","C":"não se configura pelo mero exercício de funções administrativas sem a prova de dolo específico focado na finalidade ilícita.","D":"a assinatura unânime de termo de ajustamento de conduta (TAC) firmado perante o Ministério Público.","E":"a perda definitiva do cargo público efetivo estável por determinação verbal do Governador."},"resposta_correta":"C","comentario":"O artigo 11, § 1º, da LIA sepultou a improbidade por mera irregularidade formal. A tipificação de atos contra os princípios exige dolo específico e lesão relevante, estabelecendo a lei que o mero exercício de funções sem o intuito doloso focado no resultado ilícito não configura improbidade. HUMANOS"},{"id":276,"numero":276,"bloco":1,"materia":"Direitos Humanos","texto_base":null,"enunciado":"A Declaração Universal dos Direitos Humanos (DUDH), proclamada pela Assembleia Geral das Nações Unidas em 1948, fixou um marco normativo global e comum de proteção à dignidade humana. Nos termos explícitos do Artigo 1º do referido documento:","alternativas":{"A":"os direitos dos cidadãos dependem da sua respectiva condição socioeconômica nacional.","B":"todos os seres humanos nascem livres e iguais em dignidade e direitos e, dotados de razão e consciência, devem agir em relação uns aos outros com espírito de fraternidade.","C":"o direito à liberdade de locomoção cede espaço absoluto ao poder de polícia do Estado em tempo de paz.","D":"os direitos fundamentais restringem-se aos nacionais dos países que compõem o Conselho de Segurança.","E":"admite-se a aplicação de trabalhos forçados como mecanismo de pacificação de conflitos civis urbanos."},"resposta_correta":"B","comentario":"É a reprodução literal do Artigo 1º da DUDH de 1948, pilar axiomático que consagra os princípios da liberdade, igualdade, dignidade humana e fraternidade universal entre todos os indivíduos."},{"id":277,"numero":277,"bloco":1,"materia":"Direitos Humanos","texto_base":null,"enunciado":"A Convenção Americana sobre Direitos Humanos (Pacto de São José da Costa Rica, 1969) disciplina as garantias judiciais e o direito à integridade pessoal. De acordo com o Artigo 5º do Pacto, no que tange ao tratamento dispensado às pessoas privadas de liberdade:","alternativas":{"A":"as penas privativas de liberdade devem consistir essencialmente em castigos corporais de caráter pedagógico.","B":"os processados devem ficar separados dos condenados, salvo em circunstâncias excepcionais, e ser submetidos a um tratamento adequado à sua condição de pessoas não condenadas.","C":"admite-se a aplicação da pena de morte de forma retroativa para crimes de natureza política.","D":"os menores imputáveis devem ser recolhidos preferencialmente nos mesmos pavilhões dos adultos reincidentes.","E":"a perda dos direitos civis pelo sentenciado autoriza a suspensão absoluta do direito à integridade moral."},"resposta_correta":"B","comentario":"Nos termos do Artigo 5º, item 4, da Convenção Americana sobre Direitos Humanos, impõe-se o dever de separação prisional obrigatória entre os presos provisórios (processados) e os presos condenados definitivos, garantindo-se aos primeiros tratamento compatível com a presunção de inocência."},{"id":278,"numero":278,"bloco":1,"materia":"Direitos Humanos","texto_base":null,"enunciado":"As Regras Mínimas das Nações Unidas para o Tratamento de Presos (Regras de Mandela) constituem o principal parâmetro internacional humanitário para a gestão de sistemas carcerários. Conforme as diretrizes das Regras de Mandela relativas à aplicação de sanções disciplinares intramuros, são terminantemente proibidas, por configurarem tratamento cruel, desumano ou degradante:","alternativas":{"A":"as revistas estruturais nas celas e pavimentos residenciais executadas por policiais penais armados.","B":"o isolamento indefinido ou prolongado e o confinamento em cela escura ou continuamente iluminada.","C":"a perda temporária do direito de participar de atividades recreativas ou esportivas aos finais de semana.","D":"a transferência motivada de presos líderes negativos para estabelecimentos de segurança máxima.","E":"a obrigatoriedade do uso de uniformes padrão fornecidos de forma gratuita pela administração."},"resposta_correta":"B","comentario":"As Regras de Mandela proíbem terminantemente, no seu catálogo de sanções disciplinares (Regras 43 a 45), o isolamento indefinido ou prolongado (superior a 15 dias consecutivos) e o confinamento em celas escuras ou continuamente iluminadas, por caracterizarem tortura moral e física."},{"id":279,"numero":279,"bloco":1,"materia":"Direitos Humanos","texto_base":null,"enunciado":"Considere a seguinte situação hipotética: Durante a realização de um procedimento de vistoria de rotina em um pavilhão carcerário potiguar, os Policiais Penais de plantão interceptam um manuscrito contendo ameaças de morte contra servidores da unidade. Com o objetivo de obter a identificação do autor, a equipe submete os internos da galeria ao isolamento em cubículo sem ventilação, privação de água potável por 48 horas e exposição prolongada ao sol. À luz do artigo 5º da DUDH e das normas internacionais de proteção aos direitos humanos, as medidas adotadas pelos agentes públicos caracterizam-se como:","alternativas":{"A":"técnicas táticas legítimas de controle psicológico chanceladas pela gravidade da ameaça.","B":"tortura e tratamento cruel, desumano ou degradante, configurando violação grave e inadmissível.","C":"infração de menor potencial ofensivo dispensada de apuração por órgãos correcionais.","D":"exercício regular de direito decorrente da quebra do dever de disciplina pelos custodiados.","E":"procedimentos padrão homologados tacitamente pelo Conselho da Comunidade local."},"resposta_correta":"B","comentario":"O emprego de isolamento em locais sem ventilação, privação de água potável e exposição intencional a dores físicas ou humilhações como meio de obter informações ou confissões agride frontalmente o Artigo 5º da DUDH e os tratados internacionais, configurando crime de tortura e tratamento degradante."},{"id":280,"numero":280,"bloco":1,"materia":"Direitos Humanos","texto_base":null,"enunciado":"A Declaração Universal dos Direitos Humanos consagra a proteção contra prisões e detenções arbitrárias, estabelecendo balizas de legalidade para a atuação das forças de segurança. Nos termos literais do Artigo 9º da DUDH:","alternativas":{"A":"ninguém pode ser arbitrariamente preso, detido ou exilado.","B":"a prisão preventiva de estrangeiros pode ser decretada de forma discricionária pelo delegado.","C":"admite-se a detenção sem ordem escrita se o suspeito ostentar antecedentes por crimes patrimoniais.","D":"o exílio político de cidadãos opositores é chancelado em períodos de recesso parlamentar.","E":"as forças policiais detêm imunidade civil absoluta perante violações de locomoção."},"resposta_correta":"A","comentario":"Trata-se da redação literal do Artigo 9º da DUDH, que veda o arbítrio estatal na restrição da liberdade de locomoção, exigindo que toda e qualquer prisão ou exílio submeta-se a rígidos critérios de legalidade prévia."},{"id":281,"numero":281,"bloco":1,"materia":"Direitos Humanos","texto_base":null,"enunciado":"O Pacto de São José da Costa Rica estabelece limites rígidos à aplicação da pena de morte nos países que ainda a mantêm em seus ordenamentos jurídicos. De acordo com o Artigo 4º da Convenção Americana sobre Direitos Humanos, nos países que não aboliram a pena de morte, esta:","alternativas":{"A":"pode ser estendida de forma livre a novos tipos penais por meio de decretos do Poder Executivo.","B":"só poderá ser imposta pelos crimes mais graves, em conformidade com lei que esteja em vigor antes do cometimento do crime, e não se estenderá aos crimes políticos.","C":"será aplicada de forma automática a mulheres grávidas e a menores de dezoito anos de idade.","D":"poderá ser executada de forma imediata, sendo vedado o direito de solicitar anistia ou indulto.","E":"caducará se o processo judicial de instrução tramitar por período superior a seis meses."},"resposta_correta":"B","comentario":"O Artigo 4º, item 2, do Pacto de São José da Costa Rica estabelece restrições severas à pena de morte nos países que ainda a adotam, exigindo previsão em lei anterior, aplicação restrita aos crimes mais graves e proibição absoluta de imposição em face de crimes políticos ou de opinião."},{"id":282,"numero":282,"bloco":1,"materia":"Direitos Humanos","texto_base":null,"enunciado":"No que concerne ao direito a um julgamento justo, o Artigo 11 da DUDH positiva o Princípio da Presunção de Inocência. De acordo com o texto do documento internacional, todo ser humano acusado de um ato delituoso tem o direito de ser presumido inocente até que a sua culpabilidade tenha sido provada de acordo com a lei, em julgamento público no qual:","alternativas":{"A":"o ônus da prova seja integralmente transferido à defesa técnica do réu.","B":"lhe tenham sido asseguradas todas as garantias necessárias à sua defesa.","C":"o veredicto final seja submetido à aprovação prévia das forças de segurança pública.","D":"a imprensa sensacionalista detenha o direito de divulgar as gravações do interrogatório sem restrições.","E":"se dispense a oitiva de testemunhas de acusação se houver confissão em sede policial."},"resposta_correta":"B","comentario":"O Artigo 11, item 1, da DUDH consagra o Princípio da Presunção de Inocência, condicionando a desconstrução do status de inocente a um julgamento público dotado de todas as garantias técnico-processuais necessárias à ampla defesa do acusado."},{"id":283,"numero":283,"bloco":1,"materia":"Direitos Humanos","texto_base":null,"enunciado":"As Regras de Mandela trazem orientações expressas sobre o uso de instrumentos de restrição física (como algemas ou camisas de força) no ambiente prisional. Nos termos dessas regras, os instrumentos de restrição física nunca devem ser aplicados como:","alternativas":{"A":"mecanismo de prevenção de fugas durante transferências e escoltas terrestres.","B":"medida de segurança recomendada por médicos para evitar o cometimento de automutilação pelo preso.","C":"sanção disciplinar ou forma de punição.","D":"instrumento de contenção física diante de iminente agressão contra os servidores do plantão.","E":"barreira física tática provisória autorizada pelo Diretor do estabelecimento."},"resposta_correta":"C","comentario":"Conforme preceitua a Regra 47 das Regras de Mandela, os meios de restrição física (como algemas) são instrumentos de segurança estritos para movimentação ou prevenção de danos. É terminantemente proibido o seu uso com caráter punitivo ou como modalidade de sanção disciplinar."},{"id":284,"numero":284,"bloco":1,"materia":"Direitos Humanos","texto_base":null,"enunciado":"O direito ao reconhecimento de sua personalidade jurídica em todos os lugares é garantia individual inafastável positivada nos tratados internacionais. De acordo com o Artigo 6º da DUDH e o Artigo 3º da Convenção Americana sobre Direitos Humanos, todo ser humano tem o direito de ser reconhecido, em qualquer parte, como:","alternativas":{"A":"cidadão eleitor apto ao exercício do sufrágio universal de forma compulsória.","B":"pessoa perante a lei, detentora de direitos e obrigações jurídicas.","C":"sujeito de soberania política inalcançável pelas leis penais ordinárias locais.","D":"membro honorífico de associações sindicais de assistência social privada.","E":"refugiado internacional com direito a auxílio financeiro governamental imediato."},"resposta_correta":"B","comentario":"O direito ao reconhecimento da personalidade jurídica (Artigo 6º da DUDH e Artigo 3º do Pacto) impõe que todo indivíduo, em qualquer território, seja considerado um sujeito de direitos e deveres perante o ordenamento, repelindo-se a morte civil ou a perda total de direitos."},{"id":285,"numero":285,"bloco":1,"materia":"Direitos Humanos","texto_base":null,"enunciado":"Considere a seguinte situação hipotética: Um reeducando em cumprimento de pena em regime fechado no Rio Grande do Norte manifesta formalmente o desejo de professar uma religião minoritária de matriz africana, solicitando autorização para receber assistência religiosa e manter em sua cela um livro sagrado de sua crença. À luz do Artigo 18 da DUDH e das Regras de Mandela relativas à liberdade religiosa no cárcere, a administração prisional deve:","alternativas":{"A":"proibir o ato para evitar atritos ou desentendimentos ideológicos com os demais presos do pavilhão.","B":"respeitar e viabilizar a liberdade de religião e de crença, permitindo o recebimento de assistência e materiais religiosos legítimos, desde que não representem risco à segurança.","C":"cobrar taxas de expediente financeiras para autorizar a entrada de ministros de cultos religiosos.","D":"condicionar o direito à comprovação de bom comportamento carcerário por período superior a um ano.","E":"transferir o detento para uma ala de isolamento preventivo até a conclusão do estágio probatório do plantão."},"resposta_correta":"B","comentario":"A Regra 65 das Regras de Mandela e o Artigo 18 da DUDH asseguram o direito à liberdade religiosa intramuros. A administração tem o dever de viabilizar o exercício dos cultos e o acesso a livros sagrados, desde que as práticas ou objetos respeitem as normas logísticas gerais de segurança da unidade."},{"id":286,"numero":286,"bloco":1,"materia":"Direitos Humanos","texto_base":null,"enunciado":"O direito à privacidade e à inviolabilidade da vida privada é protegido contra intromissões arbitrárias do Estado ou de particulares. Nos termos do Artigo 12 da DUDH, ninguém será sujeito a interferências na sua vida privada, na sua família, no seu domicílio ou na sua correspondência, nem a ataques à sua honra e reputação, sendo assegurado a todo ser humano o direito à:","alternativas":{"A":"censura prévia de reportagens jornalísticas críticas à atuação administrativa.","B":"proteção da lei contra tais interferências ou ataques.","C":"isenção total de tributos imobiliários sobre as residências particulares dos atingidos.","D":"eliminação definitiva de seus dados de identificação biométrica dos sistemas policiais.","E":"autonomia de recusar a realização de revistas estruturais em sua cela residencial."},"resposta_correta":"B","comentario":"É a aplicação literal do Artigo 12 da DUDH. O direito à privacidade, domicílio, honra e correspondência é protegido contra interferências arbitrárias, preceituando o texto que todo ser humano tem o direito à proteção da lei contra tais agressões."},{"id":287,"numero":287,"bloco":1,"materia":"Direitos Humanos","texto_base":null,"enunciado":"A Convenção Americana sobre Direitos Humanos veda terminantemente a escravidão e a servidão humana em suas diversas modalidades. O Artigo 6º do Pacto estabelece que ninguém pode ser submetido a escravidão ou a servidão, ressalvando contudo que o trabalho forçado:","alternativas":{"A":"é permitido como punição imposta por tribunal competente em decorrência de crime, nos países que preveem tal pena.","B":"qualifica-se como dever cívico obrigatório aplicável a todos os presos provisórios de forma ampla.","C":"pode ser utilizado pelas empresas privadas parceiras das oficinas industriais sem remuneração.","D":"é chancelado se o objetivo for cobrir os custos operacionais da alimentação fornecida no presídio.","E":"constitui técnica legítima de ressocialização imposta de forma discricionária pelo Diretor da unidade."},"resposta_correta":"A","comentario":"O Artigo 6º, item 2, do Pacto de São José da Costa Rica veda a escravidão, mas estabelece que nos países onde se prevê a pena de trabalho forçado imposta por tribunal judicial competente decorrente de condenação criminal, a medida pode ser executada em conformidade com a lei."},{"id":288,"numero":288,"bloco":1,"materia":"Direitos Humanos","texto_base":null,"enunciado":"As Regras de Mandela determinam que o sistema de registro de presos é uma ferramenta indispensável para garantir a transparência, combater desaparecimentos e salvaguardar direitos. De acordo com as regras vigentes, em todo local onde haja pessoas presas, deve-se manter um sistema de registro oficial que contenha, entre outros dados obrigatórios:","alternativas":{"A":"a orientação político-partidária e a conta bancária particular dos familiares do reeducando.","B":"a identidade do preso, os motivos de sua prisão, a autoridade que a determinou, bem como o dia e a hora de sua admissão e libertação.","C":"o histórico de postagens em mídias sociais realizadas pelo custodiado nos últimos cinco anos.","D":"a indicação discricionária de parceiros comerciais de preferência para a compra de insumos.","E":"a assinatura unânime dos deputados integrantes da comissão de direitos humanos do estado."},"resposta_correta":"B","comentario":"Conforme as Regras 6 a 8 das Regras de Mandela, o sistema de registro de presos é impositivo e deve documentar com precisão cronológica a identidade do custodiado, os motivos jurídicos da tranca, a autoridade ordenadora e os horários exatos de ingresso e soltura para evitar prisões clandestinas."},{"id":289,"numero":289,"bloco":1,"materia":"Direitos Humanos","texto_base":null,"enunciado":"O direito ao trabalho e à livre escolha de emprego é consagrado no Artigo 23 da DUDH. No que concerns ao desdobramento desse direito e à igualdade remuneratória, o texto da Declaração Universal estabelece de forma categórica que todo ser humano tem direito, sem distinção alguma, a:","alternativas":{"A":"subsídios financeiros estatais complementares em períodos de crises inflacionárias mundiais.","B":"salário igual para trabalho igual.","C":"estabilidade vitalícia e hereditária em funções comerciais de natureza estritamente privada.","D":"dispensa do cumprimento das jornadas de trabalho em dias de feriados religiosos específicos.","E":"gratificações extraordinárias por produtividade industrial sem previsão em leis locais ordinárias."},"resposta_correta":"B","comentario":"O Artigo 23, item 2, da DUDH consagra a igualdade salarial vertical ao preceituar textualmente que todo ser humano, sem qualquer modalidade de discriminação, detém o direito a salário igual para trabalho igual."},{"id":290,"numero":290,"bloco":1,"materia":"Direitos Humanos","texto_base":null,"enunciado":"Considere a seguinte situação hipotética: O Diretor de Segurança de um complexo penitenciário potiguar edita uma portaria interna determinando que todas as presas gestantes ou lactantes fiquem permanentemente algemadas durante os procedimentos de atendimento médico interno na enfermaria e durante o parto, alegando necessidade de prevenir reações intempestivas. Diante das disposições das Regras de Mandela e das Regras de Bangkok (Regras das Nações Unidas para o Tratamento de Mulheres Presas), o uso de instrumentos de restrição física em mulheres em trabalho de parto, durante o parto e imediatamente após o parto é:","alternativas":{"A":"permitido de forma discricionária pela autoridade se a presa for reincidente em crimes violentos.","B":"terminantemente proibido, qualificando-se como tratamento desumano e degradante.","C":"obrigatório se não houver policiais penais femininas suficientes para compor a escolta da enfermaria.","D":"chancelado pela aplicação do princípio da supremacia do interesse corporativo da segurança.","E":"considerado infração leve de trâmite operacional que dispensa intervenção da Corregedoria."},"resposta_correta":"B","comentario":"As Regras de Mandela (Regra 48) e as Regras de Bangkok proíbem terminantemente o uso de algemas ou instrumentos de restrição física em mulheres durante o trabalho de parto, no momento do parto e imediatamente após o parto, resguardando a integridade física e a dignidade médica da gestante."},{"id":291,"numero":291,"bloco":1,"materia":"Direitos Humanos","texto_base":null,"enunciado":"O direito de buscar e gozar asilo em outros países é garantia internacional voltada a proteger indivíduos que sofram perseguições estatais. Nos termos do Artigo 14 da DUDH, todo ser humano vítima de perseguição tem o direito de procurar asilo e de beneficiar-se dele em outros países, salvo se a perseguição for legitimamente motivada por:","alternativas":{"A":"crimes de direito comum ou por atos contrários aos objetivos e princípios das Nações Unidas.","B":"manifestações político-partidárias contrárias à ideologia do partido majoritário do governo.","C":"profissão de cultos religiosos minoritários ou dissidências intelectuais acadêmicas.","D":"organização de greves gerais pacíficas de trabalhadores das carreiras de segurança civil.","E":"questionamentos públicos sobre a eficiência estrutural dos estabelecimentos prisionais locais."},"resposta_correta":"A","comentario":"O direito de buscar asilo político (Artigo 14 da DUDH) é garantia de proteção contra perseguições ideológicas ou estatais. Contudo, o item 2 do referido artigo afasta o benefício se o indivíduo for processado genuinamente por crimes comuns de direito penal ou por atos contrários aos princípios da ONU."},{"id":292,"numero":292,"bloco":1,"materia":"Direitos Humanos","texto_base":null,"enunciado":"O Pacto de São José da Costa Rica positiva o direito à liberdade de pensamento e de expressão no seu Artigo 13. De acordo com o texto da Convenção Americana sobre Direitos Humanos, esse direito compreende a liberdade de buscar, receber e difundir informações e ideias de toda natureza, não podendo ser submetido a censura prévia, mas sim a:","alternativas":{"A":"suspensão total automática em períodos de recesso administrativo do Poder Judiciário.","B":"responsabilidades ulteriores, que devem ser expressamente fixadas em lei e necessárias para assegurar o respeito aos direitos ou à reputação das demais pessoas.","C":"aprovação prévia por escrito expedida pelo Secretário de Estado da Segurança Pública.","D":"sanções pecuniárias indenizatórias aplicadas de ofício pelas forças policiais de área.","E":"fiscalização permanente e sigilosa por comissões de inteligência militar de fronteiras."},"resposta_correta":"B","comentario":"Conforme o Artigo 13, item 2, do Pacto de São José da Costa Rica, proíbe-se a censura prévia de pensamento ou expressão. Eventuais excessos, calúnias ou ofensas submetem-se ao regime das responsabilidades ulteriores (posteriores), que devem ser expressamente fixadas em lei para proteger a honra e a ordem pública."},{"id":293,"numero":293,"bloco":1,"materia":"Direitos Humanos","texto_base":null,"enunciado":"As Regras de Mandela conferem especial atenção às condições de higiene, iluminação e ventilação das celas destinadas ao confinamento de presos. Conforme as regras técnicas vigentes, as janelas das celas de habitação devem ser suficientemente grandes para permitir que os presos:","alternativas":{"A":"visualizem a movimentação externa dos policiais de plantão nas guaritas da muralha livremente.","B":"leiam e trabalhem com luz natural, e devem permitir a entrada de ar fresco, haja vista as condições climáticas locais.","C":"realizem a troca de sinais e mensagens com visitantes localizados na recepção do complexo.","D":"ocultem ferramentas ou objetos perfurantes das vistorias estruturais periódicas da equipe.","E":"dispensem a necessidade de uso de lâmpadas elétricas artificiais durante o período do repouso noturno."},"resposta_correta":"B","comentario":"A Regra 14 das Regras de Mandela estabelece critérios arquitetônicos humanitários para o aprisionamento, exigindo que as janelas das celas possuam dimensões técnicas adequadas para permitir a entrada de ar fresco e iluminação natural suficiente para leitura e trabalho dos internos."},{"id":294,"numero":294,"bloco":1,"materia":"Direitos Humanos","texto_base":null,"enunciado":"A Declaração Universal dos Direitos Humanos estabelece a proteção ao direito de propriedade no seu Artigo 17. De acordo com as duas regras simples expressas no referido dispositivo internacional:","alternativas":{"A":"o direito de propriedade restringe-se aos bens móveis industriais adquiridos por concurso público.","B":"todo ser humano tem direito à propriedade, só ou em sociedade com outros, e ninguém pode ser arbitrariamente privado de sua propriedade.","C":"permite-se o confisco imediato de terras privadas pelo Estado se houver crises orçamentárias internas.","D":"a propriedade imobiliária rural submete-se ao controle permanente das forças armadas de defesa.","E":"os presos condenados perdem de forma definitiva a titularidade de seus bens patrimoniais herdados."},"resposta_correta":"B","comentario":"É a redação literal do Artigo 17 da DUDH, que consagra o direito de propriedade individual ou coletivo como garantia fundamental, vedando de forma intransigente a privação ou confisco arbitrário de bens pelo Estado."},{"id":295,"numero":295,"bloco":1,"materia":"Direitos Humanos","texto_base":null,"enunciado":"Considere a seguinte situação hipotética: Um estrangeiro, cidadão de um país que compõe a Organização dos Estados Americanos (OEA), ingressa com uma petição perante a Comissão Interamericana de Direitos Humanos alegando que o Estado brasileiro violou seus direitos de ampla defesa e integridade física durante o cumprimento de prisão preventiva em uma comarca potiguar. À luz das regras de funcionamento do Sistema Interamericano de Proteção aos Direitos Humanos, a petição individual apresentada por qualquer pessoa ou grupo de pessoas perante a Comissão Interamericana exige, como requisito geral de admissibilidade:","alternativas":{"A":"o pagamento de taxas judiciais proporcionais ao subsídio mensal dos juízes do tribunal internacional.","B":"que tenham sido interpostos e esgotados os recursos da jurisdição interna, de acordo com os princípios de direito internacional geralmente reconhecidos.","C":"a anuência unânime dos senadores da República que compõem a comissão de relações exteriores.","D":"que o peticionário comprove filiação partidária ativa em organizações não governamentais (ONGs).","E":"que o andamento processual na vara criminal de origem tenha sido concluído em período inferior a trinta dias."},"resposta_correta":"B","comentario":"O Artigo 46, item 1, \"a\", da Convenção Americana sobre Direitos Humanos positiva a regra do esgotamento dos recursos internos como requisito de admissibilidade impositivo para que a Comissão Interamericana conheça e processe denúncias ou petições individuais."},{"id":296,"numero":296,"bloco":1,"materia":"Direitos Humanos","texto_base":null,"enunciado":"O direito à educação é consagrado no Artigo 26 da DUDH como fator de pleno desenvolvimento da personalidade humana e do fortalecimento do respeito pelos direitos humanos. De acordo com as diretrizes da Declaração Universal, a educação deve ser gratuita, pelo menos nos graus elementares e fundamentais, sendo estabelecido que a instrução elementar será:","alternativas":{"A":"facultativa, ficando a critério dos responsáveis decidir o momento do alistamento escolar.","B":"obrigatória.","C":"restrita aos cidadãos que comprovem suficiência de recursos financeiros privados.","D":"coordenada de forma exclusiva por instituições religiosas particulares credenciadas pelo Estado.","E":"dispensada se o jovem ostentar histórico de cometimento de atos infracionais socioeducativos."},"resposta_correta":"B","comentario":"O Artigo 26, item 1, da DUDH consagra o direito universal à educação, estabelecendo que o ensino será gratuito nos graus elementares e fundamentais, fixando expressamente que a instrução elementar possui caráter obrigatório."},{"id":297,"numero":297,"bloco":1,"materia":"Direitos Humanos","texto_base":null,"enunciado":"O Pacto de São José da Costa Rica protege o direito à liberdade pessoal no seu Artigo 7º. Nos termos taxativos do item 7 do referido artigo da Convenção Americana, ninguém deve ser detido por dívidas, estabelecendo-se contudo uma única e clássica exceção aplicável ao inadimplemento de:","alternativas":{"A":"contratos civis de locação de imóveis urbanos comerciais residenciais.","B":"obrigação alimentar legalmente estipulada.","C":"tributos estaduais ou federais aduaneiros sobre o consumo de luxo.","D":"parcelas de financiamentos imobiliários contraídos perante bancos estatais.","E":"multas pecuniárias decorrentes de condenações de trânsito rodoviário."},"resposta_correta":"B","comentario":"O Artigo 7º, item 7, do Pacto de São José da Costa Rica sepultou a prisão por dívidas no plano civil americano. A única e taxativa exceção albergada pelo tratado internacional refere-se ao inadimplemento voluntário e inescusável de obrigação alimentar (pensão alimentícia)."},{"id":298,"numero":298,"bloco":1,"materia":"Direitos Humanos","texto_base":null,"enunciado":"As Regras de Mandela estabelecem diretrizes humanitárias específicas para o fornecimento de alimentação e água potável à população carcerária. De acordo com as regras vigentes, a administração prisional deve fornecer a todo preso, nas horas usuais, alimentação de valor nutritivo adequado à saúde e às forças, bem como água potável:","alternativas":{"A":"disponível apenas durante o horário do banho de sol diário de duas horas.","B":"disponível para cada preso sempre que ele necessitar.","C":"racionada de forma a servir como mecanismo de sanção disciplinar indireta por mau comportamento.","D":"condicionada ao pagamento de taxas de manutenção pelos familiares do reeducando.","E":"fornecida de forma exclusiva nos períodos diurnos, vedando-se o consumo no repouso noturno."},"resposta_correta":"B","comentario":"Conforme preceitua a Regra 22 das Regras de Mandela, o fornecimento de alimentação nutritiva adequada e o acesso permanente à água potável limpa são direitos basilar de subsistência, devendo a água estar disponível para cada preso sempre que ele necessitar, vedando-se racionamentos punitivos."},{"id":299,"numero":299,"bloco":1,"materia":"Direitos Humanos","texto_base":null,"enunciado":"A Declaração Universal dos Direitos Humanos positiva o direito à liberdade de reunião e de associação pacíficas no seu Artigo 20. De acordo com as duas balizas normativas fixadas no referido artigo da DUDH:","alternativas":{"A":"as associações civis dependem de autorização prévia por escrito do Governador do Estado.","B":"todo ser humano tem direito à liberdade de reunião e de associação pacíficas, e ninguém pode ser obrigado a fazer parte de uma associação.","C":"permite-se a interferência do Poder Executivo no funcionamento interno dos sindicatos de classe.","D":"exige-se a filiação obrigatória de todos os trabalhadores rurais em cooperativas governamentais.","E":"as reuniões pacíficas em locais abertos ao público são proibidas nos finais de semana comuns."},"resposta_correta":"B","comentario":"Trata-se da aplicação das duas regras do Artigo 20 da DUDH, que garantem a liberdade de reunião e associação pacíficas como expressão da cidadania democrática, vedando que o indivíduo seja compelido ou obrigado a filiar-se a qualquer entidade."},{"id":300,"numero":300,"bloco":1,"materia":"Direitos Humanos","texto_base":null,"enunciado":"Considere a seguinte situação hipotética: Durante o procedimento de revista e triagem médica de rotina para o ingresso de novos detentos em uma cadeia pública do Rio Grande do Norte, um Policial Penal constata que um dos internos apresenta sintomas visíveis de dependência química grave e crises de abstinência, necessitando de intervenção terapêutica imediata. À luz das Regras de Mandela relativas aos serviços médicos no ambiente prisional, a prestação de serviços de saúde para os presos é uma responsabilidade do Estado, devendo os reeducandos gozar de padrões de cuidados médicos:","alternativas":{"A":"inferiores aos prestados à sociedade civil organizada para desestimular a reincidência.","B":"equivalentes aos disponíveis para a comunidade externa, garantindo-se o acesso gratuito aos serviços de saúde do SUS sem discriminação.","C":"condicionados ao ressarcimento financeiro futuro por meio do trabalho forçado industrial.","D":"restritos aos períodos diurnos das escalas ordinárias de plantão burocrático da unidade.","E":"submetidos à aprovação prévia e homologação por escrito dos deputados da Assembleia."},"resposta_correta":"B","comentario":"As Regras de Mandela consagram o Princípio da Equivalência dos Cuidados de Saúde (Regra 24). O Estado é o garantidor da saúde intramuros, devendo assegurar à população carcerária o acesso a tratamentos médicos e psicológicos em patamar de igualdade e equivalência aos serviços públicos do SUS ofertados à comunidade externa livre. PENAL"},{"id":301,"numero":301,"bloco":1,"materia":"Lei de Execução Penal","texto_base":null,"enunciado":"A Lei de Execução Penal (Lei nº 7.210/1984) objetiva proporcionar condições para a harmônica integração social do condenado e do internado, além de efetivar as disposições de sentença ou decisão criminal. Nos termos expressos do artigo 2º da LEP, a execução penal competirá ao Juiz indicado na lei local de organização judiciária e, na sua ausência, ao da vara criminal, e a sua aplicação estender-se-á:","alternativas":{"A":"unicamente aos sentenciados nacionais em regime fechado.","B":"de forma idêntica ao preso provisório e ao condenado pela Justiça Eleitoral ou Militar, sem restrições.","C":"ao preso provisório e ao condenado pela Justiça Eleitoral ou Militar, quando recolhido a estabelecimento sujeito à jurisdição ordinária.","D":"exclusivamente aos reeducandos que preencherem o requisito subjetivo do bom comportamento.","E":"aos internados por medida de segurança na modalidade ambulatorial complementar apenas."},"resposta_correta":"C","comentario":"É a redação literal do artigo 2º, parágrafo único, da Lei de Execução Penal. A LEP estende suas garantias protetivas e deveres de disciplina ao preso provisório e aos condenados pela justiça especializada (Eleitoral e Militar) sempre que o cumprimento da custódia se der em estabelecimentos prisionais comuns da jurisdição ordinária do Estado."},{"id":302,"numero":302,"bloco":1,"materia":"Lei de Execução Penal","texto_base":null,"enunciado":"A assistência ao preso e ao internado é dever do Estado, objetivando prevenir o crime e orientar o retorno à convivência em sociedade. De acordo com o rol taxativo previsto no artigo 11 da LEP, a assistência estende-se ao egresso e compreende as seguintes modalidades:","alternativas":{"A":"financeira, política, bancária, esportiva e cultural.","B":"material, à saúde, jurídica, educacional, social e religiosa.","C":"alimentar, funcional, patrimonial, sindical e judiciária.","D":"securitária, recreativa, laboral terceirizada e habitacional.","E":"familiar, militarizada, terapêutica ocupacional e aduaneira."},"resposta_correta":"B","comentario":"O artigo 11 da LEP consagra as seis modalidades obrigatórias de assistência que o Estado deve fornecer aos indivíduos privados de liberdade e aos internados, mnemônico clássico de prova: Material, à Saúde, Jurídica, Educacional, Social e Religiosa."},{"id":303,"numero":303,"bloco":1,"materia":"Lei de Execução Penal","texto_base":null,"enunciado":"Considere a seguinte situação hipotética: Um detento ingressa em uma unidade prisional do Rio Grande do Norte para o cumprimento de pena em regime fechado. Logo na primeira semana, o reeducando exige o fornecimento de vestuário adequado, instalações higiênicas e alimentação fornecida pelo Estado. Nos termos do artigo 12 da Lei de Execução Penal, os elementos exigidos pelo detento integram a chamada assistência:","alternativas":{"A":"à saúde.","B":"educacional.","C":"social.","D":"material.","E":"jurídica."},"resposta_correta":"D","comentario":"Conforme preceitua o artigo 12 da LEP, a assistência material fornecida ao preso consiste no fornecimento obrigatório de alimentação, vestuário adequado ao clima local e instalações higiênicas em perfeito estado de salubridade estrutural."},{"id":304,"numero":304,"bloco":1,"materia":"Lei de Execução Penal","texto_base":null,"enunciado":"A assistência à saúde do preso e do internado possui caráter preventivo e curativo, compreendendo atendimento médico, farmacêutico e odontológico. Nos termos do artigo 14, § 2º, da LEP, quando o estabelecimento penal não estiver aparelhado para prover a assistência médica necessária:","alternativas":{"A":"o preso será mantido na cela sob tratamento paliativo até a progressão de regime.","B":"a direção da unidade providenciará a soltura imediata do detento por meio de alvará humanitário.","C":"esta será prestada em outro local, mediante autorização da direção do estabelecimento.","D":"haverá a remissão total e compulsória da pena aplicada na sentença transitada em julgado.","E":"os familiares do reeducando deverão arcar com os custos de contratação de UTI móvel privada."},"resposta_correta":"C","comentario":"É a aplicação literal do artigo 14, § 2º, da LEP. Diante da precariedade técnica ou ausência de infraestrutura médica interna na enfermaria do presídio, autoriza-se a prestação da assistência médica em ambiente externo hospitalar adequado mediante autorização expressa da direção."},{"id":305,"numero":305,"bloco":1,"materia":"Lei de Execução Penal","texto_base":null,"enunciado":"O trabalho do condenado, como dever social e condição de dignidade humana, possui finalidade educativa e produtiva. De acordo com o artigo 28, § 2º, da Lei de Execução Penal, o trabalho do preso submete- se a regime jurídico próprio, estabelecendo o texto legal textualmente que:","alternativas":{"A":"é regido integralmente pelas normas da Consolidação das Leis do Trabalho (CLT).","B":"não está sujeito ao regime da Consolidação das Leis do Trabalho (CLT).","C":"gera direito automático ao recebimento de seguro-desemprego e FGTS após a soltura.","D":"fica restrito às atividades de artesanato e lavoura agrícola de subsistência interna.","E":"submete-se à carga horária semanal máxima de trinta horas ininterruptas."},"resposta_correta":"B","comentario":"O trabalho do preso possui natureza eminentemente penal, ressocializadora e de dever cívico. O artigo 28, § 2º, da LEP afasta expressamente a incidência das normas celetistas (CLT) sobre a relação laboral estabelecida entre o detento e o Estado ou empresa parceira."},{"id":306,"numero":306,"bloco":1,"materia":"Lei de Execução Penal","texto_base":null,"enunciado":"O produto da remuneração pelo trabalho do preso é canalizado para finalidades específicas fixadas em lei, após atender às indenizações e despesas de manutenção. Nos termos do artigo 29, § 2º, da LEP, a parcela da remuneração destinada a constituir o \"pecúlio\" do detento será depositada em caderneta de poupança e entregue ao reeducando:","alternativas":{"A":"mensalmente para gastos livres nas cantinas do pavilhão carcerário.","B":"quando de sua liberação definitiva do estabelecimento prisional.","C":"se o sindicato da respectiva categoria profissional autorizar a transferência.","D":"após a homologação do relatório anual de estágio probatório da equipe de segurança.","E":"se houver autorização unânime por escrito de todos os detentos da galeria."},"resposta_correta":"B","comentario":"Nos termos do artigo 29, § 2º, da LEP, a fração remuneratória que compõe o pecúlio carcerário do detento (reserva de poupança depositada em conta oficial) possui caráter diferido, sendo entregue de forma impositiva ao apenado unicamente no momento de sua soltura ou liberação definitiva."},{"id":307,"numero":307,"bloco":1,"materia":"Lei de Execução Penal","texto_base":null,"enunciado":"Considere a seguinte situação hipotética: Durante o procedimento de contagem matinal dos presos em uma cadeia pública potiguar, um detento recusa-se deliberadamente a sair de sua cela e passar pelo portão de triagem, proferindo palavras de deboche e incitando os demais internos a desobedecerem as ordens dos policiais penais de plantão. À luz das disposições que regulam os deveres e a disciplina na Lei de Execução Penal, o comportamento do reeducando configura a prática de:","alternativas":{"A":"falta disciplinar de natureza leve passível exclusivamente de advertência verbal.","B":"crime de responsabilidade fiscal contra o patrimônio imaterial da repartição pública.","C":"falta disciplinar de natureza grave.","D":"ato de legítima defesa da honra carcerária face ao estresse do confinamento.","E":"irregularidade de trâmite burocrático que dispensa anotação em prontuário carcerário."},"resposta_correta":"C","comentario":"A desobediência deliberada às ordens legais da equipe de plantão e a incitação de movimentos de subversão da ordem ou da disciplina interna configuram, nos termos do artigo 50, incisos I e VI, da LEP, cometimento de falta disciplinar de natureza grave."},{"id":308,"numero":308,"bloco":1,"materia":"Lei de Execução Penal","texto_base":null,"enunciado":"O rol de faltas graves na Lei de Execução Penal submete-se ao Princípio da Reserva Legal, exigindo tipificação estrita na lei federal. Nos termos do artigo 50 da LEP, comete falta grave o condenado à pena privativa de liberdade que:","alternativas":{"A":"requerer assistência religiosa fora dos horários fixados na portaria de tranca.","B":"mantiver em seu poder, utilizar ou fornecer aparelho telefônico, de rádio ou similar, que permita a comunicação com outros presos ou com o ambiente externo.","C":"apresentar reclamações verbais fundamentadas à Ouvidoria Geral da SEAP.","D":"recusar-se a assinar o termo de recebimento informal de uniforme fornecido pelo Estado.","E":"manifestar preferência por atividades laborais burocráticas em detrimento das industriais."},"resposta_correta":"B","comentario":"O artigo 50, inciso VII, da LEP (com as alterações promovidas pela Lei nº 11.466/2007) cataloga como falta grave a posse, uso ou fornecimento de aparelhos de rádio, telefones celulares ou similares que facilitem a comunicação com o ambiente externo ou com outras celas."},{"id":309,"numero":309,"bloco":1,"materia":"Lei de Execução Penal","texto_base":null,"enunciado":"O Regime Disciplinar Diferenciado (RDD) qualifica-se como sanção disciplinar de extrema severidade, destinada a isolar presos que representem alto risco para a ordem e a segurança. Nos termos do artigo 52 da LEP, modificado pelo Pacote Anticrime, a inclusão no RDD acarretará a seguinte característica:","alternativas":{"A":"visitas semanais de dois parentes com duração de quatro horas e contato físico livre.","B":"banho de sol diário de 2 (duas) horas, em grupos de até 4 (quatro) presos, desde que não haja contato com presos do mesmo grupo criminoso.","C":"recolhimento em cela coletiva dotada de monitoramento por circuito de televisão aberto.","D":"prazo de duração máximo e improrrogável de trinta dias consecutivos por período anual.","E":"dispensa obrigatória do cumprimento das vistorias estruturais nas vestimentas do detento."},"resposta_correta":"B","comentario":"Inovação estrutural do Pacote Anticrime (Lei nº 13.964/2019) no artigo 52, inciso IV, da LEP. O banho de sol no RDD foi delimitado ao prazo de 2 horas diárias, em grupos reduzidos de até 4 presos, vedando-se o contato entre membros de uma mesma organização criminosa."},{"id":310,"numero":310,"bloco":1,"materia":"Lei de Execução Penal","texto_base":null,"enunciado":"As sanções disciplinares de advertência verbal e repreensão são de competência de aplicação direta da autoridade administrativa da unidade carcerária. Contudo, a aplicação de isolamento na própria cela ou suspensão de direitos submete-se a restrições temporais. Nos termos do artigo 58 da LEP, o isolamento, a suspensão ou a restrição de direitos não poderão exceder:","alternativas":{"A":"15 (quinze) dias, ressalvada a hipótese do Regime Disciplinar Diferenciado.","B":"30 (trinta) dias, ressalvada a hipótese do Regime Disciplinar Diferenciado.","C":"45 (quarenta e cinco) dias de forma linear e intransigente em qualquer caso.","D":"60 (sessenta) dias, mediante autorização prévia por escrito do Promotor de Justiça.","E":"90 (noventa) dias, sob pena de nulidade imediata do procedimento administrativo (PAD)."},"resposta_correta":"B","comentario":"Conforme preceitua o artigo 58 da Lei de Execução Penal, o isolamento na própria cela ou a suspensão/restrição de direitos aplicados pela autoridade administrativa em face de faltas graves não podem superar o limite temporal máximo de 30 dias (salvo o regime de RDD, que possui regras próprias)."},{"id":311,"numero":311,"bloco":1,"materia":"Lei de Execução Penal","texto_base":null,"enunciado":"Considere a seguinte situação hipotética: Um detento que cumpre pena em regime fechado no Rio Grande do Norte comete uma falta grave ao tentar fugir do estabelecimento durante o horário do banho de sol. Instaurado o PAD pelo Diretor da unidade, a infração é devidamente homologada. De acordo com a jurisprudência sumulada do Superior Tribunal de Justiça (Súmula 441), o reconhecimento de falta grave no curso da execução penal:","alternativas":{"A":"interrompe o prazo para a concessão de livramento condicional.","B":"não interrompe o prazo para a concessão de livramento condicional.","C":"gera a perda automática e total dos dias já cumpridos pelo apenado no regime.","D":"autoriza o Diretor a aplicar a sanção de RDD de ofício por determinação verbal.","E":"suspende o direito de petição do preso perante a Defensoria Pública do Estado."},"resposta_correta":"B","comentario":"O Superior Tribunal de Justiça consolidou por meio da Súmula 441 o entendimento técnico de que o cometimento de falta grave no curso da execução penal possui o condão de interromper o prazo para a progressão de regime, mas não interrompe o prazo exigido para a concessão do livramento condicional."},{"id":312,"numero":312,"bloco":1,"materia":"Lei de Execução Penal","texto_base":null,"enunciado":"Os órgãos da execução penal atuam de forma coordenada para garantir a fiscalização e a regularidade do cumprimento das penas. Assinale a alternativa que apresenta um órgão expressamente catalogado no artigo 61 da Lei de Execução Penal.","alternativas":{"A":"Assembleia Legislativa do Estado.","B":"Sindicato dos Policiais Penais.","C":"Conselho Nacional de Justiça de forma exclusiva.","D":"Departamento Penitenciário Nacional, o Conselho Nacional de Política Criminal e Penitenciária, o Juízo da Execução, o Ministério Público, o Conselho Penitenciário, o Patronato, o Conselho da Comunidade e a Defensoria Pública.","E":"Corregedoria Geral da Secretaria de Estado de Administração Fazendária."},"resposta_correta":"D","comentario":"Trata-se da reprodução literal do rol de órgãos que integram a estrutura da execução penal fixado pelo artigo 61 da Lei nº 7.210/1984."},{"id":313,"numero":313,"bloco":1,"materia":"Lei de Execução Penal","texto_base":null,"enunciado":"O Conselho da Comunidade é órgão da execução penal composto por representantes da sociedade civil organizada voltado a aproximar a comunidade do ambiente carcerário. Nos termos do artigo 81 da LEP, compete ao Conselho da Comunidade, entre outras atribuições:","alternativas":{"A":"expedir alvarás de soltura extraordinários para conter a superlotação das celas.","B":"visitar, pelo menos mensalmente, os estabelecimentos penais existentes na comarca.","C":"homologar os relatórios de sindicâncias administrativas instauradas contra policiais.","D":"fixar o valor das multas pecuniárias aplicadas aos apenados na dosimetria da pena.","E":"gerenciar de forma direta os recursos orçamentários das secretarias de segurança."},"resposta_correta":"B","comentario":"O artigo 81, inciso I, da LEP estabelece como atribuição primordial do Conselho da Comunidade a realização de visitas mensais obrigatórias a todas as unidades carcerárias instaladas nos limites territoriais da respectiva comarca judiciária, elaborando relatórios."},{"id":314,"numero":314,"bloco":1,"materia":"Lei de Execução Penal","texto_base":null,"enunciado":"Os estabelecimentos penais destinam-se ao condenado, ao submetido à medida de segurança, ao preso provisório e ao egresso. De acordo com o artigo 84 da LEP, o preso provisório ficará separado do condenado por sentença transitada em julgado, estabelecendo o texto legal critérios de separação para os presos provisórios a partir da gravidade do delito, dividindo-os entre:","alternativas":{"A":"crimes cometidos com violência ou grave ameaça e crimes cometidos sem violência ou grave ameaça.","B":"crimes com pena superior a dez anos e crimes com pena inferior a dois anos.","C":"crimes contra o patrimônio público e crimes passionais contra a integridade familiar.","D":"infrações de menor potencial ofensivo e crimes hediondos ou equiparados tão somente.","E":"réus primários de bons antecedentes e réus reincidentes confessos de alta periculosidade."},"resposta_correta":"A","comentario":"O artigo 84, § 1º, da LEP (redação dada pela Lei nº 13.167/2015) fixou critérios técnicos de separação da massa carcerária provisória a partir da gravidade objetiva do delito, dividindo os réus entre crimes com violência/grave ameaça e crimes sem violência/grave ameaça."},{"id":315,"numero":315,"bloco":1,"materia":"Lei de Execução Penal","texto_base":null,"enunciado":"Considere a seguinte situação hipotética: Uma penitenciária estadual de segurança máxima do Rio Grande do Norte recebe um mandado judicial determinando a tranca de uma detenta gestante condenada definitivamente por crime de roubo majorado. À luz das normas arquitetônicas estruturais da LEP (Art. 82 e 89), os estabelecimentos penais destinados a mulheres serão dotados de:","alternativas":{"A":"cantinas industriais privadas operadas de forma exclusiva por detentos do sexo masculino.","B":"berçário, onde as condenadas possam amamentar seus filhos, e de seção para gestantes e parturientes.","C":"salas de parlatório abertas sem divisórias de vidro ou monitoramento de áudio técnico.","D":"oficinas de panificação mecanizadas de livre trânsito entre os blocos residenciais comuns.","E":"guarições armadas compostas por militares do Exército de forma permanente."},"resposta_correta":"B","comentario":"Nos termos do artigo 89 da Lei de Execução Penal, os estabelecimentos prisionais femininos submetem-se a exigências arquitetônicas humanitárias impositivas de gênero, devendo ser estruturados com seções exclusivas para gestantes e parturientes e berçário para amamentação de bebês."},{"id":316,"numero":316,"bloco":1,"materia":"Lei de Execução Penal","texto_base":null,"enunciado":"A Colônia Agrícola, Industrial ou Similar destina-se ao cumprimento da pena em regime específico da execução penal. Nos termos do artigo 91 da Lei de Execução Penal, a Colônia Agrícola destina-se ao cumprimento da pena em:","alternativas":{"A":"Regime Fechado de segurança máxima.","B":"Regime Semiaberto.","C":"Regime Aberto com monitoramento eletrônico obrigatório.","D":"Prisão Albergue domiciliar humanitária.","E":"Medida de Segurança ambulatorial preventiva."},"resposta_correta":"B","comentario":"O artigo 91 da LEP preceitua de forma categórica que a Colônia Agrícola, Industrial ou Similar qualifica-se como o estabelecimento penal adequado e impositivo para o cumprimento das penas privativas de liberdade no Regime Semiaberto."},{"id":317,"numero":317,"bloco":1,"materia":"Lei de Execução Penal","texto_base":null,"enunciado":"A Casa do Albergado destina-se ao cumprimento de pena privativa de liberdade em regime aberto e da pena de limitação de fim de semana. De acordo com os requisitos arquitetônicos contidos no artigo 94 da LEP, o prédio da Casa do Albergado deverá situar-se em centro urbano, separado dos demais estabelecimentos, e caracterizar-se-á pela:","alternativas":{"A":"presença de muralhas com guaritas de vigilância armada e cercas elétricas industriais.","B":"ausência de obstáculos físicos contra a fuga.","C":"tranca permanente dos reeducandos em celas individuais dotadas de portas blindadas.","D":"monitoração por circuito de televisão interligado à Polícia Federal de fronteiras.","E":"proibição absoluta de saída dos internos para o exercício de atividades laborais externas."},"resposta_correta":"B","comentario":"Diferenciando-se das penitenciárias de segurança máxima, a Casa do Albergado (estabelecimento destinado ao Regime Aberto) deve orientar-se pelos princípios da autodisciplina e senso de responsabilidade, caracterizando-se arquitetonicamente pela ausência de barreiras ou obstáculos físicos contra a fuga (Art. 94)."},{"id":318,"numero":318,"bloco":1,"materia":"Lei de Execução Penal","texto_base":null,"enunciado":"O Hospital de Custódia e Tratamento Psiquiátrico destina-se aos inimputáveis e semi-imputáveis submetidos à medida de segurança. Nos termos do artigo 99 da LEP, o tratamento psiquiátrico privativo nesses estabelecimentos exige que o exame psiquiátrico e os demais exames complementares sejam realizados no prazo máximo de:","alternativas":{"A":"15 (quinze) dias corridos improrrogáveis.","B":"30 (trinta) dias.","C":"45 (quarenta e cinco) dias mediante autorização da direção.","D":"60 (sessenta) dias contados do ingresso do internado.","E":"90 (noventa) dias sob pena de ilegalidade da medida de segurança."},"resposta_correta":"B","comentario":"Conforme preceitua o artigo 99, parágrafo único, da LEP, os exames psiquiátricos e as perícias complementares destinadas a nortear o tratamento médico nos Hospitais de Custódia devem ser concluídos no prazo impositivo de até 30 dias."},{"id":319,"numero":319,"bloco":1,"materia":"Lei de Execução Penal","texto_base":null,"enunciado":"A progressão de regime constitui a espinha dorsal do sistema de execução penal brasileiro, baseando-se na teoria do sistema progressivo. Com as modificações operadas pelo Pacote Anticrime no artigo 112 da LEP, a progressão de regime dar-se-á quando o preso cumprir as frações de pena estipuladas em percentuais. O preso condenado por crime hediondo ou equiparado, com resultado morte, se for primário, progredirá de regime após o cumprimento de:","alternativas":{"A":"16% (dezesseis por cento) da pena aplicada.","B":"40% (quarenta por cento) da pena aplicada.","C":"50% (cinquenta por cento) da pena aplicada.","D":"60% (sessenta por cento) da pena aplicada.","E":"70% (setenta por cento) da pena aplicada."},"resposta_correta":"C","comentario":"Modificação estrutural introduzida pelo Pacote Anticrime (Lei nº 13.964/2019) no artigo 112, inciso V, da LEP. A progressão de regime do preso condenado por crime hediondo ou equiparado com resultado morte, desde que seja primário, exige o cumprimento da fração percentual de 50% da pena."},{"id":320,"numero":320,"bloco":1,"materia":"Lei de Execução Penal","texto_base":null,"enunciado":"Considere a seguinte situação hipotética: Um reeducando que cumpre pena no regime semiaberto em uma comarca potiguar, demonstrando bom comportamento carcerário e com o parecer favorável do Diretor da unidade, pleiteia o benefício de saídas temporárias por sete dias para visitar sua família em período natalino. De acordo com o artigo 120 e 122 da Lei de Execução Penal, a autorização para as saídas temporárias é de competência exclusiva do:","alternativas":{"A":"Diretor do Estabelecimento Prisional por meio de portaria operacional interna.","B":"Juiz da Execução, ouvido o Ministério Público e a administração penitenciária.","C":"Promotor de Justiça titular da fiscalização das prisões da comarca.","D":"Governador do Estado por meio de decreto de clemência humanitária individual.","E":"Presidente do Conselho da Comunidade local por meio de termo de concessão simplificado."},"resposta_correta":"B","comentario":"Nos termos do artigo 122 da Lei de Execução Penal, as saídas temporárias (benefício exclusivo dos regimes semiabertos) submetem-se à cláusula de reserva de jurisdição, sendo ato de concessão privativa e exclusiva do Juiz da Execução, ouvidos o Ministério Público e a direção."},{"id":321,"numero":321,"bloco":1,"materia":"Lei de Execução Penal","texto_base":null,"enunciado":"A remição de pena constitui o instituto por meio do qual o apenado abrevia o tempo de cumprimento da reprimenda penal pelo trabalho ou pelo estudo. Nos termos do artigo 126, § 1º, inciso II, da LEP, a contagem de tempo para fins de remição por estudo dar- se-á à razão de 1 (um) dia de pena por:","alternativas":{"A":"6 (seis) horas de frequência escolar, divididas em 2 (dois) dias de aula no mínimo.","B":"12 (doze) horas de frequência escolar - atividade de ensino fundamental, médio, técnico, superior ou de requalificação profissional - divididas, no mínimo, em 3 (três) dias.","C":"18 (dezoito) horas de leitura orientada em oficinas carcerárias comprovadas em relatório.","D":"24 (vinte e quatro) horas de cursos profissionalizantes à distância homologados pelo sindicato.","E":"30 (trinta) horas de participação ativa em eventos culturais ou esportivos internos."},"resposta_correta":"B","comentario":"Trata-se da aplicação da literalidade do artigo 126, § 1º, inciso II, da LEP (redação da Lei nº 12.433/2011). A remição por estudo exige o cumprimento do patamar técnico de 12 horas de frequência escolar divididas, no mínimo, em 3 dias para remir 1 dia de pena."},{"id":322,"numero":322,"bloco":1,"materia":"Lei de Execução Penal","texto_base":null,"enunciado":"A remição de pena pelo trabalho possui critérios de contagem temporal radicalmente distintos da remição por estudo. Nos termos do artigo 126, § 1º, inciso I, da Lei de Execução Penal, o condenado que cumpre pena em regime fechado ou semiaberto poderá remir 1 (um) dia de pena por:","alternativas":{"A":"2 (dois) dias de trabalho artesanal em oficinas carcerárias voluntárias.","B":"3 (três) dias de trabalho efetivo, respeitada a jornada legal.","C":"4 (quatro) dias de labor industrial terceirizado fora do presídio.","D":"5 (cinco) dias de faxina ou manutenção predial de pavilhões.","E":"6 (seis) dias de lavoura agrícola em fazendas modelo do Estado."},"resposta_correta":"B","comentario":"Conforme estabelece o artigo 126, § 1º, inciso I, da LEP, a contagem de tempo para fins de remição de pena pelo trabalho na execução penal exige o cumprimento do requisito material de 3 dias de efetivo labor para a conquista de 1 dia de desconto da reprimenda."},{"id":323,"numero":323,"bloco":1,"materia":"Lei de Execução Penal","texto_base":null,"enunciado":"O cometimento de infração disciplinar de natureza grave produz reflexos diretos sobre o instituto da remição de pena obtida pelo reeducando. Nos termos do artigo 127 da LEP, com a redação dada pela reforma da Lei nº 12.433/2011, em caso de falta grave, o Juiz da Execução poderá revogar o tempo remido, limitando-se a perda ao patamar máximo de:","alternativas":{"A":"até um terço (1/3) do tempo remido, recomeçando a contagem a partir da data da infração.","B":"metade (1/2) do tempo remido de forma linear e compulsória em qualquer caso.","C":"dois terços (2/3) dos dias acumulados no prontuário carcerário do detento.","D":"totalidade dos dias remidos acumulados pelo apenado desde o início da execução.","E":"um quarto (1/4) dos dias obtidos exclusivamente por remição pelo trabalho industrial."},"resposta_correta":"A","comentario":"O artigo 127 da LEP (com as profundas modificações humanitárias operadas pela Lei nº 12.433/2011) limitou o poder de confisco do magistrado penal. Homologada a falta grave, o juiz poderá revogar os dias remidos no limite máximo de até um terço (1/3) do total acumulado, recomeçando a contagem do zero."},{"id":324,"numero":324,"bloco":1,"materia":"Lei de Execução Penal","texto_base":null,"enunciado":"Considere a seguinte situação hipotética: Um detento que cumpre pena no regime fechado em uma penitenciária do Rio Grande do Norte sofre agressões físicas severas praticadas por outros internos e, temendo por sua vida, recusa-se terminantemente a retornar ao pavilhão comum, solicitando isolamento preventivo à direção. De acordo com o artigo 86 da LEP e as regras de segurança carcerária, os estabelecimentos prisionais devem dispor de alas ou seções especiais destinadas a garantir a segurança e a integridade física dos presos que se encontrem em situação de:","alternativas":{"A":"estágio probatório administrativo funcional avançado.","B":"risco iminente ou vulnerabilidade face à massa carcerária comum.","C":"trânsito temporário para a realização de exames psiquiátricos complementares.","D":"punição por cometimento de faltas disciplinares leves reiteradas.","E":"indicação discricionária realizada pelo sindicato dos policiais penais."},"resposta_correta":"B","comentario":"Nos termos do artigo 86 e parágrafos da LEP, o Estado é o garantidor da vida e integridade física da massa carcerária, impondo-se a estruturação de alas ou seções de segurança isoladas para a tranca de detentos que sofram ameaças reais ou vulnerabilidades graves frente aos demais internos."},{"id":325,"numero":325,"bloco":1,"materia":"Lei de Execução Penal","texto_base":null,"enunciado":"O livramento condicional constitui a última etapa do sistema de cumprimento da pena privativa de liberdade, caracterizando-se como a liberação antecipada do sentenciado sob condições. Nos termos do artigo 131 da LEP, o livramento condicional será concedido pelo Juiz da Execução, ouvidos o Ministério Público e o Conselho Penitenciário, preenchidos os requisitos da lei penal ordinária. A competência para fiscalizar o cumprimento das condições do livramento no dia a dia pertence ao:","alternativas":{"A":"Conselho da Comunidade da comarca respectiva de forma exclusiva.","B":"Juízo da Execução, com o auxílio do Patronato, da Polícia e de órgãos de assistência social.","C":"Diretor da unidade prisional de onde o apenado foi liberado definitivamente.","D":"Sindicato dos servidores públicos das carreiras de segurança integrada.","E":"Promotor de Justiça titular da fiscalização das prisões estaduais."},"resposta_correta":"B","comentario":"Conforme preceitua o artigo 131 e seguintes da Lei de Execução Penal, a fiscalização permanente do cumprimento das obrigações e restrições impostas em sede de livramento condicional compete ao Juízo da Execução, atuando de forma integrada com o Patronato e as forças policiais de área."},{"id":326,"numero":326,"bloco":1,"materia":"Lei de Execução Penal","texto_base":null,"enunciado":"A monitoração eletrônica de presos constitui medida cautelar ou modalidade de fiscalização técnica aplicada na execução penal. Nos termos do artigo 146-B da LEP, introduzido pela Lei nº 12.258/2010, o Juiz da Execução poderá definir a fiscalização por meio da monitoração eletrônica do condenado unicamente nas seguintes hipóteses:","alternativas":{"A":"em toda e qualquer modalidade de prisão preventiva decretada no inquérito policial.","B":"quando autorizar a saída temporária no regime semiaberto ou determinar a prisão domiciliar.","C":"se o detento ostentar antecedentes criminais por infrações tributárias aduaneiras.","D":"por solicitação verbal motivada do Diretor de Segurança e Disciplina da unidade.","E":"sempre que a lotação máxima das celas do regime fechado for superada no estado."},"resposta_correta":"B","comentario":"O rol de cabimento da monitoração eletrônica na execução penal possui caráter taxativo (Art. 146-B). O monitoramento geográfico por tornozeleira é legítimo unicamente quando o juiz autorizar saídas temporárias no semiaberto ou determinar a concessão de prisão domiciliar."},{"id":327,"numero":327,"bloco":1,"materia":"Lei de Execução Penal","texto_base":null,"enunciado":"O descumprimento dos deveres decorrentes do uso da tornozeleira eletrônica enseja a aplicação de sanções e a revisão dos benefícios outorgados pelo Judiciário. De acordo com as previsões expressas do artigo 146-C, parágrafo único, da Lei de Execução Penal, a violação comprovada dos deveres da monitoração eletrônica poderá acarretar, a critério do Juiz da Execução, ouvido o Ministério Público:","alternativas":{"A":"a remissão total e compulsória do restante da pena privativa de liberdade aplicada.","B":"a regressão de regime, a revogação da autorização de saída temporária ou da prisão domiciliar.","C":"a aplicação de sanção pecuniária a ser quitada pelos familiares do reeducando.","D":"o isolamento imediato em Regime Disciplinar Diferenciado (RDD) por prazo de dez anos.","E":"a perda definitiva dos direitos políticos estaduais e a cassação de aposentadorias."},"resposta_correta":"B","comentario":"O artigo 146-C, parágrafo único, da LEP cataloga de forma literal as consequências jurídicas da quebra ou descumprimen
