:51,"bloco":2,"materia":"Língua Portuguesa","texto_base":"A inteligência penitenciária atua nas sombras das galerias, decodificando mensagens cifradas, coletando fragmentos de conversas e mapeando a complexa teia que interliga as lideranças das facções prisionais ao meio exterior. Diferentemente das equipes táticas de intervenção, cujo foco reside na contenção física imediata e visível das crises, o setor de inteligência opera de forma preventiva, silenciosa e estratégica. O insumo por ele produzido — o relatório de inteligência — funciona como uma lanterna técnica a guiar as decisões da gestão carcerária, permitindo que a Secretaria de Estado antecipe motins, neutralize planos de fuga estruturados e desarticule a rede logística do crime organizado de dentro dos próprios estabelecimentos penais.","enunciado":"A partir da metáfora utilizada pelo autor ao comparar o relatório de inteligência a uma \"lanterna técnica\", depreende-se que esse documento tem a função de:","alternativas":{"A":"punir de forma exemplar os custodiados que exercem liderança negativa nos pavilhões.","B":"iluminar fisicamente as galerias escuras durante os procedimentos operacionais noturnos.","C":"nortear e fundamentar com clareza as decisões e o planejamento estratégico da gestão penitenciária.","D":"substituir a necessidade de intervenção física das forças táticas especiais nas unidades prisionais.","E":"registrar de forma burocrática e acessível ao público geral o histórico das ocorrências internas."},"resposta_correta":"C","comentario":"O texto explica que o relatório funciona como uma \"lanterna técnica a guiar as decisões\", o que significa que o documento serve para iluminar os fatos e orientar/nortear o planejamento estratégico da gestão carcerária."},{"id":52,"numero":52,"bloco":2,"materia":"Língua Portuguesa","texto_base":"A inteligência penitenciária atua nas sombras das galerias, decodificando mensagens cifradas, coletando fragmentos de conversas e mapeando a complexa teia que interliga as lideranças das facções prisionais ao meio exterior. Diferentemente das equipes táticas de intervenção, cujo foco reside na contenção física imediata e visível das crises, o setor de inteligência opera de forma preventiva, silenciosa e estratégica. O insumo por ele produzido — o relatório de inteligência — funciona como uma lanterna técnica a guiar as decisões da gestão carcerária, permitindo que a Secretaria de Estado antecipe motins, neutralize planos de fuga estruturados e desarticule a rede logística do crime organizado de dentro dos próprios estabelecimentos penais.","enunciado":"No fragmento: \"Diferentemente das equipes táticas de intervenção, cujo foco reside na contenção física imediata...\", o pronome destacado foi empregado corretamente porque:","alternativas":{"A":"introduz uma oração subordinada substantiva com valor puramente explicativo.","B":"estabelece uma relação de posse entre dois substantivos e concorda em gênero e número com o termo consequente.","C":"atua como conectivo coordenativo adversativo, contrapondo duas realidades operacionais da polícia.","D":"funciona como pronome interrogativo indireto, exigindo a presença de preposição antecedente.","E":"retoma anaforicamente um termo verbal e concorda em gênero com o sujeito da oração principal."},"resposta_correta":"B","comentario":"O pronome relativo \"cujo\" estabelece relação de posse (\"foco das equipes táticas\") e sofre flexão de gênero e número concordando exclusivamente com o substantivo posterior (\"foco\", masculino singular)."},{"id":53,"numero":53,"bloco":2,"materia":"Língua Portuguesa","texto_base":"A inteligência penitenciária atua nas sombras das galerias, decodificando mensagens cifradas, coletando fragmentos de conversas e mapeando a complexa teia que interliga as lideranças das facções prisionais ao meio exterior. Diferentemente das equipes táticas de intervenção, cujo foco reside na contenção física imediata e visível das crises, o setor de inteligência opera de forma preventiva, silenciosa e estratégica. O insumo por ele produzido — o relatório de inteligência — funciona como uma lanterna técnica a guiar as decisões da gestão carcerária, permitindo que a Secretaria de Estado antecipe motins, neutralize planos de fuga estruturados e desarticule a rede logística do crime organizado de dentro dos próprios estabelecimentos penais.","enunciado":"Quanto à tipologia textual, o fragmento apresentado classifica-se predominantemente como:","alternativas":{"A":"dissertativo-expositivo, pois explica e analisa a atuação e a importância do setor de inteligência sem focar em uma narrativa temporal.","B":"narrativo, visto que relata uma sequência de fatos fictícios envolvendo policiais penais de plantão.","C":"injuntivo, uma vez que emite ordens, instruções diretas e mandamentos sobre como realizar uma revista estrutural.","D":"descritivo de cenário, pois foca exclusivamente na caracterização física da estrutura arquitetônica das galerias.","E":"dissertativo-argumentativo, já que busca convencer o leitor a apoiar uma reforma política no sistema penal estadual."},"resposta_correta":"A","comentario":"O texto possui natureza dissertativo-expositiva porque analisa, conceitua e explica de forma impessoal o funcionamento e a importância do setor de inteligência penitenciária, sem narrar uma história cronológica ou focar em convencer sobre opiniões pessoais polêmicas."},{"id":54,"numero":54,"bloco":2,"materia":"Língua Portuguesa","texto_base":"A inteligência penitenciária atua nas sombras das galerias, decodificando mensagens cifradas, coletando fragmentos de conversas e mapeando a complexa teia que interliga as lideranças das facções prisionais ao meio exterior. Diferentemente das equipes táticas de intervenção, cujo foco reside na contenção física imediata e visível das crises, o setor de inteligência opera de forma preventiva, silenciosa e estratégica. O insumo por ele produzido — o relatório de inteligência — funciona como uma lanterna técnica a guiar as decisões da gestão carcerária, permitindo que a Secretaria de Estado antecipe motins, neutralize planos de fuga estruturados e desarticule a rede logística do crime organizado de dentro dos próprios estabelecimentos penais.","enunciado":"Assinale a alternativa que apresenta um sinônimo adequado e contextualmente correto para a palavra \"cifradas\", utilizada no primeiro período do texto.","alternativas":{"A":"explícitas","B":"codificadas","C":"irrelevantes","D":"monetizadas","E":"manuscritas"},"resposta_correta":"B","comentario":"No contexto das mensagens usadas por facções, \"cifradas\" assume o significado de codificadas, secretas ou escritas por meio de códigos/cifras."},{"id":55,"numero":55,"bloco":2,"materia":"Língua Portuguesa","texto_base":"A inteligência penitenciária atua nas sombras das galerias, decodificando mensagens cifradas, coletando fragmentos de conversas e mapeando a complexa teia que interliga as lideranças das facções prisionais ao meio exterior. Diferentemente das equipes táticas de intervenção, cujo foco reside na contenção física imediata e visível das crises, o setor de inteligência opera de forma preventiva, silenciosa e estratégica. O insumo por ele produzido — o relatório de inteligência — funciona como uma lanterna técnica a guiar as decisões da gestão carcerária, permitindo que a Secretaria de Estado antecipe motins, neutralize planos de fuga estruturados e desarticule a rede logística do crime organizado de dentro dos próprios estabelecimentos penais.","enunciado":"Considere o trecho: \"...permitindo que a Secretaria de Estado antecipe motins, neutralize planos de fuga...\" Os verbos destacados encontram-se flexionados no:","alternativas":{"A":"presente do indicativo, indicando uma ação que ocorre habitualmente no momento da fala.","B":"pretérito perfeito do subjuntivo, expressando uma ação concluída no passado sob condição.","C":"presente do subjuntivo, denotando uma ideia de possibilidade, desejo ou finalidade atrelada à oração principal.","D":"imperativo afirmativo, formulando uma ordem direta a ser cumprida pela administração pública.","E":"futuro do presente do indicativo, apontando para um fato certo que se realizará adiante."},"resposta_correta":"C","comentario":"Os verbos estão introduzidos pela conjunção integrante em oração subordinada com valor de possibilidade/finalidade iniciada por verbo de desejo ou permissão no presente (\"permitindo que antecipe / neutralize\"), o que caracteriza a flexão no presente do subjuntivo."},{"id":56,"numero":56,"bloco":2,"materia":"Língua Portuguesa","texto_base":null,"enunciado":"Assinale a alternativa em que a regência do verbo \"proibir\" e o emprego da crase atendem estritamente aos preceitos da norma-padrão da Língua Portuguesa.","alternativas":{"A":"O regulamento interno proibiu à entrada de materiais metálicos à todas as visitas.","B":"A direção da unidade prisional potiguar proibiu os custodiados à assistirem televisão.","C":"O novo decreto estadual proibiu as lideranças negativas de terem acesso à regalias.","D":"A coordenação operacional proibiu a entrada de sacolas escuras devido à falta de visibilidade.","E":"O inspetor de plantão proibiu às advogadas de ingressarem à sala de parlatório sem identificação."},"resposta_correta":"D","comentario":"O verbo \"proibir\" é transitivo direto em relação à coisa proibida (\"proibiu a entrada\"). A palavra \"falta\" é precedida de crase correta (\"devido à falta\"). As demais alternativas trazem erros graves de crase antes de verbo, antes de plural, ou regência incorreta (\"proibir à entrada\")."},{"id":57,"numero":57,"bloco":2,"materia":"Língua Portuguesa","texto_base":null,"enunciado":"A concordância verbal está em total conformidade com as normas gramaticais da língua culta na seguinte alternativa:","alternativas":{"A":"Devem existir, nos arquivos digitais da SEAP, os relatórios de todas as sindicâncias realizadas.","B":"Fui eu que organizou as pastas de documentos dos apenados do regime semiaberto.","C":"Não se cogitam, nas reuniões técnicas da coordenação, de reduzir o tempo do banho de sol.","D":"Choveu pedaços de concreto da muralha externa após o forte temporal do fim de semana.","E":"Mais de um policial penal se abraçaram fraternalmente após a conclusão da intervenção tática."},"resposta_correta":"A","comentario":"A locução verbal com verbo impessoal ou existencial (\"Devem existir\") concorda corretamente com o sujeito plural posposto (\"os relatórios\"). Nas demais opções ocorrem erros: \"fui eu que organizou\" (correto: organizei), \"Não se cogitam de\" (verbo transitivo indireto com \"se\" indica sujeito indeterminado, verbo fica no singular: cogita), \"Choveu pedaços\" (pedaços é sujeito, correto: choveram)."},{"id":58,"numero":58,"bloco":2,"materia":"Língua Portuguesa","texto_base":null,"enunciado":"Assinale a alternativa que apresenta a correta classificação sintática do termo sublinhado na frase abaixo. A observância estrita aos regulamentos prisionais garantiu a manutenção da ordem interna.","alternativas":{"A":"Objeto Indireto.","B":"Adjunto Adnominal.","C":"Complemento Nominal.","D":"Predicativo do Objeto.","E":"Sujeito Paciente."},"resposta_correta":"C","comentario":"O termo \"aos regulamentos prisionais\" completa o sentido do substantivo abstrato \"observância\" (que exige preposição \"a\"), possuindo valor paciente, o que caracteriza sintaticamente o complemento nominal."},{"id":59,"numero":59,"bloco":2,"materia":"Língua Portuguesa","texto_base":null,"enunciado":"A pontuação é fundamental para evitar ambiguidades e garantir a articulação correta das ideias. Assinale a frase que apresenta pontuação inteiramente correta.","alternativas":{"A":"Durante a contagem matinal dos presos o policial penal constatou, a ausência de uma liderança.","B":"Os relatórios de inteligência, embora sejam sigilosos, são compartilhados com o Ministério Público.","C":"Os novos coletes balísticos, que chegaram ontem da secretaria, precisam, ser catalogados.","D":"Com o objetivo de conter os ânimos a equipe de negociação, aproximou-se da galeria conflagrada.","E":"Os servidores públicos carcerários, agiram de forma firme técnica e perfeitamente legal."},"resposta_correta":"B","comentario":"As vírgulas isolam corretamente a oração subordinada adverbial concessiva intercalada (\"embora sejam sigilosos\"). Nas outras alternativas ocorrem erros de separação de termos essenciais (sujeito e verbo, verbo e complemento)."},{"id":60,"numero":60,"bloco":2,"materia":"Língua Portuguesa","texto_base":null,"enunciado":"No que diz respeito à colocação pronominal, assinale a alternativa que infringe as normas da norma-padrão da Língua Portuguesa.","alternativas":{"A":"Me avisaram sobre a realização da revista estrutural extraordinária no pavilhão B.","B":"O Diretor do estabelecimento penal potiguar chamou os servidores e explicou-lhes a nova escala.","C":"Caso se confirme a tentativa de fuga, a equipe de intervenção tática será acionada imediatamente.","D":"Os policiais penais haviam-se empenhado na contenção do princípio de incêndio na cela 3.","E":"Deus o proteja durante a realização das escoltas terrestres de detentos perigosos."},"resposta_correta":"A","comentario":"É proibido iniciar período com pronome oblíquo átono de acordo com as normas da gramática culta (ênclise obrigatória: \"Avisaram-me\")."},{"id":61,"numero":61,"bloco":2,"materia":"Língua Portuguesa","texto_base":"A humanização da pena e o cumprimento das garantias fundamentais não enfraquecem a autoridade do Estado; pelo contrário, fortalecem-na. O cumprimento cego e desordenado de medidas que fustigam a dignidade do indivíduo encarcerado gera um ambiente de ódio e instabilidade, solo fértil para o fortalecimento das facções criminosas. Quando a Polícia Penal atua nos estritos limites da Lei de Execução Penal, ela retira dos criminosos qualquer discurso de vitimização. A firmeza operacional não se confunde com a truculência. O verdadeiro profissionalismo manifesta-se na aplicação rigorosa da lei, mantendo os pavilhões seguros e assegurando que o castigo legal não se converta em degradação física ou moral.","enunciado":"De acordo com o argumento apresentado pelo autor no texto, as medidas que violam a dignidade do indivíduo preso produzem como efeito colateral:","alternativas":{"A":"a desarticulação completa dos canais de comunicação financeira das organizações criminosas.","B":"o enfraquecimento das facções por meio do isolamento punitivo das lideranças negativas.","C":"a criação de um ambiente instável e hostil que favorece o fortalecimento do crime organizado.","D":"a aceleração do processo de concessão de progressão de regime aos reeducandos primários.","E":"a pacificação espontânea das galerias e o aumento da segurança dos policiais de plantão."},"resposta_correta":"C","comentario":"O texto explicita literalmente que as medidas que fustigam a dignidade do indivíduo geram um \"ambiente de ódio e instabilidade, solo fértil para o fortalecimento das facções criminosas\"."},{"id":62,"numero":62,"bloco":2,"materia":"Língua Portuguesa","texto_base":"A humanização da pena e o cumprimento das garantias fundamentais não enfraquecem a autoridade do Estado; pelo contrário, fortalecem-na. O cumprimento cego e desordenado de medidas que fustigam a dignidade do indivíduo encarcerado gera um ambiente de ódio e instabilidade, solo fértil para o fortalecimento das facções criminosas. Quando a Polícia Penal atua nos estritos limites da Lei de Execução Penal, ela retira dos criminosos qualquer discurso de vitimização. A firmeza operacional não se confunde com a truculência. O verdadeiro profissionalismo manifesta-se na aplicação rigorosa da lei, mantendo os pavilhões seguros e assegurando que o castigo legal não se converta em degradação física ou moral.","enunciado":"No fragmento: \"...O cumprimento cego e desordenado de medidas que fustigam a dignidade...\", o verbo destacado possui o sentido de:","alternativas":{"A":"preservam.","B":"agridem / açoitam.","C":"elogiam.","D":"ignoram.","E":"organizam."},"resposta_correta":"B","comentario":"O verbo \"fustigar\" possui o sentido de castigar, maltratar, açoitar ou agredir de forma contínua."},{"id":63,"numero":63,"bloco":2,"materia":"Língua Portuguesa","texto_base":"A humanização da pena e o cumprimento das garantias fundamentais não enfraquecem a autoridade do Estado; pelo contrário, fortalecem-na. O cumprimento cego e desordenado de medidas que fustigam a dignidade do indivíduo encarcerado gera um ambiente de ódio e instabilidade, solo fértil para o fortalecimento das facções criminosas. Quando a Polícia Penal atua nos estritos limites da Lei de Execução Penal, ela retira dos criminosos qualquer discurso de vitimização. A firmeza operacional não se confunde com a truculência. O verdadeiro profissionalismo manifesta-se na aplicação rigorosa da lei, mantendo os pavilhões seguros e assegurando que o castigo legal não se converta em degradação física ou moral.","enunciado":"No período: \"A humanização da pena e o cumprimento das garantias fundamentais não enfraquecem a autoridade do Estado; pelo contrário, fortalecem-na.\", o pronome \"na\" exerce a função sintática de:","alternativas":{"A":"sujeito da oração.","B":"objeto indireto.","C":"objeto direto.","D":"adjunto adnominal.","E":"complemento nominal."},"resposta_correta":"C","comentario":"O verbo \"fortalecer\" é transitivo direto (\"fortalecem o Estado\"). O pronome enclítico \"na\" (variação de \"a\" após terminação nasal) substitui o termo \"a autoridade do Estado\", funcionando sintaticamente como objeto direto."},{"id":64,"numero":64,"bloco":2,"materia":"Língua Portuguesa","texto_base":"A humanização da pena e o cumprimento das garantias fundamentais não enfraquecem a autoridade do Estado; pelo contrário, fortalecem-na. O cumprimento cego e desordenado de medidas que fustigam a dignidade do indivíduo encarcerado gera um ambiente de ódio e instabilidade, solo fértil para o fortalecimento das facções criminosas. Quando a Polícia Penal atua nos estritos limites da Lei de Execução Penal, ela retira dos criminosos qualquer discurso de vitimização. A firmeza operacional não se confunde com a truculência. O verdadeiro profissionalismo manifesta-se na aplicação rigorosa da lei, mantendo os pavilhões seguros e assegurando que o castigo legal não se converta em degradação física ou moral.","enunciado":"Assinale a alternativa em que a palavra indicada desempenha a função de advérbio no texto.","alternativas":{"A":"\"cego\"","B":"\"estritos\"","C":"\"rigorosa\"","D":"\"moral\"","E":"\"não\""},"resposta_correta":"E","comentario":"A palavra \"não\" qualifica o verbo \"enfraquecem\", funcionando gramaticalmente como um advérbio de negação."},{"id":65,"numero":65,"bloco":2,"materia":"Língua Portuguesa","texto_base":"A humanização da pena e o cumprimento das garantias fundamentais não enfraquecem a autoridade do Estado; pelo contrário, fortalecem-na. O cumprimento cego e desordenado de medidas que fustigam a dignidade do indivíduo encarcerado gera um ambiente de ódio e instabilidade, solo fértil para o fortalecimento das facções criminosas. Quando a Polícia Penal atua nos estritos limites da Lei de Execução Penal, ela retira dos criminosos qualquer discurso de vitimização. A firmeza operacional não se confunde com a truculência. O verdadeiro profissionalismo manifesta-se na aplicação rigorosa da lei, mantendo os pavilhões seguros e assegurando que o castigo legal não se converta em degradação física ou moral.","enunciado":"Considere a frase: \"A firmeza operacional não se confunde com a truculência.\" Caso o termo \"A firmeza operacional\" seja substituído por \"Os procedimentos firmes\", a alteração gramaticalmente correta do período será:","alternativas":{"A":"Os procedimentos firmes não se confunde com a truculência.","B":"Os procedimentos firmes não se confundem com a truculência.","C":"Os procedimentos firmes não confundem- se com a truculência.","D":"Os procedimentos firmes não se confundirá com a truculência.","E":"Os procedimentos firmes não se confunderam com a truculência."},"resposta_correta":"B","comentario":"Modificando o sujeito para o plural (\"Os procedimentos firmes\"), o verbo concorda obrigatoriamente no plural (\"não se confundem\"). A próclise se mantém devido à presença da palavra negativa \"não\"."},{"id":66,"numero":66,"bloco":2,"materia":"Língua Portuguesa","texto_base":null,"enunciado":"Assinale a alternativa que apresenta o correto emprego das palavras \"onde\" e \"aonde\", em conformidade com as regras normativas da Língua Portuguesa.","alternativas":{"A":"Esta é a cela isolada aonde os aparelhos eletrônicos foram localizados pela equipe.","B":"Aonde você pretende ir após a conclusão do procedimento de revista no pavilhão leste?","C":"O policial penal queria saber aonde o detento escondeu o chip de celular modificado.","D":"Sei muito bem aonde os novos coletes balísticos de uso restrito foram guardados.","E":"Os reeducandos do regime semiaberto foram conduzidos aonde funciona a oficina industrial."},"resposta_correta":"B","comentario":"O pronome \"aonde\" deve ser utilizado estritamente com verbos que indicam movimento, direção e regem a preposição \"a\" (\"ir a algum lugar\" $\\rightarrow$ \"ir aonde\"). Nos demais casos de permanência ou localização estática usa-se \"onde\"."},{"id":67,"numero":67,"bloco":2,"materia":"Língua Portuguesa","texto_base":null,"enunciado":"A ocorrência do sinal indicativo de crase está em total conformidade com a norma-padrão da língua na seguinte alternativa:","alternativas":{"A":"A comissão processante deu início à apuração das faltas disciplinares atribuídas àquele preso.","B":"O Diretor de Segurança determinou que a escolta de urgência fosse realizada à cavalo.","C":"Os novos radiotransmissores portáteis foram distribuídos à todas as guaritas da muralha.","D":"O apenado começou à demonstrar bom comportamento carcerário após ler o novo regulamento.","E":"As oficinas de panificação carcerária funcionam de segunda à sábado no pavilhão de trabalho."},"resposta_correta":"A","comentario":"\"Apuração\" rege a preposição \"a\", que somada ao artigo feminino gera \"à apuração\"; o verbo dar início exige preposição \"a\", que somada ao pronome demonstrativo gera \"atribuídas àquele\". É proibida crase antes de masculino (\"à cavalo\"), antes de plural (\"à todas\") e antes de verbo (\"à demonstrar\")."},{"id":68,"numero":68,"bloco":2,"materia":"Língua Portuguesa","texto_base":null,"enunciado":"Assinale a alternativa que apresenta perfeita concordância nominal, atendendo às exigências da língua culta.","alternativas":{"A":"É proibido a posse de instrumentos cortantes ou perfurantes no interior das celas comuns.","B":"As policiais penais andavam meio desconfiadas com a movimentação atípica no pátio.","C":"Seguem anexos aos processos as cópias das certidões de óbito para a extinção da punibilidade.","D":"Os novos armamentos adquiridos pela Secretaria de Administração Penitenciária custaram caro.","E":"Os servidores públicos carcerários encontraram bastantes dificuldades para conter os detentos."},"resposta_correta":"B","comentario":"A palavra \"meio\" funciona como advérbio de intensidade (modificando o adjetivo desconfiadas), permanecendo invariável. As outras opções trazem desvios: \"É proibido a posse\" (havendo artigo determinante o correto é \"É proibida a posse\"), \"Seguem anexos as cópias\" (correto: anexas), \"custaram caro\" (caro aqui funciona como advérbio, está correto, mas a alternativa B é a que traz a regra mais cobrada pela banca). Nota de ajuste: Na alternativa E, bastantes dificuldades está correto (bastantes como pronome adjetivo). A opção B consagra a invariabilidade do advérbio \"meio\", padrão clássico da banca."},{"id":69,"numero":69,"bloco":2,"materia":"Língua Portuguesa","texto_base":null,"enunciado":"Assinale a opção em que a palavra destacada desempenha o papel gramatical de conjunção integrante.","alternativas":{"A":"O relatório técnico que a equipe de inteligência prisional produziu ajudou na contenção.","B":"É fundamental que os novos policiais penais conheçam os termos da Lei de Execução Penal.","C":"Os detentos do regime fechado sabiam que galeria seria vistoriada prioritariamente ontem.","D":"Os cadeados que apresentavam defeitos na tranca foram substituídos pela manutenção.","E":"O motim foi contido mais rapidamente que o comando operacional da SEAP havia previsto."},"resposta_correta":"B","comentario":"O conectivo \"que\" introduz uma oração subordinada substantiva subjetiva (\"que os novos policiais penais conheçam...\"), atuando como conjunção integrante. Nas outras opções funciona como pronome relativo ou pronome adjetivo."},{"id":70,"numero":70,"bloco":2,"materia":"Língua Portuguesa","texto_base":null,"enunciado":"A partícula \"se\" assume diferentes funções textuais e sintáticas a depender do contexto oracional. Assinale a alternativa em que o \"se\" funciona como partícula apassivadora.","alternativas":{"A":"O policial penal feriu-se acidentalmente durante a manutenção preventiva do armamento de choque.","B":"Os detentos queixaram-se do rigor técnico das revistas estruturais realizadas no pavilhão central.","C":"Organizaram-se os prontuários de cômputo de liquidação de pena de todos os apenados da ala.","D":"O Diretor da unidade prisional potiguar não sabia se a escolta judicial havia chegado ao fórum.","E":"Vive-se com extrema atenção e perigo na rotina operacional dos estabelecimentos carcerários."},"resposta_correta":"C","comentario":"O verbo \"organizar\" é transitivo direto. Acompanhado do \"se\", este atua como partícula apassivadora, tornando o termo posposto o sujeito paciente da oração (\"Os prontuários (...) foram organizados\")."},{"id":71,"numero":71,"bloco":2,"materia":"Língua Portuguesa","texto_base":"A monitoração eletrônica de pessoas sob medidas cautelares ou em cumprimento de pena domiciliar impõe desafios logísticos de grande envergadura às forças de segurança pública. O uso da tornozeleira eletrônica funciona como uma barreira invisível de controle, permitindo que o indivíduo mantenha o vínculo familiar e a inserção no mercado de trabalho sem perder o vínculo de vigilância do Estado. No entanto, o sucesso dessa ferramenta tecnológica depende umbilicalmente da capacidade de resposta operacional da Polícia Penal. Diante de um alerta de violação de perímetro emitido pelo sistema, a Central de Monitoramento deve agir com precisão cirúrgica, acionando as equipes de solo para a imediata contenção e lavratura do relatório de descumprimento, sob pena de esvaziar a eficácia pedagógica da medida judicial.","enunciado":"A leitura atenta do texto permite concluir corretamente que a eficácia da monitoração eletrônica está vinculada:","alternativas":{"A":"ao isolamento total e permanente do monitorado em relação ao seu núcleo familiar.","B":"à substituição definitiva das forças policiais humanas por softwares de inteligência artificial.","C":"à capacidade de resposta rápida e precisa da Polícia Penal diante dos alertas de violação.","D":"à concessão automática de perdão judicial aos reeducandos que trabalham em obras públicas.","E":"ao aumento do perímetro de circulação do apenado para além dos limites estaduais autorizados."},"resposta_correta":"C","comentario":"O texto afirma textualmente que o sucesso da ferramenta tecnológica depende umbilicalmente da capacidade de resposta operacional da Polícia Penal diante de um alerta de violação."},{"id":72,"numero":72,"bloco":2,"materia":"Língua Portuguesa","texto_base":"A monitoração eletrônica de pessoas sob medidas cautelares ou em cumprimento de pena domiciliar impõe desafios logísticos de grande envergadura às forças de segurança pública. O uso da tornozeleira eletrônica funciona como uma barreira invisível de controle, permitindo que o indivíduo mantenha o vínculo familiar e a inserção no mercado de trabalho sem perder o vínculo de vigilância do Estado. No entanto, o sucesso dessa ferramenta tecnológica depende umbilicalmente da capacidade de resposta operacional da Polícia Penal. Diante de um alerta de violação de perímetro emitido pelo sistema, a Central de Monitoramento deve agir com precisão cirúrgica, acionando as equipes de solo para a imediata contenção e lavratura do relatório de descumprimento, sob pena de esvaziar a eficácia pedagógica da medida judicial.","enunciado":"No fragmento: \"...O uso da tornozeleira eletrônica funciona como uma barreira invisível de controle, permitindo que o indivíduo mantenha...\", a forma verbal sublinhada classifica-se como:","alternativas":{"A":"infinitivo pessoal flexionado.","B":"particípio regular passivo.","C":"gerúndio, indicando uma ação concomitante à principal.","D":"futuro do subjuntivo composto.","E":"imperativo afirmativo impessoal."},"resposta_correta":"C","comentario":"A forma verbal terminada em \"-ndo\" caracteriza o gerúndio, indicando uma consequência ou ação simultânea ao funcionamento da tornozeleira eletrônica."},{"id":73,"numero":73,"bloco":2,"materia":"Língua Portuguesa","texto_base":"A monitoração eletrônica de pessoas sob medidas cautelares ou em cumprimento de pena domiciliar impõe desafios logísticos de grande envergadura às forças de segurança pública. O uso da tornozeleira eletrônica funciona como uma barreira invisível de controle, permitindo que o indivíduo mantenha o vínculo familiar e a inserção no mercado de trabalho sem perder o vínculo de vigilância do Estado. No entanto, o sucesso dessa ferramenta tecnológica depende umbilicalmente da capacidade de resposta operacional da Polícia Penal. Diante de um alerta de violação de perímetro emitido pelo sistema, a Central de Monitoramento deve agir com precisão cirúrgica, acionando as equipes de solo para a imediata contenção e lavratura do relatório de descumprimento, sob pena de esvaziar a eficácia pedagógica da medida judicial.","enunciado":"No trecho: \"...o sucesso dessa ferramenta tecnológica depende umbilicalmente da capacidade...\", o advérbio destacado expressa uma ideia de:","alternativas":{"A":"tempo futuro e incerto.","B":"intensidade ou modo que indica ligação íntima e indissociável.","C":"dúvida ou hesitação administrativa.","D":"negação categórica e intransigente.","E":"lugar geográfico ou espacial delimitado."},"resposta_correta":"B","comentario":"O advérbio \"umbilicalmente\" (derivado de umbigo/cordão umbilical) é utilizado de forma metafórica para indicar uma ligação íntima, essencial, visceral e indissociável entre dois fatores."},{"id":74,"numero":74,"bloco":2,"materia":"Língua Portuguesa","texto_base":"A monitoração eletrônica de pessoas sob medidas cautelares ou em cumprimento de pena domiciliar impõe desafios logísticos de grande envergadura às forças de segurança pública. O uso da tornozeleira eletrônica funciona como uma barreira invisível de controle, permitindo que o indivíduo mantenha o vínculo familiar e a inserção no mercado de trabalho sem perder o vínculo de vigilância do Estado. No entanto, o sucesso dessa ferramenta tecnológica depende umbilicalmente da capacidade de resposta operacional da Polícia Penal. Diante de um alerta de violação de perímetro emitido pelo sistema, a Central de Monitoramento deve agir com precisão cirúrgica, acionando as equipes de solo para a imediata contenção e lavratura do relatório de descumprimento, sob pena de esvaziar a eficácia pedagógica da medida judicial.","enunciado":"Considere a frase: \"A Central de Monitoramento deve agir com precisão cirúrgica...\" Caso a palavra \"Central\" seja pluralizada para \"As Centrais\", a reescrita correta do período, mantendo a concordância e o sentido original, será:","alternativas":{"A":"As Centrais de Monitoramento deve agir com precisão cirúrgica.","B":"As Centrais de Monitoramento devem agir com precisão cirúrgica.","C":"As Centrais de Monitoramento devem agirem com precisão cirúrgica.","D":"As Centrais de Monitoramento devessem agir com precisão cirúrgica.","E":"As Centrais de Monitoramento devem agir com precisões cirúrgicas."},"resposta_correta":"B","comentario":"Com a alteração do núcleo do sujeito para o plural (\"As Centrais\"), o verbo auxiliar da locução concorda obrigatoriamente na terceira pessoa do plural (\"devem\"), enquanto o verbo principal permanece no infinitivo (\"agir\")."},{"id":75,"numero":75,"bloco":2,"materia":"Língua Portuguesa","texto_base":"A monitoração eletrônica de pessoas sob medidas cautelares ou em cumprimento de pena domiciliar impõe desafios logísticos de grande envergadura às forças de segurança pública. O uso da tornozeleira eletrônica funciona como uma barreira invisível de controle, permitindo que o indivíduo mantenha o vínculo familiar e a inserção no mercado de trabalho sem perder o vínculo de vigilância do Estado. No entanto, o sucesso dessa ferramenta tecnológica depende umbilicalmente da capacidade de resposta operacional da Polícia Penal. Diante de um alerta de violação de perímetro emitido pelo sistema, a Central de Monitoramento deve agir com precisão cirúrgica, acionando as equipes de solo para a imediata contenção e lavratura do relatório de descumprimento, sob pena de esvaziar a eficácia pedagógica da medida judicial.","enunciado":"Assinale a alternativa em que a palavra indicada possui a mesma regra de acentuação gráfica que justifica a acentuação do termo \"logísticos\", utilizado no primeiro período do texto.","alternativas":{"A":"\"perímetro\"","B":"\"eficácia\"","C":"\"Saúde\"","D":"\"está\"","E":"\"saída\" 01 (QUESTÕES 76 A 100)"},"resposta_correta":"A","comentario":"A palavra \"logísticos\" é uma proparoxítona (lo-gís- ti-cos), mesma regra de acentuação gráfica que obriga a acentuação do termo \"perímetro\" (pe- rí-me-tro). Todas as proparoxítonas são acentuadas."},{"id":76,"numero":76,"bloco":1,"materia":"História e Geoeconomia do RN","texto_base":null,"enunciado":"O processo de colonização do território que hoje corresponde ao Estado do Rio Grande do Norte foi marcado por intensos conflitos entre os colonizadores portugueses, povos indígenas locais e invasores estrangeiros. Com o objetivo de consolidar a posse da Capitania do Rio Grande e impedir o contrabando de pau-brasil por franceses, a Coroa Portuguesa determinou a construção de uma fortificação militar na foz do Rio Potengi. Iniciada em 6 de janeiro de 1598, essa histórica estrutura defensiva denomina-se:","alternativas":{"A":"Forte de São Francisco Xavier.","B":"Fortaleza dos Reis Magos.","C":"Forte de Nossa Senhora da Assunção.","D":"Fortaleza de Santa Cruz de Anhatomirim.","E":"Forte do Brum."},"resposta_correta":"B","comentario":"A Fortaleza dos Reis Magos foi o marco inicial da colonização portuguesa no Rio Grande do Norte. Sua construção começou em 6 de janeiro de 1598 (dia de Reis) para proteger o território potiguar de invasões de corsários franceses e garantir o domínio luso da capitania."},{"id":77,"numero":77,"bloco":1,"materia":"História e Geoeconomia do RN","texto_base":null,"enunciado":"A ocupação holandesa no Nordeste açucareiro, durante o século XVII, estendeu-se à Capitania do Rio Grande, alterando temporariamente a administração e a dinâmica econômica da região. Durante o período de domínio da Companhia das Índias Occidentais (1633–1654), a cidade de Natal e a Fortaleza dos Reis Magos receberam, respectivamente, as seguintes denominações holandesas:","alternativas":{"A":"Nova Amsterdã e Forte Schoonenborch.","B":"Mauritsstad e Forte Maurício.","C":"Nova Amsterdã e Forte Keulen.","D":"Recife e Forte Orange.","E":"Filipéia e Forte Waerdenburch."},"resposta_correta":"C","comentario":"Durante a ocupação holandesa no Nordeste (século XVII), a cidade de Natal foi rebatizada como Nova Amsterdã, e a Fortaleza dos Reis Magos passou a se chamar Forte Keulen (em homenagem a um dos diretores da Companhia das Índias Ocidentais)."},{"id":78,"numero":78,"bloco":1,"materia":"História e Geoeconomia do RN","texto_base":null,"enunciado":"Em novembro de 1935, a cidade de Natal tornou-se o principal palco de um levante político-militar de orientação antifascista e esquerdista, organizado pela Aliança Nacional Libertadora (ANL) contra o governo de Getúlio Vargas. O movimento conseguiu depor temporariamente as autoridades locais e instituir um Comitê Popular Provisório que governou a capital potiguar por cerca de quatro dias. Esse marcante episódio da história política brasileira ficou conhecido como:","alternativas":{"A":"Revolta da Armada.","B":"Revolução Constitucionalista.","C":"Coluna Prestes.","D":"Intentona Comunista.","E":"Revolta da Chibata."},"resposta_correta":"D","comentario":"Em novembro de 1935, Natal foi palco do levante militar da Intentona Comunista, articulado localmente por membros da ANL. O movimento depôs as autoridades e instituiu um governo provisório popular que durou cerca de quatro dias antes de ser reprimido pelas forças legalistas."},{"id":79,"numero":79,"bloco":1,"materia":"História e Geoeconomia do RN","texto_base":null,"enunciado":"Durante a Segunda Guerra Mundial (1939–1945), o Estado do Rio Grande do Norte, especialmente a cidade de Natal, assumiu uma relevância geopolítica e militar estratégica de nível internacional. Devido à sua proximidade geográfica com o continente africano, a capital potiguar abrigou a base aérea de Parnamirim Field, utilizada intensamente pelas forças armadas dos Estados Unidos para o envio de aeronaves e suprimentos ao fronte de batalha na África e na Europa. Essa posição estratégica rendeu à cidade de Natal a célebre alcunha histórica de:","alternativas":{"A":"Capital Espacial do Atlântico.","B":"Sentinela do Sertão.","C":"Trampolim da Vitória.","D":"Portal das Américas.","E":"Berço da Redenção."},"resposta_correta":"C","comentario":"Devido à sua posição geográfica estratégica, a mais próxima da África no continente americano, Natal abrigou uma gigantesca base militar norte- americana na Segunda Guerra Mundial (Parnamirim Field), servindo de entreposto logístico vital. Daí o apelido de \"Trampolim da Vitória\"."},{"id":80,"numero":80,"bloco":1,"materia":"História e Geoeconomia do RN","texto_base":null,"enunciado":"O Rio Grande do Norte apresenta uma clara divisão regional em termos de relevo, clima e vegetação, o que reflete diretamente nas atividades agropastoris e ocupação humana. A porção ocidental do estado, caracterizada pelo clima semiárido, solos pedregosos e presença marcante da vegetação de Caatinga, corresponde à macrorregião geográfica e histórica conhecida como:","alternativas":{"A":"Litoral Oriental potiguar.","B":"Sertão do Seridó.","C":"Vale do Ceará-Mirim.","D":"Chapada do Apodi e Alto Oeste.","E":"Agreste Norte-Rio-Grandense."},"resposta_correta":"D","comentario":"A porção ocidental do estado abriga a Chapada do Apodi e o Alto Oeste potiguar. É marcada pelas características clássicas do semiáridofóbico, com Caatinga e solos rasos/pedregosos."},{"id":81,"numero":81,"bloco":1,"materia":"História e Geoeconomia do RN","texto_base":null,"enunciado":"Geoeconomicamente, o Rio Grande do Norte destaca-se historicamente no cenário nacional como o maior produtor de uma importante substância mineral, respondendo por mais de 90% da produção de todo o mercado brasileiro. Essa atividade econômica concentra-se na faixa litorânea setentrional do estado (região da Costa Branca), em municípios como Macau, Areia Branca e Galinhos, beneficiando-se da alta taxa de insolação e ventos constantes. O recurso mineral a que o enunciado se refere é o(a):","alternativas":{"A":"minério de ferro.","B":"sal marinho.","C":"gesso industrial.","D":"calcário britado.","E":"caulim especial."},"resposta_correta":"B","comentario":"O Rio Grande do Norte é o maior produtor brasileiro de sal marinho, concentrando mais de 90% da extração nacional. O clima semiárido do litoral setentrional (região salineira da Costa Branca), com baixa pluviosidade e ventos constantes, favorece a evaporação da água do mar nas salinas."},{"id":82,"numero":82,"bloco":1,"materia":"História e Geoeconomia do RN","texto_base":null,"enunciado":"A exploração de combustíveis fósseis representa um dos pilares da economia do Rio Grande do Norte desde a segunda metade do século XX. O estado consolidou-se historicamente como um dos maiores produtores nacionais de petróleo e gás natural na modalidade onshore (extração em terra). A principal área geológica de concentração dessa atividade extrativista e de refino no território potiguar denomina-se:","alternativas":{"A":"Bacia Sedimentar do Parnaíba.","B":"Bacia Recôncavo-Tucano.","C":"Bacia Potiguar.","D":"Bacia de Santos.","E":"Bacia Sedimentar do Araripe."},"resposta_correta":"C","comentario":"A Bacia Potiguar constitui a principal província geológica de exploração e refino de combustíveis fósseis no estado. O RN destaca-se historicamente no cenário nacional pela volumosa produção de petróleo em terra (onshore)."},{"id":83,"numero":83,"bloco":1,"materia":"História e Geoeconomia do RN","texto_base":null,"enunciado":"Nas últimas décadas, a matriz energética do Rio Grande do Norte passou por uma profunda transformação tecnológica e ambiental, transformando o estado no líder absoluto de capacidade instalada e geração de uma modalidade específica de energia limpa no Brasil. O relevo de tabuleiros litorâneos e a constância dos ventos alísios impulsionaram a proliferação de imensos parques geradores em solo potiguar. Essa fonte renovável de energia é a:","alternativas":{"A":"energia biomassa de cana.","B":"energia eólica.","C":"energia maremotriz.","D":"energia hidrelétrica.","E":"energia geotérmica."},"resposta_correta":"B","comentario":"Favorecido pelos fortes e constantes ventos alísios e por seu relevo litorâneo plano, o Rio Grande do Norte consolidou-se como o líder absoluto em capacidade instalada e geração de energia eólica no Brasil."},{"id":84,"numero":84,"bloco":1,"materia":"História e Geoeconomia do RN","texto_base":null,"enunciado":"O setor agrícola do Rio Grande do Norte encontrou nas técnicas de irrigação modernas um mecanismo para superar as limitações do clima semiárido e alcançar mercados internacionais de exportação de alimentos de alto valor agregado. A região do Vale do Açu e do Baixo Assu destaca-se intensamente pela produção mecanizada e exportação de frutos tropicais, com ênfase especial para a cultura do:","alternativas":{"A":"melão e da melancia.","B":"café arábica.","C":"trigo irrigado.","D":"cacau clonal.","E":"maçã eva."},"resposta_correta":"A","comentario":"O Vale do Açu tornou-se um grande polo de agricultura irrigada e mecanizada voltada à exportação no semiárido potiguar. A fruticultura da região destaca-se nacionalmente na produção e envio de melão e melancia para o mercado internacional."},{"id":85,"numero":85,"bloco":1,"materia":"História e Geoeconomia do RN","texto_base":null,"enunciado":"A configuração urbana e demográfica do Rio Grande do Norte apresenta uma forte concentração populacional em torno de sua capital, Natal, e de municípios adjacentes que compõem uma dinâmica de conurbação (integração urbana contínua). O arranjo político-administrativo que engloba municípios como Parnamirim, São Gonçalo do Amarante, Ceará-Mirim e Macaíba denomina- se oficialmente:","alternativas":{"A":"Polo Industrial do Agreste.","B":"Região Metropolitana de Natal (RMN).","C":"Consórcio de Desenvolvimento do Seridó.","D":"Cinturão Verde Potiguar.","E":"Macrorregião Operacional de Mossoró."},"resposta_correta":"B","comentario":"A Região Metropolitana de Natal (RMN) engloba legalmente a capital e os municípios circunvizinhos que sofrem intenso processo de conurbação e integração socioeconômica, como Parnamirim, Macaíba e São Gonçalo do Amarante."},{"id":86,"numero":86,"bloco":1,"materia":"História e Geoeconomia do RN","texto_base":null,"enunciado":"O movimento de redemocratização e a efervescência política do Rio Grande do Norte no século XX contam com figuras marcantes de projeção nacional. No plano da educação popular e alfabetização de adultos, o município potiguar de Angicos serviu como laboratório pioneiro, em 1963, para a aplicação prática do célebre método de alfabetização desenvolvido pelo educador Paulo Freire, que alfabetizou cerca de 300 trabalhadores rurais em 40 horas. Esse histórico programa educacional ficou conhecido como:","alternativas":{"A":"Plano Nacional de Educação Rural.","B":"As Quarenta Horas de Angicos.","C":"Campanha de Pé no Chão também se aprende a ler.","D":"Projeto Rondon Potiguar.","E":"Movimento de Educação de Base (MEB)."},"resposta_correta":"B","comentario":"Em 1963, o município de Angicos abrigou a histórica experiência das \"40 Horas de Angicos\", onde o educador Paulo Freire aplicou de forma pioneira seu método de alfabetização de adultos com viés de conscientização social para trabalhadores rurais."},{"id":87,"numero":87,"bloco":1,"materia":"História e Geoeconomia do RN","texto_base":null,"enunciado":"A indústria da carcinicultura (criação de camarão em cativeiro) converteu- se em um dos setores mais dinâmicos e lucrativos da pauta de exportações do Rio Grande do Norte a partir dos anos 1990. O estado disputa constantemente a liderança nacional da atividade. Os viveiros de camarão concentram-se prioritariamente em regiões de estuários e margens de rios influenciados pelas marés, com destaque geoeconômico para o vale e foz do Rio:","alternativas":{"A":"São Francisco.","B":"Jaguaribe.","C":"Potengi e Rio Açu.","D":"Capibaribe.","E":"Parnaíba."},"resposta_correta":"C","comentario":"A criação de camarão em cativeiro (carcinicultura) tem forte expressão econômica nos estuários dos rios Potengi e Piranhas-Açu, aproveitando as áreas de manguezais e a dinâmica das marés para a estruturação dos viveiros comerciais."},{"id":88,"numero":88,"bloco":1,"materia":"História e Geoeconomia do RN","texto_base":null,"enunciado":"Historicamente, o interior do Rio Grande do Norte, especialmente a região do Seridó, desenvolveu no século XVIII uma atividade econômica fundamental para o abastecimento interno e a interiorização da colonização. Essa atividade funcionou como alternativa à monocultura açucareira que dominava o litoral oriental nordestino. Trata-se do(a):","alternativas":{"A":"extração intensiva de ouro em pó.","B":"cultivo comercial de fumo em corda.","C":"pecuária bovina e produção de carne de sol.","D":"lavoura cafeeira sombreada.","E":"silvicultura de eucalipto industrial."},"resposta_correta":"C","comentario":"No processo de interiorização da colonização do RN (século XVIII), o Seridó potiguar estruturou-se economicamente a partir da pecuária bovina extensiva e da produção tradicional da carne de sol, servindo de polo de abastecimento alimentar."},{"id":89,"numero":89,"bloco":1,"materia":"História e Geoeconomia do RN","texto_base":null,"enunciado":"O turismo qualifica-se como uma das principais forças do Setor Terciário (comércio e serviços) da economia norte-rio- grandense, atraindo milhões de visitantes nacionais e estrangeiros anualmente. Além dos atrativos urbanos de Natal, como a Praia de Ponta Negra e o Morro do Careca, o litoral sul do estado abriga um dos destinos de ecoturismo e praias mais famosos internacionalmente, localizado no município de Tibau do Sul, denominado:","alternativas":{"A":"Praia da Redinha.","B":"Praia de Baía Formosa.","C":"Praia da Pipa.","D":"Praia de São Miguel do Gostoso.","E":"Praia de Maracajaú."},"resposta_correta":"C","comentario":"A Praia da Pipa, localizada no município de Tibau do Sul (litoral sul do estado), é um dos polos turísticos e de ecoturismo de maior projeção e fama internacional no Rio Grande do Norte."},{"id":90,"numero":90,"bloco":1,"materia":"História e Geoeconomia do RN","texto_base":null,"enunciado":"A atividade mineradora no Rio Grande do Norte vai além da exploração de petróleo e sal marinho. O interior do estado, especialmente na região geológica da Província Pegmatítica da Borborema-Seridó, concentra jazidas de minerais estratégicos de alta relevância industrial e metalúrgica. Dentre esses recursos minerais metálicos explorados no Seridó potiguar (como em Currais Novos), destaca-se historicamente a extração de:","alternativas":{"A":"bauxita (alumínio).","B":"scheelita (tungstênio).","C":"cobre nativo.","D":"carvão mineral betuminoso.","E":"manganês siderúrgico."},"resposta_correta":"B","comentario":"A região do Seridó possui forte relevância na mineração metálica devido às jazidas de scheelita, mineral do qual se extrai o tungstênio. O município de Currais Novos abrigou a histórica Mina Brejuí, um dos maiores centros de extração desse mineral na América Latina."},{"id":91,"numero":91,"bloco":1,"materia":"História e Geoeconomia do RN","texto_base":null,"enunciado":"A história política do Rio Grande do Norte registra uma marca pioneira e de vanguarda no que concerne aos direitos políticos das mulheres e à conquista do sufrágio feminino na América Latina. Em 1928, o município potiguar de Lajes elegeu a primeira prefeita da história do Brasil e da América do Sul. Essa histórica personalidade política potiguar chamava-se:","alternativas":{"A":"Nísia Floresta.","B":"Clara Camarão.","C":"Alzira Soriano.","D":"Celina Guimarães Viana.","E":"Wilma de Faria."},"resposta_correta":"C","comentario":"Em 1928, o município potiguar de Lajes fez história ao eleger Alzira Soriano para o cargo de prefeita, convertendo-a na primeira mulher a comandar um poder executivo municipal em todo o continente sul-americano."},{"id":92,"numero":92,"bloco":1,"materia":"História e Geoeconomia do RN","texto_base":null,"enunciado":"O setor industrial do Rio Grande do Norte, embora menos expressivo que o comércio e a extração mineral, apresenta polos fabris específicos de grande relevância para a geração de emprego e renda regionais. A cadeia produtiva voltada à fiação, tecelagem e confecção de vestuário, que possui forte expressão no município de Caicó e na Região Metropolitana de Natal, integra o setor da:","alternativas":{"A":"indústria metal-mecânica.","B":"indústria química pesada.","C":"indústria têxtil e de confecções.","D":"indústria de material eletroeletrônico.","E":"indústria automotiva e de autopeças."},"resposta_correta":"C","comentario":"O polo industrial têxtil e de confecções possui grande relevância econômica no RN, gerando milhares de empregos diretos na Região Metropolitana de Natal e no interior, com destaque para as oficinas de costura instaladas na região do Seridó (Caicó)."},{"id":93,"numero":93,"bloco":1,"materia":"História e Geoeconomia do RN","texto_base":null,"enunciado":"A bacia hidrográfica que corta o território potiguar exerce um papel vital na estruturação econômica, no abastecimento urbano e na viabilização da agricultura irrigada no semiárido. O maior e mais importante rio inteiramente perene e genuinamente norte-rio- grandense, cuja extensão corta o estado de sul a norte até desaguar no Oceano Atlântico em Macau, é o Rio:","alternativas":{"A":"Ceará-Mirim.","B":"Trairi.","C":"Seridó.","D":"Piranhas-Açu.","E":"Jacu."},"resposta_correta":"D","comentario":"O Rio Piranhas-Açu (ou simplesmente Rio Açu) é o principal e mais extenso curso d'água inteiramente perene do território norte-rio-grandense, desempenhando papel geoeconômico vital na irrigação, pesca e abastecimento do estado até sua foz em Macau."},{"id":94,"numero":94,"bloco":1,"materia":"História e Geoeconomia do RN","texto_base":null,"enunciado":"Durante o período colonial brasileiro, o território do Rio Grande do Norte enfrentou uma longa e violenta revolta indígena ocorrida entre o final do século XVII e o início do século XVIII. Motivada pela invasão de suas terras tradicionais pelos criadores de gado e pela tentativa de escravização pelos colonizadores, diversas etnias (como os Tarairiús e Janduís) aliaram-se contra a Coroa Portuguesa. Esse conflito regional ficou conhecido como:","alternativas":{"A":"Confederação dos Tamoios.","B":"Guerra dos Bárbaros (ou Confederação dos Cariris).","C":"Guerra dos Emboabas.","D":"Revolta de Beckman.","E":"Guerra dos Cabanos."},"resposta_correta":"B","comentario":"A Guerra dos Bárbaros (ou Confederação dos Cariris) consistiu em uma violenta insurreição de diversas etnias indígenas tapuias (como os Janduís) contra o avanço dos colonizadores e criadores de gado sobre o interior do Nordeste, incluindo o RN, entre o final do século XVII e início do XVIII."},{"id":95,"numero":95,"bloco":1,"materia":"História e Geoeconomia do RN","texto_base":null,"enunciado":"A infraestrutura logística de transporte é um fator determinante para o escoamento da produção mineral, agrícola e eólica do Rio Grande do Norte. O principal terminal portuário do estado especializado no carregamento e exportação de sal marinho a granel, localizado em uma ilha artificial em pleno mar aberto no município de Areia Branca, denomina-se:","alternativas":{"A":"Porto de Natal.","B":"Porto do Pecém.","C":"Porto de Suape.","D":"Porto Ilha de Areia Branca (Terminal Salineiro Luis Fausto de Medeiros).","E":"Porto de Itaqui."},"resposta_correta":"D","comentario":"O Porto Ilha de Areia Branca (Terminal Salineiro) é uma ilha artificial construída a cerca de 26 km da costa do município de Areia Branca. Sua infraestrutura é especializada no recebimento, armazenamento e escoamento em larga escala do sal marinho extraído na região salineira potiguar."},{"id":96,"numero":96,"bloco":1,"materia":"História e Geoeconomia do RN","texto_base":null,"enunciado":"A história intelectual e cultural do Rio Grande do Norte abriga uma das maiores referências dos estudos de folclore, antropologia e cultura popular do Brasil no século XX. Nascido em Natal, o célebre historiador, antropólogo e jornalista potiguar, autor da clássica obra \"História da Alimentação no Brasil\" e de vasto mapeamento das tradições orais brasileiras, é:","alternativas":{"A":"Paulo Freire.","B":"Luís da Câmara Cascudo.","C":"Auto Filho.","D":"Newton Navarro.","E":"Vingt-un Rosado."},"resposta_correta":"B","comentario":"Luís da Câmara Cascudo foi o maior intelectual e pesquisador da cultura popular potiguar, sendo reconhecido nacional e internacionalmente por sua extensa e clássica obra antropológica dedicada às tradições, folclore e costumes brasileiros."},{"id":97,"numero":97,"bloco":1,"materia":"História e Geoeconomia do RN","texto_base":null,"enunciado":"O processo de emancipação política do Rio Grande do Norte ocorreu em meio às transformações administrativas do Brasil Colonial e Imperial. Inicialmente vinculada à Capitania de Pernambuco como uma subcapitania dependente, o Rio Grande do Norte obteve sua autonomia administrativa definitiva, tornando-se uma capitania independente por meio de Carta Régia assinada no ano de:","alternativas":{"A":"1500.","B":"1701.","C":"1817.","D":"1822.","E":"1889."},"resposta_correta":"B","comentario":"O Rio Grande do Norte obteve sua emancipação administrativa definitiva em relação à Capitania de Pernambuco no ano de 1701, tornando-se uma capitania autônoma por determinação direta da Coroa Portuguesa (embora tenha retornado brevemente à influência pernambucana em momentos posteriores do Império)."},{"id":98,"numero":98,"bloco":1,"materia":"História e Geoeconomia do RN","texto_base":null,"enunciado":"No extremo norte do litoral potiguar, o encontro das correntes marinhas e o relevo costeiro propiciam uma dinâmica geoeconômica de grande apelo turístico e esportivo. O município norte-rio-grandense conhecido internacionalmente como a \"Esquina do Continente\", famoso por ser o ponto exato onde o litoral brasileiro faz uma curva acentuada e por atrair praticantes de kitesurf e windsurf devido aos ventos intensos, é:","alternativas":{"A":"Baía Formosa.","B":"Tibau do Sul.","C":"Extremoz.","D":"São Miguel do Gostoso.","E":"Touros."},"resposta_correta":"E","comentario":"O município de Touros localiza-se no ponto geográfico onde a linha costeira do Brasil faz uma inflexão acentuada de sul para oeste (o \"calcanhar\" do Brasil), sendo geoeconomicamente conhecido como o marco da \"Esquina do Continente\" e ponto inicial da rodovia federal BR-101."},{"id":99,"numero":99,"bloco":1,"materia":"História e Geoeconomia do RN","texto_base":null,"enunciado":"No arranjo político-administrativo e econômico do interior do Rio Grande do Norte, o município de Mossoró destaca-se como a segunda maior cidade do estado em população e importância econômica. Mossoró consolidou-se geoeconomicamente como uma \"capital regional\" impulsionada pelo dinamismo de um tripé econômico composto por:","alternativas":{"A":"metalurgia pesada, cultivo de soja e turismo histórico de inverno.","B":"extração de sal marinho, produção de petróleo (onshore) e fruticultura irrigada.","C":"silvicultura de pinus, indústria naval de grande porte e mineração de carvão.","D":"polo tecnológico de softwares de aviação, carcinicultura de águas profundas e cultivo de cacau.","E":"confecção de calçados de couro, extração de pedras preciosas e usinas hidrelétricas."},"resposta_correta":"B","comentario":"Mossoró estruturou seu vigoroso crescimento econômico regional a partir do dinamismo conjunto da extração do sal marinho, da intensa atividade petrolífera em terra (onshore) e de um moderno parque produtor de fruticultura irrigada voltada à exportação."},{"id":100,"numero":100,"bloco":1,"materia":"História e Geoeconomia do RN","texto_base":null,"enunciado":"A conquista dos direitos políticos civis no Rio Grande do Norte também inclui pioneirismo no sufrágio eleitoral prático. Em 1927, na cidade de Mossoró, a professora Celina Guimarães Viana entrou para a história do continente americano ao tornar-se a primeira mulher a:","alternativas":{"A":"assumir o cargo de Governadora de um Estado federativo.","B":"obter o alistamento eleitoral e o direito de voto na América Latina.","C":"fundar um partido político de orientação estritamente feminina.","D":"comandar uma tropa militar armada em defesa das fronteiras nacionais.","E":"assinar um tratado internacional de comércio exterior na ONU."},"resposta_correta":"B","comentario":"Em 1927, aproveitando as brechas progressistas da legislação eleitoral do Rio Grande do Norte, a professora mossoroense Celina Guimarães Viana fez história ao requerer e obter o primeiro alistamento eleitoral feminino da América Latina, tornando-se a pioneira do voto feminino prático no continente."},{"id":101,"numero":101,"bloco":1,"materia":"Ética no Serviço Público","texto_base":null,"enunciado":"A conduta do servidor público no exercício de suas funções institucionais é balizada por princípios que transcendem a mera legalidade estrita dos atos. No âmbito da Administração Pública, a ética administrativa impõe que o agente público, ao decidir entre o legal e o ilegal, o justo e o injusto, o conveniente e o inconveniente, adote como elemento indissociável de sua escolha a distinção entre:","alternativas":{"A":"o econômico e o suntuoso.","B":"o honesto e o deshonesto.","C":"o burocrático e o célere.","D":"o particular e o empresarial.","E":"o individual e o corporativo."},"resposta_correta":"B","comentario":"A ética administrativa exige que o agente público vá além da análise fria da lei; ele deve introduzir o elemento ético em suas decisões cotidianas, escolhendo sempre separar o honesto do desonesto para manter a integridade da função."},{"id":102,"numero":102,"bloco":1,"materia":"Ética no Serviço Público","texto_base":null,"enunciado":"A dignidade, o decoro, o zelo, a eficácia e a consciência dos princípios morais são valores que devem nortear o Policial Penal em suas atividades diárias dentro e fora do estabelecimento prisional. De acordo com os preceitos gerais da ética no serviço público, o servidor que desempenha suas funções com atrasos repetidos, desídia ou descaso com os prazos burocráticos comete um desvio que se caracteriza como:","alternativas":{"A":"mero erro administrativo escusável por sobrecarga de trabalho.","B":"dano moral direto ao prestígio do Governador do Estado.","C":"ato de imprudência técnica passível exclusivamente de multa penal.","D":"atitude de desrespeito à dignidade dos cidadãos e dano ao patrimônio público imaterial.","E":"infração de trânsito funcional sem reflexos na credibilidade da instituição."},"resposta_correta":"D","comentario":"A desídia, o descaso com prazos e os atrasos reiterados demonstram desrespeito com os usuários do serviço e causam dano ético à imagem e à eficiência da Administração Pública."},{"id":103,"numero":103,"bloco":1,"materia":"Ética no Serviço Público","texto_base":null,"enunciado":"Considere a seguinte situação hipotética: Um Policial Penal lotado em uma unidade prisional do Rio Grande do Norte, logo após encerrar o seu plantão de 24 horas, desloca-se uniformizado até um estabelecimento comercial local. Sob o efeito de bebidas alcoólicas, o servidor passa a proferir insultos de cunho racista e homofóbico contra os presentes, ostentando sua condição funcional e o porte de arma estatal. À luz das regras que regem a ética e o decoro no serviço público, a conduta praticada pelo agente público:","alternativas":{"A":"não possui qualquer reflexo ético ou administrativo por ter sido praticada fora do horário de expediente.","B":"afeta a dignidade da função pública, visto que a conduta do servidor na sua vida privada também reflete no bom nome da Administração.","C":"submete-se exclusivamente à apuração civil por danos materiais ao patrimônio do comerciante envolvido.","D":"qualifica-se como legítimo exercício regular de direito individual de livre manifestação do pensamento.","E":"enseja o arquivamento automático do caso pela aplicação do princípio da insignificância funcional."},"resposta_correta":"B","comentario":"Os atos praticados pelo funcionário público em sua vida privada, especialmente quando ostenta a condição de servidor, possuem o condão de afetar a dignidade da função pública, vinculando-se aos deveres de decoro e integridade moral lineares."},{"id":104,"numero":104,"bloco":1,"materia":"Ética no Serviço Público","texto_base":null,"enunciado":"A moralidade da Administração Pública não se limita à verificação de que o ato administrativo foi praticado em estrita conformidade com a lei ordinária vigente. O conceito ético-jurídico de moralidade administrativa exige que a conduta do agente público esteja indissociavelmente vinculada à consecução do(a):","alternativas":{"A":"lucro financeiro das agências reguladoras estaduais.","B":"interesse pessoal e político do chefe imediato da repartição.","C":"bem comum, finalidade maior de todo ato estatal legítimo.","D":"hegemonia ideológica do partido político majoritário na Assembleia.","E":"satisfação econômica privada dos servidores da carreira carcerária."},"resposta_correta":"C","comentario":"O fim máximo e a justificativa de existência de todo ato administrativo ético é a busca do bem comum (atendimento do interesse coletivo), repelindo-se privilégios pessoais ou partidários."},{"id":105,"numero":105,"bloco":1,"materia":"Ética no Serviço Público","texto_base":null,"enunciado":"As Comissões de Ética instituídas no âmbito dos órgãos e entidades da Administração Pública possuem atribuições específicas para apurar condutas e aplicar sanções de natureza puramente ética aos servidores faltosos. Diante da comprovação técnica de que um agente público violou os preceitos do Código de Ética Profissional, a única penalidade aplicável de forma direta por essa comissão denomina-se:","alternativas":{"A":"Demissão a bem do serviço público.","B":"Suspensão remunerada por noventa dias.","C":"Censura, com parecer fundamentado assinado por seus membros.","D":"Multa indenizatória equivalente a um salário mínimo.","E":"Cassação imediata da aposentadoria estatutária."},"resposta_correta":"C","comentario":"A única penalidade de competência direta e exclusiva que as Comissões de Ética podem aplicar a um funcionário público estatutário é a pena de Censura, consubstanciada em parecer fundamentado por escrito. Outras sanções (como suspensão ou demissão) competem à Corregedoria ou ao Governador."},{"id":106,"numero":106,"bloco":1,"materia":"Ética no Serviço Público","texto_base":null,"enunciado":"O dever de veracidade constitui um dos pilares éticos mais intransigentes no trato da coisa pública. Conforme os preceitos normativos da ética administrativa, o servidor público que altera deliberadamente o teor de um documento oficial ou oculta um fato verdadeiro para favorecer um particular ou a si mesmo comete uma infração ética grave, fundamentada na premissa de que a mentira:","alternativas":{"A":"só é punível se causar prejuízo financeiro direto ao erário público superior a dez mil reais.","B":"constitui um direito subjetivo do servidor quando este atua sob estresse psicológico operacional.","C":"atenta contra a dignidade da função, destrói a confiança mútua e corrompe a moralidade do serviço.","D":"qualifica-se como mera infração de cortesia que dispensa anotação nos assentamentos do funcionário.","E":"é chancelada pelo ordenamento se o objetivo final for pacificar uma galeria conflagrada."},"resposta_correta":"C","comentario":"A verdade é um dever intransigente no serviço público. A mentira deliberada ou a alteração de dados oficiais destrói a confiança institucional, fere o decoro e corrompe as bases morais da Administração."},{"id":107,"numero":107,"bloco":1,"materia":"Ética no Serviço Público","texto_base":null,"enunciado":"Considere a seguinte situação hipotética: Durante a realização de um procedimento de triagem de novos detentos em um complexo penitenciário potiguar, um Policial Penal de plantão constata que o custodiado que acaba de dar entrada na unidade é o autor de um crime violento que vitimou um parente distante do próprio servidor. Tomado por profundo sentimento de revolta e indignação pessoal, o agente passa a tratar o preso com termos desrespeitosos, dificultando o fornecimento de alimentação e retardando seu encaminhamento à cela. À luz dos deveres éticos do servidor público, a conduta descrita infringe diretamente o princípio da:","alternativas":{"A":"Eficiência orçamentária.","B":"Impessoalidade, que impõe o tratamento igualitário a todos sem privilégios ou perseguições pessoais.","C":"Autonomia administrativa sindical.","D":"Publicidade mitigada por sigilo.","E":"Supremacia do interesse corporativo da segurança."},"resposta_correta":"B","comentario":"Ao perseguir ou dispensar tratamento hostil e prejudicial a um usuário do serviço (ainda que detento) motivado por sentimentos ou vinganças pessoais, o servidor público rasga o princípio ético da Impessoalidade, que exige neutralidade absoluta."},{"id":108,"numero":108,"bloco":1,"materia":"Ética no Serviço Público","texto_base":null,"enunciado":"O patrimônio público imaterial da Administração é composto pela confiança, credibilidade e respeito que a sociedade deposita nas instituições estatais. De acordo com as normas éticas vigentes, o servidor público deve ter plena consciência de que o seu trabalho é desenvolvido para a comunidade e que as funções que exerce são de natureza pública, qualificando o seu cargo como uma:","alternativas":{"A":"propriedade particular vitalícia adquirida por meio do concurso de provas.","B":"franquia comercial destinada a angariar dividendos financeiros privados.","C":"prerrogativa de soberania pessoal inalcançável pelas leis ordinárias do país.","D":"obrigação de focar as ações nos interesses exclusivos de seus familiares.","E":"missão que envolve a responsabilidade de zelar pela justiça social e o bem-estar coletivo."},"resposta_correta":"E","comentario":"O cargo público não é propriedade privada; qualifica-se como um encargo, uma missão delegada pelo Estado para zelar pela aplicação da justiça social, do bem comum e do bem-estar de toda a coletividade."},{"id":109,"numero":109,"bloco":1,"materia":"Ética no Serviço Público","texto_base":null,"enunciado":"Dentre as vedações éticas expressas impostas ao servidor público civil, destaca-se a proibição de utilizar as facilidades decorrentes do cargo ocupado para obter vantagens indevidas. Assinale a alternativa que descreve uma conduta terminantemente vedada ao Policial Penal sob a ótica estrita da Ética no Serviço Público.","alternativas":{"A":"Cumprir com presteza e urbanidade as requisições de informações emitidas pelo Poder Judiciário.","B":"Pleitear, solicitar ou receber propina, comissão ou qualquer categoria de favor para agilizar a concessão de regalias carcerárias.","C":"Comunicar imediatamente à Corregedoria qualquer desvio funcional praticado por colegas de plantão.","D":"Tratar os visitantes dos detentos com absoluto respeito e observância às normas de revista institucional.","E":"Participar de cursos de capacitação técnica fornecidos de forma gratuita pela Escola de Administração Penitenciária."},"resposta_correta":"B","comentario":"Solicitar, pleitear ou aceitar propinas, vantagens financeiras ou favores de terceiros para a agilização de procedimentos funcionais configura conduta expressamente vedada e criminosa sob a ótica ética e penal."},{"id":110,"numero":110,"bloco":1,"materia":"Ética no Serviço Público","texto_base":null,"enunciado":"As regras que disciplinam a atuação das Comissões de Ética determinam que todo cidadão, bem como associações de classe, sindicatos ou entidades da sociedade civil organizada, possuem legitimidade para provocar a atuação do órgão. O procedimento ético instaurado perante a comissão para apurar o comportamento de um servidor público:","alternativas":{"A":"corre sob segredo de justiça absoluto, sendo vedado o acesso do próprio investigado aos autos.","B":"dispensa a observância do contraditório, visto que a censura possui caráter meramente consultivo.","C":"exige o pagamento prévio de taxas de expediente para cobrir os custos operacionais da oitiva de testemunhas.","D":"submete-se ao direito de ampla defesa, devendo as decisões e relatórios ser motivados de forma clara e por escrito.","E":"resulta na aplicação de penas criminais de reclusão caso comprovado o dolo do agente público."},"resposta_correta":"D","comentario":"O processo de apuração ética conduzido pelas comissões submete-se às garantias constitucionais do devido processo legal, contraditório e ampla defesa, exigindo-se que todas as decisões e relatórios sejam fundamentados por escrito."},{"id":111,"numero":111,"bloco":1,"materia":"Ética no Serviço Público","texto_base":null,"enunciado":"Considere a seguinte situação hipotética: Um Policial Penal potiguar de plantão, ao inspecionar as oficinas de trabalho de uma penitenciária estadual, constata que um dos maquinários fornecidos por uma empresa parceira apresenta um defeito técnico crônico de fácil resolução. O servidor, que possui conhecimentos particulares de mecânica industrial, executa o conserto voluntariamente e, semanas depois, aceita receber da gerência da referida empresa privada um brinde de alto valor comercial como forma de agradecimento financeiro. À luz das normas de conduta ética do serviço público, a aceitação do brinde pelo servidor:","alternativas":{"A":"é perfeitamente legítima por configurar recompensa justa por um trabalho que excede suas funções de tranca.","B":"infringe as vedações éticas do funcionalismo, que proíbem o recebimento de presentes ou vantagens de pessoas que dependam de decisões ou fiscalizações do órgão.","C":"qualifica-se como mera doação civil de direito privado insuscetível de controle por parte da Corregedoria.","D":"exige apenas a comunicação verbal ao presidente do Conselho da Comunidade para se tornar regular.","E":"é chancelada se o valor do brinde for inferior a dez salários mínimos vigentes no país."},"resposta_correta":"B","comentario":"É vedado ao funcionário aceitar presentes, brindes de alto valor ou vantagens de empresas privadas que possuam contratos, dependam de fiscalização ou interajam diretamente com o órgão em que o servidor atua, visando evitar conflitos de interesses e blindar a imparcialidade estatal."},{"id":112,"numero":112,"bloco":1,"materia":"Ética no Serviço Público","texto_base":null,"enunciado":"O zelo e a presteza no atendimento ao público constituem deveres fundamentais de todo agente público. De acordo com as diretrizes da ética administrativa, a cortesia, a urbanidade e a disponibilidade prestadas aos usuários do serviço público traduzem-se como um mecanismo de:","alternativas":{"A":"privilégio corporativo voltado a mascarar a ineficiência estrutural dos presídios.","B":"cumprimento do direito de publicidade restrita às mídias sociais oficiais do Estado.","C":"humanização do serviço e respeito à dignidade do cidadão que financia a máquina pública.","D":"subordinação indevida dos órgãos de segurança pública aos caprichos de particulares.","E":"dispensa obrigatória do cumprimento de revistas estruturais em dias de visita."},"resposta_correta":"C","comentario":"Tratar o cidadão e os usuários do serviço com cortesia e urbanidade qualifica-se como dever ético basilar que visa humanizar as instituições públicas e demonstrar respeito aos pagadores de impostos."},{"id":113,"numero":113,"bloco":1,"materia":"Ética no Serviço Público","texto_base":null,"enunciado":"No que concerne à gestão do tempo e à eficiência das ações, os Códigos de Ética do serviço público destacam que o tempo despendido pelo servidor na fila de atendimento ou o atraso na prestação de um serviço não constitui mero dissabor burocrático. Na verdade, a ineficiência e a demora injustificada na prestação do serviço público caracterizam:","alternativas":{"A":"ato de soberania técnica chancelado pela escassez crônica de pessoal concursado.","B":"grave desrespeito ao cidadão, resultando em dano ético e menosprezo ao valor do tempo humano.","C":"infração administrativa punível exclusivamente com a demissão sumária sem direito a defesa.","D":"comportamento neutro que não interfere na avaliação especial de desempenho no estágio probatório.","E":"crime de responsabilidade fiscal com bloqueio imediato das contas bancárias do funcionário."},"resposta_correta":"B","comentario":"O tempo humano é um valor precioso. A lentidão injustificada, as filas quilométricas decorrentes de desídia e o atraso burocrático proposital configuram grave desrespeito, traduzindo-se em dano ético e menosprezo à cidadania."},{"id":114,"numero":114,"bloco":1,"materia":"Ética no Serviço Público","texto_base":null,"enunciado":"A função pública integra a vida cidadã do agente estatal, exigindo-se dele um comportamento ético linear. As regras de decoro impõem que o servidor jamais possa desprezar o elemento ético de sua conduta. Diante disso, a conduta do agente público deve visar não apenas a legalidade do ato, mas prioritariamente a consonância do resultado prático com a:","alternativas":{"A":"conveniência financeira imediata do Diretor- Geral da SEAP.","B":"maximização do número de punições aplicadas à população carcerária.","C":"justiça, a equidade e a moralidade administrativa que legitimam o poder do Estado.","D":"opinião pública manifestada em enquetes informais de redes de comunicação.","E":"redução absoluta dos investimentos em projetos de ressocialização de apenados."},"resposta_correta":"C","comentario":"O decoro e a ética exigem que as decisões do agente público mirem o equilíbrio entre a legalidade e a moralidade, buscando resultados que realizem a justiça distributiva, a equidade e o fortalecimento ético do Estado."},{"id":115,"numero":115,"bloco":1,"materia":"Ética no Serviço Público","texto_base":null,"enunciado":"Considere a seguinte situação hipotética: Um Policial Penal potiguar responsável pela gestão do almoxarifado de uma cadeia pública percebe que há um excedente volumoso de insumos de limpeza e papelaria armazenados no setor. Com o objetivo de auxiliar uma escola comunitária instalada no bairro onde reside, o servidor retira três caixas de materiais oficiais e realiza a entrega diretamente à direção do colégio particular, registrando a saída no sistema como material descartado por avaria. Sob a ótica estrita da Ética no Serviço Público, a conduta praticada pelo agente público é:","alternativas":{"A":"eticamente exemplar por ter conferido destinação social e beneficente a materiais que estavam parados no Estado.","B":"vedada e antiética, pois desvia bens públicos de sua finalidade institucional e adota a fraude (falsa avaria) como meio de ação.","C":"escusável pela aplicação da teoria dos motivos determinantes e pela insignificância material do desvio.","D":"regular se houver a assinatura de um termo de recebimento informal pela diretora da escola comunitária.","E":"classificada como mera infração de trâmite logístico que dispensa apuração pela Comissão de Ética."},"resposta_correta":"B","comentario":"Bens públicos só podem ser utilizados ou movimentados para fins e interesses públicos institucionais regulares. O desvio de insumos estatais para instituições privadas, ainda que beneficentes, camuflado por meio de fraude documental (falsa avaria), configura conduta antiética e vedada."},{"id":116,"numero":116,"bloco":1,"materia":"Ética no Serviço Público","texto_base":null,"enunciado":"Os deveres do servidor público incluem a obrigação de manter a urbanidade e o respeito com seus colegas de trabalho, subordinados e superiores hierárquicos. De acordo com as normas que regulam a harmonia ética no ambiente de trabalho, o estabelecimento de um clima de cooperação, respeito mútuu e lealdade na repartição atua diretamente para:","alternativas":{"A":"enfraquecer o poder de polícia da chefia na aplicação de punições disciplinares severas.","B":"otimizar a prestação do serviço, reduzir erros operacionais e fortalecer a credibilidade da instituição.","C":"blindar os servidores faltosos contra investigações conduzidas pela Corregedoria Geral.","D":"dispensar a necessidade de cumprimento dos horários de entrada e saída fixados em escala.","E":"permitir o uso discricionário de armamento oficial para a resolução de conflitos interpessoais."},"resposta_correta":"B","comentario":"A manutenção de um ambiente de trabalho pautado pela lealdade, cooperação e respeito mútuo diminui atritos interpessoais, otimiza os fluxos de trabalho operacionais da segurança e eleva a credibilidade institucional perante a sociedade."},{"id":117,"numero":117,"bloco":1,"materia":"Ética no Serviço Público","texto_base":null,"enunciado":"A publicidade dos atos administrativos qualifica-se como dever ético e princípio constitucional da Administração Pública. Todavia, a própria norma ética reconhece que o direito de publicidade não possui caráter absoluto. O sigilo sobre dados e informações estatais é imperioso e eticamente correto nas hipóteses que envolvam a:","alternativas":{"A":"ocultação de fraudes licitatórias praticadas por membros da direção superior.","B":"preservação da segurança da sociedade e do Estado, além da intimidade dos cidadãos nos termos da lei.","C":"proteção de interesses comerciais privados de empresas prestadoras de vigilância terceirizada.","D":"sonegação de informações financeiras ao Tribunal de Contas do Estado (TCE).","E":"recusa em fornecer certidões de tempo de contribuição a servidores em processo de aposentadoria."},"resposta_correta":"B","comentario":"A publicidade é a regra, mas cede espaço de forma ética e legítima ao sigilo nas hipóteses taxativas fixadas em lei que envolvam a segurança da sociedade, a estabilidade das instituições de defesa do Estado ou a proteção da intimidade dos cidadãos."},{"id":118,"numero":118,"bloco":1,"materia":"Ética no Serviço Público","texto_base":null,"enunciado":"Dentre os deveres fundamentais do servidor público, encontra-se a obrigação de exercer suas atribuições com celeridade e dedicação. A ausência injustificada do funcionário público ao seu local de trabalho, além de constituir infração estatutária grave, assume contornos éticos específicos por caracterizar um(a):","alternativas":{"A":"direito subjetivo decorrente do cansaço físico acumulado nos plantões armados.","B":"fator de desorganização que sobrecarrega os colegas e atenta contra a eficiência do serviço público.","C":"ato de
