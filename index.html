protesto político legítimo assegurado pelo princípio da autodefesa funcional.","D":"mera irregularidade de ponto eletrônico insuscetível de reprovação pela sociedade civil.","E":"conduta irrelevante para a segurança das muralhas e contenção dos pavilhões carcerários."},"resposta_correta":"B","comentario":"Faltar ao serviço de forma injustificada sobrecarrega os companheiros de plantão na escala armada, desorganiza as rotinas operacionais e agride frontalmente o princípio da eficiência no serviço público."},{"id":119,"numero":119,"bloco":1,"materia":"Ética no Serviço Público","texto_base":null,"enunciado":"Considere a seguinte situação hipotética: Um Policial Penal potiguar, durante o horário de repouso noturno em seu plantão, acessa suas redes sociais particulares utilizando o computador oficial da guarita de vigilância. O servidor passa a emitir comentários ofensivos e deboches públicos contra a capacidade técnica de seus superiores e contra a integridade institucional da própria Secretaria de Administração Penitenciária. Diante do panorama normativo que regula a Ética no Serviço Público, a atitude do funcionário configura:","alternativas":{"A":"comportamento eticamente aceitável por estar albergado pelo direito de liberdade de expressão na internet.","B":"violação ética tripla por desviar o maquinário oficial para fins privados, descumprir o dever de lealdade e ferir o decoro da função.","C":"infração puramente virtual que dispensa intervenção administrativa ou controle ético pelo órgão.","D":"conduta escusável se o perfil do servidor nas redes sociais estiver configurado no modo restrito para amigos.","E":"ato de legítima defesa da honra profissional contra a precarização estrutural do sistema carcerário."},"resposta_correta":"B","comentario":"O servidor cometeu falta ética multifacetada ao utilizar o patrimônio tecnológico do Estado para fins estritamente privados durante o expediente, atacar a hierarquia funcional por meio de deboches públicos e violar ostensivamente o decoro da farda."},{"id":120,"numero":120,"bloco":1,"materia":"Ética no Serviço Público","texto_base":null,"enunciado":"O descumprimento deliberado das ordens legais emitidas por superiores hierárquicos constitui desvio de conduta passível de punição. Sob o prisma ético, o dever de obediência na estrutura da Administração Pública:","alternativas":{"A":"obriga o servidor a cumprir toda e qualquer ordem, inclusive aquelas manifestamente ilegais ou criminosas.","B":"impõe o cumprimento estrito das ordens legais, cabendo ao servidor representar perante a autoridade superior se a ordem violar a lei.","C":"cede espaço para que o policial penal atue de forma 100% autônoma e discricionária no pátio.","D":"restringe-se aos momentos em que o estabelecimento prisional estiver operando em nível de normalidade.","E":"submete-se à aprovação prévia do sindicato da categoria para adquirir validade tática interna."},"resposta_correta":"B","comentario":"O dever de obediência impõe o cumprimento das ordens legais da chefia. Se a ordem for manifestamente ilegal, o servidor tem o dever ético e legal de recusar o cumprimento e representar imediatamente perante as autoridades de controle superior."},{"id":121,"numero":121,"bloco":1,"materia":"Ética no Serviço Público","texto_base":null,"enunciado":"O Código de Ética Profissional funciona como um guia de condutas imperativas e proibitivas. Conforme os preceitos gerais da ética no serviço público, o servidor que constata o cometimento de um erro técnico grave ou fraude praticada por um colega de repartição deve:","alternativas":{"A":"omitir-se para preservar a harmonia interpessoal e evitar o rótulo de delator entre os pares.","B":"comunicar o fato imediatamente à autoridade competente, visto que a conivência com o erro corrompe a moralidade do órgão.","C":"divulgar os fatos de forma anônima em canais de imprensa sensacionalista antes de acionar a chefia.","D":"chancelar o desvio se o autor da fraude for um superior hierárquico com poder de remoção.","E":"aguardar a conclusão do estágio probatório do colega para formalizar qualquer modalidade de queixa."},"resposta_correta":"B","comentario":"O servidor público não pode ser conivente com o erro ou com a fraude. Constatada a irregularidade por colega ou superior, impõe-se o dever ético de comunicar imediatamente o fato às autoridades competentes para a devida apuração, sob pena de condescendência."},{"id":122,"numero":122,"bloco":1,"materia":"Ética no Serviço Público","texto_base":null,"enunciado":"A solidariedade entre os servidores públicos é incentivada para a consolidação de um ambiente de trabalho produtivo e seguro. Contudo, a solidariedade de natureza ética encontra limites claros no ordenamento. A chamada \"solidariedade corporativa\" corporificada no acobertamento de faltas disciplinares ou agressões ilegais a detentos por companheiros de farda é classificada como:","alternativas":{"A":"dever ético implícito de proteção mútua das forças policiais operacionais do Estado.","B":"conduta antiética e ilegal que atenta contra a moralidade, a justiça e a legalidade administrativa.","C":"prerrogativa tática legítima decorrente dos riscos inerentes à segurança interna do cárcere.","D":"infração de menor potencial ofensivo dispensada de anotação nos assentamentos funcionais.","E":"ato chancelado pelo Conselho da Comunidade em situações de iminente motim ou rebelião."},"resposta_correta":"B","comentario":"O acobertamento de crimes, faltas graves ou agressões ilegais intramuros sob o pretexto de \"solidariedade de farda\" constitui conduta antiética, corporativista e ilegal, colidindo frontalmente com a moralidade e a justiça da função pública de segurança."},{"id":123,"numero":123,"bloco":1,"materia":"Ética no Serviço Público","texto_base":null,"enunciado":"O tratamento dispensado pelo agente público aos detentos e internados sob custódia do Estado submete-se a rígidos padrões éticos e humanitários internacionais. Sob a ótica da Ética no Serviço Público, o uso de linguagem vulgar, deboches, xingamentos ou humilhações morais contra a população carcerária qualifica-se como:","alternativas":{"A":"técnica de controle psicológico legítima e necessária para a manutenção da disciplina interna.","B":"desvio ético frontal que desrespeita a dignidade humana e viola o decoro impositivo da função pública.","C":"comportamento irrelevante para a apuração conduzida pelas Comissões de Ética estaduais.","D":"infração escusável se o detento apresentar histórico de cometimento de faltas disciplinares graves.","E":"prerrogativa funcional decorrente da perda total dos direitos civis sofrida pelo sentenciado."},"resposta_correta":"B","comentario":"A população carcerária perde o direito de locomoção, mas mantém a dignidade da pessoa humana intacta. O emprego de humilhações morais, deboches ou linguagem vulgar por agentes públicos qualifica-se como grave desvio ético e quebra de decoro."},{"id":124,"numero":124,"bloco":1,"materia":"Ética no Serviço Público","texto_base":null,"enunciado":"As decisões tomadas pelas Comissões de Ética ao analisarem a conduta de um funcionário público devem ser instruídas com base nas provas documentadas nos autos. O parecer fundamentado emitido pela comissão ao aplicar a pena de censura ética ao servidor:","alternativas":{"A":"possui caráter estritamente financeiro, determinando o desconto imediato de parcelas do subsídio.","B":"é sigiloso de forma permanente, sendo proibida a sua inclusão nos assentamentos funcionais do apenado.","C":"deve ser encaminhado à respectiva chefia imediata e integrado ao prontuário do servidor para fins de histórico funcional.","D":"resulta na perda automática dos direitos políticos estaduais e demissão sumária do agente público.","E":"exige a homologação unânime por parte dos deputados estaduais da Assembleia Legislativa."},"resposta_correta":"C","comentario":"O parecer fundamentado que consagra a aplicação da penalidade de censura ética deve constar nos assentamentos do funcionário público, sendo integrado ao seu histórico para fins de avaliação de comportamento e progressão na carreira."},{"id":125,"numero":125,"bloco":1,"materia":"Ética no Serviço Público","texto_base":null,"enunciado":"O dever de atualizar os conhecimentos técnicos e operacionais constitui obrigação ética do servidor público. O funcionário que se recusa sistematicamente a participar de treinamentos de modernização burocrática ou operacional fornecidos pelo Estado comete desvio que impacta a:","alternativas":{"A":"autonomia financeira do sindicato de sua respectiva categoria profissional.","B":"eficiência e a qualidade do serviço público prestado à sociedade civil organizada.","C":"estabilidade constitucional adquirida após os três anos de efetivo exercício probatório.","D":"publicidade dos atos administrativos exarados pela direção do complexo carcerário.","E":"prerrogativa de exercer livremente atividades comerciais privadas como sócio gerente."},"resposta_correta":"B","comentario":"O servidor público tem o dever ético de manter-se atualizado e qualificado. A recusa injustificada em participar de cursos de modernização operacional oferecidos de forma gratuita pelo Estado compromete diretamente a eficiência e a qualidade técnica dos serviços entregues à comunidade."},{"id":126,"numero":126,"bloco":1,"materia":"Direito Constitucional","texto_base":null,"enunciado":"O artigo 5º da Constituição Federal de 1988 consagra os direitos e deveres individuais e coletivos, assegurando a brasileiros e a estrangeiros residentes no País a inviolabilidade do direito à vida, à liberdade, à igualdade, à segurança e à propriedade. Nos termos expressos do referido dispositivo constitucional, a lei penal:","alternativas":{"A":"nunca poderá retroagir, independentemente das condições ou do benefício gerado ao infrator.","B":"retroagirá sempre, atingindo atos passados para punir com maior severidade crimes hediondos.","C":"não retroagirá, salvo para beneficiar o réu.","D":"retroagirá por determinação exclusiva do Ministério Público durante o inquérito policial.","E":"poderá retroagir apenas se houver concordância expressa da Defensoria Pública do Estado."},"resposta_correta":"C","comentario":"Trata-se da aplicação literal do artigo 5º, inciso XL, da Constituição Federal. A irretroatividade da lei penal prejudicial é a regra no Estado Democrático de Direito, admitindo-se a retroatividade unicamente quando o diploma novo trouxer situação benéfica ao réu (novatio legis in mellius)."},{"id":127,"numero":127,"bloco":1,"materia":"Direito Constitucional","texto_base":null,"enunciado":"A inviolabilidade do domicílio é uma garantia constitucional consolidada no artigo 5º, inciso XI, da Carta Magna. A regra estabelece que a casa é asilo inviolável do indivíduo, ninguém nela podendo penetrar sem consentimento do morador. Assinale a alternativa que descreve a hipótese em que a entrada forçada no domicílio durante o período noturno é admitida constitucionalmente sem o consentimento do morador e sem exigência de mandado judicial.","alternativas":{"A":"Para o cumprimento de determinação judicial de busca e apreensão de aparelhos celulares.","B":"Em caso de flagrante delito ou desastre, ou para prestar socorro.","C":"Por determinação verbal direta de autoridade policial judiciária (Delegado).","D":"Para a realização de intimação pessoal de testemunha arrolada pela acusação.","E":"Sempre que o morador ostentar antecedentes criminais por crimes de tráfico de drogas."},"resposta_correta":"B","comentario":"Conforme preceitua o artigo 5º, inciso XI, da CF/88, as situações de flagrante delito, desastre ou prestação de socorro autorizam a entrada forçada no domicílio a qualquer hora do dia ou da noite, independentemente de consentimento do morador ou de mandado judicial. A determinação judicial (mandado) só autoriza a entrada durante o dia."},{"id":128,"numero":128,"bloco":1,"materia":"Direito Constitucional","texto_base":null,"enunciado":"Dentre os remédios constitucionais destinados a garantir a proteção de direitos fundamentais contra ilegalidade ou abuso de autoridade, o Habeas Corpus (HC) assume papel de destaque na tutela da liberdade. De acordo com a sistemática constitucional e processual penal vigente, o Habeas Corpus:","alternativas":{"A":"exige o pagamento prévio de custas judiciais proporcionais à pena do paciente.","B":"é ação de natureza civil que exige capacidade postulatória privativa de advogado inscrito na OAB.","C":"será concedido sempre que alguém sofrer ou se achar ameaçado de sofrer violência ou coação em sua liberdade de locomoção.","D":"aplica-se exclusivamente para a proteção do direito ao sigilo de dados bancários e fiscais.","E":"possui prazo de interposição estrito de cinco dias contados da lavratura do auto de flagrante."},"resposta_correta":"C","comentario":"O Habeas Corpus é o remédio constitucional expresso no artigo 5º, inciso LXVIII, da CF/88, destinado à proteção exclusiva da liberdade de locomoção contra ilegalidade ou abuso de autoridade. É ação gratuita e universal, dispensando advogado."},{"id":129,"numero":129,"bloco":1,"materia":"Direito Constitucional","texto_base":null,"enunciado":"Considere a seguinte situação hipotética: Um indivíduo maior e capaz é preso em flagrante delito por Policiais Penais ao tentar introduzir substâncias entorpecentes em uma unidade prisional do Rio Grande do Norte. Conduzido à delegacia, o preso exige o cumprimento de suas garantias constitucionais relativas à transparência dos atos públicos e à ampla defesa. À luz do artigo 5º, inciso LXIV, da CF/88, o preso tem direito:","alternativas":{"A":"à escolha imediata do pavilhão e da cela onde cumprirá a prisão provisória.","B":"à identificação dos responsáveis por sua prisão ou por seu interrogatório policial.","C":"ao relaxamento automático da prisão se não houver defensor público presente no local do crime.","D":"à eliminação imediata de seus dados de identificação biométrica dos sistemas estaduais.","E":"ao recebimento de auxílio financeiro governamental imediato para o custeio de sua subsistência carcerária."},"resposta_correta":"B","comentario":"De acordo com o artigo 5º, inciso LXIV, da Constituição Federal, o preso possui a garantia fundamental de saber a identidade dos agentes responsáveis por sua captura física ou pela condução de seu interrogatório policial, coibindo prisões clandestinas."},{"id":130,"numero":130,"bloco":1,"materia":"Direito Constitucional","texto_base":null,"enunciado":"O princípio do Juiz Natural constitui garantia fundamental que blinda o cidadão contra arbitrariedades do poder punitivo estatal. Nos termos taxativos dos incisos XXXVII e LIII do artigo 5º da Constituição Federal de 1988:","alternativas":{"A":"o julgamento de crimes militares cometidos por civis será realizado por comissões temporárias de cidadãos.","B":"não haverá juízo ou tribunal de exceção, e ninguém será processado nem sentenciado senão pela autoridade competente.","C":"o Governador do Estado possui prerrogativa para criar juízos especiais extraordinários após grandes crises carcerárias.","D":"admite-se a criação de tribunais temporários para o julgamento de crimes dolosos contra o patrimônio público.","E":"a competência para julgar policiais penais por faltas administrativas é do Tribunal de Justiça Militar federal."},"resposta_correta":"B","comentario":"Aplicação conjunta dos incisos XXXVII e LIII do artigo 5º da CF/88, que consagram o Princípio do Juiz Natural. Proíbe-se a instituição de tribunais de exceção criados após o cometimento do crime para julgamentos específicos."},{"id":131,"numero":131,"bloco":1,"materia":"Direito Constitucional","texto_base":null,"enunciado":"O artigo 144 da Constituição Federal de 1988 estrutura a Segurança Pública, definindo os órgãos responsáveis pela preservação da ordem pública e da incolumidade das pessoas e do patrimônio. Com a promulgação da Emenda Constitucional nº 104/2019, o rol dos órgãos da segurança pública passou a incluir expressamente as:","alternativas":{"A":"Guardas Municipais armadas.","B":"Forças Auxiliares de Vigilância Privada.","C":"Polícias Penais federal, estaduais e distrital.","D":"Corregedorias Unificadas de Defesa Social.","E":"Polícias Rodoviárias estaduais independentes."},"resposta_correta":"C","comentario":"A Emenda Constitucional nº 104/2019 alterou o artigo 144 da CF/88 para incluir formalmente as Polícias Penais federal, estaduais e distrital no rol taxativo dos órgãos responsáveis pela segurança pública."},{"id":132,"numero":132,"bloco":1,"materia":"Direito Constitucional","texto_base":null,"enunciado":"De acordo com o texto constitucional (Art. 144, § 5º-A), a Polícia Penal vincula-se ao órgão administrador do sistema penal da unidade federativa a que pertence. No âmbito dos Estados, as Polícias Penais possuem como atribuição precípua e constitucional a:","alternativas":{"A":"apuração das infrações penais contra a ordem política e social em prejuízo de autarquias federais.","B":"execução do policiamento ostensivo e preventivo de trânsito nas rodovias estaduais.","C":"segurança dos estabelecimentos penais.","D":"realização de investigações criminais de natureza estritamente militar e de inteligência aérea.","E":"proteção dos bens, serviços e instalações dos municípios e câmaras de vereadores."},"resposta_correta":"C","comentario":"Nos termos do artigo 144, § 5º-A, da Constituição Federal, à polícia penal compete, como atribuição constitucional originária, a segurança dos estabelecimentos penais, assumindo as funções de gestão e vigilância tática intramuros."},{"id":133,"numero":133,"bloco":1,"materia":"Direito Constitucional","texto_base":null,"enunciado":"Os direitos sociais, positivados no artigo 6º da Constituição Federal de 1988, constituem garantias de segunda geração que impõem prestações positivas ao Estado para a realização da justiça social. Assinale a alternativa que apresenta um direito expressamente catalogado como direito social no texto constitucional.","alternativas":{"A":"Direito de propriedade de bens imóveis urbanos.","B":"Direito ao voto secreto, universal e periódico.","C":"Direito à segurança, à saúde e ao trabalho.","D":"Direito à liberdade de locomoção em tempo de paz.","E":"Direito ao livre exercício de qualquer culto religioso."},"resposta_correta":"C","comentario":"O artigo 6º da Constituição Federal apresenta o rol dos direitos sociais, incluindo expressamente a educação, a saúde, a alimentação, o trabalho, a moradia, o transporte, o lazer, a segurança, a previdência social, a proteção à maternidade e à infância, e a assistência aos desamparados."},{"id":134,"numero":134,"bloco":1,"materia":"Direito Constitucional","texto_base":null,"enunciado":"A Constituição Federal regula de forma rígida as prerrogativas do preso e as condições de cumprimento das penas, visando garantir o respeito à dignidade humana intramuros. De acordo com o artigo 5º, inciso XLVIII, da CF/88, a pena será cumprida em estabelecimentos distintos, de acordo com os seguintes critérios:","alternativas":{"A":"a renda familiar, a cor da pele e o grau de escolaridade do sentenciado.","B":"a natureza da infração, a idade e o sexo do apenado.","C":"a orientação político-partidária, a naturalidade e a opção religiosa do preso.","D":"o valor do prejuízo material causado ao erário e o local de nascimento do réu.","E":"a indicação discricionária realizada pelo Conselho da Comunidade da respectiva comarca."},"resposta_correta":"B","comentario":"É a redação literal do artigo 5º, inciso XLVIII, da Constituição Federal. O Estado é obrigado a separar a massa carcerária a partir da gravidade e natureza do delito praticado, bem como por critérios biológicos de idade e sexo."},{"id":135,"numero":135,"bloco":1,"materia":"Direito Constitucional","texto_base":null,"enunciado":"No que tange aos direitos de nacionalidade regulados pelo artigo 12 da Constituição Federal, o ordenamento jurídico brasileiro adota critérios específicos para a definição da nacionalidade nata e da naturalizada. São considerados brasileiros natos os nascidos na República Federativa do Brasil, ainda que de pais estrangeiros, desde que estes:","alternativas":{"A":"possuam visto de permanência definitiva expedido pelo Ministério da Justiça.","B":"não estejam a serviço de seu país.","C":"professem a mesma religião da maioria da população nacional.","D":"comprovem residência ininterrupta em solo nacional superior a dez anos.","E":"exerçam atividades comerciais de natureza estritamente privada no território."},"resposta_correta":"B","comentario":"O ordenamento adota o critério do jus soli (direito do solo) como regra para a nacionalidade nata. Os nascidos no Brasil serão brasileiros natos, ainda que de pais estrangeiros, desde que estes não estejam no território a serviço de seu país de origem (Art. 12, I, \"a\")."},{"id":136,"numero":136,"bloco":1,"materia":"Direito Constitucional","texto_base":null,"enunciado":"Considere a seguinte situação hipotética: Um Policial Penal do Estado do Rio Grande do Norte, atuando na fiscalização do setor de correspondências de uma penitenciária estadual, decide abrir e ler, sem qualquer autorização judicial ou justificativa técnica de segurança, as cartas enviadas pelos advogados particulares e familiares direcionadas aos detentos. Diante das garantias de inviolabilidade de comunicações expressas no artigo 5º, inciso XII, da CF/88, e ressalvadas as hipóteses de mitigação para a segurança interna do cárcere legalmente fundamentadas, a conduta arbitrária do servidor viola o sigilo da:","alternativas":{"A":"correspondência e das comunicações telegráficas, de dados e das comunicações telefônicas.","B":"intimidade financeira das empresas de telefonia celular parceiras do Estado.","C":"interceptação ambiental decretada pelo Promotor de Justiça de forma autônoma.","D":"publicidade obrigatória das atas de reuniões do Conselho da Comunidade.","E":"manifestação político-partidária de organizações criminosas intramuros."},"resposta_correta":"A","comentario":"O artigo 5º, inciso XII, protege o sigilo da correspondência e das comunicações como direito fundamental. Embora mitigável em situações de segurança carcerária nos termos da lei, o rompimento arbitrário sem lastro legal atenta contra o mandamento constitucional."},{"id":137,"numero":137,"bloco":1,"materia":"Direito Constitucional","texto_base":null,"enunciado":"Os direitos políticos, previstos no artigo 14 da Constituição Federal de 1988, disciplinam a soberania popular por meio do sufrágio universal e do voto direto e secreto. De acordo com as normas constitucionais vigentes, o alistamento eleitoral e o voto são obrigatórios para os:","alternativas":{"A":"analfabetos maiores de dezoito anos.","B":"maiores de setenta anos de idade.","C":"jovens maiores de dezesseis e menores de dezoito anos.","D":"brasileiros maiores de dezoito anos.","E":"estrangeiros residentes no país há mais de cinco anos."},"resposta_correta":"D","comentario":"Conforme o artigo 14, § 1º, inciso I, da CF/88, o alistamento eleitoral e o voto possuem caráter obrigatório para os cidadãos maiores de dezoito anos. É facultativo para analfabetos, maiores de setenta anos e jovens de dezesseis a dezoito anos."},{"id":138,"numero":138,"bloco":1,"materia":"Direito Constitucional","texto_base":null,"enunciado":"A Constituição Federal veda expressamente a aplicação de determinadas modalidades de penas no território nacional, estabelecendo balizas humanitárias intransigentes para o direito penal e de execução. Nos termos do artigo 5º, inciso XLVII, não haverá penas de:","alternativas":{"A":"reclusão em regime fechado ou detenção preventiva.","B":"suspensão de direitos políticos ou interdição de funções.","C":"prestação de serviços à comunidade ou perda de bens.","D":"morte (salvo em caso de guerra declarada), de caráter perpétuo, de trabalhos forçados, de banimento e cruéis.","E":"multa pecuniária ou cassação de gratificações administrativas."},"resposta_correta":"D","comentario":"O artigo 5º, inciso XLVII, da CF/88 impõe limites humanitários às sanções penais estatais, proibindo penas de morte (salvo guerra declarada), perpétuas, de trabalhos forçados, de banimento e cruéis."},{"id":139,"numero":139,"bloco":1,"materia":"Direito Constitucional","texto_base":null,"enunciado":"A extradição é o ato por meio do qual um Estado entrega um indivíduo a outro país para que este responda a processo criminal ou cumpra pena já aplicada. No que tange à proteção dos nacionais, a Constituição Federal estabelece que:","alternativas":{"A":"nenhum brasileiro, nato ou naturalizado, poderá ser extraditado em qualquer hipótese.","B":"o brasileiro naturalizado poderá ser extraditado em caso de crime comum praticado antes da naturalização.","C":"o brasileiro nato poderá ser extraditado por crime político ou de opinião se houver tratado internacional.","D":"a extradição de estrangeiro por crime político ou de opinião será autorizada automaticamente pelo Juiz da Execução.","E":"o brasileiro nato será extraditado se comprovado o envolvimento em crimes contra o patrimônio privado estrangeiro."},"resposta_correta":"B","comentario":"Conforme preceitua o artigo 5º, inciso LI, da CF/88, o brasileiro nato nunca será extraditado. O naturalizado poderá ser extraditado em duas hipóteses: crime comum praticado antes da naturalização ou envolvimento comprovado em tráfico ilícito de entorpecentes a qualquer tempo."},{"id":140,"numero":140,"bloco":1,"materia":"Direito Constitucional","texto_base":null,"enunciado":"As Comissões Parlamentares de Inquérito (CPI), criadas pelas Casas Legislativas, detêm poderes de investigação próprios das autoridades judiciais, além de outros previstos nos regimentos internos. No exercício de suas funções, uma CPI criada no âmbito do Poder Legislativo estadual não possui competência constitucional para decretar a seguinte medida:","alternativas":{"A":"A quebra do sigilo bancário do investigado por decisão motivada.","B":"A oitiva de testemunhas sob o compromisso legal de dizer a verdade.","C":"A requisição de documentos e relatórios técnicos a órgãos do Poder Executivo.","D":"A busca e apreensão domiciliar noturna sem consentimento do morador.","E":"A quebra do sigilo fiscal do agente público submetido a apuração."},"resposta_correta":"D","comentario":"As CPIs detêm poderes de investigação próprios das autoridades judiciais, podendo quebrar sigilos bancário, fiscal e telefônico de forma motivada. Contudo, a busca e apreensão domiciliar (especialmente noturna) submete-se à cláusula de reserva de jurisdição, sendo ato exclusivo de magistrados."},{"id":141,"numero":141,"bloco":1,"materia":"Direito Constitucional","texto_base":null,"enunciado":"Considere a seguinte situação hipotética: Uma associação de Policiais Penais do Rio Grande do Norte, legalmente constituída e em funcionamento há mais de dois anos, pretende ingressar em juízo para defender os interesses jurídicos e remuneratórios de seus associados, independentemente de autorização expressa individual de cada um. À luz das normas constitucionais que regulam o direito de associação (Art. 5º, XXI), as entidades associativas, quando expressamente autorizadas, têm legitimidade para representar seus filiados judicial ou extrajudicialmente. Portanto, a regra constitucional exige:","alternativas":{"A":"autorização expressa, seja por ato individual ou por deliberação em assembleia geral da entidade.","B":"autorização verbal emitida perante o Diretor- Geral da Secretaria de Administração Penitenciária.","C":"o pagamento prévio de taxas associativas ao Tribunal de Justiça do Estado.","D":"a anuência unânime dos deputados integrantes da comissão de segurança pública.","E":"que a associação esteja em funcionamento há pelo menos dez anos ininterruptos."},"resposta_correta":"A","comentario":"Nos termos do artigo 5º, inciso XXI, da CF/88, as entidades associativas necessitam de autorização expressa para exercer a representação processual de seus filiados. A jurisprudência do STF firmou que essa autorização pode ser concedida por deliberação assemblear."},{"id":142,"numero":142,"bloco":1,"materia":"Direito Constitucional","texto_base":null,"enunciado":"O princípio da inafastabilidade da jurisdição (ou direito de acesso à Justiça) está previsto no artigo 5º, inciso XXXV, da CF/88. De acordo com o mandamento constitucional, a lei:","alternativas":{"A":"poderá impedir o acesso ao Judiciário se o valor da causa for inferior a um salário mínimo.","B":"não excluirá da apreciação do Poder Judiciário lesão ou ameaça a direito.","C":"exigirá o esgotamento obrigatório das vias administrativas em todo e qualquer conflito civil.","D":"submeterá as decisões judiciais criminais à aprovação prévia do Governador do Estado.","E":"suspenderá o direito de petição dos cidadãos durante o recesso parlamentar anual."},"resposta_correta":"B","comentario":"O artigo 5º, inciso XXXV, consagra o Princípio da Inafastabilidade da Jurisdição ou Direito de Acesso à Justiça, impedindo que o legislador crie barreiras que proíbam o cidadão de submeter lesão ou ameaça a direito ao crivo do Judiciário."},{"id":143,"numero":143,"bloco":1,"materia":"Direito Constitucional","texto_base":null,"enunciado":"No âmbito da organização político-administrativa da República Federativa do Brasil, a competência legislativa divide-se entre a União, os Estados, o Distrito Federal e os Municípios. Nos termos do artigo 22, inciso I, da CF/88, compete privativamente à União legislar sobre direito:","alternativas":{"A":"tributário, financeiro e penitenciário.","B":"penal, processual penal e civil.","C":"urbanístico, caça e pesca.","D":"orçamento, juntas comerciais e custas judiciais.","E":"previdência social, proteção da infância e da juventude."},"resposta_correta":"B","comentario":"De acordo com o artigo 22, inciso I, da Constituição Federal, compete privativamente à União legislar sobre direito civil, comercial, penal, processual, eleitoral, agrário, marítimo, aeronáutico, espacial e do trabalho. Direito penitenciário é de competência concorrente (Art. 24)."},{"id":144,"numero":144,"bloco":1,"materia":"Direito Constitucional","texto_base":null,"enunciado":"A Constituição Federal confere especial relevância ao Tribunal do Júri, assegurando-lhe uma organização interna e competências soberanas fixadas no artigo 5º, inciso XXXVIII. A Carta Magna reconhece a instituição do Júri, com a organização que lhe der a lei, assegurados os seguintes princípios:","alternativas":{"A":"a publicidade restrita, o voto aberto dos jurados e a subordinação ao veredicto do juiz presidente.","B":"a plenitude de defesa, o sigilo das votações, a soberania dos veredictos e a competência para o julgamento dos crimes dolosos contra a vida.","C":"o contraditório diferido, a oralidade plena e a competência restrita aos crimes patrimoniais violentos.","D":"a inversão do ônus da prova, a incomunicabilidade absoluta absoluta das testemunhas e a pena de morte automática.","E":"a obrigatoriedade de assistência por defensor público e a competência para julgar crimes militares culposos."},"resposta_correta":"B","comentario":"É a reprodução literal do artigo 5º, inciso XXXVIII, da Constituição Federal. O Júri é garantido constitucionalmente a partir do tripé da plenitude de defesa, sigilo das votações, soberania dos veredicto e competência para julgar crimes dolosos contra a vida."},{"id":145,"numero":145,"bloco":1,"materia":"Direito Constitucional","texto_base":null,"enunciado":"Considere a seguinte situação hipotética: Durante a realização de uma operação policial civil em uma comarca potiguar, os agentes estatais realizam a prisão de um suspeito e deixam de comunicar o fato ao juiz competente e à família do preso nas primeiras 48 horas da tranca, alegando necessidade de resguardar o sigilo da investigação. Diante das normas que regulam a prisão e as garantias do preso no artigo 5º, inciso LXII, da CF/88, a prisão de qualquer pessoa e o local onde se encontre serão comunicados:","alternativas":{"A":"no prazo máximo de cinco dias úteis, por meio de edital publicado na imprensa oficial do estado.","B":"imediatamente ao juiz competente e à família do preso ou à pessoa por ele indicada.","C":"apenas se houver requisição formal por escrito emitida pela Ordem dos Advogados do Brasil (OAB).","D":"ao final do inquérito policial, juntamente com o relatório de indiciamento assinado pelo delegado.","E":"após a realização da audiência de instrução e julgamento na vara criminal respectiva."},"resposta_correta":"B","comentario":"O artigo 5º, inciso LXII, impõe a obrigação de comunicação imediata da prisão de qualquer indivíduo ao juiz competente e à família do detento, visando coibir restrições clandestinas de liberdade."},{"id":146,"numero":146,"bloco":1,"materia":"Direito Constitucional","texto_base":null,"enunciado":"A segurança pública é dever do Estado, direito e responsabilidade de todos. Dentre as forças policiais estruturadas no artigo 144 da Constituição Federal, o órgão responsável pelo policiamento ostensivo e pela preservação da ordem pública no âmbito dos Estados federais é a:","alternativas":{"A":"Polícia Civil.","B":"Polícia Científica ou Instituto de Perícia Técnica.","C":"Polícia Militar.","D":"Guarda Municipal.","E":"Polícia Federal."},"resposta_correta":"C","comentario":"Conforme o artigo 144, § 5º, da CF/88, às polícias militares cabem a polícia ostensiva e a preservação da ordem pública no âmbito dos Estados e do Distrito Federal."},{"id":147,"numero":147,"bloco":1,"materia":"Direito Constitucional","texto_base":null,"enunciado":"No que concerne às atribuições das forças de segurança, o artigo 144, § 4º, da Constituição Federal estabelece as competências das Polícias Civis. Dirigidas por delegados de polícia de carreira, as polícias civis exercem as funções de:","alternativas":{"A":"polícia judiciária e a apuração de infrações penais, exceto as militares.","B":"policiamento ostensivo de trânsito em vias urbanas e guarda de palácios governamentais.","C":"execução penal e custódia de presos condenados definitivos em presídios de segurança máxima.","D":"patrulhamento ostensivo das fronteiras fluviais e combate ao contrabando aduaneiro.","E":"fiscalização de contratos licitatórios estaduais e repressão a infrações administrativas fiscais."},"resposta_correta":"A","comentario":"Nos termos do artigo 144, § 4º, da Constituição Federal, as polícias civis exercem as funções de polícia judiciária e a apuração de infrações penais, submetendo-se à exceção das infrações penais militares, cuja apuração compete às próprias Forças Armadas ou PM."},{"id":148,"numero":148,"bloco":1,"materia":"Direito Constitucional","texto_base":null,"enunciado":"A garantia da presunção de inocência (ou princípio da não culpabilidade) está expressamente positivada no artigo 5º, inciso LVII, da Constituição Federal de 1988, produzindo reflexos drásticos no tratamento conferido ao réu. De acordo com o texto da Carta Magna, ninguém será considerado culpado até:","alternativas":{"A":"o indiciamento formal lavrado pela autoridade policial judiciária no relatório do inquérito.","B":"o recebimento da peça acusatória de denúncia oferecida pelo Promotor de Justiça.","C":"a prolação da sentença condenatória pelo magistrado de primeira instância criminal.","D":"o trânsito em julgado de sentença penal condenatória.","E":"a interposição do recurso de apelação perante o Tribunal de Justiça do Estado."},"resposta_correta":"D","comentario":"O artigo 5º, inciso LVII, positiva o princípio da presunção de inocência, estabelecendo que o status de inocente acompanha o acusado durante toda a persecução, só sendo desfeito após o trânsito em julgado da sentença condenatória (quando não couberem mais recursos)."},{"id":149,"numero":149,"bloco":1,"materia":"Direito Constitucional","texto_base":null,"enunciado":"Dentre as garantias fundamentais instituídas no artigo 5º da CF/88, encontra-se a proibição de criação de penas ou restrições de direitos de forma retroativa prejudicial. O inciso XXXIX positiva o Princípio da Legalidade (ou da Anterioridade) ao preceituar textualmente que não haverá crime sem:","alternativas":{"A":"autorização expressa emitida por Decreto do Governador do Estado.","B":"lei anterior que o defina, nem pena sem prévia cominação legal.","C":"homologação unânime dos membros do Conselho da Comunidade local.","D":"prejuízo material superior a um salário mínimo provado nos autos.","E":"representação verbal imediata realizada pela vítima perante o juiz."},"resposta_correta":"B","comentario":"Trata-se do Princípio da Legalidade estrita ou da Anterioridade Penal positivado no artigo 5º, inciso XXXIX, da CF/88, exigindo-se lei em sentido estrito anterior para a criação de tipos incriminadores ou fixação de sanções."},{"id":150,"numero":150,"bloco":1,"materia":"Direito Constitucional","texto_base":null,"enunciado":"Considere a seguinte situação hipotética: Um cidadão brasileiro nato, residente no Estado do Rio Grande do Norte, decide criar uma associação de moradores voltada a debater melhorias urbanas na comarca e, simultaneamente, estruturar uma milícia armada para realizar o patrulhamento privado das ruas do bairro. À luz do direito fundamental de associação previsto no artigo 5º, inciso XVII, da CF/88, é plena a liberdade de associação para fins lícitos, sendo:","alternativas":{"A":"permitida a organização de milícias armadas se houver autorização da Assembleia Legislativa.","B":"vedada a de caráter paramilitar.","C":"obrigatória a filiação de todos os moradores do bairro na referida entidade comunitária.","D":"permitida a interferência do Poder Executivo estadual no funcionamento interno da associação.","E":"exigida a autorização prévia do Ministério da Defesa para a criação de qualquer associação civil."},"resposta_correta":"B","comentario":"Conforme preceitua o artigo 5º, inciso XVII, da CF/88, a liberdade de associação é plena para fins lícitos, vedando-se terminantemente a criação ou funcionamento de associações de caráter paramilitar ou milícias armadas."},{"id":151,"numero":151,"bloco":1,"materia":"Direito Constitucional","texto_base":null,"enunciado":"A Constituição Federal de 1988 elenca no artigo 5º, inciso LVI, uma barreira instrutória intransigente para a proteção dos direitos do acusado no processo judicial ou administrativo. De acordo com o texto da Carta Magna, são inadmissíveis no processo as provas:","alternativas":{"A":"colhidas por meio de testemunhas que possuam vínculos de parentesco com a vítima.","B":"obtidas por meios ilícitos.","C":"produzidas fora dos limites territoriais da comarca onde ocorreu o crime.","D":"documentadas em formato digital ou eletrônico sem assinatura de perito oficial.","E":"requeridas pela defesa técnica após o encerramento do expediente bancário ordinário."},"resposta_correta":"B","comentario":"O artigo 5º, inciso LVI, proíbe expressamente a introdução e valoração de provas obtidas por meios ilícitos (que violem normas constitucionais ou legais de direito material) no processo judicial."},{"id":152,"numero":152,"bloco":1,"materia":"Direito Constitucional","texto_base":null,"enunciado":"No que concerne à extradição e às garantias de estrangeiros em solo nacional, o artigo 5º, inciso LII, da Constituição Federal de 1988 veda a concessão de extradição em hipóteses que envolvam motivações de perseguição ideológica por parte do Estado requerente. Nos termos do mandamento constitucional, não será concedida a extradição de estrangeiro por:","alternativas":{"A":"crime comum ou infração financeira aduaneira.","B":"crime político ou de opinião.","C":"crime doloso contra a vida de diplomatas internacionais.","D":"infração de trânsito ou descumprimento de obrigações contratuais civis.","E":"atos de improbidade administrativa dolosa cometidos no exterior."},"resposta_correta":"B","comentario":"De acordo com o artigo 5º, inciso LII, da Constituição Federal de 1988, é vedada a concessão de extradição de estrangeiros quando o crime motivador do pedido possuir natureza política ou de manifestação de opinião."},{"id":153,"numero":153,"bloco":1,"materia":"Direito Constitucional","texto_base":null,"enunciado":"Os direitos e garantias fundamentais previstos na Constituição Federal de 1988 não excluem outros decorrentes do regime e dos princípios por ela adotados, ou dos tratados internacionais em que a República Federativa do Brasil seja parte. Os tratados e convenções internacionais sobre direitos humanos que forem aprovados, em cada Casa do Congresso Nacional, em dois turnos, por três quintos dos votos dos respectivos membros, serão equivalentes:","alternativas":{"A":"às leis ordinárias federais comuns.","B":"às emendas constitucionais.","C":"aos decretos legislativos complementares.","D":"às resoluções administrativas do Ministério da Justiça.","E":"às portarias normativas da Advocacia-Geral da União (AGU)."},"resposta_correta":"B","comentario":"É a aplicação do rito especial introduzido pelo artigo 5º, § 3º, da CF/88. Os tratados de direitos humanos aprovados pelo rito equivalente ao das emendas (duas casas, dois turnos, 3/5 dos votos) adquirem status constitucional."},{"id":154,"numero":154,"bloco":1,"materia":"Direito Constitucional","texto_base":null,"enunciado":"A propriedade é garantida como direito fundamental no artigo 5º, inciso XXII, da CF/88, submetendo-se contudo à sua função social. O inciso XXIV estabelece o procedimento por meio do qual o Estado pode intervir na propriedade privada de forma impositiva, preceituando que a lei estabelecerá o procedimento para desapropriação por necessidade ou utilidade pública, ou por interesse social, mediante:","alternativas":{"A":"confisco imediato dos bens sem direito a qualquer categoria de ressarcimento pecuniário.","B":"justa e prévia indenização em dinheiro, ressalvados os casos previstos nesta Constituição.","C":"pagamento parcelado em títulos da dívida pública emitidos pelo município por trinta anos.","D":"autorização verbal emitida pelo prefeito em solenidade comunitária de bairro.","E":"permuta obrigatória por terras públicas localizadas na região amazônica."},"resposta_correta":"B","comentario":"Conforme o artigo 5º, inciso XXIV, da Constituição Federal, a intervenção estatal por desapropriação submete-se ao dever de indenização justa, prévia e em dinheiro, ressalvadas as hipóteses constitucionais específicas de sanção agrária ou urbana."},{"id":155,"numero":155,"bloco":1,"materia":"Direito Constitucional","texto_base":null,"enunciado":"Considere a seguinte situação hipotética: Uma cidadã brasileira, grávida e cumprindo pena em regime fechado em um estabelecimento prisional feminino do Rio Grande do Norte, dá à luz ao seu filho no interior do complexo carcerário, exigindo o cumprimento das garantias de proteção à maternidade asseguradas pela Carta Magna. À luz do artigo 5º, inciso L, da Constituição Federal de 1988, às presidiárias serão asseguradas condições para que possam:","alternativas":{"A":"obter a remissão total da pena aplicada na sentença sem exigência de trabalho.","B":"permanecer com seus filhos durante o período de amamentação.","C":"migrar automaticamente para o regime aberto sem monitoramento eletrônico.","D":"receber visitas íntimas diárias de familiares sem triagem de segurança.","E":"transferir a guarda definitiva da criança ao Conselho da Comunidade local."},"resposta_correta":"B","comentario":"O artigo 5º, inciso L, da CF/88 impõe ao Estado o dever de garantir condições dignas estruturais para que as presidiárias grávidas ou lactantes possam permanecer com seus filhos durante o período necessário de amamentação."},{"id":156,"numero":156,"bloco":1,"materia":"Direito Constitucional","texto_base":null,"enunciado":"A publicidade dos atos processuais constitui garantia de transparência democrática inserida no rol dos direitos fundamentais da CF/88. Todavia, a própria norma constitucional estabelece limites a esse direito no artigo 5º, inciso LX. De acordo com o texto da Carta Magna, a lei só poderá restringir a publicidade dos atos processuais quando a:","alternativas":{"A":"defesa da intimidade ou o interesse social o exigirem.","B":"autoridade policial (Delegado) considerar as provas vexatórias para a reputação do réu.","C":"imprensa sensacionalista requerer acesso exclusivo aos depoimentos das testemunhas.","D":"pena aplicada na sentença for inferior a dois anos de detenção simples.","E":"vítima manifestar concordância verbal com o sigilo perante o escrivão de polícia."},"resposta_correta":"A","comentario":"Conforme o artigo 5º, inciso LX, da Carta Magna, a publicidade é a regra para os atos processuais. A restrição e decretação de segredo de justiça só são legítimas quando a defesa da intimidade ou o interesse social maior assim exigirem."},{"id":157,"numero":157,"bloco":1,"materia":"Direito Constitucional","texto_base":null,"enunciado":"Os direitos e garantias expressos na Constituição Federal possuem aplicação imediata e vinculam a atuação de todos os poderes públicos do Estado. De acordo com o artigo 5º, § 1º, da CF/88, as normas definidoras dos direitos e garantias fundamentais têm:","alternativas":{"A":"aplicação programática diferida, dependendo de regulamentação por lei complementar federal.","B":"aplicação imediata.","C":"eficácia suspensa durante a tramitação do orçamento anual do Estado.","D":"vigência restrita às comarcas judiciárias que possuam varas criminais especializadas.","E":"aplicação condicionada à anuência prévia das assembleias legislativas estaduais."},"resposta_correta":"B","comentario":"O artigo 5º, § 1º, estabelece que as normas definidoras dos direitos e garantias fundamentais possuem aplicação imediata, repelindo a necessidade de leis regulamentadoras prévias para surtirem efeitos práticos protetivos."},{"id":158,"numero":158,"bloco":1,"materia":"Direito Constitucional","texto_base":null,"enunciado":"A assistência jurídica integral e gratuita constitui direito fundamental essencial para viabilizar o acesso dos hipossuficientes econômicos ao Poder Judiciário. Nos termos expressos do artigo 5º, inciso LXXIV, da Constituição Federal de 1988, o Estado prestará assistência jurídica integral e gratuita aos que:","alternativas":{"A":"comprovarem insuficiência de recursos.","B":"ostentarem a condição de servidores públicos das carreiras de segurança de forma compulsória.","C":"apresentarem certidão de antecedentes criminais sem anotações de faltas disciplinares.","D":"residirem em municípios que não possuam sedes de comarcas judiciárias ativas.","E":"forem processados por crimes cometidos estritamente na modalidade culposa."},"resposta_correta":"A","comentario":"De acordo com o artigo 5º, inciso LXXIV, da Constituição Federal, o Estado prestará assistência jurídica integral e gratuita por meio da Defensoria Pública aos que comprovarem a insuficiência de recursos (hipossuficiência econômica)."},{"id":159,"numero":159,"bloco":1,"materia":"Direito Constitucional","texto_base":null,"enunciado":"O direito de petição e a obtenção de certidões constituem garantias fundamentais voltadas a assegurar a cidadania e o controle dos atos da Administração Pública. Nos termos do artigo 5º, inciso XXXIV, da CF/88, são assegurados a todos, independentemente do pagamento de taxas:","alternativas":{"A":"o direito de petição aos Poderes Públicos em defesa de direitos ou contra ilegalidade ou abuso de autoridade, e a obtenção de certidões em repartições públicas.","B":"a emissão de passaportes diplomáticos internacionais e a renovação de vistos aduaneiros.","C":"o registro de contratos de compra e venda de imóveis rurais em cartórios privados.","D":"a consulta a relatórios de inteligência militar sigilosos produzidos pelas forças armadas.","E":"a inscrição em concursos públicos estaduais para cargos de direção de segurança máxima."},"resposta_correta":"A","comentario":"O artigo 5º, inciso XXXIV, consagra a gratuidade universal, independentemente de pagamento de taxas, para o exercício do direito de petição contra ilegalidades e para a obtenção de certidões em repartições públicas."},{"id":160,"numero":160,"bloco":1,"materia":"Direito Constitucional","texto_base":null,"enunciado":"Considere a seguinte situação hipotética: Um grupo de cidadãos potiguares decide organizar uma reunião pacífica, sem armas, em uma praça pública localizada na cidade de Natal, com o objetivo de protestar contra a precarização das vias urbanas locais. À luz do direito de reunião previsto no artigo 5º, inciso XVI, da CF/88, o exercício desse direito:","alternativas":{"A":"exige autorização prévia por escrito expedida pela Secretaria de Segurança Pública.","B":"independe de autorização, sendo apenas exigido prévio aviso à autoridade competente.","C":"pressupõe o pagamento de taxas de ocupação de solo urbano ao município.","D":"fica restrito aos períodos diurnos, sendo terminantemente proibido o protesto após as dezoito horas.","E":"submete-se à aprovação unânime dos moradores residentes no entorno da praça pública."},"resposta_correta":"B","comentario":"Conforme o artigo 5º, inciso XVI, da CF/88, o direito de reunião pacífica em locais abertos ao público independe de autorização do Estado. Exige-se apenas que não frustre outra reunião anterior e que haja prévio aviso à autoridade competente."},{"id":161,"numero":161,"bloco":1,"materia":"Direito Constitucional","texto_base":null,"enunciado":"A liberdade de locomoção no território nacional constitui direito fundamental de primeira geração assegurado no artigo 5º, inciso XV, da Constituição Federal de 1988. Nos termos expressos do dispositivo constitucional, é livre a locomoção no território nacional em tempo de:","alternativas":{"A":"paz, podendo qualquer pessoa, nos termos da lei, nele entrar, permanecer ou dele sair com seus bens.","B":"guerra declarada, sem qualquer modalidade de restrição ou controle aduaneiro por forças militares.","C":"calamidade pública financeira, vedando-se a cobrança de pedágios ou taxas de trânsito rodoviário.","D":"eleições gerais, sendo proibida a prisão preventiva de candidatos nas duas semanas anteriores ao pleito.","E":"recesso administrativo, ficando a fiscalização de fronteiras sob a responsabilidade das polícias civis."},"resposta_correta":"A","comentario":"É a redação literal do artigo 5º, inciso XV, da Constituição Federal, que garante o direito de ir, vir e ficar em tempo de paz no território nacional, observados os limites normativos da lei ordinária."},{"id":162,"numero":162,"bloco":1,"materia":"Direito Constitucional","texto_base":null,"enunciado":"A liberdade de manifestação do pensamento é garantida pelo artigo 5º, inciso IV, da Constituição Federal de 1988, caracterizando-se como pilar do Estado Democrático de Direito. Todavia, a própria Carta Magna impõe uma barreira intransigente a esse direito, preceituando textualmente que é livre a manifestação do pensamento, sendo:","alternativas":{"A":"obrigatório o registro prévio do conteúdo editorial na Secretaria de Cultura do Estado.","B":"vedado o anonimato.","C":"exigida a comprovação de diploma de curso superior de jornalismo para publicações na internet.","D":"permitida a ofensa à honra de agentes públicos se o objetivo for a crítica administrativa.","E":"vedada a manifestação sobre temas de natureza religiosa ou político-partidária nos fins de semana."},"resposta_correta":"B","comentario":"O artigo 5º, inciso IV, garante a livre manifestação do pensamento, proibindo contudo o anonimato, visando assegurar o direito de resposta e a responsabilização civil ou penal por eventuais excessos ou ofensas."},{"id":163,"numero":163,"bloco":1,"materia":"Direito Constitucional","texto_base":null,"enunciado":"No que concerne ao direito de propriedade intelectual e industrial regulado pelo artigo 5º, inciso XXIX, da Constituição Federal de 1988, a lei assegurará aos autores de inventos industriais privilégio temporário para sua utilização, bem como proteção às criações industriais, à propriedade das marcas, aos nomes de empresas e a outros signos distintivos, tendo em vista o:","alternativas":{"A":"interesse social e o desenvolvimento tecnológico e econômico do País.","B":"lucro financeiro exclusivo das corporações multinacionais parceiras do Estado.","C":"aumento da arrecadação de tributos federais sobre o consumo de luxo.","D":"fortalecimento das agências reguladoras estaduais do setor carcerário.","E":"monopólio perpétuo de famílias tradicionais do setor industrial agrário."},"resposta_correta":"A","comentario":"Conforme o artigo 5º, inciso XXIX, da CF/88, a proteção e o privilégio temporário concedidos às criações industriais e marcas justificam-se a partir do interesse social maior e do desenvolvimento tecnológico e econômico do país."},{"id":164,"numero":164,"bloco":1,"materia":"Direito Constitucional","texto_base":null,"enunciado":"A individualização da pena é princípio constitucional fundamental que orienta o magistrado na fixação e dosimetria da reprimenda penal. Nos termos do artigo 5º, inciso XLVI, da CF/88, a lei regulará a individualização da pena e adotará, entre outras, as seguintes sanções:","alternativas":{"A":"a pena de morte por fuzilamento, o banimento compulsório e o confisco total de bens da família do réu.","B":"privação ou restrição da liberdade, perda de bens, multa, prestação social alternativa e suspensão ou interdição de direitos.","C":"o isolamento perpétuo em colônias agrícolas de segurança máxima e trabalhos forçados na infraestrutura.","D":"a cassação de direitos civis, a perda de nacionalidade nata e a proibição de acesso à assistência médica.","E":"a demissão sumária de funções privadas e a proibição de circulação em vias urbanas após as vinte horas."},"resposta_correta":"B","comentario":"O artigo 5º, inciso XLVI, traz o rol exemplificativo de sanções admitidas no ordenamento nacional sob o manto do Princípio da Individualização da Pena, incluindo a privação de liberdade, perda de bens, multa e interdição de direitos."},{"id":165,"numero":165,"bloco":1,"materia":"Direito Constitucional","texto_base":null,"enunciado":"Considere a seguinte situação hipotética: Um Policial Penal do Rio Grande do Norte sofre agressões físicas e ofensas verbais gravíssimas praticadas por um detento durante o procedimento de tranca do pavilhão central. O servidor pretende processar o agressor civilmente e exige que o Estado garanta a reparação proporcional aos danos suportados em sua integridade moral. À luz do artigo 5º, inciso V, da Constituição Federal de 1988, é assegurado o direito de resposta, proporcional ao agravo, além da:","alternativas":{"A":"promoção automática do servidor público lesado por ato de bravura administrativa.","B":"indenização por dano material, moral ou à imagem.","C":"transferência compulsória do detento para o regime aberto sem monitoramento eletrônico.","D":"perda do cargo público do Diretor de Segurança que coordenava o plantão da unidade.","E":"isenção obrigatória do pagamento de imposto de renda sobre o subsídio do policial lesado."},"resposta_correta":"B","comentario":"Conforme o artigo 5º, inciso V, da Carta Magna, a violação da honra ou integridade física confere ao ofendido o direito de resposta proporcional, além de indenização compensatória por danos materiais, morais ou à imagem."},{"id":166,"numero":166,"bloco":1,"materia":"Direito Constitucional","texto_base":null,"enunciado":"O princípio da dignidade da pessoa humana projeta-se sobre o tratamento conferido aos indivíduos submetidos à custódia do Estado. Nos termos expressos do artigo 5º, inciso XLIX, da Constituição Federal de 1988, é assegurado aos presos o respeito à:","alternativas":{"A":"escolha discricionária do cardápio alimentar diário e horário de visitas íntimas.","B":"integridade física e moral.","C":"dispensa obrigatória do cumprimento das normas do regulamento disciplinar carcerário.","D":"remuneração salarial idêntica à fixada para os policiais penais de plantão na muralha.","E":"liberdade de trânsito livre entre os pavilhões e blocos residenciais do complexo."},"resposta_correta":"B","comentario":"É a reprodução expressa do artigo 5º, inciso XLIX, da Constituição Federal. O custodiado perde o direito de locomoção, mas o Estado permanece com o dever impositivo de zelar por sua integridade física e moral intramuros."},{"id":167,"numero":167,"bloco":1,"materia":"Direito Constitucional","texto_base":null,"enunciado":"A liberdade de consciência e de crença é direito fundamental inviolável instituído pelo artigo 5º, inciso VI, da Constituição Federal de 1988. De acordo com o texto da Carta Magna, é assegurado o livre exercício dos cultos religiosos e garantida, na forma da lei, a:","alternativas":{"A":"isenção total de impostos imobiliários sobre as residências particulares dos fiéis.","B":"proteção aos locais de culto e a suas liturgias.","C":"obrigatoriedade de ensino de uma religião oficial nas escolas públicas do estado.","D":"subordinação das leis ordinárias penais aos mandamentos dos livros sagrados locais.","E":"proibição de realização de manifestações religiosas em vias públicas urbanas."},"resposta_correta":"B","comentario":"O artigo 5º, inciso VI, da CF/88 consagra a inviolabilidade da liberdade de consciência e crença, garantindo o livre exercício dos cultos e impondo ao Estado o dever de proteger os locais de liturgia."},{"id":168,"numero":168,"bloco":1,"materia":"Direito Constitucional","texto_base":null,"enunciado":"No que concerne às Forças Armadas na estrutura constitucional brasileira, o artigo 142 da CF/88 estabelece as diretrizes para a Marinha, o Exército e a Aeronáutica. Instituições nacionais permanentes e regulares, organizadas com base na hierarquia e na disciplina, as forças armadas destinam-se à:","alternativas":{"A":"investigação de infrações penais comuns e policiamento ostensivo das vias urbanas municipais.","B":"defesa da Pátria, à garantia dos poderes constitucionais e, por iniciativa de qualquer destes, da lei e da ordem.","C":"administração direta dos estabelecimentos prisionais femininos estaduais de segurança média.","D":"fiscalização de contratos administrativos de concessões de rodovias federais pedagiadas.","E":"apuração de crimes funcionais praticados por membros do Poder Judiciário e Ministério Público."},"resposta_correta":"B","comentario":"Nos termos do artigo 142 da Constituição Federal, as Forças Armadas (Marinha, Exército e Aeronáutica) destinam-se constitucionalmente à defesa da Pátria, à garantia dos poderes constitucionais e da lei e da ordem."},{"id":169,"numero":169,"bloco":1,"materia":"Direito Constitucional","texto_base":null,"enunciado":"A segurança pública, dever do Estado, direito e responsabilidade de todos, é exercida para a preservação da ordem pública e da incolumidade das pessoas e do patrimônio. O órgão constitucional responsável pelo patrulhamento ostensivo das rodovias federais, expressamente estruturado no artigo 144, inciso II, da CF/88, é a:","alternativas":{"A":"Polícia Ferroviária Federal.","B":"Polícia Rodoviária Federal.","C":"Força Nacional de Segurança Pública de forma permanente.","D":"Polícia Militar rodoviária integrada.","E":"Guarda Rodoviária civil municipal."},"resposta_correta":"B","comentario":"Conforme o artigo 144, inciso II e § 2º, da CF/88, à Polícia Rodoviária Federal, órgão permanente estruturado pela União, compete o patrulhamento ostensivo das rodovias federais."},{"id":170,"numero":170,"bloco":1,"materia":"Direito Constitucional","texto_base":null,"enunciado":"Considere a seguinte situação hipotética: O Governador do Estado do Rio Grande do Norte, diante de uma grave crise de segurança pública caracterizada por conflitos armados generalizados entre facções criminosas nas vias urbanas da capital, pretende decretar uma medida de exceção constitucional para restabelecer a ordem pública de forma imediata. Nos termos do artigo 136 da Constituição Federal de 1988, o Governador do Estado não possui competência autônoma para decretar o Estado de Sítio ou o Estado de Defesa. Essa atribuição político-constitucional de decretação é privativa do:","alternativas":{"A":"Presidente da República, ouvidos o Conselho da República e o Conselho de Defesa Nacional, e mediante autorização ou aprovação do Congresso Nacional.","B":"Tribunal de Justiça do Estado, mediante provocação unânime dos prefeitos da região metropolitana.","C":"Comandante-Geral da Polícia Militar potiguar por meio de portaria operacional interna.","D":"Procurador-Geral de Justiça do Ministério Público estadual de forma discricionária.","E":"Secretário de Estado da Segurança Pública e da Defesa Social por ato normativo isolado."},"resposta_correta":"A","comentario":"De acordo com os artigos 136 e 137 da CF/88, as medidas de exceção (Estado de Defesa e Estado de Sítio) são de competência exclusiva de decretação do Presidente da República, submetendo-se ao controle e autorização do Congresso Nacional. Governors não detêm essa atribuição."},{"id":171,"numero":171,"bloco":1,"materia":"Direito Constitucional","texto_base":null,"enunciado":"O artigo 5º, inciso LVII, da Constituição Federal de 1988 abriga o princípio da presunção de inocência, barreira de proteção do indivíduo no processo penal. Como desdobramento dessa garantia fundamental, a jurisprudência sumulada dos Tribunais Superiores estabelece que inquéritos policiais ou ações penais em curso, sem trânsito em julgado:","alternativas":{"A":"podem ser utilizados livremente como maus antecedentes para majorar a pena-base do réu.","B":"não podem ser utilizados para agravar a pena-base ou fixar maus antecedentes na sentença.","C":"autorizam a inclusão automática do investigado no Regime Disciplinar Diferenciado (RDD).","D":"impedem o exercício do direito ao voto nas eleições municipais ordinárias secundárias.","E":"geram a demissão sumária imediata de servidores públicos estáveis sem direito a contraditório."},"resposta_correta":"B","comentario":"Em consonância com o princípio da presunção de inocência, a Súmula 444 do Superior Tribunal de Justiça (STJ) consolidou que inquéritos policiais ou ações penais em andamento não podem ser valorados como maus antecedentes para majorar a pena-base do réu."},{"id":172,"numero":172,"bloco":1,"materia":"Direito Constitucional","texto_base":null,"enunciado":"O direito à herança é garantido como direito fundamental no artigo 5º, inciso XXX, da Constituição Federal de 1988. O inciso XXXI estabelece regra específica de direito internacional privado, preceituando que a sucessão de bens de estrangeiros situados no País será regulada pela lei brasileira em benefício do cônjuge ou dos filhos brasileiros, sempre que:","alternativas":{"A":"o Estado estrangeiro de origem do de cujus não professar valores democráticos liberais.","B":"não lhes seja mais favorável a lei pessoal do de cujus.","C":"o valor total dos bens herdados for inferior a cem salários mínimos nacionais.","D":"os herdeiros comprovem filiação partidária ativa em organizações de assistência social.","E":"os bens situados no território nacional forem oriundos de atividades agrícolas cafeeiras."},"resposta_correta":"B","comentario":"O artigo 5º, inciso XXXI, consagra a aplicação da lei brasileira para a sucessão de bens de estrangeiros situados no país, em benefício do cônjuge ou filhos nacionais, sempre que a lei pessoal do falecido não lhes for mais favorável."},{"id":173,"numero":173,"bloco":1,"materia":"Direito Constitucional","texto_base":null,"enunciado":"Dentre as garantias que protegem o indivíduo contra prisões ilegais ou arbitrárias, o artigo 5º, inciso LXV, da Constituição Federal de 1988 impõe comando direto e impositivo ao Poder Judiciário. De acordo com o texto da Carta Magna, a prisão ilegal será:","alternativas":{"A":"mantida em sigilo até o encerramento da instrução processual na vara criminal.","B":"imediatamente relaxada pela autoridade judiciária.","C":"convertida automaticamente em prisão preventiva com monitoramento eletrônico.","D":"submetida à aprovação do Delegado de Polícia de plantão na delegacia de área.","E":"convalidada se o preso ostentar condenações criminais anteriores transitadas em julgado."},"resposta_correta":"B","comentario":"É a ordem literal do artigo 5º, inciso LXV, da Constituição Federal. Constatada a ilegalidade de qualquer restrição de liberdade, o relaxamento da prisão pela autoridade judiciária competente deve ser imediato."},{"id":174,"numero":174,"bloco":1,"materia":"Direito Constitucional","texto_base":null,"enunciado":"O artigo 144, § 8º, da Constituição Federal de 1988 confere faculdade aos Municípios para a estruturação de corpos de segurança urbana interna. Nos termos do mandamento constitucional, os Municípios poderão constituir guardas municipais destinadas à:","alternativas":{"A":"apuração de infrações penais comuns contra a pessoa e repressão ao tráfico de drogas.","B":"proteção de seus bens, serviços e instalações, conforme dispuser a lei.","C":"execução do policiamento ostensivo e trânsito rodoviário de rodovias estaduais.","D":"segurança interna dos estabelecimentos penais federais de segurança máxima.","E":"realização de investigações criminais de natureza militar e controle de fronteiras fluviais."},"resposta_correta":"B","comentario":"Nos termos do artigo 144, § 8º, da Constituição Federal, os Municípios possuem a faculdade de criar guardas municipais destinadas especificamente à proteção de seus bens, serviços e instalações, não detendo funções ordinárias de polícia judiciária ou ostensiva geral."},{"id":175,"numero":175,"bloco":1,"materia":"Direito Constitucional","texto_base":null,"enunciado":"Considere a seguinte situação hipotética: Um cidadão estrangeiro, residente legalmente no Estado do Rio Grande do Norte, é processado criminalmente por crime de estelionato cometido contra um estabelecimento comercial local. Durante o trâmite processual, o magistrado impede a participação do réu em atos de instrução e nega o acesso de sua defesa técnica aos autos, alegando que os direitos e garantias fundamentais do artigo 5º da CF/88 restringem-se aos cidadãos brasileiros. À luz do caput do artigo 5º da Constituição Federal de 1988, a decisão do magistrado está incorreta, pois a Carta Magna assegura a inviolabilidade dos direitos fundamentais aos brasileiros e aos:","alternativas":{"A":"estrangeiros residentes no País.","B":"turistas internacionais que permaneçam no território por período inferior a trinta dias.","C":"representantes diplomáticos de nações que componham o bloco econômico do Mercosul apenas.","D":"apátridas que comprovem vínculo financeiro industrial com empresas estatais federais.","E":"estrangeiros que professem os mesmos valores de liberdade religiosa da maioria nacional."},"resposta_correta":"A","comentario":"O caput do artigo 5º da CF/88 estabelece a igualdade de todos perante a lei, garantindo a inviolabilidade dos direitos fundamentais aos brasileiros e aos estrangeiros residentes no país. A jurisprudência estende grande parte dessas garantias também aos estrangeiros em trânsito."},{"id":176,"numero":176,"bloco":2,"materia":"Direito Constitucional","texto_base":null,"enunciado":"O artigo 37 da Constituição Federal de 1988 positiva os princípios fundamentais que regem a Administração Pública direta e indireta de qualquer dos Poderes da União, dos Estados, do Distrito Federal e do Municípios. O candidato deve memorizar o rol expresso do caput do referido artigo, que estabelece que a Administração obedecerá aos seguintes princípios:","alternativas":{"A":"Legalidade, Impessoalidade, Moralidade, Publicidade e Eficiência.","B":"Soberania, Lucratividade, Celeridade, Supremacia e Economicidade.","C":"Hierarquia, Discricionariedade, Bilateralidade, Centralização e Subordinação.","D":"Intimidade, Julgamento Prévio, Unidade, Proporcionalidade e Eqüidade.","E":"Autonomia Sindical, Privatização, Unilateralidade, Universalidade e Cortesia."},"resposta_correta":"A","comentario":"É a redação literal do caput do artigo 37 da Constituição Federal, que consagra o mnemônico LIMPE: os princípios expressos e impositivos da Legalidade, Impessoalidade, Moralidade, Publicidade e Eficiência."},{"id":177,"numero":177,"bloco":2,"materia":"Direito Constitucional","texto_base":null,"enunciado":"A investidura em cargo ou emprego público submete-se a regras rígidas voltadas a garantir a moralidade e a igualdade de acesso aos cidadãos. De acordo com o artigo 37, inciso II, da Constituição Federal, a investidura em cargo ou emprego público depende de:","alternativas":{"A":"aprovação prévia em exame psicotécnico de natureza sigilosa conduzido pelo sindicato.","B":"indicação política direta assinada pelo Governador do Estado durante o recesso parlamentar.","C":"aprovação prévia em concurso público de provas ou de provas e títulos, ressalvadas as nomeações para cargo em comissão.","D":"comprovação de filiação partidária ativa por período superior a dois anos ininterruptos.","E":"sorteio público universal auditado por membros do Conselho da Comunidade local."},"resposta_correta":"C","comentario":"Conforme preceitua o artigo 37, inciso II, da CF/88, a regra de ouro do acesso ao serviço público baseia-se na aprovação prévia em concurso público de provas ou de provas e títulos, ressalvando-se os cargos comissionados de livre nomeação e exoneração."},{"id":178,"numero":178,"bloco":2,"materia":"Direito Constitucional","texto_base":null,"enunciado":"A Constituição Federal regula o direito de greve e de livre associação sindical para os servidores públicos, estabelecendo contudo distinções drásticas aplicáveis às carreiras de segurança pública. Nos termos do artigo 142, § 3º, inciso IV, estendido expressamente às carreiras policiais militares e conforme jurisprudência pacífica do STF aplicada às demais forças policiais (inclusive a Polícia Penal):","alternativas":{"A":"o direito de greve é amplo e irrestrito, desde que mantido o efetivo de 10% em atividade.","B":"ao militar e ao policial de carreira são proibidas a beligerância e a sindicalização, sendo o direito de greve terminantemente vedado.","C":"a greve será autorizada apenas se o objetivo final for a reestruturação dos coletes balísticos.","D":"permite-se a paralisação das atividades nos fins de semana, mantendo-se o plantão ordinário.","E":"cabe ao sindicato da categoria fixar discricionariamente os limites e os dias de greve tática armada."},"resposta_correta":"B","comentario":"O Supremo Tribunal Federal (STF) estendeu a proibição absoluta do direito de greve a todas as carreiras de segurança pública (Art. 144), sob o argumento de que as atividades de preservação da ordem pública e custódia prisional são essenciais e contínuas para o Estado."},{"id":179,"numero":179,"bloco":2,"materia":"Direito Constitucional","texto_base":null,"enunciado":"Considere a seguinte situação hipotética: Um Policial Penal potiguar estável, aprovado no concurso de 2020, decide candidatar-se ao cargo de Deputado Estadual nas próximas eleições reguladas pela Justiça Eleitoral. À luz das normas que regulam os direitos políticos do servidor público civil no artigo 38 da CF/88, investido no mandato de Deputado Estadual, o servidor deverá:","alternativas":{"A":"acumular integralmente os vencimentos do cargo de policial penal com o subsídio do mandato parlamentar.","B":"ser demitido do serviço público estadual sem direito a qualquer modalidade de ressarcimento ou contagem de tempo.","C":"ficar afastado de seu cargo, emprego ou função, sendo-lhe facultado optar pela sua remuneração.","D":"permanecer exercendo os plantões na muralha nos fins de semana e atuar na Assembleia Legislativa nos dias úteis.","E":"transferir seu cargo público de forma vitalícia e hereditária para o seu filho primogênito."},"resposta_correta":"C","comentario":"É a aplicação da regra de afastamento funcional contida no artigo 38, inciso II, da Constituição Federal. Investido no mandato eletivo estadual ou federal, o servidor afasta-se do cargo de origem e opta legitimamente pela remuneração."},{"id":180,"numero":180,"bloco":2,"materia":"Direito Constitucional","texto_base":null,"enunciado":"O artigo 144, § 5º, da Constituição Federal estabelece as atribuições constitucionais precípuas do Corpo de Bombeiros Militar. Além das atribuições definidas em lei, compete a esse órgão de segurança pública a:","alternativas":{"A":"realização de patrulhamento ostensivo das rodovias estaduais e federais delegadas.","B":"execução de atividades de defesa civil.","C":"apuração de crimes contra o patrimônio privado cometidos por organizações faccionadas.","D":"gestão logística interna das cadeias públicas femininas de segurança máxima.","E":"instrução primária de processos de extradição passiva de estrangeiros."},"resposta_correta":"B","comentario":"Nos termos do artigo 144, § 5º, da CF/88, ao Corpo de Bombeiros Militar, além de suas funções de combate a incêndio e salvamento, compete expressamente a execução de atividades de defesa civil."},{"id":181,"numero":181,"bloco":2,"materia":"Direito Constitucional","texto_base":null,"enunciado":"O prazo de validade do concurso público constitui baliza temporal impositiva para resguardar a moralidade administrativa e os direitos dos candidatos aprovados. De acordo com o artigo 37, inciso III, da Constituição Federal de 1988, o prazo de validade do concurso público será de:","alternativas":{"A":"até um ano, prorrogável por igual período se houver concordância do sindicato.","B":"até dois anos, prorrogável uma vez, por igual período.","C":"cinco anos improrrogáveis, contados da data de publicação do edital de abertura.","D":"seis meses, admitindo-se prorrogações sucessivas até o preenchimento total das vagas.","E":"tempo indeterminado, ficando a critério do Governador decidir o momento do encerramento."},"resposta_correta":"B","comentario":"Trata-se da literalidade do artigo 37, inciso III, da Carta Magna. O prazo de validade do concurso público será de até dois anos, admitindo-se uma única prorrogação por igual período (limite máximo de 2+2 anos)."},{"id":182,"numero":182,"bloco":2,"materia":"Direito Constitucional","texto_base":null,"enunciado":"A Constituição Federal estabelece a proibição de acumulação remunerada de cargos públicos como regra para a moralidade do funcionalismo, fixando contudo exceções taxativas quando houver compatibilidade de horários. Nos termos do artigo 37, inciso XVI, é vedada a acumulação remunerada de cargos públicos, exceto a de:","alternativas":{"A":"dois cargos de policial penal tático operacional.","B":"dois cargos de professor; a de um cargo de professor com outro técnico ou científico; e a de dois cargos ou empregos privativos de profissionais de saúde, com profissões regulamentadas.","C":"um cargo de Diretor de presídio com outro de vereador municipal sem compatibilidade de horários.","D":"três cargos de nível médio técnico administrativo da Secretaria de Fazenda.","E":"um cargo militar das Forças Armadas com outro de Delegado de Polícia Civil."},"resposta_correta":"B","comentario":"O artigo 37, inciso XVI, da CF/88 proíbe a acumulação remunerada de cargos, trazendo as três exceções clássicas (havendo compatibilidade de horários): dois de professor; um de professor com técnico/científico; dois de profissionais de saúde regulamentados."},{"id":183,"numero":183,"bloco":2,"materia":"Direito Constitucional","texto_base":null,"enunciado":"A estabilidade no serviço público é uma garantia outorgada ao servidor nomeado para cargo de provimento efetivo em virtude de concurso público. Nos termos do artigo 41 da Constituição Federal de 1988, com a redação dada pelas emendas de reforma administrativa, são estáveis após:","alternativas":{"A":"um ano de efetivo exercício os servidores concursados.","B":"dois anos de efetivo exercício os servidores concursados.","C":"três anos de efetivo exercício os servidores concursados.","D":"quatro anos de efetivo exercício os servidores concursados.","E":"cinco anos de efetivo exercício os servidores concursados."},"resposta_correta":"C","comentario":"Conforme preceitua o artigo 41, caput, da Constituição Federal, a estabilidade no cargo público efetivo é adquirida após o cumprimento de três anos de efetivo exercício e aprovação em avaliação especial de desempenho."},{"id":184,"numero":184,"bloco":2,"materia":"Direito Constitucional","texto_base":null,"enunciado":"A responsabilidade civil do Estado pelos danos causados por seus agentes constitui garantia fundamental do cidadão positivada no artigo 37, § 6º, da Constituição Federal. De acordo com o mandamento constitucional, as pessoas jurídicas de direito público e as de direito privado prestadoras de serviços públicos responderão pelos danos que seus agentes, nessa qualidade, causarem a terceiros, assegurado o direito de regresso contra o responsável nos casos de:","alternativas":{"A":"força maior ou caso fortuito sistêmico exclusivamente.","B":"culpa exclusiva da vítima provada pela inteligência prisional.","C":"dolo ou culpa.","D":"erro de hermenêutica judicial ou atraso orçamentário.","E":"legítima defesa da honra profissional do Governador."},"resposta_correta":"C","comentario":"O artigo 37, § 6º, adota a Responsabilidade Objetiva do Estado na modalidade do Risco Administrativo perante terceiros. Contudo, para exercer o direito de regresso contra o servidor público causador direto do dano, o Estado precisa provar dolo ou culpa do agente."},{"id":185,"numero":185,"bloco":2,"materia":"Direito Constitucional","texto_base":null,"enunciado":"Considere a seguinte situação hipotética: Um Policial Penal potiguar estável comete uma falta administrativa gravíssima ao facilitar dolosamente a entrada de aparelhos telefônicos em um pavilhão carcerário. Instaurado o devido processo perante a Corregedoria, o servidor alega que goza da garantia de estabilidade e que jamais poderá perder o cargo por ato administrativo isolado. À luz do artigo 41, § 1º, da Constituição Federal de 1988, o servidor público estável perderá o cargo:","alternativas":{"A":"apenas se houver concordância unânime por parte dos deputados estaduais.","B":"em virtude de sentença judicial transitada em julgado ou mediante processo administrativo em que lhe seja assegurada ampla defesa.","C":"se o Diretor da unidade determinar a demissão sumária por meio de portaria verbal.","D":"por ato discricionário motivado do Secretário de Segurança Pública sem direito a recurso.","E":"se houver representação assinada por mais de metade dos detentos do estabelecimento."},"resposta_correta":"B","comentario":"O artigo 41, § 1º, elenca as hipóteses de perda de cargo do servidor estável: sentença judicial transitada em julgado, processo administrativo disciplinar (PAD) com ampla defesa ou procedimento de avaliação periódica de desempenho."},{"id":186,"numero":186,"bloco":2,"materia":"Direito Constitucional","texto_base":null,"enunciado":"O princípio da publicidade impõe a transparência dos atos da Administração Pública. Contudo, a Constituição Federal prevê instrumentos específicos de controle e acesso à informação. O remédio constitucional expressamente destinado a assegurar o conhecimento de informações relativas à pessoa do impetrante, constantes de registros ou bancos de dados de entidades governamentais ou de caráter público, denomina-se:","alternativas":{"A":"Mandado de Injunção.","B":"Ação Popular.","C":"Habeas Data.","D":"Habeas Corpus.","E":"Mandado de Segurança Coletivo."},"resposta_correta":"C","comentario":"O Habeas Data (Art. 5º, inciso LXXII) é o remédio constitucional personalíssimo destinado especificamente a garantir o acesso a informações ou retificação de dados relativos à pessoa do impetrante em bancos governamentais."},{"id":187,"numero":187,"bloco":2,"materia":"Direito Constitucional","texto_base":null,"enunciado":"A organização do Poder Executivo confere ao Chefe do Poder do Estado atribuições de direção superior da administração estadual. No âmbito do Rio Grande do Norte, as forças de segurança pública (Polícia Civil, Polícia Militar, Corpo de Bombeiros M
